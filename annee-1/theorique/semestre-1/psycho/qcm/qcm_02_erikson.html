<script>window.QUIZ={"titre": "QCM", "fiche": "../fiches/fiche_03_erikson.html", "questions": [{"q": "Selon Erikson, la personnalité se développe principalement sous l’influence :", "o": ["Des pulsions biologiques", "Des stades cognitifs", "Des influences sociales", "Du conditionnement", "De la maturation neurologique"], "r": 2, "e": "Erikson prolonge Freud en déplaçant l'accent des pulsions vers le social : chaque crise se joue dans la rencontre entre les attentes de la société et les capacités du sujet, et ce sur toute la vie."}, {"q": "La notion centrale de la théorie d’Erikson est :", "o": ["Le conflit œdipien", "La crise psychosociale", "Le renforcement", "L’intelligence", "L’attachement primaire"], "r": 1, "e": "Chez Erikson, toute la vie est structurée par une suite de huit crises psychosociales, chacune opposant deux pôles et débouchant sur une vertu. C'est le concept central de sa théorie."}, {"q": "Une résolution saine d’une crise psychosociale implique :", "o": ["L’élimination complète du pôle négatif", "La prédominance du pôle positif", "L’équilibre strict 50/50", "L’absence de conflit", "Une résolution définitive et irréversible"], "r": 1, "e": "Pour Erikson, une crise bien résolue ne supprime pas le pôle négatif : elle établit une dominance du pôle positif. Un minimum de méfiance est nécessaire pour se protéger, un minimum de doute pour rester prudent."}, {"q": "La vertu associée au stade Confiance vs Méfiance est :", "o": ["Volonté", "Compétence", "Espoir", "Fidélité", "Amour"], "r": 2, "e": "Confiance vs méfiance (0-18 mois) donne l'espoir : la conviction que les besoins seront satisfaits et que le monde est fiable. La volonté vient du stade 2, la compétence du stade 4, la fidélité de l'adolescence."}, {"q": "Le stade Autonomie vs honte et doute est particulièrement lié :", "o": ["À l’entrée à l’école", "À l’adolescence", "À l’apprentissage de la propreté", "À l’identité sociale", "À l’intimité affective"], "r": 2, "e": "Le stade 2 (18 mois - 3 ans) se joue autour du contrôle de soi, dont l'apprentissage de la propreté est le terrain symbolique : l'enfant y éprouve son pouvoir de retenir ou de lâcher."}, {"q": "Le stade Initiative vs culpabilité se caractérise principalement par :", "o": ["Le raisonnement abstrait", "La dépendance affective", "L’exploration des rôles et le jeu symbolique", "La peur de l’échec scolaire", "L’isolement social"], "r": 2, "e": "Le stade 3 (3-6 ans) est celui de l'initiative : l'enfant entreprend, invente, joue des rôles. Réprimé ou excessivement jugé, il développe de la culpabilité à l'égard de ses propres désirs."}, {"q": "Le sentiment d’infériorité apparaît principalement lorsque :", "o": ["Le stade 1 est mal résolu", "L’enfant échoue à développer un sentiment de compétence", "L’adolescent ne trouve pas son identité", "Le jeune adulte évite l’intimité", "La personne âgée fait un bilan négatif"], "r": 1, "e": "Le stade 4 (6-12 ans) oppose Productivité et infériorité : confronté à l'école et aux pairs, l'enfant qui ne parvient pas à se sentir capable intériorise un sentiment d'infériorité."}, {"q": "La question clé du stade Identité vs confusion des rôles est :", "o": ["Puis-je faire confiance au monde ?", "Suis-je compétent ?", "Qui suis-je ?", "Puis-je aimer ?", "Ma vie a-t-elle eu un sens ?"], "r": 2, "e": "« Qui suis-je ? » résume la crise adolescente : construire une identité cohérente à partir des rôles, valeurs et projets explorés. Les autres formulations renvoient aux stades 1, 4, 6 et 8."}, {"q": "La vertu associée au stade Intimité vs isolement est :", "o": ["Fidélité", "Amour", "Sagesse", "Espoir", "Attention à l’autre"], "r": 1, "e": "Erikson associe une vertu à chaque crise résolue. Intimité vs isolement, au jeune adulte, donne l'amour : la capacité de se lier durablement sans se perdre. La fidélité appartient à l'adolescence, la sagesse au dernier stade, l'espoir au tout premier."}, {"q": "Le désespoir, au dernier stade, est caractérisé par :", "o": ["Une peur de la mort uniquement", "Une incapacité à aimer", "Un regret des occasions manquées et une absence de réconciliation avec soi", "Une perte cognitive", "Une dépendance affective"], "r": 2, "e": "Le désespoir n'est pas seulement la crainte de mourir : c'est le sentiment que le temps manque désormais pour reprendre ce qui a été manqué, et l'impossibilité d'accepter sa vie telle qu'elle a été."}, {"q": "Erikson s'est distancié de Freud en soulignant l'importance :", "o": ["Des pulsions biologiques", "Des influences sociales sur la personnalité", "Du conditionnement", "De la maturation cérébrale"], "r": 1, "e": "Là où Freud voit un développement psychosexuel gouverné par les pulsions, Erikson décrit un développement psychosocial où chaque crise se joue dans la rencontre entre le sujet et les attentes de la société."}, {"q": "Chez Erikson, le développement du Moi se déroule :", "o": ["Uniquement pendant l'enfance", "Jusqu'à l'adolescence", "Tout au long de la vie, en huit stades", "Pendant les six premières années"], "r": 2, "e": "C'est une innovation majeure par rapport à Freud, dont les stades s'achèvent à la puberté. Erikson prolonge le développement jusqu'au grand âge."}, {"q": "Une crise psychosociale au sens d'Erikson est :", "o": ["Un épisode pathologique", "Une question de développement particulièrement marquante au moment où elle survient, et qui conserve une importance tout au long de la vie", "Un traumatisme imprévisible", "Un conflit avec les parents"], "r": 1, "e": "Le mot crise ne désigne pas un accident mais un moment décisif. Chaque crise reste ensuite en arrière-plan et peut être remaniée aux étapes suivantes."}, {"q": "Selon Erikson, la résolution d'une crise nécessite que :", "o": ["Le trait négatif disparaisse totalement", "La qualité positive prédomine, le trait négatif restant néanmoins nécessaire", "Les deux traits s'équilibrent strictement", "Le trait négatif l'emporte"], "r": 1, "e": "Le cours donne un exemple éclairant : les enfants doivent conserver une part de méfiance pour se protéger des étrangers. Une confiance absolue ne serait pas une réussite mais un danger."}, {"q": "Une bonne résolution de crise engendre :", "o": ["Une régression", "Une force ou vertu qui aide à résoudre les conflits futurs", "Un arrêt du développement", "Une fixation"], "r": 1, "e": "Espoir, volonté, intention, compétence, fidélité, amour, sollicitude et sagesse : chaque stade franchi laisse une ressource mobilisable pour les suivants."}, {"q": "Le premier stade, Confiance vs Méfiance, s'étend de :", "o": ["0 à 6 mois", "0 à 12-18 mois", "12 mois à 3 ans", "3 à 6 ans"], "r": 1, "e": "L'enfant y construit, à travers la relation avec la personne qui s'occupe de lui, l'idée que le monde est ou non un lieu agréable et sûr."}, {"q": "Au premier stade, l'absence d'amour et de réponse aux besoins conduit à :", "o": ["Un sentiment de honte", "Le développement de peurs et de méfiance", "Un sentiment de culpabilité", "Un sentiment d'infériorité"], "r": 1, "e": "Chaque stade a son pôle négatif propre : méfiance au premier, honte et doute au deuxième, culpabilité au troisième, infériorité au quatrième."}, {"q": "Le stade Autonomie vs Honte et Doute couvre approximativement :", "o": ["0 à 12 mois", "12-18 mois à 3 ans", "3 à 6 ans", "6 à 12 ans"], "r": 1, "e": "C'est le temps de l'exploration du corps et du milieu, de l'apprentissage de la toilette, et de la recherche d'un équilibre entre indépendance et doute de soi."}, {"q": "Les « crises de colère », les « pourquoi » et le désir de tout faire seul caractérisent :", "o": ["Le stade Confiance vs Méfiance", "Le stade Autonomie vs Honte et Doute", "Le stade Initiative vs Culpabilité", "Le stade Productivité vs Infériorité"], "r": 1, "e": "Ces manifestations traduisent l'affirmation naissante de la volonté. Le cours précise que l'aide parentale doit être dosée : trop de sévérité engendre la honte."}, {"q": "Au troisième stade, la conscience devient un guide de l'initiative, ce qui se traduit par la question :", "o": ["Puis-je faire confiance au monde ?", "Serai-je bon ou mauvais ?", "Suis-je compétent ou incompétent ?", "Qui suis-je ?"], "r": 1, "e": "Chaque stade a sa question implicite. L'enfant de 3 à 6 ans expérimente des rôles dans le jeu, imite les adultes et prend conscience de son individualité."}, {"q": "La vertu associée au stade Initiative vs Culpabilité est :", "o": ["La volonté", "L'intention ou conviction", "La compétence", "La fidélité"], "r": 1, "e": "L'ordre des vertus : espoir, volonté, intention, compétence, fidélité, amour, sollicitude, sagesse. L'intention est la capacité de poursuivre un but sans se sentir coupable de l'avoir voulu."}, {"q": "Au quatrième stade, le sentiment d'infériorité a pour conséquence principale :", "o": ["Une confusion des rôles", "Des blocages cognitifs", "Un isolement affectif", "Une stagnation"], "r": 1, "e": "L'enfant qui ne se sent pas capable de produire cesse d'essayer, ce qui compromet ses apprentissages. Le cours souligne que la résolution positive des stades antérieurs y est déterminante."}, {"q": "Le stade Productivité vs Infériorité correspond à la période :", "o": ["3 à 6 ans", "6 à 12 ans", "Adolescence", "Jeune âge adulte"], "r": 1, "e": "C'est le stade scolaire, marqué par de nouvelles relations interpersonnelles et par la découverte que l'on est capable de travailler et de réussir."}, {"q": "Au cinquième stade, l'identité résulte :", "o": ["D'une décision ponctuelle", "De la consolidation des résolutions des quatre stades précédents en un sens cohérent du Moi", "De l'influence exclusive des pairs", "De la maturation biologique seule"], "r": 1, "e": "L'identité n'est pas une découverte soudaine mais une synthèse. C'est pourquoi les difficultés antérieures se manifestent souvent à ce moment."}, {"q": "Parmi les risques de confusion des rôles à l'adolescence, le cours cite :", "o": ["Un excès de soutien familial", "L'échec de la séparation émotionnelle avec les figures adultes", "Une trop grande autonomie", "Une scolarité trop exigeante"], "r": 1, "e": "S'y ajoutent le manque de soutien, la perte de liens familiaux, les difficultés face au changement et le manque de liens sociaux avec les pairs."}, {"q": "La question clé du sixième stade est :", "o": ["Qui suis-je ?", "Dois-je partager ma vie ou vivre seul ?", "Suis-je compétent ?", "Cela valait-il la peine de vivre ?"], "r": 1, "e": "Intimité vs Isolement concerne le jeune adulte : il s'agit d'établir des relations durables, amoureuses et amicales, fondées sur l'engagement et l'échange de sentiments."}, {"q": "Au septième stade, la stagnation se manifeste par :", "o": ["Une confusion identitaire", "Un appauvrissement relationnel, de l'égoïsme et une préoccupation pour le seul bien-être matériel", "Une perte de mémoire", "Une dépendance affective"], "r": 1, "e": "Elle s'oppose à la générativité, qui est le besoin de guider la génération suivante et d'investir dans la société, au travail comme dans la famille."}, {"q": "La vertu associée au stade Générativité vs Stagnation est :", "o": ["L'amour", "La sollicitude ou attention à l'autre", "La sagesse", "La fidélité"], "r": 1, "e": "Elle traduit le déplacement du souci de soi vers le souci de ce qui suivra : transmettre, encadrer, créer quelque chose qui survivra à soi."}, {"q": "Au huitième stade, l'intégrité correspond à :", "o": ["La réalisation de tous ses rêves", "Un bilan positif, même si tous les rêves n'ont pas été réalisés, permettant d'accepter l'âge et ses conséquences", "L'absence de regrets", "Le maintien des capacités physiques"], "r": 1, "e": "La nuance est importante : l'intégrité n'est pas la réussite de tout ce qui était projeté, mais la réconciliation avec la vie telle qu'elle a été."}, {"q": "Le huitième stade débute, selon Erikson, vers :", "o": ["40 ans", "50 ans", "60 ans", "75 ans"], "r": 2, "e": "C'est le temps du bilan, de l'intégration et de la compréhension du passé vécu. Sa résolution positive engendre la sagesse."}, {"q": "Dans le tableau récapitulatif d'Erikson, la vertu du stade 4 est :", "o": ["L'intention", "La compétence", "La fidélité", "La volonté"], "r": 1, "e": "Le stade 4, entre 6 et 12 ans, oppose compétence et infériorité, et sa réussite donne précisément le sentiment de compétence."}, {"q": "La théorie d'Erikson est qualifiée de psychosociale plutôt que psychosexuelle parce qu'elle :", "o": ["Ignore le corps", "Situe le moteur du développement dans la relation entre le sujet et la société plutôt que dans les pulsions", "Ne concerne que l'âge adulte", "Rejette la psychanalyse"], "r": 1, "e": "Erikson reste psychanalyste, mais déplace l'accent : ce sont les attentes sociales et les rôles qui structurent les huit crises, non l'évolution des zones érogènes."}, {"q": "Jouer à la maman ou au papa, prendre le thé et imiter les adultes caractérise :", "o": ["Le stade Autonomie vs Honte", "Le stade Initiative vs Culpabilité", "Le stade Productivité vs Infériorité", "Le stade Identité vs Confusion"], "r": 1, "e": "Entre 3 et 6 ans, l'enfant expérimente différents rôles dans les jeux de groupe. C'est aussi la période de développement des capacités motrices, linguistiques, cognitives et imaginatives."}, {"q": "L'apprentissage de la toilette est associé au stade :", "o": ["1", "2", "3", "4"], "r": 1, "e": "Entre 12-18 mois et 3 ans, il constitue le terrain symbolique du contrôle de soi : l'enfant y éprouve son pouvoir de retenir ou de lâcher, sous le regard de ses parents."}, {"q": "Selon Erikson, une crise mal résolue :", "o": ["Bloque définitivement le développement", "Conserve une certaine importance tout au long de la vie et peut être remaniée", "Disparaît au stade suivant", "N'a aucune conséquence"], "r": 1, "e": "C'est ce qui rend la théorie moins déterministe qu'il n'y paraît : chaque question demeure disponible, et des expériences ultérieures peuvent en modifier la résolution."}, {"q": "Au deuxième stade, une sévérité parentale excessive produit surtout :", "o": ["De la méfiance", "Un sentiment de honte", "De la culpabilité", "Un sentiment d'infériorité"], "r": 1, "e": "Le cours précise que l'aide parentale doit être dosée : trop peu laisse l'enfant en échec, trop l'empêche d'éprouver sa propre capacité à faire seul."}, {"q": "La vertu du premier stade, l'espoir, correspond à :", "o": ["La capacité d'aimer", "La conviction que le monde est fiable et que les besoins seront satisfaits", "La capacité de s'engager", "Le sentiment d'être capable"], "r": 1, "e": "Elle se construit dans la relation au premier caregiver et constitue le socle sur lequel s'appuieront toutes les crises suivantes."}, {"q": "Pour Erikson, le développement est principalement :", "o": ["Sexuel", "Social", "Cognitif", "Génétique"], "r": 1, "e": "C'est la formule de synthèse du cours : le développement continue toute la vie, est principalement social et non sexuel, et chaque crise est l'occasion de transformer un conflit en force adaptative."}, {"q": "La vertu associée au stade Identité vs Confusion des rôles est :", "o": ["L'amour", "La fidélité", "La compétence", "L'intention"], "r": 1, "e": "La fidélité est la capacité de se tenir à des engagements, des valeurs et des liens choisis — ce qui suppose d'avoir d'abord constitué une identité cohérente."}, {"q": "Le stade Intimité vs Isolement suppose, pour être résolu favorablement :", "o": ["Une identité déjà constituée au stade précédent", "Une réussite professionnelle", "L'absence de conflits familiaux", "Une bonne santé physique"], "r": 0, "e": "Sans identité stable, la relation intime est vécue comme une menace de dissolution. C'est pourquoi l'ordre des stades importe autant chez Erikson."}, {"q": "Au huitième stade, le désespoir se caractérise par :", "o": ["La peur de la mort uniquement", "Le sentiment que la vie s'est mal déroulée, des regrets et l'absence de réconciliation avec soi-même", "Une perte des capacités cognitives", "Un isolement social"], "r": 1, "e": "Ce n'est pas la crainte de mourir mais l'impossibilité d'accepter la vie telle qu'elle a été, aggravée par le sentiment que le temps manque désormais pour la reprendre."}, {"q": "L'affirmation selon laquelle « le trait négatif est aussi nécessaire » implique que la santé psychique suppose :", "o": ["L'élimination complète du pôle négatif", "Un dosage où le positif prédomine sans que le négatif disparaisse", "Un équilibre strict entre les deux", "La domination du pôle négatif"], "r": 1, "e": "Une confiance sans aucune méfiance exposerait au danger, une autonomie sans aucun doute à l'imprudence. La résolution saine est une proportion, non une élimination."}, {"q": "Erik Erikson a vécu de :", "o": ["1856 à 1939", "1902 à 1994", "1896 à 1980", "1920 à 2006"], "r": 1, "e": "Psychanalyste formé dans le cercle freudien, il élabore sa théorie des huit stades au cours du XXᵉ siècle, prolongeant et déplaçant l'héritage de Freud."}, {"q": "Le stade 5 du tableau récapitulatif correspond à la période :", "o": ["6 à 12 ans", "De l'adolescence", "Du jeune adulte", "De l'âge mûr"], "r": 1, "e": "Il oppose Identité et Confusion des rôles et donne la fidélité. Le stade 6 concerne le jeune adulte, le stade 7 l'âge mûr et le stade 8 les 60 ans et plus."}, {"q": "Selon Erikson, l'enfant du troisième stade prend conscience :", "o": ["De sa dépendance", "D'avoir une individualité", "De ses limites physiques", "De son rôle social futur"], "r": 1, "e": "Cette prise de conscience accompagne le développement de la curiosité et de l'imagination, et rend possible l'initiative — comme le risque de culpabilité qui lui est associé."}, {"q": "Le quatrième stade est décrit comme une période de :", "o": ["Repli sur la famille", "Nouvelles relations interpersonnelles", "Confusion identitaire", "Recherche d'intimité"], "r": 1, "e": "L'entrée dans le monde scolaire élargit considérablement le cercle des relations et introduit la comparaison avec les pairs, d'où l'enjeu de compétence ou d'infériorité."}, {"q": "Chez Erikson, la générativité peut s'exprimer :", "o": ["Uniquement par la parentalité", "Au travail comme dans la famille, et par la créativité dans divers domaines", "Uniquement après la retraite", "Uniquement dans un cadre associatif"], "r": 1, "e": "Le cours mentionne l'affirmation personnelle au travail et dans la famille, ainsi que la possibilité d'être créatif et productif. Transmettre ne se réduit pas à avoir des enfants."}, {"q": "Le sixième stade se solde, en cas d'échec, par :", "o": ["La stagnation", "L'isolement", "Le désespoir", "La confusion des rôles"], "r": 1, "e": "Chaque stade a son pôle négatif : isolement au sixième, stagnation au septième, désespoir au huitième. Les confondre est l'erreur la plus fréquente."}, {"q": "Le concept de crise chez Erikson implique que le conflit :", "o": ["Doit être évité", "Est l'occasion de transformer une tension en force adaptative", "Signale une pathologie", "Ne concerne que l'enfance"], "r": 1, "e": "C'est la formule de synthèse du cours. La crise n'est pas un dysfonctionnement mais le mécanisme normal par lequel la personnalité se construit."}, {"q": "Le stade 2 du tableau récapitulatif a pour vertu :", "o": ["L'espoir", "La volonté", "L'intention", "La compétence"], "r": 1, "e": "La volonté naît de la résolution du conflit entre autonomie et honte : c'est la capacité d'exercer un choix et de se retenir, découverte dans l'exploration et l'apprentissage du contrôle de soi."}]};</script>
