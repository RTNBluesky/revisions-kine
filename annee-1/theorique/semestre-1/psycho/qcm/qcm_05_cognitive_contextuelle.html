<script>window.QUIZ={"titre": "QCM", "fiche": "../fiches/fiche_06_cognitive_contextuelle.html", "questions": [{"q": "Pour Vygotsky, le développement cognitif est avant tout :", "o": ["Un processus individuel", "Un produit de la maturation biologique", "Un processus coopératif et social", "Une succession de stades universels", "Déterminé génétiquement"], "r": 2, "e": "Pour Vygotsky, toute fonction supérieure apparaît deux fois : d'abord sur le plan interpsychique, dans l'échange, puis sur le plan intrapsychique, par intériorisation. Le développement est coopératif avant d'être individuel."}, {"q": "La Zone de Développement Proximal (ZDP) correspond :", "o": ["À ce que l’enfant sait faire seul", "À ce que l’enfant ne peut jamais faire", "À la différence entre performance autonome et assistée", "À une compétence innée", "À une limite biologique fixe"], "r": 2, "e": "La ZDP est l'écart entre ce que l'enfant réussit seul et ce qu'il réussit avec l'aide d'un adulte ou d'un pair plus avancé. C'est là que l'enseignement est efficace — et le fondement de la notion d'étayage."}, {"q": "Dans la théorie du traitement de l’information, la pensée est comparée à :", "o": ["Un réseau social", "Un organisme biologique", "Un ordinateur", "Un système émotionnel", "Une construction culturelle"], "r": 2, "e": "L'approche du traitement de l'information modélise la cognition comme un système d'entrée, de stockage et de sortie, avec ses registres et ses limites de capacité — d'où la métaphore informatique."}, {"q": "La séquence correcte du traitement de l’information est :", "o": ["Mémoire long terme → mémoire sensorielle → mémoire court terme", "Mémoire sensorielle → mémoire court terme → mémoire long terme", "Mémoire court terme → attention → mémoire sensorielle", "Attention → mémoire long terme → mémoire sensorielle", "Mémoire long terme → attention → output"], "r": 1, "e": "L'information transite par le registre sensoriel (très bref), passe en mémoire de travail si elle est attentionnellement sélectionnée, puis est éventuellement encodée en mémoire à long terme."}, {"q": "Le microsystème de Bronfenbrenner correspond :", "o": ["Aux valeurs culturelles", "Aux événements historiques", "Aux environnements immédiats de l’enfant", "Aux institutions politiques", "Aux interactions indirectes"], "r": 2, "e": "Le microsystème est le niveau des relations directes : famille, crèche, école, voisinage. Les valeurs culturelles relèvent du macrosystème, les influences indirectes de l'exosystème."}, {"q": "L’ exosystème se définit comme :", "o": ["Une interaction directe avec l’enfant", "Un environnement qui n’affecte pas l’enfant", "Un environnement indirect influençant l’enfant", "Un environnement biologique", "Le système de valeurs culturelles"], "r": 2, "e": "L'exosystème regroupe les milieux où l'enfant n'est pas présent mais dont les décisions le touchent : le lieu de travail d'un parent, le conseil municipal, le réseau d'amis des parents."}, {"q": "Selon Bowlby, le besoin d’attachement est :", "o": ["Secondaire à l’alimentation", "Appris par conditionnement", "Un besoin primaire", "Culturel", "Dépendant du langage"], "r": 2, "e": "Bowlby rompt avec l'idée d'un attachement dérivé du besoin de nourriture : c'est un besoin primaire, sélectionné par l'évolution pour la protection. Les singes de Harlow, préférant la mère en tissu à celle qui nourrit, l'ont confirmé."}, {"q": "La Strange Situation permet principalement :", "o": ["D’évaluer le QI", "De mesurer la mémoire", "D’évaluer la qualité de l’attachement", "De tester la peur innée", "De diagnostiquer des troubles neurologiques"], "r": 2, "e": "La procédure d'Ainsworth alterne séparations et retrouvailles avec la mère en présence d'un inconnu. C'est la réaction aux retrouvailles qui classe l'attachement : sécure, évitant, ambivalent ou désorganisé."}, {"q": "Selon Maslow, les besoins qui motivent le comportement humain sont :", "o": ["Indépendants les uns des autres", "Hiérarchisés", "Purement biologiques", "Aléatoires", "Exclusivement sociaux"], "r": 1, "e": "La pyramide de Maslow ordonne les besoins des plus fondamentaux (physiologiques, sécurité) aux plus élevés (appartenance, estime, accomplissement), les premiers devant être suffisamment satisfaits pour que les suivants deviennent motivants."}, {"q": "La perspective éthologique met l’accent sur :", "o": ["Le conditionnement", "Les conflits inconscients", "Les bases biologiques et évolutionnistes du comportement", "Les processus cognitifs abstraits", "Les apprentissages scolaires"], "r": 2, "e": "L'éthologie (Lorenz, Tinbergen, Bowlby) étudie le comportement comme un produit de l'évolution, dans son milieu naturel : empreinte, périodes sensibles, valeur adaptative de l'attachement."}, {"q": "Ce qui rapproche Vygotsky de Piaget est :", "o": ["L'importance accordée aux stades universels", "L'accent mis sur l'implication active de l'enfant dans son environnement", "La primauté du renforcement", "Le rôle central du langage intérieur"], "r": 1, "e": "Leur divergence porte ailleurs : Piaget décrit une construction essentiellement individuelle, Vygotsky un processus coopératif où l'apprentissage passe d'abord par l'interaction sociale."}, {"q": "Selon Vygotsky, les activités partagées permettent aux enfants :", "o": ["D'imiter mécaniquement les adultes", "D'intérioriser les modes de pensée et de comportement de leur société", "D'éviter les conflits cognitifs", "De progresser sans aide"], "r": 1, "e": "L'intériorisation est le mécanisme central de sa théorie : ce qui se joue d'abord entre les personnes devient ensuite une ressource mentale propre à l'enfant."}, {"q": "L'étayage (scaffolding) désigne :", "o": ["La structure des stades de développement", "Le guidage par un adulte ou un pair plus avancé jusqu'à ce que l'enfant réalise la tâche seul", "Un renforcement positif", "La mémorisation par répétition"], "r": 1, "e": "L'image est celle de l'échafaudage : un soutien temporaire, ajusté et destiné à être retiré. C'est la mise en œuvre pratique de la zone de développement proximal."}, {"q": "Dans la théorie du traitement de l'information, l'activité mentale commence par :", "o": ["Une sortie orientée vers un objectif", "Une entrée via les sens", "Un stockage en mémoire à long terme", "Une répétition"], "r": 1, "e": "Le modèle va de l'input sensoriel à l'output, c'est-à-dire à l'action orientée vers un but. D'où l'analogie avec l'ordinateur comme instrument de traitement."}, {"q": "Les trois étapes-clés retenues par la théorie du traitement de l'information sont :", "o": ["Attention, répétition, stockage", "Perception, décision, action", "Encodage, oubli, récupération", "Entrée, calcul, sortie"], "r": 0, "e": "Les processus étudiés sont l'attention, la mémoire — sensorielle, à court terme et à long terme — et la résolution de problèmes."}, {"q": "Dans le modèle de Bronfenbrenner, le mésosystème correspond :", "o": ["Aux environnements directs de l'enfant", "À l'interaction entre deux ou plusieurs microsystèmes", "Aux valeurs culturelles dominantes", "À la dimension temporelle"], "r": 1, "e": "Les liens entre la maison et l'école, ou les réunions parents-professeurs, en sont les exemples typiques. Ce n'est pas un lieu mais une articulation entre des lieux."}, {"q": "L'exemple d'un homme frustré par son travail qui maltraite son enfant illustre :", "o": ["Le microsystème", "L'exosystème", "Le macrosystème", "Le chronosystème"], "r": 1, "e": "L'enfant n'est pas présent sur le lieu de travail, mais ce qui s'y produit le touche. C'est la définition même de l'exosystème : un environnement qui affecte indirectement."}, {"q": "Le macrosystème de Bronfenbrenner regroupe :", "o": ["La famille et l'école", "Les valeurs, croyances et coutumes dominantes de la culture", "Les événements historiques", "Les relations entre microsystèmes"], "r": 1, "e": "Culture, religion et idéologies forment le cadre le plus englobant, celui qui donne leur forme aux systèmes inférieurs sans jamais apparaître directement."}, {"q": "Le chronosystème introduit dans le modèle de Bronfenbrenner :", "o": ["La dimension du temps, le degré de stabilité ou de variation", "Les relations entre pairs", "Les institutions politiques", "Les facteurs génétiques"], "r": 0, "e": "Événements historiques et transitions familiales — divorce, déménagement, crise économique — y prennent place. C'est le cinquième système, ajouté pour rendre compte du changement."}, {"q": "La perspective humaniste s'intéresse particulièrement :", "o": ["Aux comportements observables", "Aux facteurs internes : personnalité, sentiments, valeurs et espoirs", "Aux structures cognitives", "Aux bases biologiques du comportement"], "r": 1, "e": "Elle cherche à aider les personnes à promouvoir leur propre développement par leurs capacités de choix, leur créativité et leur réalisation personnelle."}, {"q": "Dans la hiérarchie de Maslow, les besoins d'appartenance et d'amour se situent :", "o": ["Au premier niveau", "Au troisième niveau, après les besoins physiologiques et de sécurité", "Au sommet de la pyramide", "En dehors de la hiérarchie"], "r": 1, "e": "L'ordre complet : physiologiques, sécurité, appartenance et amour, estime, puis auto-actualisation. Les besoins inférieurs doivent être suffisamment satisfaits pour que les suivants deviennent motivants."}, {"q": "Le besoin d'auto-actualisation chez Maslow correspond à :", "o": ["La satisfaction de la faim et de la soif", "Le besoin de reconnaissance sociale", "La réalisation personnelle, au sommet de la hiérarchie", "Le besoin de sécurité"], "r": 2, "e": "Maslow (1908-1970) le place au-dessus de l'estime : c'est le développement de son potentiel propre, une fois les besoins plus fondamentaux assurés."}, {"q": "Selon l'éthologie, chaque espèce a développé des comportements :", "o": ["Appris individuellement", "Innés et spécifiques, augmentant ses chances de survie", "Identiques à ceux des autres espèces", "Indépendants de l'évolution"], "r": 1, "e": "L'approche insiste également sur l'existence de périodes critiques ou sensibles, moments où certains apprentissages se font avec une facilité particulière."}, {"q": "Bowlby considère le besoin d'attachement comme :", "o": ["Secondaire, dérivé du besoin alimentaire", "Primaire, au même titre que les besoins vitaux comme l'alimentation", "Acquis par conditionnement", "Culturellement variable"], "r": 1, "e": "C'est une rupture avec les conceptions antérieures qui faisaient de l'attachement un sous-produit de la satisfaction alimentaire. Les travaux de Harlow lui donneront raison."}, {"q": "Selon Bowlby, l'enfant est génétiquement prédisposé à :", "o": ["Imiter les adultes", "Répondre à des signaux internes et externes et garantir la proximité d'une personne particulière", "Explorer seul son environnement", "Développer le langage"], "r": 1, "e": "Froid, faim, douleur du côté de l'organisme ; bruit fort, obscurité soudaine du côté de l'environnement. Dans les deux cas, la réponse consiste à rechercher la figure d'attachement."}, {"q": "Le répertoire d'actions initial du bébé décrit par Bowlby comprend :", "o": ["La succion, la préhension et les pleurs", "Le langage et le sourire social", "La marche et la préhension fine", "L'imitation différée"], "r": 0, "e": "Ce répertoire s'élargit ensuite aux sourires, aux appels et à la locomotion, tous orientés vers le maintien de la proximité avec la figure d'attachement."}, {"q": "L'imprinting mis en évidence par Lorenz est décrit comme :", "o": ["Progressif et réversible", "Automatique et irréversible, survenant pendant une brève période critique", "Acquis par renforcement", "Dépendant de l'alimentation"], "r": 1, "e": "Lorenz imitait la démarche et le cri des canards ; les canetons le suivaient comme leur mère. Le phénomène résulte d'une prédisposition du système nerveux juste après la naissance."}, {"q": "Dans les expériences de Harlow, les bébés singes passaient le plus de temps accrochés :", "o": ["À la mère en fil de fer qui les nourrissait", "À la mère en tissu éponge, même lorsqu'ils étaient nourris par l'autre", "Indifféremment aux deux", "À aucune des deux"], "r": 1, "e": "C'est la démonstration décisive : la préférence ne suit pas la source de nourriture. Placés en lieu inconnu, ces singes exploraient davantage et préféraient encore la mère en tissu un an après."}, {"q": "La conclusion de Harlow dans « The nature of love » (1958) est que :", "o": ["L'alimentation est le fondement du lien", "Le réconfort du contact physique intime est essentiel, et non l'alimentation", "Les singes n'ont pas d'attachement", "L'attachement est purement appris"], "r": 1, "e": "Il souligne chez les singes un besoin inné de s'accrocher. Le cours précise qu'aucun de ces animaux n'a grandi normalement ni n'a su élever sa propre progéniture."}, {"q": "Parmi les caractéristiques de l'attachement selon Bowlby, on ne trouve PAS :", "o": ["Le caractère sélectif", "La recherche de proximité physique", "L'indifférence à la séparation", "Le fait de procurer réconfort et sécurité"], "r": 2, "e": "C'est l'inverse : la rupture provoque une anxiété de séparation. Cette réaction est même l'un des indices les plus sûrs de l'existence d'un lien d'attachement."}, {"q": "La double fonction de l'attachement selon Bowlby est :", "o": ["Protection et socialisation", "Alimentation et réconfort", "Exploration et apprentissage", "Imitation et langage"], "r": 0, "e": "La protection est jugée aussi importante que le comportement alimentaire. La socialisation correspond au déplacement progressif de l'attachement de la mère vers la famille, puis les étrangers et les groupes."}, {"q": "Selon les étapes décrites par Ainsworth en 1964, la peur des étrangers apparaît :", "o": ["Dès la naissance", "Entre 6 et 8 mois", "Vers 18 mois", "Après 2 ans"], "r": 1, "e": "Elle coïncide avec l'établissement d'un attachement bien défini à la mère, vers 6-7 mois. Avant 2 mois, les réactions du bébé restent indistinctes quel que soit l'interlocuteur."}, {"q": "La Situation étrange d'Ainsworth (1967) s'adresse à des bébés âgés de :", "o": ["0 à 6 mois", "10 à 24 mois", "2 à 4 ans", "6 mois à 1 an"], "r": 1, "e": "La procédure se déroule dans une salle inconnue et enchaîne de courts épisodes : présence de la mère, arrivée d'une étrangère, absence de la mère, puis retrouvailles."}, {"q": "Dans la Situation étrange, ce qui est déterminant pour classer l'attachement est :", "o": ["La réaction au moment de la séparation", "La réaction au moment des retrouvailles avec la mère", "Le temps passé à explorer", "La réaction à l'étrangère"], "r": 1, "e": "C'est l'usage que l'enfant fait de sa mère comme base sécurisante qui est révélé. Les tensions des épisodes ne servent qu'à activer le comportement d'attachement."}, {"q": "L'enfant à attachement insécurisant évitant se caractérise par le fait qu'il :", "o": ["Pleure beaucoup au départ de la mère", "Évite le contact, pleure rarement au départ et évite la mère au retour", "Recherche le contact tout en y résistant", "Adopte des comportements contradictoires"], "r": 1, "e": "Il ne demande pas d'aide. À distinguer du résistant, très perturbé et difficile à consoler, et du désorganisé, dont le comportement est contradictoire et sans modèle cohérent."}, {"q": "L'attachement insécurisant résistant, ou ambivalent, se manifeste par :", "o": ["Une exploration abondante", "Une perturbation intense à la séparation, une difficulté à être consolé et une recherche de contact à laquelle l'enfant résiste", "Une indifférence au retour de la mère", "Une absence de réaction à l'étrangère"], "r": 1, "e": "Le paradoxe apparent — chercher et repousser à la fois — donne son nom au type ambivalent. Ces enfants explorent peu, ce qui témoigne d'une base sécurisante défaillante."}, {"q": "L'attachement désorganisé se reconnaît à :", "o": ["Une stratégie cohérente d'évitement", "L'absence de modèle cohérent, avec des comportements contradictoires mêlant recherche et évitement", "Une exploration confiante", "Une résistance systématique"], "r": 1, "e": "Confusion et appréhension dominent. C'est le seul des quatre types qui ne constitue pas une stratégie organisée face à la séparation."}, {"q": "L'enfant à attachement sécurisant se caractérise par :", "o": ["Un besoin modéré de proximité, l'usage de la mère comme base sécurisante et un accueil positif au retour", "Une absence de réaction à la séparation", "Une détresse ininterrompue", "Un refus d'explorer"], "r": 0, "e": "La sécurité se lit dans l'alternance : l'enfant s'éloigne pour explorer parce qu'il sait pouvoir revenir, et se laisse apaiser rapidement au retour."}, {"q": "Selon le cours, un attachement sécurisant au père :", "o": ["Ne joue aucun rôle", "Peut compenser un attachement insécurisant à la mère", "Empêche l'attachement à la mère", "Apparaît beaucoup plus tard"], "r": 1, "e": "Le cours précise que les bébés développent un attachement aux deux parents à peu près au même moment. La pluralité des figures d'attachement est donc un facteur de résilience."}, {"q": "Bowlby déconseille de séparer la mère et le bébé :", "o": ["En toutes circonstances", "Sans substitut de bonne qualité", "Avant l'âge de 6 ans", "Sauf en cas de maladie"], "r": 1, "e": "La nuance est importante : ce n'est pas la présence de la mère biologique qui est jugée indispensable, mais la continuité d'une relation d'attachement de qualité."}, {"q": "Ainsworth a mené ses études comparatives auprès de bébés :", "o": ["Européens uniquement", "Africains et nord-américains", "Asiatiques et sud-américains", "D'un seul pays"], "r": 1, "e": "Cette dimension comparative visait à distinguer ce qui, dans l'attachement, relève de l'universel et ce qui dépend des pratiques culturelles de soin."}, {"q": "La zone de développement proximal n'existe que :", "o": ["Chez les enfants d'âge scolaire", "Dans l'interaction avec un adulte ou un pair plus avancé", "Après l'acquisition du langage", "En situation d'évaluation"], "r": 1, "e": "Elle désigne l'écart entre ce que l'enfant réussit seul et ce qu'il réussit accompagné. Sans aide ajustée, il n'y a que le niveau actuel, et donc aucune zone proximale."}, {"q": "La théorie du traitement de l'information distingue la mémoire :", "o": ["Sensorielle, à court terme et à long terme", "Explicite et implicite uniquement", "Épisodique et procédurale uniquement", "Consciente et inconsciente"], "r": 0, "e": "Ce découpage suit le trajet de l'information : un registre sensoriel très bref, une mémoire de travail limitée, puis un stockage durable."}, {"q": "Pour Vygotsky, la croissance cognitive est avant tout :", "o": ["Un processus individuel", "Un processus coopératif", "Le résultat de la maturation", "Une succession de stades universels"], "r": 1, "e": "C'est la différence majeure avec Piaget : l'enfant n'est pas seul face au monde, il apprend d'abord avec les autres, puis intériorise ce qui s'est joué dans l'échange."}, {"q": "L'approche écologique de Bronfenbrenner compte :", "o": ["Trois systèmes", "Quatre systèmes", "Cinq systèmes contextuels emboîtés", "Sept systèmes"], "r": 2, "e": "Micro, méso, exo, macro et chronosystème. L'image est celle de poupées russes, chaque niveau contenant et influençant les précédents."}, {"q": "Le microsystème comprend :", "o": ["Les activités, rôles et relations dans les environnements directs de la personne", "Les valeurs culturelles", "Le travail des parents", "Les événements historiques"], "r": 0, "e": "Famille, école et lieu de travail en sont les exemples. C'est le seul niveau où la personne est présente et interagit directement."}, {"q": "Maslow a vécu de :", "o": ["1896 à 1980", "1908 à 1970", "1902 à 1994", "1925 à 2021"], "r": 1, "e": "Figure de la psychologie humaniste, il propose la hiérarchie des besoins qui reste l'un des modèles les plus connus de la motivation humaine."}, {"q": "L'imprinting de Lorenz suppose une prédisposition :", "o": ["Acquise par apprentissage", "Du système nerveux, active pendant une brève période critique après la naissance", "Transmise par la mère", "Liée à l'alimentation"], "r": 1, "e": "Sa brièveté et son caractère irréversible ont conduit à forger la notion de période critique, plus tard assouplie en période sensible pour rendre compte de la plasticité humaine."}, {"q": "Dans l'expérience de Harlow, les singes élevés par la mère en tissu, placés en lieu inconnu :", "o": ["Refusaient d'explorer", "Exploraient davantage que ceux élevés par la mère en fil de fer", "Se montraient agressifs", "Cherchaient la mère en fil de fer"], "r": 1, "e": "C'est la fonction de base sécurisante : le contact réconfortant ne retient pas l'animal, il lui permet au contraire de s'aventurer."}, {"q": "Entre 8 et 12 semaines, selon Ainsworth, le bébé :", "o": ["Réagit indistinctement à n'importe qui", "Manifeste davantage de pleurs, de sourires et de babillage avec sa mère", "Présente une peur marquée des étrangers", "A un attachement pleinement défini"], "r": 1, "e": "La différenciation s'amorce avant l'attachement proprement dit, qui n'est bien défini que vers 6-7 mois. Avant 2 mois, les réactions restent indistinctes."}]};</script>
