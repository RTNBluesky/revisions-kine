<script>window.QUIZ={"titre": "QCM", "fiche": "../fiches/fiche_11_troisieme_enfance.html", "questions": [{"q": "Durant la troisième enfance, la croissance corporelle se caractérise par :", "o": ["Une accélération comparable à celle de la puberté", "Une croissance lente et régulière", "Une stagnation pondérale", "Une perte de masse musculaire", "Une augmentation rapide du tissu adipeux chez tous les enfants"], "r": 1, "e": "Entre 6 et 12 ans, la croissance est lente et régulière — environ 5 à 6 cm et 2 à 3 kg par an — ce qui contraste avec la poussée pubertaire qui suivra."}, {"q": "Concernant les différences filles/garçons à cet âge :", "o": ["Les garçons se développent plus tôt que les filles", "Les filles présentent davantage de tissu adipeux", "Les garçons conservent plus de masse grasse", "Il n’existe aucune différence", "Les différences apparaissent uniquement à l’adolescence"], "r": 1, "e": "Dès l'enfance, et plus nettement à la puberté, les filles présentent une proportion de masse grasse supérieure et les garçons davantage de masse musculaire."}, {"q": "À partir de quel âge environ les dents définitives commencent-elles à apparaître ? :", "o": ["4 ans", "5 ans", "6 ans", "8 ans", "10 ans"], "r": 2, "e": "Les premières dents permanentes, souvent les premières molaires et les incisives centrales, sortent vers 6 ans, au début de la troisième enfance. La dentition de lait est complète vers 3 ans."}, {"q": "Le stade cognitif correspondant à la troisième enfance selon Piaget est :", "o": ["Préopératoire", "Sensori-moteur", "Opérations concrètes", "Opérations formelles", "Post-formel"], "r": 2, "e": "La troisième enfance (6-12 ans) correspond aux opérations concrètes : conservation, classification, sériation, réversibilité — mais toujours appuyées sur du concret."}, {"q": "La pensée de l’enfant à ce stade est dite « concrète » car :", "o": ["Elle est illogique", "Elle repose sur l’intuition", "Elle nécessite des objets ou situations concrètes", "Elle est purement perceptive", "Elle est entièrement abstraite"], "r": 2, "e": "Concrète ne veut pas dire illogique : l'enfant applique une logique réelle, mais qui doit s'appuyer sur des objets ou des situations qu'il peut se représenter. Il échouera au même raisonnement posé en termes purement verbaux."}, {"q": "La mémoire qui se développe le plus durant l’âge scolaire est :", "o": ["Mémoire sensorielle", "Mémoire à long terme", "Mémoire procédurale", "Mémoire à court terme / mémoire de travail", "Mémoire autobiographique"], "r": 3, "e": "L'âge scolaire est marqué par l'essor de la mémoire de travail et surtout par l'apparition des stratégies (répétition, organisation, élaboration) et de la métamémoire qui les pilote."}, {"q": "La métamémoire correspond :", "o": ["À la capacité de mémorisation brute", "À la mémoire émotionnelle", "À la connaissance que l’on a de sa propre mémoire", "À la mémoire sensorielle", "À une stratégie d’apprentissage"], "r": 2, "e": "La métamémoire est un savoir sur son propre fonctionnement mnésique : savoir qu'on retient mieux en répétant, ou estimer si l'on saura répondre. Elle se développe à l'âge scolaire et rend l'apprentissage stratégique."}, {"q": "Selon Erikson, le conflit psychosocial central de la troisième enfance est :", "o": ["Initiative vs culpabilité", "Identité vs confusion des rôles", "Autonomie vs honte", "Productivité (industrie) vs infériorité", "Intimité vs isolement"], "r": 3, "e": "Le 4ᵉ stade, Productivité (industrie) vs infériorité, couvre 6-12 ans : l'enfant se mesure à des tâches réelles et évaluées, à l'école comme dans les activités, et en tire un sentiment de compétence ou d'insuffisance."}, {"q": "À cet âge, l’agression devient principalement :", "o": ["Physique", "Instrumentale", "Relationnelle ou sociale", "Accidentelle", "Inexistante"], "r": 2, "e": "À l'âge scolaire, l'agression se déplace du physique vers le relationnel : exclusion du groupe, rumeurs, mise à l'écart. Elle est plus discrète mais tout aussi délétère."}, {"q": "L’« effet Pygmalion » montre que :", "o": ["Les capacités intellectuelles sont innées", "Les attentes des enseignants influencent la réussite des élèves", "Le QI est immuable", "Les élèves surdoués réussissent toujours", "L’école n’a aucun impact sur le développement"], "r": 1, "e": "Rosenthal et Jacobson ont montré qu'une attente positive induite chez l'enseignant améliore effectivement les résultats de l'élève : l'attente modifie les interactions, qui modifient la performance. C'est une prophétie autoréalisatrice."}, {"q": "En troisième enfance, le remplacement des dents de lait par les dents définitives se fait au rythme d'environ :", "o": ["1 par an pendant 20 ans", "4 par an pendant 5 ans", "10 par an pendant 2 ans", "Toutes la même année"], "r": 1, "e": "Le processus commence à 6 ans. L'enfant a par ailleurs beaucoup d'appétit à cet âge et mange davantage que les plus jeunes."}, {"q": "En fin de troisième enfance, l'importance croissante de l'image corporelle :", "o": ["Concerne surtout les garçons", "Concerne surtout les filles et accroît le risque de troubles alimentaires", "N'a aucune conséquence", "Disparaît à l'adolescence"], "r": 1, "e": "Les filles se développent plus tôt et conservent un peu plus de tissu adipeux, ce qui rend cette période particulièrement sensible sur le plan de l'image de soi."}, {"q": "À 7 ans, sur le plan moteur, l'enfant est capable de :", "o": ["Lancer une balle à 21 mètres", "Tenir en équilibre sur un pied sans regarder et marcher sur une barre de 5 cm", "Courir à 5 m/s", "Sauter à 1,5 m"], "r": 1, "e": "À 6 ans, les filles sont plus précises et les garçons plus forts ; à 8 ans, la force de préhension atteint 5,4 kg et le lancer porte à environ 12 mètres."}, {"q": "À 10 ans, une acquisition motrice caractéristique est :", "o": ["Le saut à 1,5 m", "La capacité d'évaluer et d'intercepter une trajectoire", "Le lancer à 12 mètres", "L'équilibre sur un pied"], "r": 1, "e": "Les filles courent alors à 5,1 m/s. Cette anticipation de trajectoire suppose une coordination perceptivo-motrice élaborée, utile dans les sports collectifs."}, {"q": "Les jeux turbulents, caractéristiques de la troisième enfance, se reconnaissent à :", "o": ["Leur caractère silencieux", "Leur vigueur — se battre, donner des coups de pied, rouler, se poursuivre — accompagnée de rires et de cris", "Leur nature compétitive et réglée", "Leur rareté à cet âge"], "r": 1, "e": "Ils atteignent leur apogée à cette période, qui est aussi celle où l'on observe le plus de blessures accidentelles."}, {"q": "Les acquisitions cognitives des opérations concrètes comprennent :", "o": ["La classification multiple, la réversibilité, la sériation et la conservation", "Le raisonnement hypothético-déductif", "La pensée symbolique et l'animisme", "La permanence de l'objet"], "r": 0, "e": "La pensée devient réversible, flexible et efficace, avec un raisonnement systématique et une libération de l'égocentrisme — mais elle a encore besoin de supports concrets."}, {"q": "Dans le traitement de l'information, le codage consiste à :", "o": ["Retenir l'information dans la durée", "Placer l'information dans un dossier avec une étiquette, notamment par catégorisation", "Se souvenir d'une information", "Effacer une information"], "r": 1, "e": "Les trois phases sont le codage, le stockage — rétention de l'information codée — et la récupération, c'est-à-dire le souvenir proprement dit."}, {"q": "La mémoire sensorielle se caractérise par une durée d'environ :", "o": ["0,5 seconde", "30 secondes", "5 minutes", "Illimitée"], "r": 0, "e": "Le cours souligne qu'elle change peu avec l'âge : dès 5 ans, elle équivaut à celle de l'adulte. Ce n'est donc pas elle qui explique les progrès mnésiques de l'âge scolaire."}, {"q": "Quelle mémoire se développe le plus durant l'âge scolaire ?", "o": ["La mémoire sensorielle", "La mémoire à court terme, ou mémoire de travail", "La mémoire à long terme uniquement", "Aucune"], "r": 1, "e": "C'est l'information sur laquelle on travaille activement, notamment par répétition. La mémoire à long terme, de capacité quasi illimitée, mûrit entre 8 et 10 ans."}, {"q": "La mémoire à long terme mûrit, selon le cours, entre :", "o": ["3 et 5 ans", "6 et 7 ans", "8 et 10 ans", "11 et 13 ans"], "r": 2, "e": "Sa capacité est décrite comme quasi illimitée. Sa maturation, jointe aux progrès de la mémoire de travail, explique les performances scolaires croissantes de cette période."}, {"q": "Parmi les connaissances relevant de la métamémoire, le cours cite :", "o": ["Savoir que plus on étudie, mieux on retient, et qu'on oublie avec le temps", "Le nombre exact de mots retenus", "La liste des matières scolaires", "La capacité de la mémoire sensorielle"], "r": 0, "e": "S'y ajoutent : il est plus facile de réapprendre, certaines personnes ont une meilleure mémoire, et certaines choses sont plus faciles à retenir que d'autres."}, {"q": "Noter un numéro ou placer un livre près de la porte sont des mnémoniques :", "o": ["Internes", "Externes", "Sensoriels", "Inefficaces"], "r": 1, "e": "Les mnémoniques internes sont la répétition, l'organisation et l'élaboration — par exemple inventer une histoire reliant les éléments à retenir."}, {"q": "L'élaboration, comme stratégie mnémonique interne, consiste à :", "o": ["Répéter mentalement l'information", "Regrouper l'information par catégories", "Inventer des histoires reliant les éléments à retenir", "Noter l'information sur un support"], "r": 2, "e": "Elle est plus efficace que la simple répétition parce qu'elle crée des liens sémantiques, donc davantage de chemins d'accès à l'information."}, {"q": "Les progrès de l'attention sélective à l'âge scolaire sont liés :", "o": ["À la maturation neurologique", "À l'entraînement scolaire uniquement", "À l'imitation des adultes", "Au développement moteur"], "r": 0, "e": "Les enfants se concentrent plus longtemps, focalisent sur l'information utile, ignorent l'inutile et commettent moins d'erreurs de mémoire."}, {"q": "Au plan du langage, la troisième enfance se caractérise notamment par :", "o": ["L'apparition des premiers mots", "L'utilisation de comparaisons et de métaphores, et la compréhension des différentes significations d'un mot", "Le langage télégraphique", "Le discours privé dominant"], "r": 1, "e": "L'enfant emploie aussi des termes plus précis pour décrire l'action. L'apprentissage de la lecture et de l'écriture le libère de la communication en face-à-face."}, {"q": "L'étude de l'effet Pygmalion a été menée par :", "o": ["Piaget et Inhelder", "Rosenthal et Jacobson en 1968", "Erikson et Erikson", "Anderson"], "r": 1, "e": "Les chercheurs ont faussement annoncé aux enseignants que certains élèves avaient un potentiel élevé ; ces élèves ont effectivement mieux réussi."}, {"q": "Le mécanisme de l'effet Pygmalion est :", "o": ["Une amélioration réelle du QI initial", "Une prophétie auto-réalisatrice : les enseignants ont revu leurs attentes à la hausse et modifié leur attitude", "Un biais de mesure", "Une sélection des meilleurs élèves"], "r": 1, "e": "Ce n'est donc pas l'élève qui change d'abord, mais la relation pédagogique. Les attentes modifient les interactions, qui modifient la performance."}, {"q": "Selon le cours, c'est à l'entrée à l'école qu'apparaissent notamment :", "o": ["Les difficultés d'apprentissage, les problèmes d'attention et l'identification des enfants surdoués", "Les troubles du sommeil", "Les terreurs nocturnes", "Les premiers mots"], "r": 0, "e": "L'école est le premier contexte où les compétences cognitives sont systématiquement sollicitées et comparées, ce qui rend visibles des difficultés jusque-là masquées."}, {"q": "Dans le stade Compétence vs Infériorité, le lieu central de validation est :", "o": ["La famille", "L'école", "Le groupe de pairs", "Le club sportif"], "r": 1, "e": "La question clé est « suis-je compétent ou incompétent ? », et la réponse influence fortement l'estime de soi à cet âge."}, {"q": "Les groupes d'amis en troisième enfance se forment généralement :", "o": ["Entre enfants de sexes différents", "Entre enfants du même sexe, dans le voisinage ou à l'école", "Uniquement par affinités familiales", "De façon aléatoire"], "r": 1, "e": "Le cours souligne que c'est à cette période que le groupe d'amis commence à jouer un rôle fondamental dans le développement social."}, {"q": "Parmi les effets positifs du groupe de pairs, le cours cite :", "o": ["L'acquisition du leadership, de la communication et de la coopération", "L'adoption de comportements indésirables", "Le renforcement des préjugés", "L'imitation des adultes"], "r": 0, "e": "Le groupe développe la sociabilité et l'intimité, procure un sentiment d'appartenance et une sécurité émotionnelle, et apprend à équilibrer ses besoins et ceux des autres."}, {"q": "Parmi les effets négatifs du groupe de pairs, le cours mentionne :", "o": ["L'excès de coopération", "L'acceptation de normes indésirables, l'adoption de comportements comme le vol ou les drogues, et le renforcement des préjugés", "La perte du langage", "L'isolement systématique"], "r": 1, "e": "Il note également que les jeunes antisociaux attirent d'autres jeunes antisociaux, ce qui produit un effet d'amplification au sein du groupe."}, {"q": "Concernant la popularité en troisième enfance, le cours indique que :", "o": ["Elle n'a aucune conséquence à long terme", "Les enfants appréciés s'adaptent mieux à l'adolescence, tandis que ceux en difficulté ont un risque accru de problèmes psychologiques, d'abandon scolaire et de délinquance", "Elle dépend uniquement des résultats scolaires", "Elle se stabilise dès 6 ans"], "r": 1, "e": "L'estime de soi est fortement influencée par l'opinion des amis à cette période, ce qui explique le poids durable de la position dans le groupe."}, {"q": "L'amitié, en troisième enfance, se caractérise par la recherche :", "o": ["D'un simple compagnon de jeu", "D'engagement et de coopération mutuelle", "D'un modèle adulte", "D'une protection physique"], "r": 1, "e": "Les enfants distinguent désormais meilleurs amis, bons amis et amis occasionnels : la relation se hiérarchise et suppose une réciprocité."}, {"q": "L'agression relationnelle consiste à :", "o": ["Frapper ou pousser", "Dénigrer, répandre des rumeurs, provoquer et manipuler", "Voler des objets", "Insulter les adultes"], "r": 1, "e": "Elle remplace progressivement l'agression physique et devient particulièrement courante chez les filles à cet âge."}, {"q": "Pour qu'une agression soit qualifiée d'intimidation (bullying), elle doit être :", "o": ["Occasionnelle et involontaire", "Délibérée, persistante et dirigée contre une victime généralement faible ou sans défense", "Uniquement physique", "Réciproque"], "r": 1, "e": "Ces trois critères sont cumulatifs. L'intimidation peut être physique, verbale ou relationnelle — insultes, intrigues, mise à l'écart."}, {"q": "Selon les études citées (Anderson, 2000), les enfants exposés à des jeux vidéo violents présentent :", "o": ["Une hausse des comportements prosociaux", "Une baisse des comportements prosociaux, une hausse des pensées agressives et une réaction violente accrue à la provocation", "Aucune modification", "Une amélioration de l'attention"], "r": 1, "e": "Le cours indique deux facteurs d'atténuation : réduire le temps d'exposition et assurer une surveillance ou un accompagnement parental."}, {"q": "Parmi les signes de la dépression infantile, le cours cite :", "o": ["Une humeur altérée, un manque d'amis, une perte d'intérêt, de la fatigue et un sentiment d'inutilité", "Une hyperactivité isolée", "Des troubles du langage", "Une croissance ralentie"], "r": 0, "e": "S'y ajoutent l'apathie, les plaintes physiques et les pensées morbides ou suicidaires. La dépression de l'enfant s'exprime souvent différemment de celle de l'adulte. Si ce sujet te touche personnellement, en parler à un professionnel ou à un adulte de confiance est utile."}, {"q": "Le concept d'« enfants pressés » a été proposé par :", "o": ["Anderson", "Elkind", "Rosenthal", "Erikson"], "r": 1, "e": "Il désigne les pressions de la vie moderne — école, sport, attentes parentales — qui forcent les enfants à se développer prématurément et les exposent tôt aux problèmes des adultes."}, {"q": "La résilience est définie dans le cours comme la capacité à :", "o": ["Éviter toute difficulté", "Conserver son équilibre et ses compétences malgré des conditions dangereuses, et à se remettre des traumatismes", "Ne ressentir aucune émotion négative", "Réussir scolairement"], "r": 1, "e": "Les facteurs protecteurs cités sont la relation avec un parent ou tuteur attentionné, un QI plus élevé avec des capacités de résolution de problèmes, la personnalité et les expériences enrichissantes."}, {"q": "Parmi les troubles pouvant apparaître en troisième enfance, le cours cite :", "o": ["Les phobies scolaires et les troubles anxieux comme le TAG et les TOC", "Les terreurs nocturnes exclusivement", "Les troubles du langage uniquement", "L'énurésie primaire"], "r": 0, "e": "S'y ajoutent les troubles du comportement de type antisocial et la dépression infantile. L'entrée dans le cadre scolaire rend ces difficultés plus visibles."}, {"q": "Concernant les différences motrices entre filles et garçons à 11 ans, le cours indique que :", "o": ["Les filles sautent plus loin que les garçons", "Les garçons sautent à 1,5 m, les filles environ 15 cm de moins", "Les performances sont identiques", "Les filles courent nettement plus vite"], "r": 1, "e": "À 10 ans, les filles couraient pourtant légèrement plus vite (5,1 m/s contre 5 m/s à 9 ans pour les garçons). Les écarts se creusent surtout à l'approche de la puberté."}, {"q": "À 8 ans, sur le plan moteur, le cours signale notamment :", "o": ["Une force de préhension de 5,4 kg et le pic des jeux mixtes", "La capacité d'intercepter une trajectoire", "Une course à 5 m/s", "Un saut à 1,5 m"], "r": 0, "e": "L'enfant lance alors une balle à environ 12 mètres. À 9 ans, la portée du lancer atteint 21,3 mètres chez les garçons."}, {"q": "Le stockage, deuxième phase du traitement de l'information, consiste à :", "o": ["Étiqueter l'information", "Retenir l'information codée", "Récupérer un souvenir", "Effacer une information inutile"], "r": 1, "e": "Il s'intercale entre le codage, qui organise l'information, et la récupération, qui la ramène à la conscience. Un échec peut survenir à chacune des trois étapes."}, {"q": "La libération de l'égocentrisme, acquise aux opérations concrètes, permet notamment :", "o": ["De raisonner sur des hypothèses", "De considérer d'autres points de vue que le sien", "D'acquérir le langage", "De développer la motricité fine"], "r": 1, "e": "C'est la décentration. Elle rend possibles la coopération, la discussion et l'argumentation, qui supposent de se représenter le point de vue de l'interlocuteur."}, {"q": "L'apprentissage de la lecture et de l'écriture, selon le cours, libère l'enfant :", "o": ["De l'école", "De la communication en face-à-face", "De ses parents", "De l'influence des pairs"], "r": 1, "e": "Il peut désormais recevoir et transmettre de l'information à distance, dans le temps comme dans l'espace, ce qui élargit considérablement ses sources d'apprentissage."}, {"q": "Les enfants surdoués sont, selon le cours, généralement identifiés :", "o": ["Dès la naissance", "À l'entrée à l'école", "À l'adolescence", "À l'âge adulte"], "r": 1, "e": "Comme les difficultés d'apprentissage et les problèmes d'attention, la précocité devient repérable quand les compétences cognitives sont systématiquement sollicitées et comparées."}, {"q": "La répétition et l'organisation sont des mnémoniques :", "o": ["Externes", "Internes", "Sensoriels", "Automatiques"], "r": 1, "e": "L'élaboration complète cette liste. Les mnémoniques externes s'appuient au contraire sur des supports du milieu : notes, listes, réveils, objets placés en évidence."}, {"q": "Selon Erikson, le sentiment d'infériorité en troisième enfance :", "o": ["N'a pas de conséquence durable", "Influence fortement l'estime de soi", "Concerne uniquement le sport", "Disparaît à l'adolescence"], "r": 1, "e": "Le cours précise ailleurs qu'il engendre des blocages cognitifs : l'enfant qui ne se sent pas capable cesse d'essayer, ce qui aggrave ses difficultés."}, {"q": "Parmi les facteurs protecteurs de la résilience, le cours cite :", "o": ["L'absence de difficultés", "La relation avec un parent ou un tuteur attentionné", "L'isolement social", "L'évitement des situations nouvelles"], "r": 1, "e": "S'y ajoutent un QI plus élevé avec des capacités de résolution de problèmes, la personnalité de l'enfant et des expériences enrichissantes."}]};</script>
