<script>window.QUIZ={"titre": "QCM", "fiche": "../fiches/fiche_13_jeune_adulte.html", "questions": [{"q": "Sur le plan physique, le jeune adulte se caractérise généralement par :", "o": ["Un déclin rapide des capacités motrices", "Un apogée de la force, de l’énergie et de l’endurance", "Une diminution précoce de l’acuité visuelle", "Une augmentation importante des maladies chroniques", "Une instabilité sensorielle marquée"], "r": 1, "e": "Entre 20 et 30 ans, force, endurance, vitesse, acuité sensorielle et fonction immunitaire sont à leur maximum : c'est le sommet physique, qui rend d'ailleurs cette période peu consommatrice de soins."}, {"q": "L’acuité visuelle est maximale en moyenne :", "o": ["Entre 10 et 20 ans", "Entre 15 et 25 ans", "Entre 20 et 40 ans", "Entre 30 et 50 ans", "Après 40 ans"], "r": 2, "e": "L'acuité visuelle culmine vers 20-40 ans ; la presbytie s'installe ensuite progressivement à partir de la quarantaine, par perte d'élasticité du cristallin."}, {"q": "La perte auditive observée chez le jeune adulte concerne d’abord :", "o": ["Les sons graves", "Les sons aigus", "Les sons médiums", "Toutes les fréquences de façon équivalente", "Uniquement la parole"], "r": 1, "e": "La perte porte d'abord sur les hautes fréquences, souvent dès la vingtaine et de façon infraclinique. Les sons graves sont épargnés bien plus longtemps."}, {"q": "Selon l’OMS, la santé est définie comme :", "o": ["L’absence totale de maladie", "Un état biologique optimal", "Un état de bien-être physique, mental et social", "Une performance fonctionnelle maximale", "Une ressource uniquement individuelle"], "r": 2, "e": "La définition de 1946, reprise en 1948, pose la santé comme « un état de complet bien-être physique, mental et social, et non seulement l'absence de maladie ou d'infirmité ». Elle fonde l'approche biopsychosociale."}, {"q": "Le lien entre comportement et santé implique que :", "o": ["Les connaissances suffisent à adopter de bons comportements", "Les comportements n’influencent pas les émotions", "Les émotions et le contexte social influencent les comportements de santé", "La santé dépend uniquement de facteurs biologiques", "Les habitudes sont indépendantes de la personnalité"], "r": 2, "e": "Savoir ne suffit pas à faire : les comportements de santé dépendent aussi des émotions, des habitudes, de l'entourage et des conditions matérielles. C'est pourquoi l'information seule change peu les pratiques."}, {"q": "La pensée caractéristique du jeune adulte est dite :", "o": ["Concrète", "Préopératoire", "Hypothético-déductive uniquement", "Post-formelle", "Intuitive exclusive"], "r": 3, "e": "Le jeune adulte accède à la pensée post-formelle : relativiste, contextuelle, capable d'intégrer la contradiction et l'affect dans le raisonnement."}, {"q": "La pensée post-formelle se distingue par :", "o": ["Une logique rigide et binaire", "Une absence d’émotion dans le raisonnement", "Une capacité à gérer l’incertitude et la contradiction", "Une dépendance au raisonnement abstrait pur", "Une disparition de l’intuition"], "r": 2, "e": "La pensée post-formelle accepte que plusieurs vérités coexistent, intègre l'affect au raisonnement et sait décider en contexte incertain. Elle dépasse la logique binaire des opérations formelles sans la nier."}, {"q": "Selon Sinnott, la causalité multiple correspond à :", "o": ["Une cause unique pour chaque problème", "Une explication strictement logique", "La reconnaissance de plusieurs causes et solutions possibles", "Une pensée immature", "Une stratégie purement émotionnelle"], "r": 2, "e": "La causalité multiple est un trait de la pensée post-formelle : admettre qu'un problème a plusieurs causes et plusieurs solutions acceptables, dont le choix dépend du contexte."}, {"q": "Dans la théorie triarchique de Sternberg, l’intelligence pratique est liée :", "o": ["À la résolution de problèmes abstraits", "À la créativité artistique uniquement", "À l’adaptation aux situations concrètes de la vie quotidienne", "À la mémoire de travail", "À la vitesse de traitement"], "r": 2, "e": "L'intelligence pratique, chez Sternberg, est le sens commun appliqué : savoir agir efficacement dans des situations mal définies de la vie réelle. Elle complète l'intelligence analytique et créative."}, {"q": "Selon Erikson, le conflit psychosocial central du jeune adulte est :", "o": ["Identité vs confusion des rôles", "Productivité vs infériorité", "Intimité vs isolement", "Générativité vs stagnation", "Autonomie vs honte"], "r": 2, "e": "Le 6ᵉ stade, Intimité vs isolement, concerne le jeune adulte : la capacité à s'engager dans une relation profonde suppose une identité déjà constituée, sans quoi la fusion est vécue comme une menace."}, {"q": "Le goût, l'odorat et la sensibilité à la douleur et à la température restent inchangés, selon le cours, jusqu'à :", "o": ["25 ans", "35 ans", "45 ans au moins", "65 ans"], "r": 2, "e": "L'acuité visuelle, elle, est maximale entre 20 et 40 ans. La perte auditive, progressive dès l'adolescence, devient plus évidente après 25 ans et porte d'abord sur les sons aigus."}, {"q": "Chez le jeune adulte, la principale cause de décès est :", "o": ["Les maladies cardiovasculaires", "Les accidents", "Les cancers", "Les infections"], "r": 1, "e": "C'est cohérent avec un état de santé globalement bon à cet âge : ce ne sont pas les maladies mais les conduites et les circonstances qui pèsent le plus."}, {"q": "La définition de la santé citée dans ce cours associe :", "o": ["L'absence de maladie uniquement", "Un état positif complet de bien-être physique, mental et social, et une ressource pour la vie quotidienne", "La capacité de travailler", "L'absence d'incapacité"], "r": 1, "e": "Elle réunit la définition de 1948 et celle d'Ottawa de 1986. Le cours souligne son caractère multifactoriel : âge, sexe, hérédité, mode de vie."}, {"q": "Le lien entre comportement et santé s'énonce dans le cours comme :", "o": ["Ce que les gens savent influence ce qu'ils font, et ce qu'ils font influence ce qu'ils ressentent", "La santé dépend uniquement de l'hérédité", "Le comportement n'a aucun effet", "Les émotions n'interviennent pas"], "r": 0, "e": "Le cours ajoute aussitôt que connaître les bonnes habitudes ne suffit pas : personnalité, émotions et environnement social prennent souvent le pas."}, {"q": "Selon le cours, la consommation de sauces tomate, riches en lycopène, est associée à :", "o": ["Une réduction du cancer de la prostate", "Une réduction du cancer du côlon", "Une hausse du cholestérol", "Une amélioration de l'acuité visuelle"], "r": 0, "e": "L'augmentation des fruits et légumes accroît par ailleurs la capacité antioxydante du sang et participe à la prévention des maladies cardiaques, des AVC et des cancers."}, {"q": "Une alimentation riche en graisses animales est associée dans le cours à :", "o": ["Une hausse du risque de cancer du côlon et de la prostate", "Une amélioration du profil lipidique", "Une protection cardiovasculaire", "Une perte de poids"], "r": 0, "e": "Les graisses augmentent également les risques cardiovasculaires et le cholestérol. Les recommandations privilégient les graisses polyinsaturées et monoinsaturées."}, {"q": "Parmi les graisses recommandées, le cours cite :", "o": ["Le beurre et la crème", "Les polyinsaturées comme le soja et le maïs, et les monoinsaturées comme l'huile d'olive", "Les graisses animales", "Les graisses trans"], "r": 1, "e": "S'y ajoutent les fibres solubles — avoine, haricots, fruits et légumes —, la perte de poids si nécessaire, l'exercice physique, et l'absence d'excès d'alcool et de tabac."}, {"q": "Parmi les bienfaits de l'activité physique régulière, le cours mentionne :", "o": ["Une protection contre crises cardiaques, AVC, diabète, néoplasies et ostéoporose", "Une augmentation de la tension artérielle", "Une hausse de l'anxiété", "Une perte de tonus musculaire"], "r": 0, "e": "S'y ajoutent le maintien d'un poids équilibré, le renforcement musculaire et cardio-pulmonaire, la baisse de la tension artérielle et la réduction de l'anxiété et de la dépression."}, {"q": "Chez le jeune adulte, le raisonnement formel :", "o": ["Reste la capacité dominante", "N'est plus la capacité dominante, laissant place à la pensée post-formelle", "Disparaît complètement", "Se limite aux situations scolaires"], "r": 1, "e": "La période est décrite comme un moment de découverte de soi, dans de nouveaux environnements éducatifs et professionnels, où la logique pure ne suffit plus."}, {"q": "Parmi les six caractéristiques de la pensée post-formelle, le cours cite :", "o": ["Une logique rigide et binaire", "Une pensée flexible, ouverte, adaptative et individualiste", "L'exclusion de l'émotion", "La recherche d'une solution unique"], "r": 1, "e": "Elle mobilise autant l'intuition et l'émotion que la logique, applique l'expérience aux situations ambiguës, et sait gérer incertitude, incohérence et contradiction."}, {"q": "La pensée relativiste, caractéristique du post-formel, consiste à :", "o": ["Nier toute vérité", "Percevoir des nuances de gris plutôt qu'une opposition noir/blanc", "Refuser de trancher", "Suivre l'opinion majoritaire"], "r": 1, "e": "Le cours précise que les adultes peuvent aller au-delà d'un système logique unique et concilier différentes approches, en traitant l'information dans un contexte social et émotionnel."}, {"q": "Le critère de Sinnott « changement de perspective » correspond à :", "o": ["Passer de l'abstrait au concret pratique", "Reconnaître plusieurs causes possibles", "Sélectionner la meilleure solution", "Identifier un conflit intrinsèque"], "r": 0, "e": "Son exemple type est : « cela peut fonctionner sur le papier, mais pas dans la vie réelle ». C'est le premier des quatre critères identifiés en 1984 et 1998."}, {"q": "Le critère de « pragmatisme » chez Sinnott consiste à :", "o": ["Envisager plusieurs causes", "Sélectionner la meilleure solution en reconnaissant les critères de choix", "Reconnaître un paradoxe", "Changer de point de vue"], "r": 1, "e": "L'exemple donné est : « si tu veux le plus pratique, fais ceci ; si tu veux le plus rapide, fais cela ». Le choix dépend explicitement du critère retenu."}, {"q": "La « conscience du paradoxe », quatrième critère de Sinnott, consiste à :", "o": ["Refuser les contradictions", "Reconnaître un conflit intrinsèque, comme « faire cela lui donnera ce qu'il veut, mais le rendra malheureux »", "Choisir la solution la plus rapide", "Multiplier les hypothèses"], "r": 1, "e": "C'est la forme la plus aboutie de la pensée post-formelle : admettre qu'une situation puisse comporter une tension irréductible, sans chercher à la dissoudre artificiellement."}, {"q": "Dans la théorie triarchique de Sternberg (1994), l'intelligence analytique correspond à :", "o": ["L'adaptation aux situations pratiques", "Le traitement de l'information, la planification et la résolution de problèmes théoriques ou abstraits", "La gestion des nouvelles expériences", "La connaissance tacite"], "r": 1, "e": "C'est l'intelligence « classique », celle que mesurent les tests. Les deux autres formes sont la créative et la pratique."}, {"q": "L'intelligence créative, chez Sternberg, permet de :", "o": ["Résoudre des problèmes abstraits", "Gérer de nouvelles expériences, générer des alternatives et s'adapter", "Appliquer des procédures apprises", "Mémoriser efficacement"], "r": 1, "e": "Le cours parle de perspicacité créative. Elle se distingue de l'intelligence analytique par le caractère inédit des situations auxquelles elle s'applique."}, {"q": "Selon Sternberg, quelle forme d'intelligence se développe avec l'âge ?", "o": ["L'analytique", "La créative uniquement", "La pratique", "Aucune"], "r": 2, "e": "Le cours précise que la créativité et la résolution de problèmes pratiques se développent au moins jusqu'à l'âge mûr, tandis que la résolution de problèmes abstraits diminue généralement."}, {"q": "La connaissance tacite se définit comme :", "o": ["Un savoir enseigné formellement", "Des informations internes et un savoir-faire non formellement enseignés, acquis principalement par soi-même", "Une connaissance théorique", "Un savoir transmis par les diplômes"], "r": 1, "e": "Elle est présentée comme la composante essentielle de l'intelligence pratique : ce qu'on apprend sans que personne ne l'enseigne, en observant comment les choses fonctionnent réellement."}, {"q": "Parmi les usages de la connaissance tacite, le cours cite :", "o": ["Atteindre des objectifs personnels, se gérer soi-même, gérer les tâches et les autres", "Réussir des examens", "Mémoriser des procédures", "Résoudre des équations"], "r": 0, "e": "Obtenir une promotion, contourner la bureaucratie, s'organiser dans le temps, savoir récompenser ou critiquer : ce sont des compétences décisives qu'aucun cursus n'enseigne explicitement."}, {"q": "En matière de développement moral, le jeune adulte accède selon le cours :", "o": ["Au premier niveau de Kohlberg", "Au deuxième niveau, conventionnel", "Au troisième niveau, post-conventionnel, fondé sur des principes", "À aucun niveau particulier"], "r": 2, "e": "Le cours précise que cet accès dépend de l'expérience, et non du seul âge. L'intelligence émotionnelle se développe également à cette période."}, {"q": "Parmi les défis psychosociaux du jeune adulte, le cours mentionne :", "o": ["La retraite et le bilan de vie", "Les relations intimes, les attitudes envers la sexualité, le mariage ou le divorce, la cohabitation et la parentalité", "L'entrée à l'école", "La construction de l'identité de genre"], "r": 1, "e": "Ils déclinent concrètement le conflit Intimité vs Isolement décrit par Erikson, dont la vertu associée est l'amour."}, {"q": "Le cours qualifie le jeune adulte d'âge où « tout est possible » en raison de :", "o": ["L'absence de responsabilités", "L'apogée de la force, de l'énergie, de l'endurance et des capacités sensorielles et motrices", "L'absence de contraintes financières", "La fin des études"], "r": 1, "e": "La plupart des fonctions corporelles y sont pleinement développées, ce qui explique aussi la rareté des maladies graves à cette période."}, {"q": "La pensée post-formelle traite l'information :", "o": ["De façon purement logique", "Dans un contexte social et émotionnel", "En excluant l'expérience", "Selon un système unique"], "r": 1, "e": "C'est ce qui la distingue de la pensée formelle : elle ne cherche pas la solution formellement correcte mais celle qui convient à une situation réelle, avec ses acteurs et ses enjeux."}, {"q": "La causalité multiple, deuxième critère de Sinnott, s'illustre par :", "o": ["« Essayons ta méthode ; si ça ne marche pas, on essaiera la mienne »", "« Cela fonctionne sur le papier mais pas dans la vie »", "« Si tu veux le plus rapide, fais cela »", "« Cela le rendra heureux mais insatisfait »"], "r": 0, "e": "Admettre plusieurs causes, c'est admettre plusieurs solutions — et donc accepter que celle d'autrui puisse valoir la sienne."}, {"q": "Parmi les recommandations alimentaires du cours figure la consommation de fibres solubles présentes dans :", "o": ["La viande rouge", "L'avoine, les haricots, les fruits et les légumes", "Les produits laitiers gras", "Les huiles de friture"], "r": 1, "e": "Elles s'ajoutent aux graisses insaturées et complètent un ensemble de recommandations incluant l'exercice et la modération vis-à-vis de l'alcool et du tabac."}, {"q": "Concernant l'audition du jeune adulte, le cours indique que la perte :", "o": ["Commence après 40 ans", "Est progressive dès l'adolescence et devient plus évidente après 25 ans, sur les sons aigus", "Ne concerne que les graves", "N'existe pas avant 65 ans"], "r": 1, "e": "Cette précocité surprend souvent : la presbyacousie n'est pas un phénomène strictement gériatrique, mais l'aboutissement d'un processus très étalé dans le temps."}, {"q": "Selon Erikson, l'échec du stade Intimité vs Isolement conduit à :", "o": ["La stagnation", "L'isolement", "Le désespoir", "La confusion des rôles"], "r": 1, "e": "La question clé est « dois-je partager ma vie ou vivre seul ? ». La réussite suppose engagement et échange de sentiments intimes, et donne la vertu d'amour."}, {"q": "La pensée post-formelle permet notamment de gérer :", "o": ["Uniquement des problèmes bien définis", "L'incertitude, l'incohérence, la contradiction, l'imperfection et la conciliation", "Des situations sans enjeu émotionnel", "Des problèmes purement mathématiques"], "r": 1, "e": "Ce sont précisément les caractéristiques des problèmes de la vie adulte, qui n'ont ni énoncé complet ni solution unique."}, {"q": "Le cours précise que connaître les bonnes habitudes de santé :", "o": ["Suffit à les adopter", "Ne suffit pas, car personnalité, émotions et environnement social prennent souvent le pas", "Est inutile", "Dépend du niveau d'études"], "r": 1, "e": "C'est pourquoi l'information seule modifie peu les comportements de santé, constat que l'on retrouve aussi en sociologie de la santé."}, {"q": "L'apogée de l'acuité visuelle se situe selon le cours :", "o": ["Entre 10 et 20 ans", "Entre 20 et 40 ans", "Entre 30 et 50 ans", "Après 40 ans"], "r": 1, "e": "Elle décline ensuite progressivement, la presbytie s'installant à partir de la quarantaine par perte d'élasticité du cristallin."}, {"q": "Selon le cours, la résolution de problèmes abstraits :", "o": ["Progresse tout au long de la vie", "Diminue généralement avec l'âge, contrairement à la créativité et à la résolution de problèmes pratiques", "Reste stable", "Est maximale à l'âge mûr"], "r": 1, "e": "Cette dissociation est au cœur du modèle des gains et des pertes : ce qui décline et ce qui progresse coexistent chez la même personne."}, {"q": "La santé est décrite dans le cours comme un concept multifactoriel dépendant notamment :", "o": ["De l'âge, du sexe, de l'hérédité et du mode de vie", "Du seul patrimoine génétique", "Du seul système de soins", "Du seul revenu"], "r": 0, "e": "Sa nature positive est associée au bien-être psychologique, ce qui la distingue d'une simple absence de pathologie."}, {"q": "Parmi les trois formes d'intelligence de Sternberg, celle qui porte sur l'adaptation au contexte, aux relations et aux tâches quotidiennes est :", "o": ["L'analytique", "La créative", "La pratique", "L'émotionnelle"], "r": 2, "e": "Elle repose largement sur la connaissance tacite et explique pourquoi la réussite professionnelle corrèle imparfaitement avec les résultats aux tests classiques."}, {"q": "La pensée post-formelle se caractérise notamment par l'application :", "o": ["De règles logiques strictes", "Des fruits de l'expérience à des situations ambiguës", "D'un système unique de raisonnement", "De procédures standardisées"], "r": 1, "e": "C'est l'apport décisif de l'âge adulte : ce qui a été vécu devient une ressource pour interpréter des situations que la seule logique ne permet pas de trancher."}, {"q": "La période du jeune adulte est décrite dans le cours comme un temps :", "o": ["De bilan rétrospectif", "De découverte de soi, dans de nouveaux environnements éducatifs et professionnels", "De stagnation", "De repli sur la famille d'origine"], "r": 1, "e": "Ces nouveaux contextes confrontent à des problèmes mal définis, ce qui favorise précisément le passage de la pensée formelle à la pensée post-formelle."}, {"q": "L'intelligence émotionnelle, chez le jeune adulte :", "o": ["Décline", "Se développe également", "Reste figée", "N'est pas mentionnée"], "r": 1, "e": "Elle accompagne l'accès au niveau post-conventionnel de Kohlberg en matière morale, lui aussi dépendant de l'expérience plutôt que du seul âge."}, {"q": "Parmi les usages de la connaissance tacite relevant de la « manipulation de soi », le cours cite :", "o": ["La motivation et l'organisation du temps", "La critique des collègues", "La négociation salariale", "La délégation des tâches"], "r": 0, "e": "Les deux autres registres sont l'atteinte d'objectifs personnels — obtenir une promotion, contourner la bureaucratie — et la gestion des tâches et des autres, par exemple savoir récompenser ou critiquer."}, {"q": "Le cours situe le stade Intimité vs Isolement dans la tranche d'âge :", "o": ["11 à 20 ans", "20 à 40 ans", "40 à 65 ans", "Après 65 ans"], "r": 1, "e": "C'est le sixième stade d'Erikson, qui correspond exactement à la période du jeune adulte traitée dans ce chapitre."}, {"q": "Une pensée « individualiste », parmi les caractéristiques du post-formel, signifie que le raisonnement :", "o": ["Ignore les autres", "Devient propre à la personne, façonné par son histoire et son expérience", "Refuse toute règle", "Est égoïste"], "r": 1, "e": "Il ne s'agit pas d'égocentrisme mais de singularisation : deux adultes compétents peuvent aborder différemment le même problème, sans que l'un ait tort."}, {"q": "Selon le cours, l'augmentation de la consommation de fruits et légumes est associée à :", "o": ["Une hausse de la capacité antioxydante du sang", "Une augmentation du cholestérol", "Une prise de poids", "Une baisse de l'immunité"], "r": 0, "e": "Elle participe à la prévention des maladies cardiaques, des accidents vasculaires cérébraux et des cancers."}]};</script>
