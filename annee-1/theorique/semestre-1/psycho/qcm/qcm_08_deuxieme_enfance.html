<script>window.QUIZ={"titre": "QCM", "fiche": "../fiches/fiche_09_deuxieme_enfance.html", "questions": [{"q": "Pendant la deuxième enfance, les proportions corporelles évoluent de sorte que :", "o": ["La tête devient proportionnellement plus grande", "Le tronc et les membres s’allongent", "Le ventre devient plus proéminent", "Les os restent mous", "La masse grasse augmente fortement"], "r": 1, "e": "Entre 3 et 6 ans, la silhouette s'affine : le tronc et les membres s'allongent, la tête devient proportionnellement plus petite et le ventre proéminent du nourrisson s'efface."}, {"q": "À cet âge, l’enfant a tendance à :", "o": ["Augmenter spontanément son apport calorique", "Ne plus réguler sa consommation alimentaire", "Réguler sa consommation calorique s’il n’est pas forcé à manger", "Présenter systématiquement une dénutrition", "Ne plus avoir besoin d’encadrement alimentaire"], "r": 2, "e": "Laissé libre, le jeune enfant ajuste ses apports d'un repas à l'autre et sur la journée. Forcer ou restreindre perturbe cette régulation spontanée — argument central de l'éducation alimentaire respectueuse des signaux de faim."}, {"q": "À 3 ans, la dentition se caractérise par :", "o": ["L’apparition des premières dents permanentes", "L’absence de dents de lait", "La présence de toutes les dents primaires", "La perte des incisives", "Une dentition définitive complète"], "r": 2, "e": "Les 20 dents temporaires sont généralement toutes sorties vers 2 ans et demi - 3 ans. Les permanentes n'apparaissent que vers 6 ans."}, {"q": "Jusqu’à environ 5 ans, la majorité des enfants :", "o": ["N’ont plus besoin de dormir en journée", "Ont besoin d’une sieste ou d’un petit somme", "Dorment moins bien que les adolescents", "Présentent tous des troubles sévères du sommeil", "Ont un rythme identique à celui des adultes"], "r": 1, "e": "Jusque vers 5 ans, la plupart des enfants ont encore besoin d'une sieste ou d'un temps calme en journée. Sa disparition est progressive et très variable d'un enfant à l'autre."}, {"q": "Les objets transitionnels, selon Winnicott, servent principalement à :", "o": ["Stimuler l’intelligence", "Favoriser le langage", "Gérer l’angoisse de séparation", "Remplacer la figure parentale", "Développer l’autonomie motrice"], "r": 2, "e": "L'objet transitionnel — doudou, coin de tissu — est ni tout à fait moi ni tout à fait l'autre : il occupe l'espace laissé par l'absence de la mère et permet d'en supporter la séparation. Il ne la remplace pas, il en fait le deuil progressif."}, {"q": "Les terreurs nocturnes se distinguent des cauchemars car :", "o": ["L’enfant s’en souvient clairement", "Elles surviennent en sommeil paradoxal", "L’enfant n’est pas réellement éveillé", "Elles persistent à l’âge adulte", "Elles sont déclenchées volontairement"], "r": 2, "e": "Les terreurs nocturnes surviennent en sommeil lent profond, en début de nuit : l'enfant crie, semble terrifié, mais n'est pas réveillé et n'en garde aucun souvenir. Le cauchemar, lui, survient en sommeil paradoxal, réveille l'enfant qui peut le raconter."}, {"q": "L’énurésie est considérée comme problématique lorsqu’elle :", "o": ["Survient avant 3 ans", "Est occasionnelle", "Persiste après 5 ans à une fréquence définie", "Est uniquement diurne", "Est toujours d’origine psychologique"], "r": 2, "e": "On parle d'énurésie lorsque les mictions involontaires persistent au-delà de 5 ans avec une fréquence répétée. Avant cet âge, le contrôle n'est pas attendu, et la cause est souvent une maturation retardée, non un trouble psychologique."}, {"q": "Le stade cognitif correspondant à la deuxième enfance est :", "o": ["Sensori-moteur", "Opérations concrètes", "Opérations formelles", "Préopératoire", "Post-formel"], "r": 3, "e": "La deuxième enfance (3-6 ans) correspond au stade préopératoire : fonction symbolique et langage, mais aussi égocentrisme, animisme, centration et absence de conservation."}, {"q": "Le discours privé chez l’enfant d’âge préscolaire est :", "o": ["Anormal et inquiétant", "Un signe de retard cognitif", "Un langage sans fonction", "Fréquent et normal", "Réservé aux enfants anxieux"], "r": 3, "e": "Le discours privé — l'enfant qui commente son action à voix haute — est fréquent et normal entre 3 et 7 ans. Pour Vygotsky, il s'intériorisera pour devenir la pensée verbale et l'autorégulation."}, {"q": "Le type d’agression le plus courant entre 2,5 et 5 ans est :", "o": ["Agression hostile", "Agression verbale intentionnelle", "Agression instrumentale", "Violence préméditée", "Agression défensive"], "r": 2, "e": "Entre 2 ans et demi et 5 ans domine l'agression instrumentale : l'enfant pousse ou arrache pour obtenir l'objet, sans viser à faire mal. L'agression hostile, intentionnellement blessante, apparaît plus tard."}, {"q": "La disparition du ventre rond au cours de la deuxième enfance s'explique par :", "o": ["Une perte de poids généralisée", "Le développement des muscles abdominaux", "Un allongement de la tête", "Une diminution de l'appétit"], "r": 1, "e": "Le corps devient plus mince et athlétique, le tronc et les membres s'allongent, et les proportions se rapprochent de celles de l'adulte — la tête restant néanmoins encore grande."}, {"q": "Parmi les changements corporels de la deuxième enfance, le cours cite :", "o": ["Un durcissement des os et une maturation du cerveau et du système nerveux", "Une perte de masse musculaire", "Un ralentissement respiratoire", "Une diminution de la capacité circulatoire"], "r": 0, "e": "S'y ajoute une augmentation de la capacité des systèmes respiratoire et circulatoire, qui soutient l'activité physique croissante de cet âge."}, {"q": "À partir de quel âge apparaissent les dents permanentes ?", "o": ["3 ans", "4 ans", "6 ans", "8 ans"], "r": 2, "e": "À 3 ans, toutes les dents de lait sont en place. Les premières dents permanentes n'apparaissent qu'à partir de 6 ans, au début de la troisième enfance."}, {"q": "Le cours signale que l'obésité chez les enfants d'âge préscolaire est aujourd'hui :", "o": ["En diminution", "Plus fréquente qu'autrefois", "Inexistante", "Sans lien avec l'alimentation"], "r": 1, "e": "Ce constat coexiste avec la capacité spontanée de l'enfant à réguler ses apports, ce qui souligne le rôle de l'environnement alimentaire et des pratiques éducatives."}, {"q": "Quelle proportion d'enfants de moins de 4 ans réveille encore ses parents la nuit ?", "o": ["5 à 10 %", "20 à 30 %", "50 à 60 %", "Plus de 80 %"], "r": 1, "e": "Le sommeil à cet âge est plus profond qu'aux stades ultérieurs, mais les réveils nocturnes restent fréquents — un repère utile pour rassurer les parents."}, {"q": "L'objet transitionnel décrit par Winnicott fait le lien entre :", "o": ["Le monde intérieur de l'enfant et la réalité extérieure", "Le père et la mère", "L'école et la maison", "Le sommeil et l'éveil"], "r": 0, "e": "Peluche ou couverture, il permet de gérer l'angoisse de séparation. Il n'est ni tout à fait l'enfant ni tout à fait l'autre : il occupe un espace intermédiaire."}, {"q": "Les terreurs nocturnes se caractérisent par le fait que l'enfant :", "o": ["Se souvient précisément de son rêve", "N'est pas réellement réveillé et ne s'en souvient pas", "Reste calme", "Se rendort immédiatement après en avoir parlé"], "r": 1, "e": "Il peut crier, s'asseoir, respirer rapidement et avoir les yeux ouverts sans être éveillé. Elles disparaissent vers 6 ans, contrairement aux cauchemars dont l'enfant garde le souvenir."}, {"q": "Les cauchemars, selon le cours, sont souvent causés par :", "o": ["Un repas copieux ou une émission de télévision", "Une carence alimentaire", "Un manque de sommeil", "Une maladie infectieuse"], "r": 0, "e": "Contrairement aux terreurs nocturnes, l'enfant s'en souvient et peut les raconter. Cette différence de mémorisation est le critère clinique le plus simple pour les distinguer."}, {"q": "Le somnambulisme et la somniloquie sont, selon le cours :", "o": ["Rares et inquiétants", "Fréquents en deuxième et troisième enfance et disparaissent avec l'âge", "Des signes de troubles neurologiques", "Propres à l'adolescence"], "r": 1, "e": "Marcher ou parler en dormant relève de la même immaturité des mécanismes du sommeil lent profond que les terreurs nocturnes, et se résout spontanément."}, {"q": "L'énurésie est qualifiée de persistante lorsqu'elle survient :", "o": ["Une fois par mois après 3 ans", "Au moins deux fois par semaine pendant au moins trois mois après 5 ans", "Occasionnellement après 4 ans", "Uniquement en journée"], "r": 1, "e": "Ces critères de fréquence et de durée évitent de pathologiser des accidents banals. Avant 5 ans, le contrôle n'est pas attendu."}, {"q": "Concernant la prise en charge de l'énurésie, le cours recommande :", "o": ["De punir les épisodes", "De ne pas blâmer ni punir, mais de récompenser les nuits sèches et d'utiliser alarmes et exercices musculaires", "De limiter toute boisson", "D'attendre sans rien faire"], "r": 1, "e": "Les travaux cités — Von Gontard, Heron et Joinson (2011) — signalent en outre des causes génétiques possibles et une maturation lente, ce qui disqualifie toute lecture en termes de faute."}, {"q": "À 3 ans, sur le plan de la motricité générale, l'enfant :", "o": ["Démarre, tourne et s'arrête efficacement", "Est incapable de tourner ou de s'arrêter brusquement, et saute de 30 à 60 cm", "Descend un escalier sans appui en alternant les pieds", "Saute facilement sur un pied sur 5 mètres"], "r": 1, "e": "Il monte cependant les escaliers sans appui en alternant les pieds, et saute sur un pied de façon irrégulière. Le contrôle des arrêts et des changements de direction viendra à 4 ans."}, {"q": "À 5 ans, en motricité générale, l'enfant est capable de :", "o": ["Sauter 30 à 60 cm seulement", "Descendre l'escalier sans appui en alternant les pieds et sauter facilement sur un pied sur 5 mètres", "Monter les escaliers avec appui uniquement", "Faire 4 à 6 sauts sur un pied au maximum"], "r": 1, "e": "La progression est nette : à 4 ans il descend encore avec appui et fait 4 à 6 sauts sur un pied ; à 5 ans, il démarre, tourne et s'arrête efficacement."}, {"q": "La motricité fine se définit comme les compétences impliquant :", "o": ["Les grands groupes musculaires", "Les petits muscles et la coordination œil-main", "L'équilibre statique", "L'endurance"], "r": 1, "e": "Boutonner, lacer, couper aux ciseaux, dessiner et peindre en sont les manifestations typiques à cet âge."}, {"q": "À 3 ans, en motricité fine, l'enfant peut :", "o": ["Copier un carré ou un triangle", "Verser le lait, manger avec des couverts et dessiner un cercle ainsi qu'une silhouette humaine rudimentaire sans bras", "Plier une feuille en deux triangles", "Couper le long d'une ligne droite"], "r": 1, "e": "Il va également aux toilettes seul. Couper le long d'une ligne vient à 4 ans, copier un carré ou un triangle à 5 ans."}, {"q": "À 5 ans, en motricité fine, l'enfant sait notamment :", "o": ["S'habiller avec peu d'aide et copier un carré ou un triangle", "Dessiner une silhouette sans bras", "Manger avec les doigts uniquement", "Tenir un crayon en prise palmaire seulement"], "r": 0, "e": "Il produit aussi une silhouette humaine plus élaborée et plie une feuille en deux triangles. À 4 ans, il s'habillait encore avec de l'aide."}, {"q": "À 3 ans, le vocabulaire de l'enfant compte environ :", "o": ["200 mots", "900 à 1 000 mots", "2 600 mots", "20 000 mots"], "r": 1, "e": "Il en utilise environ 12 000 par jour, distingue « je », « tu » et « nous », et emploie le pluriel et le passé simple."}, {"q": "À 6 ans, l'enfant possède un vocabulaire d'environ 2 600 mots mais en comprend :", "o": ["Moins de 1 000", "Environ 2 600 également", "Plus de 20 000", "Environ 5 000"], "r": 2, "e": "L'écart entre vocabulaire actif et vocabulaire passif est considérable. De 5 à 7 ans, le langage devient très proche de celui des adultes."}, {"q": "La pragmatique désigne :", "o": ["La grammaire", "La connaissance pratique de l'utilisation du langage pour communiquer : demander, raconter une histoire", "Le vocabulaire", "La prononciation"], "r": 1, "e": "Elle concerne l'usage social du langage plutôt que sa structure formelle : savoir à qui, quand et comment s'adresser."}, {"q": "Selon Vygotsky, le discours privé représente à 4 ans :", "o": ["Moins de 5 % du langage", "20 à 50 % du langage", "80 % du langage", "La totalité du langage"], "r": 1, "e": "Il est normal et courant : l'enfant parle à voix haute avec lui-même sans intention de communiquer. Il s'intériorisera ensuite pour devenir la pensée verbale."}, {"q": "Le concept de soi, selon Harter (1993), se définit comme :", "o": ["Un simple reflet de l'opinion des parents", "Un système de représentations descriptives et évaluatives du soi, qui détermine ce que nous pensons de nous et guide nos actions", "La conscience de son corps", "Un stade du développement cognitif"], "r": 1, "e": "Les deux registres — décrire et évaluer — sont présents simultanément, ce qui explique que le concept de soi oriente les conduites et pas seulement les représentations."}, {"q": "L'auto-définition d'un enfant de 4 ans se caractérise par :", "o": ["Des traits psychologiques abstraits", "Un ensemble de caractéristiques concrètes : nom, famille, possessions, goûts, compétences", "Une comparaison systématique avec les pairs", "Un discours nuancé sur ses limites"], "r": 1, "e": "L'exemple du cours l'illustre bien : prénom, maison, famille, chaton, pizza, lettres connues, course et humeur, avec une confiance globale et sans nuance."}, {"q": "À l'âge préscolaire, l'estime de soi est décrite par Harter comme :", "o": ["Différenciée selon les domaines", "Globale : « je suis bon » ou « je suis mauvais »", "Inexistante", "Fondée sur la comparaison sociale"], "r": 1, "e": "La différenciation par domaines — scolaire, sportif, social — viendra plus tard. À cet âge, le jugement sur soi est tout d'un bloc."}, {"q": "Parmi les comportements parentaux favorables à l'estime de soi, le cours cite :", "o": ["Écouter, lire des histoires, préparer des snacks et sécher des larmes", "Valoriser uniquement les réussites", "Fixer des exigences élevées", "Comparer aux autres enfants"], "r": 0, "e": "Ce sont des gestes ordinaires de disponibilité. C'est leur régularité, plus que leur caractère exceptionnel, qui construit le sentiment de valeur personnelle."}, {"q": "L'identité de genre se définit comme :", "o": ["Les différences physiques entre individus", "La conscience d'être de sexe masculin ou féminin et ses implications sociales", "Les comportements jugés culturellement appropriés", "Les croyances exagérées sur les comportements"], "r": 1, "e": "À distinguer des différences sexuelles (physiques), des rôles sexuels (attentes culturelles) et des stéréotypes sexuels (croyances exagérées)."}, {"q": "La typification de genre désigne :", "o": ["La socialisation par laquelle les enfants apprennent le comportement jugé approprié par leur culture", "Les différences biologiques entre les sexes", "La conscience d'appartenir à un sexe", "Les croyances exagérées sur les comportements"], "r": 0, "e": "C'est un processus, et non un état : elle décrit comment les attentes culturelles sont transmises et intégrées au fil des interactions quotidiennes."}, {"q": "Les différences entre les sexes, au sens du cours, désignent :", "o": ["Les différences physiques", "Les différences psychologiques ou comportementales entre individus masculins et féminins", "Les rôles culturels", "Les stéréotypes"], "r": 1, "e": "Les différences physiques relèvent, elles, des « différences sexuelles ». Cette distinction terminologique est précisément l'objet de la section du cours."}, {"q": "Dans l'agression instrumentale, l'enfant qui prend le jouet d'un autre :", "o": ["Cherche à blesser ou à dominer", "S'intéresse au jouet, et non à faire mal", "Imite un modèle agressif", "Réagit à une punition"], "r": 1, "e": "C'est le type d'agression le plus courant entre 2 ans et demi et 5 ans. L'agressivité y est un moyen d'obtenir quelque chose, non une fin en soi."}, {"q": "Avec le développement du contrôle de soi et de l'expression verbale, l'agressivité :", "o": ["Disparaît totalement", "Se manifeste par des mots plutôt que par des coups", "Devient systématiquement hostile", "Se déplace vers les adultes"], "r": 1, "e": "Le langage offre un substitut à l'acte. Le cours note qu'à 6-7 ans, l'agressivité générale diminue."}, {"q": "L'agressivité hostile se définit par :", "o": ["La recherche d'un objet convoité", "L'intention de blesser autrui", "Un réflexe de défense", "Une imitation du groupe"], "r": 1, "e": "Elle apparaît chez certains enfants vers 6-7 ans et s'associe à des situations plus lourdes : punitions sévères, environnement violent, problèmes familiaux. Elle expose au rejet par les pairs."}, {"q": "Les peurs passagères de la deuxième enfance s'expliquent notamment par :", "o": ["Une imagination débordante et la confusion entre apparence et réalité", "Un trouble anxieux sous-jacent", "Un manque de sommeil", "Une carence affective"], "r": 0, "e": "Elles proviennent aussi d'expériences personnelles ou de récits entendus, et s'estompent à mesure que l'enfant perd son sentiment d'impuissance et devient plus réaliste."}, {"q": "Selon le tableau des peurs par âge, les êtres surnaturels — fantômes, sorcières — apparaissent typiquement vers :", "o": ["2 ans", "4 ans", "6 ans", "9 ans"], "r": 2, "e": "À 6 ans s'ajoutent les agressions, le tonnerre, l'obscurité et la peur de dormir seul. Entre 9 et 12 ans, les peurs deviennent plus réalistes : examens, exposés, apparence physique, mort."}, {"q": "Le cours souligne que les enfants apprennent les émotions :", "o": ["Par instruction explicite", "Dans le contexte des relations interpersonnelles", "Par imitation télévisuelle", "De façon innée et sans apprentissage"], "r": 1, "e": "Comprendre ses propres émotions aide à les exprimer et à devenir sensible à celles d'autrui : la compétence émotionnelle se construit dans l'échange."}, {"q": "Selon le tableau des peurs par âge, entre 0 et 6 mois le bébé craint surtout :", "o": ["Les étrangers", "La perte de soutien et les bruits forts", "L'obscurité", "La séparation"], "r": 1, "e": "La peur des étrangers, des hauteurs et des objets inattendus apparaît entre 7 et 12 mois, en même temps que l'attachement se différencie."}, {"q": "À 2 ans, les peurs typiques portent notamment sur :", "o": ["Les examens scolaires", "Les bruits intenses comme l'aspirateur ou les sirènes, les animaux et les pièces sombres", "Les êtres surnaturels", "La mort"], "r": 1, "e": "La séparation reste présente à cet âge. Les peurs suivent la maturation cognitive : d'abord sensorielles, puis imaginaires, enfin réalistes et sociales."}, {"q": "Entre 9 et 12 ans, les peurs deviennent principalement :", "o": ["Sensorielles", "Réalistes et sociales : examens, exposés scolaires, apparence physique, mort", "Liées aux animaux", "Liées à la séparation parentale"], "r": 1, "e": "Ce glissement traduit l'accès à la pensée opératoire et la sensibilité croissante au regard des pairs, caractéristique de la troisième enfance."}, {"q": "Le discours social se distingue du discours privé parce qu'il :", "o": ["Est destiné à être compris par autrui", "Est plus long", "Est réservé aux adultes", "Apparaît plus tard"], "r": 0, "e": "Le discours privé, décrit par Vygotsky, n'a aucune intention communicative : l'enfant s'adresse à lui-même pour guider son action, surtout dans les tâches difficiles."}, {"q": "Au stade préopératoire, correspondant à la deuxième enfance, on retrouve :", "o": ["La réversibilité et la conservation", "La pensée symbolique, l'égocentrisme, l'animisme et le raisonnement transductif", "Le raisonnement hypothético-déductif", "L'inclusion de classes"], "r": 1, "e": "Réversibilité et conservation caractérisent les opérations concrètes, à partir de 7 ans ; le raisonnement hypothético-déductif, les opérations formelles."}, {"q": "Selon Erikson, le fait que l'enfant de 3 à 6 ans prenne conscience « d'être autre » signifie qu'il :", "o": ["Se sent rejeté", "Prend conscience d'avoir une individualité propre", "Imite passivement les adultes", "Se compare aux adultes"], "r": 1, "e": "Cette conscience accompagne l'initiative : expérimenter des rôles dans le jeu, imiter les adultes, développer curiosité et imagination — sans se sentir coupable de vouloir."}, {"q": "Le cours indique qu'à 3 ans l'enfant emploie :", "o": ["Uniquement des mots isolés", "Le pluriel et le passé simple, et distingue « je », « tu » et « nous »", "Des phrases complexes avec subordonnées", "Un langage identique à celui d'un adulte"], "r": 1, "e": "La maîtrise des pronoms personnels marque une étape importante : elle suppose de comprendre que le locuteur et l'interlocuteur changent de place selon qui parle."}]};</script>
