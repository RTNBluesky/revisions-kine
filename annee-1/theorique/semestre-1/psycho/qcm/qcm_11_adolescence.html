<script>window.QUIZ={"titre": "QCM", "fiche": "../fiches/fiche_12_adolescence.html", "questions": [{"q": "L’adolescence débute classiquement avec :", "o": ["L’entrée au collège", "Le développement cognitif abstrait", "La puberté", "La majorité légale", "L’autonomie émotionnelle"], "r": 2, "e": "L'adolescence est classiquement bornée par un repère biologique à son début — la puberté — et par des repères sociaux à sa fin (autonomie, majorité), d'où le flou de son terme."}, {"q": "La puberté est déclenchée notamment par :", "o": ["Une maturation du cortex préfrontal", "Une augmentation de la leptine circulante", "Une pression sociale accrue", "L’entrée dans un groupe de pairs", "Une baisse des hormones sexuelles"], "r": 1, "e": "La leptine, sécrétée par le tissu adipeux, informe l'hypothalamus qu'une masse grasse suffisante est atteinte : c'est l'un des signaux permissifs qui lèvent le frein sur l'axe gonadotrope. Cela explique le retard pubertaire des adolescentes très maigres."}, {"q": "En moyenne, la puberté commence :", "o": ["Plus tôt chez les garçons que chez les filles", "En même temps chez les deux sexes", "Plus tôt chez les filles que chez les garçons", "Après 15 ans chez tous", "Uniquement à 12 ans"], "r": 2, "e": "La puberté débute en moyenne un à deux ans plus tôt chez les filles (vers 10-11 ans) que chez les garçons (vers 12-13 ans), d'où le décalage de taille observé au collège."}, {"q": "La poussée de croissance adolescente :", "o": ["Suit la maturité sexuelle", "Précède la maturité sexuelle", "Dure toute l’adolescence", "Commence après les premières règles", "Est identique chez les deux sexes"], "r": 1, "e": "Chez la fille, le pic de croissance précède les premières règles ; chez le garçon, il suit le début du développement génital. Dans les deux cas, la poussée précède l'achèvement de la maturité sexuelle et dure environ deux ans."}, {"q": "Selon Piaget, l’adolescent atteint le stade :", "o": ["Préopératoire", "Opérations concrètes", "Opérations formelles", "Post-formel", "Sensori-moteur"], "r": 2, "e": "L'adolescence correspond aux opérations formelles : raisonnement sur l'abstrait, le possible et l'hypothétique. Tous les adolescents n'y accèdent d'ailleurs pas dans tous les domaines."}, {"q": "La pensée hypothético-déductive permet à l’adolescent :", "o": ["De raisonner uniquement sur le concret", "De résoudre des problèmes par essais-erreurs", "De raisonner sur des abstractions et des hypothèses", "D’imiter les adultes", "De supprimer l’égocentrisme"], "r": 2, "e": "Le raisonnement hypothético-déductif consiste à poser des hypothèses, en déduire des conséquences, puis les tester en faisant varier une seule variable à la fois. C'est la marque des opérations formelles."}, {"q": "Selon Elkind, le public imaginaire correspond :", "o": ["À une hallucination", "À la croyance que tout le monde observe et juge l’adolescent", "À un trouble anxieux", "À une stratégie sociale consciente", "À une construction propre à l’enfance"], "r": 1, "e": "Le public imaginaire est la sensation constante d'être observé et évalué, qui explique l'hypersensibilité au regard d'autrui à l'adolescence. C'est une forme d'égocentrisme cognitif, non un trouble."}, {"q": "La fable personnelle est principalement associée à :", "o": ["Une peur excessive du danger", "Une estime de soi faible", "Une présomption d’invulnérabilité", "Une maturité émotionnelle accrue", "Un retrait social"], "r": 2, "e": "La fable personnelle est la conviction d'être une exception : « ça n'arrive qu'aux autres ». Elle abaisse la perception du risque et participe des conduites dangereuses de l'adolescence."}, {"q": "Selon Erikson, le conflit psychosocial central de l’adolescence est :", "o": ["Intimité vs isolement", "Productivité vs infériorité", "Autonomie vs honte", "Identité vs confusion des rôles", "Initiative vs culpabilité"], "r": 3, "e": "Le 5ᵉ stade oppose Identité et confusion des rôles : l'adolescent doit unifier ce qu'il a été, ce qu'il ressent et ce que la société attend en un sentiment cohérent de soi."}, {"q": "La vertu sociale développée à l’adolescence est :", "o": ["L’amour", "L’espérance", "La compétence", "La fidélité", "La sagesse"], "r": 3, "e": "Identité vs confusion des rôles donne la fidélité : la capacité de se tenir à des engagements, des valeurs et des liens choisis."}, {"q": "Selon le cours, l'adolescence dure environ :", "o": ["2 à 3 ans", "5 ans", "10 à 12 ans, avec des bornes floues", "20 ans"], "r": 2, "e": "Elle commence avec la puberté, repère biologique relativement net, mais s'achève sur des critères sociaux beaucoup plus variables : autonomie, insertion professionnelle, majorité."}, {"q": "La tâche principale de l'adolescence est, selon le cours :", "o": ["Réussir sa scolarité", "Affirmer une identité, y compris sexuelle", "S'émanciper financièrement", "Choisir un métier"], "r": 1, "e": "Les changements physiques, cognitifs et psychosociaux y sont interdépendants : le corps change, la pensée devient abstraite et hypothétique, les relations évoluent."}, {"q": "La puberté se définit comme le processus menant à :", "o": ["La maturité sexuelle et à la fertilité", "L'autonomie sociale", "La pensée abstraite", "La fin de la croissance"], "r": 0, "e": "Elle s'accompagne d'une augmentation rapide de la production d'hormones sexuelles et dure environ quatre ans."}, {"q": "Dans le déclenchement de la puberté par la leptine, l'ordre des étapes est :", "o": ["Hypophyse → hypothalamus → glandes sexuelles", "Accumulation de leptine → stimulation de l'hypothalamus → signaux pulsés à l'hypophyse → glandes sexuelles", "Glandes sexuelles → leptine → hypothalamus", "Hypothalamus → tissu adipeux → hypophyse"], "r": 1, "e": "La leptine, sécrétée par les tissus adipeux, informe que la masse grasse est suffisante. C'est pourquoi le début de la puberté dépend en partie d'un certain poids."}, {"q": "Le cours indique que les filles en surpoids :", "o": ["Entrent dans la puberté plus tard", "Entrent dans la puberté plus tôt que les filles minces", "N'ont pas de différence de calendrier", "Ne produisent pas de leptine"], "r": 1, "e": "Cette observation est cohérente avec le rôle de la leptine : c'est l'atteinte d'un seuil de masse grasse qui lève le frein sur l'axe gonadotrope."}, {"q": "Concernant l'activité sexuelle à l'adolescence, le cours souligne qu'elle dépend :", "o": ["Uniquement de l'activité glandulaire", "Davantage de ce que font les amis que de l'activité glandulaire", "Exclusivement de l'éducation parentale", "Du niveau scolaire"], "r": 1, "e": "C'est un exemple net de l'influence des relations sur un comportement souvent attribué à la seule biologie."}, {"q": "La poussée de croissance survient en moyenne chez les filles vers :", "o": ["8 ans", "10 ans", "12-13 ans", "15 ans"], "r": 1, "e": "Elle s'étend de 9,5 à 14,5 ans chez les filles, et de 10,5 à 16 ans chez les garçons, avec une moyenne de 12-13 ans. La puberté commence 2 à 3 ans plus tôt chez les filles."}, {"q": "Chez les filles, la ménarche survient selon le cours entre :", "o": ["8 et 10 ans", "10 et 16,5 ans", "14 et 18 ans", "12 et 13 ans exactement"], "r": 1, "e": "Elle suit le développement des seins (6-13 ans), les poils pubiens (6-14 ans) et la poussée de croissance. Les poils axillaires apparaissent environ deux ans après les poils pubiens."}, {"q": "Chez les garçons, la première caractéristique pubertaire à apparaître est :", "o": ["Le changement de voix", "La croissance des testicules et du scrotum, entre 10 et 13,5 ans", "Les poils faciaux", "La première éjaculation"], "r": 1, "e": "Viennent ensuite la croissance corporelle, les poils pubiens, la croissance du pénis et de la prostate, puis le changement de voix au même moment."}, {"q": "Chez les garçons, la première éjaculation survient environ :", "o": ["En même temps que les poils pubiens", "Un an après le début de la croissance du pénis", "Deux ans après le changement de voix", "Avant la croissance testiculaire"], "r": 1, "e": "Les poils faciaux et axillaires apparaissent, eux, environ deux ans après les poils pubiens, en même temps que l'augmentation des glandes sébacées responsable de l'acné."}, {"q": "Les caractères sexuels primaires correspondent :", "o": ["Aux signes physiologiques de maturation n'impliquant pas les organes sexuels", "Aux organes nécessaires à la reproduction", "Aux changements de voix", "Au développement musculaire"], "r": 1, "e": "Chez la femme : ovaires, trompes, utérus, vagin. Chez l'homme : testicules, pénis, scrotum, vésicules séminales, prostate."}, {"q": "Parmi les caractères sexuels secondaires, on trouve :", "o": ["Les ovaires et l'utérus", "Les seins, les épaules larges, le changement de voix et la pousse des poils", "La prostate", "Les vésicules séminales"], "r": 1, "e": "Les signes de maturité sexuelle proprement dits sont la production de sperme et la menstruation, qui marquent l'accès à la fertilité."}, {"q": "La durée de sommeil idéale pour un adolescent est d'environ :", "o": ["6 heures", "7 heures", "9 heures", "11 heures"], "r": 2, "e": "Le cours précise que la plupart des adolescents n'atteignent pas cette durée et que dormir davantage le week-end ne compense pas le déficit accumulé."}, {"q": "Le décalage du rythme circadien à l'adolescence s'explique par :", "o": ["Une sécrétion de mélatonine plus tardive après la puberté", "Un usage excessif des écrans uniquement", "Une baisse du besoin de sommeil", "Une modification de la température corporelle"], "r": 0, "e": "Les adolescents restent naturellement éveillés plus tard, sont moins alertes et plus stressés tôt le matin. Le cours en déduit que commencer les cours plus tard améliorerait la concentration."}, {"q": "Un sommeil insuffisant à l'adolescence est associé à :", "o": ["Une somnolence diurne et des symptômes dépressifs", "Une amélioration des performances", "Une réduction du stress", "Une croissance accélérée"], "r": 0, "e": "C'est l'un des rares leviers de santé publique sur lequel une mesure organisationnelle simple — décaler les horaires scolaires — aurait un effet mesurable."}, {"q": "Parmi les carences nutritionnelles fréquentes à l'adolescence, le cours cite :", "o": ["Le calcium, le fer et le zinc", "Les protéines et les lipides", "Les glucides", "Les vitamines A et D uniquement"], "r": 0, "e": "Elles résultent d'habitudes alimentaires peu équilibrées — fast-food, frites, sodas — à un moment où les besoins liés à la croissance sont pourtant maximaux."}, {"q": "Parmi les facteurs d'obésité à l'adolescence, le cours mentionne, outre le manque d'activité :", "o": ["Une mauvaise régulation du métabolisme et une incapacité à reconnaître les signaux de faim et de satiété", "Une croissance trop rapide", "Un excès de sommeil", "Une puberté tardive"], "r": 0, "e": "S'y ajoute un nombre anormalement élevé de cellules graisseuses. L'obésité n'est donc pas réductible à un défaut de volonté."}, {"q": "Parmi les signes d'anorexie mentale décrits, le cours cite :", "o": ["Des régimes secrets, une insatisfaction persistante après la perte de poids et la fixation de nouveaux objectifs", "Une augmentation de l'appétit", "Une prise de poids rapide", "Un sommeil excessif"], "r": 0, "e": "S'y ajoutent un excès d'exercice et l'interruption des menstruations. Elle est plus fréquente chez les filles recherchant l'excellence physique, notamment en patinage ou en gymnastique. C'est un sujet sensible : si tu te sens concerné, en parler à un professionnel est important."}, {"q": "La boulimie nerveuse se caractérise par des ingestions massives suivies de tentatives d'annulation, avec un critère de :", "o": ["Un épisode par mois", "Au moins deux épisodes par semaine pendant au moins trois mois", "Un épisode par an", "Aucun critère de fréquence"], "r": 1, "e": "Les conduites d'annulation citées sont les vomissements provoqués, les régimes ou jeûnes sévères, l'exercice intense, les laxatifs et les diurétiques."}, {"q": "L'abus de substances est défini dans le cours comme une consommation nocive :", "o": ["Ponctuelle", "De plus d'un mois, dans des situations dangereuses comme la conduite", "Uniquement d'alcool", "Sans conséquence sur la santé"], "r": 1, "e": "Il mène à la dépendance, à la fois physiologique et psychologique. La durée et le contexte de mise en danger sont les deux critères retenus."}, {"q": "Selon Elkind, la « tendance à discuter » chez l'adolescent traduit :", "o": ["Une opposition systématique", "La recherche d'occasions de tester son nouveau raisonnement", "Un trouble du comportement", "Un manque de vocabulaire"], "r": 1, "e": "C'est la première des six attitudes immatures qu'il décrit. L'outil intellectuel est neuf, et l'adolescent l'exerce partout où il le peut."}, {"q": "L'« hypocrisie apparente » décrite par Elkind consiste en :", "o": ["Un mensonge délibéré", "L'incapacité à faire la différence entre exprimer un idéal et le vivre", "Un rejet des valeurs adultes", "Une indécision chronique"], "r": 1, "e": "L'exemple du cours est celui d'un adolescent qui manifeste pour le climat sans modifier ses propres comportements. Il ne s'agit pas de duplicité mais d'immaturité de la mise en cohérence."}, {"q": "Le public imaginaire, selon Elkind, désigne :", "o": ["Un groupe d'amis fictif", "Un observateur mental qui se préoccupe de l'adolescent autant que lui-même", "Une audience réelle", "Une hallucination"], "r": 1, "e": "Cette conscience de soi exacerbée explique l'hypersensibilité au regard d'autrui, le souci de l'apparence et la crainte du ridicule à cet âge."}, {"q": "La fable personnelle est présentée comme la source :", "o": ["De comportements prudents", "De comportements risqués et autodestructeurs", "D'une bonne estime de soi", "D'une meilleure réussite scolaire"], "r": 1, "e": "« Les autres deviennent esclaves de la drogue, mais pas moi » : la présomption d'invulnérabilité neutralise la perception du risque."}, {"q": "Selon Elkind (1998), le public imaginaire et la fable personnelle :", "o": ["Disparaissent complètement à l'âge adulte", "Existent encore à l'âge adulte, mais dans une moindre mesure", "S'aggravent avec l'âge", "Sont propres aux garçons"], "r": 1, "e": "Il note que la fable personnelle est ce qui permet de prendre des risques : conduire malgré les statistiques d'accidents suppose une forme d'exception accordée à soi-même."}, {"q": "Les identités sociales se définissent comme les perceptions de soi :", "o": ["Comme personne unique et singulière", "Comme membre d'un groupe ou d'une catégorie, à contenus collectivistes", "Comme futur professionnel", "Comme enfant de ses parents"], "r": 1, "e": "Les identités personnelles, à l'inverse, portent sur ce qui singularise. Le cours note que nous cherchons des identités sociales positives, qui renforcent l'estime de soi."}, {"q": "Parmi les trois questions importantes de la construction identitaire, le cours cite :", "o": ["Le choix d'une occupation, l'adoption de valeurs et le développement d'une identité sexuelle satisfaisante", "Le choix d'un logement, d'un partenaire et d'un revenu", "La réussite scolaire, sportive et artistique", "L'autonomie financière, juridique et affective"], "r": 0, "e": "Ces trois axes recouvrent le travail, les convictions et la sexualité — soit les trois grands registres d'engagement de la vie adulte."}, {"q": "La vertu de fidélité, selon Erikson, recouvre :", "o": ["L'obéissance aux parents", "La loyauté, la foi, le sentiment d'appartenance et l'identification à un ensemble de valeurs, une idéologie, une religion ou un mouvement politique", "La stabilité amoureuse uniquement", "La constance scolaire"], "r": 1, "e": "Le cours ajoute que l'identification personnelle apparaît quand les jeunes choisissent leurs valeurs au lieu d'accepter simplement celles de leurs parents."}, {"q": "Concernant la rébellion adolescente, le cours précise qu'elle :", "o": ["Est universelle et inévitable", "N'est pas toujours présente", "Est toujours pathologique", "Ne concerne que les garçons"], "r": 1, "e": "Il ajoute que considérer cette phase comme difficile mais acceptable peut aider à la gérer — ce qui suppose de ne pas la dramatiser ni de la nier."}, {"q": "Le groupe de pairs devient à l'adolescence une source :", "o": ["D'affection, de solidarité, de compréhension et d'orientation morale", "De contraintes uniquement", "De compétition scolaire", "D'autorité parentale déléguée"], "r": 0, "e": "Il permet d'acquérir autonomie et indépendance vis-à-vis des parents, et les relations intimes y constituent une répétition de l'intimité adulte."}, {"q": "Parmi les effets négatifs du groupe de pairs à l'adolescence, le cours cite :", "o": ["Une trop grande autonomie", "Les comportements antisociaux, les drogues et l'abandon scolaire", "L'isolement social", "Un excès de conformisme scolaire"], "r": 1, "e": "Il souligne que les jeunes antisociaux recherchent d'autres jeunes antisociaux, et que leur comportement s'intensifie en groupe."}, {"q": "Selon Elkind, l'indécision de l'adolescent s'explique par le fait qu'il :", "o": ["Ignore les options disponibles", "Est conscient des choix possibles mais éprouve des difficultés à décider", "Refuse de choisir par principe", "Manque d'informations"], "r": 1, "e": "C'est un effet paradoxal du progrès cognitif : pouvoir envisager le possible multiplie les options sans fournir de critère pour trancher entre elles."}, {"q": "Chez les filles, l'augmentation des glandes sébacées et sudoripares, responsable de l'acné, survient :", "o": ["Avant le développement des seins", "En même temps que l'apparition des poils axillaires", "Après la fin de la croissance", "Avant la ménarche"], "r": 1, "e": "La même chronologie vaut chez les garçons. L'acné accompagne donc une phase déjà avancée de la puberté."}, {"q": "Le changement de voix chez le garçon survient approximativement :", "o": ["Avant la croissance testiculaire", "En même temps que la croissance du pénis", "Deux ans après les poils pubiens", "Après les poils faciaux"], "r": 1, "e": "La croissance du pénis, de la prostate et des vésicules séminales se situe entre 11 et 14,5 ans ; la voix mue à la même période."}, {"q": "Selon Elkind, « trouver des défauts aux figures d'autorité » s'explique par le fait que :", "o": ["Les adultes sont effectivement défaillants", "L'accès à la pensée idéale fait apparaître l'écart entre les adultes admirés et les idéaux", "L'adolescent rejette toute autorité par principe", "L'adolescent manque d'informations"], "r": 1, "e": "C'est une conséquence directe de la pensée formelle : pouvoir concevoir le parfait rend visible l'imperfection du réel, y compris chez ceux qu'on admire."}, {"q": "Le cours indique que les changements hormonaux de la puberté sont liés :", "o": ["À une stabilisation de l'humeur", "À une instabilité de l'humeur et à une exacerbation des émotions", "À une baisse de l'émotivité", "À aucun effet psychologique"], "r": 1, "e": "Comportements agressifs et états dépressifs peuvent en résulter. Mais le cours rappelle aussitôt le poids des relations, par exemple pour l'entrée dans la sexualité."}, {"q": "La puberté dure en moyenne :", "o": ["1 an", "2 ans", "4 ans", "8 ans"], "r": 2, "e": "Elle commence 2 à 3 ans plus tôt chez les filles que chez les garçons, ce qui explique le décalage visible de stature dans les classes de collège."}, {"q": "Les signes de maturité sexuelle proprement dits sont :", "o": ["La pousse des poils et le changement de voix", "La production de sperme et la menstruation", "Le développement musculaire et l'élargissement des épaules", "L'apparition de l'acné"], "r": 1, "e": "Ils marquent l'accès effectif à la fertilité, alors que les autres changements ne sont que des caractères sexuels secondaires."}, {"q": "Dormir davantage le week-end permet-il, selon le cours, de compenser le manque de sommeil de la semaine ?", "o": ["Oui, totalement", "Non, cela ne compense pas", "Oui, à condition de dormir 12 heures", "Le cours ne se prononce pas"], "r": 1, "e": "La dette de sommeil ne se rattrape pas par un décalage ponctuel, qui aggrave même le désalignement du rythme circadien."}, {"q": "Les identités personnelles se définissent comme les perceptions de soi :", "o": ["Comme membre d'un groupe", "Comme personne unique et singulière, à contenus singularisants", "Comme futur professionnel", "Comme membre d'une famille"], "r": 1, "e": "Elles coexistent avec les identités sociales. La construction identitaire de l'adolescence consiste largement à articuler ces deux registres."}]};</script>
