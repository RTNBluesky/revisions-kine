<script>window.QUIZ={"titre": "QCM", "fiche": "../fiches/fiche_05_piaget.html", "questions": [{"q": "Pour Piaget, le développement cognitif résulte principalement :", "o": ["De la maturation biologique", "De l’imitation sociale", "De l’interaction active entre l’enfant et son environnement", "Du conditionnement", "De la transmission directe des connaissances"], "r": 2, "e": "Piaget est constructiviste : la connaissance n'est ni innée ni transmise, elle se construit par l'action du sujet sur son milieu, via l'assimilation et l'accommodation. L'enfant est acteur, pas récepteur."}, {"q": "La psychologie génétique étudie principalement :", "o": ["Les différences individuelles de QI", "Les normes du développement", "L’origine et la construction de la connaissance", "Les troubles cognitifs", "Les apprentissages scolaires"], "r": 2, "e": "La psychologie génétique, au sens de Piaget, n'a rien à voir avec les gènes : « genèse » y signifie origine. Elle étudie comment se construit la connaissance chez l'enfant."}, {"q": "L’assimilation correspond au processus par lequel l’enfant :", "o": ["Modifie ses structures mentales", "Supprime un schéma inefficace", "Intègre une nouvelle information dans un schéma existant", "Crée un nouveau schéma", "Atteint un état d’équilibre"], "r": 2, "e": "Assimiler, c'est traiter du neuf avec de l'ancien : l'enfant applique un schéma déjà constitué à un objet inédit. C'est le versant conservateur de l'adaptation, l'accommodation en étant le versant transformateur."}, {"q": "L’accommodation se définit comme :", "o": ["L’utilisation d’un schéma inchangé", "L’ajout d’un stimulus externe", "La modification d’un schéma existant pour s’adapter à la réalité", "La répétition automatique d’une action", "Le renforcement d’un comportement"], "r": 2, "e": "L'accommodation modifie le schéma pour l'ajuster à un objet qui lui résiste : l'enfant qui appelle « chien » tous les quadrupèdes doit créer une catégorie « chat ». L'assimilation, elle, fait entrer le nouvel objet dans un schéma inchangé."}, {"q": "Le moteur du développement cognitif chez Piaget est :", "o": ["La maturation cérébrale", "Le langage", "Le déséquilibre cognitif", "Le renforcement", "L’imitation"], "r": 2, "e": "Le moteur est le déséquilibre : lorsqu'un schéma échoue, la tension pousse à accommoder et à retrouver un équilibre supérieur. C'est l'équilibration majorante."}, {"q": "Le stade préopératoire se caractérise notamment par :", "o": ["La réversibilité", "La conservation", "L’égocentrisme", "Le raisonnement hypothético-déductif", "La pensée abstraite"], "r": 2, "e": "Le stade préopératoire (2-6 ans) est marqué par l'égocentrisme intellectuel : l'enfant ne parvient pas encore à adopter le point de vue d'autrui, comme l'illustre l'épreuve des trois montagnes. Réversibilité et conservation viendront au stade suivant."}, {"q": "La conservation apparaît principalement au stade :", "o": ["Sensori-moteur", "Préopératoire", "Opérations concrètes", "Opérations formelles", "Adulte"], "r": 2, "e": "Conserver, c'est comprendre que la quantité ne change pas quand la forme change — le liquide transvasé dans un verre plus fin. Cette acquisition marque l'entrée dans les opérations concrètes et suppose la réversibilité."}, {"q": "Le raisonnement transductif est typique du stade :", "o": ["Sensori-moteur", "Préopératoire", "Opérations concrètes", "Opérations formelles", "Post-formel"], "r": 1, "e": "Le raisonnement transductif va du particulier au particulier, sans passer par une règle générale : « je n'ai pas fait ma sieste, donc ce n'est pas l'après-midi ». Il est typique du stade préopératoire."}, {"q": "Le stade des opérations formelles permet surtout :", "o": ["L’imitation différée", "La pensée symbolique simple", "Le raisonnement abstrait et hypothétique", "La conservation perceptive", "L’animisme"], "r": 2, "e": "Les opérations formelles ouvrent le raisonnement hypothético-déductif : envisager le possible, tester systématiquement les variables, raisonner sur des propositions indépendamment du réel."}, {"q": "Pour Piaget, l’enfant est comparable à un scientifique car il :", "o": ["Imite passivement l’adulte", "Reçoit des connaissances toutes faites", "Teste activement des hypothèses pour comprendre le monde", "Évite l’erreur", "Apprend uniquement par répétition"], "r": 2, "e": "L'enfant piagétien observe, forme des hypothèses implicites, agit sur le réel et révise ses schémas lorsque le résultat le dément : l'erreur y est un moteur, non un accident."}, {"q": "Jean Piaget a publié sa première note scientifique à l'âge de :", "o": ["7 ans", "11 ans", "15 ans", "21 ans"], "r": 1, "e": "Il s'agissait d'une observation d'oiseau albinos. À 15 ans, il était déjà reconnu comme spécialiste des mollusques — une formation de naturaliste qui marquera toute sa conception du développement."}, {"q": "Piaget a développé ses travaux principalement à l'université de :", "o": ["Vienne", "Genève", "Paris", "Harvard"], "r": 1, "e": "L'école de Genève reste associée à la psychologie génétique, c'est-à-dire à l'étude de l'origine et de la construction de la connaissance."}, {"q": "Le mot « génétique » dans « psychologie génétique » renvoie à :", "o": ["Les gènes et l'hérédité", "La genèse, c'est-à-dire l'origine et la construction de la connaissance", "Les maladies héréditaires", "La transmission culturelle"], "r": 1, "e": "C'est un faux ami classique. Piaget ne s'intéresse pas à l'ADN mais à la façon dont la connaissance se forme et se transforme chez l'enfant."}, {"q": "Piaget s'intéressait avant tout :", "o": ["Aux normes de développement par âge", "À la nature du développement plutôt qu'aux normes", "À la mesure du quotient intellectuel", "Aux différences entre garçons et filles"], "r": 1, "e": "Le cours précise qu'il a mené de nombreuses études sur trois enfants seulement — ses propres fils. Ce n'était pas un défaut d'échantillonnage mais un choix : décrire des mécanismes, non établir des moyennes."}, {"q": "L'entretien clinique piagétien se caractérise par :", "o": ["Un questionnaire standardisé", "Des questions ouvertes et flexibles adaptées aux réponses de l'enfant", "Une observation silencieuse", "Un test chronométré"], "r": 1, "e": "« Qu'est-ce qui fait bouger les nuages ? », « D'où viennent les rêves ? » : l'important n'est pas la réponse juste mais le raisonnement qui la produit."}, {"q": "La première des trois grandes convictions de Piaget établit un parallèle entre :", "o": ["Le développement de l'enfant et l'histoire des sciences", "L'enfant et l'adulte", "La biologie et la culture", "L'individu et la société"], "r": 0, "e": "D'où la formule de « petit scientifique » : l'enfant construit des théories, les met à l'épreuve du réel et les révise quand elles échouent."}, {"q": "La deuxième conviction de Piaget affirme que nos structures intellectuelles sont :", "o": ["Innées et immuables", "Des organes d'adaptation, produits de l'évolution biologique", "Des constructions purement sociales", "Indépendantes du corps"], "r": 1, "e": "Le parallèle entre vie et pensée est constant chez lui : connaître, c'est s'adapter, exactement comme un organisme s'adapte à son milieu."}, {"q": "Selon Piaget, pour que la connaissance se construise, il faut que :", "o": ["L'adulte transmette l'information", "Le sujet soit actif et l'environnement réactif", "L'enfant observe passivement", "Le comportement soit renforcé"], "r": 1, "e": "Les deux conditions sont nécessaires : un sujet passif n'apprend pas, mais un environnement qui ne résiste ni ne répond ne provoque aucun déséquilibre."}, {"q": "Un schème, chez Piaget, désigne :", "o": ["Une image mentale", "Une structure cognitive de base, modèle de comportement organisé réutilisable dans différentes situations", "Un souvenir", "Une règle sociale"], "r": 1, "e": "Le schème de succion en est l'exemple princeps : d'abord appliqué au sein, il sera étendu à la tétine, au pouce, puis adapté à la tasse."}, {"q": "L'organisation, chez Piaget, est définie comme :", "o": ["La capacité innée à coordonner les schèmes et à les combiner en systèmes plus complexes", "Le classement des objets par catégories", "La mise en ordre du milieu", "La planification d'une action"], "r": 0, "e": "La tétée du biberon suppose de coordonner succion, préhension et regard. L'organisation est ce qui permet aux schèmes isolés de former des ensembles fonctionnels."}, {"q": "Utiliser le schéma de succion pour boire à la tasse relève de :", "o": ["L'assimilation", "L'accommodation", "L'équilibration", "L'organisation"], "r": 0, "e": "L'enfant applique une structure existante à un objet nouveau. L'accommodation intervient ensuite, quand il doit modifier ses mouvements de bouche et de langue pour que cela fonctionne."}, {"q": "L'équilibration correspond à l'état atteint lorsque :", "o": ["L'enfant cesse d'apprendre", "Assimilation et accommodation sont en équilibre", "L'environnement ne change plus", "Le schème disparaît"], "r": 1, "e": "Savoir boire correctement à la tasse marque cet équilibre. Mais il est provisoire : une expérience nouvelle le rompra, relançant le processus à un niveau supérieur."}, {"q": "Le moteur du passage d'un équilibre à un autre est :", "o": ["Le renforcement", "Le déséquilibre provoqué par une expérience qui ne correspond pas aux structures existantes", "La maturation cérébrale seule", "L'imitation d'un modèle"], "r": 1, "e": "Le cours ajoute que la curiosité pousse l'enfant à rechercher l'équilibre. C'est l'équilibration majorante : chaque rééquilibrage se fait à un niveau plus intégré que le précédent."}, {"q": "Au stade sensori-moteur, la connaissance s'acquiert principalement :", "o": ["Par le langage", "Par la succion, la préhension, l'observation, le toucher et la morsure", "Par le raisonnement", "Par l'imitation différée uniquement"], "r": 1, "e": "L'intelligence y est entièrement pratique : elle s'exerce dans l'action sur les objets, avant toute représentation symbolique."}, {"q": "Le comportement intentionnel apparaît vers :", "o": ["3 mois", "9 mois", "18 mois", "2 ans"], "r": 1, "e": "Le bébé peut alors chercher et trouver un moyen d'atteindre un but — prendre un bâton pour ramener un objet hors de portée. C'est la dissociation du moyen et du but."}, {"q": "Dans le test du jouet caché, un bébé très jeune :", "o": ["Soulève immédiatement le tissu", "Agit comme si l'objet avait cessé d'exister", "Pleure systématiquement", "Cherche dans la mauvaise direction"], "r": 1, "e": "« Loin des yeux, loin du cœur », résume le cours. Vers un an, l'enfant soulève le tissu ; mais la permanence de l'objet n'est pleinement acquise que vers deux ans."}, {"q": "La pensée symbolique, acquise au stade préopératoire, consiste à :", "o": ["Raisonner logiquement sur du concret", "Faire qu'un symbole — mot ou image — représente autre chose", "Inverser mentalement une opération", "Classer des objets"], "r": 1, "e": "C'est elle qui rend possibles le langage, le dessin, l'imitation différée et les jeux de rôle, tous apparaissant à cette période."}, {"q": "L'exemple de Jacqueline appelant un coquillage « coupe », « verre », « chapeau » puis « bateau sur l'eau » illustre :", "o": ["L'égocentrisme", "L'émergence de la pensée symbolique et du jeu imaginatif", "L'animisme", "La conservation"], "r": 1, "e": "Rapporté par Piaget en 1953, cet exemple montre un même objet servant successivement de support à plusieurs représentations. Trois jours plus tard, elle pousse une boîte vide en disant « voiture »."}, {"q": "La tâche des trois montagnes sert à mettre en évidence :", "o": ["La conservation du volume", "L'égocentrisme intellectuel", "La sériation", "La réversibilité"], "r": 1, "e": "L'enfant préopératoire attribue à autrui la vue qu'il a lui-même de la maquette : il ne parvient pas encore à décentrer son point de vue."}, {"q": "L'animisme piagétien consiste à :", "o": ["Croire aux esprits", "Attribuer des caractéristiques vivantes aux objets inanimés", "Imiter les animaux", "Refuser de distinguer les espèces"], "r": 1, "e": "« Le soleil s'en va parce qu'il ne veut pas qu'il pleuve dessus. » La distinction entre animé et inanimé s'installe progressivement au cours du stade."}, {"q": "L'irréversibilité de la pensée préopératoire se manifeste par le fait que l'enfant :", "o": ["Oublie ce qu'il vient d'apprendre", "Sachant que 3 + 4 = 7, ne déduit pas que 7 − 4 = 3", "Refuse de changer d'avis", "Ne comprend pas les nombres"], "r": 1, "e": "Il ne peut pas encore parcourir mentalement une opération en sens inverse. La réversibilité sera l'acquisition majeure du stade des opérations concrètes."}, {"q": "Le fait qu'un chien portant un masque de chat devienne « un chat » pour l'enfant préopératoire illustre :", "o": ["L'animisme", "La domination de la pensée par les caractéristiques perceptives", "Le raisonnement transductif", "L'égocentrisme"], "r": 1, "e": "L'apparence l'emporte sur l'identité : ce qui se voit détermine ce qui est. C'est la même logique qui empêche la conservation des quantités."}, {"q": "« L'homme est tombé de vélo parce qu'il s'est cassé le bras » est un exemple de :", "o": ["Raisonnement déductif", "Raisonnement transductif", "Raisonnement inductif", "Raisonnement hypothético-déductif"], "r": 1, "e": "Le raisonnement transductif va du particulier au particulier et établit un lien causal entre deux faits simplement concomitants, sans passer par une règle générale ni respecter l'ordre temporel."}, {"q": "La sériation, acquise au stade des opérations concrètes, consiste à :", "o": ["Regrouper selon un critère commun", "Organiser des éléments selon une dimension comme la taille, le poids ou la vitesse", "Comprendre qu'une quantité reste constante", "Inverser une opération"], "r": 1, "e": "Elle se distingue de la classification, qui regroupe selon un critère et suppose l'inclusion de classes, c'est-à-dire la compréhension de la relation entre le tout et les parties."}, {"q": "L'inclusion de classe désigne la compréhension :", "o": ["De la relation entre le tout et ses parties", "De l'ordre chronologique", "De la conservation du volume", "Du point de vue d'autrui"], "r": 0, "e": "Savoir qu'il y a plus de fleurs que de marguerites dans un bouquet mêlant marguerites et roses suppose de penser simultanément le tout et la sous-catégorie."}, {"q": "La conservation signifie que certaines caractéristiques restent constantes malgré :", "o": ["Le passage du temps", "La transformation de l'apparence", "Le changement de lieu", "L'ajout d'éléments"], "r": 1, "e": "Elle porte sur le poids, le volume, le nombre, la longueur et la masse. Elle suppose la réversibilité et la décentration, toutes deux acquises aux opérations concrètes."}, {"q": "La décentration correspond à :", "o": ["La perte des repères", "La libération de l'égocentrisme", "L'oubli des acquis antérieurs", "La concentration sur un seul aspect"], "r": 1, "e": "L'enfant devient capable de considérer plusieurs dimensions à la fois et d'adopter d'autres points de vue que le sien — condition de la conservation comme de la coopération."}, {"q": "Au stade des opérations formelles, l'adolescent devient notamment :", "o": ["Plus concret", "Idéaliste, capable de raisonner sur des choses jamais expérimentées directement", "Moins logique", "Égocentrique au sens préopératoire"], "r": 1, "e": "Pouvoir penser le possible et pas seulement le réel ouvre à la critique du monde tel qu'il est — d'où l'idéalisme souvent associé à cette période."}, {"q": "Le raisonnement hypothético-déductif consiste à :", "o": ["Procéder par essais et erreurs", "Construire des hypothèses et imaginer mentalement différents résultats avant de les tester", "Raisonner du particulier au particulier", "Se fier à l'apparence perceptive"], "r": 1, "e": "C'est la démarche expérimentale elle-même : poser une hypothèse, en déduire des conséquences, puis les confronter au réel de façon systématique."}, {"q": "Parmi les contributions de Piaget, le cours retient :", "o": ["La démonstration que la pensée enfantine est qualitativement différente de celle de l'adulte", "L'invention des tests d'intelligence", "La théorie de l'attachement", "L'étude des renforcements"], "r": 0, "e": "S'y ajoutent l'idée d'un développement intellectuel continu dès la naissance, la conception d'un enfant actif et des découvertes majeures : permanence de l'objet, égocentrisme, conservation."}, {"q": "Parmi les limites de la théorie de Piaget, le cours retient que :", "o": ["Les âges des étapes sont parfois surévalués, les compétences précoces des bébés ayant été sous-estimées", "Il accorde trop d'importance aux bébés", "Il néglige les aspects cognitifs", "Ses méthodes étaient trop standardisées"], "r": 0, "e": "La seconde limite est que les changements cognitifs seraient plus progressifs que ne le suggère un découpage en stades stricts."}, {"q": "Selon le tableau récapitulatif, le stade sensori-moteur se caractérise par :", "o": ["La pensée symbolique et l'égocentrisme", "Les actions sensorielles et motrices, la permanence de l'objet et l'intentionnalité", "La réversibilité et la conservation", "L'abstraction et les hypothèses"], "r": 1, "e": "Chaque stade a ses marqueurs : sensori-moteur de 0 à 2 ans, préopératoire de 2 à 7, opérations concrètes de 7 à 11, opérations formelles au-delà."}, {"q": "Le terme « préopératoire » signifie que l'enfant :", "o": ["Ne pense pas encore", "N'a pas encore accès aux opérations mentales comme les classifications et les classements", "Ne parle pas", "Agit sans intention"], "r": 1, "e": "Le préfixe indique un manque par rapport au stade suivant : la pensée symbolique est là, mais les opérations logiques réversibles ne le sont pas encore."}, {"q": "Pour Piaget, le déséquilibre cognitif est :", "o": ["Un obstacle à éviter", "Le moteur même du développement", "Un signe de pathologie", "Sans effet sur l'apprentissage"], "r": 1, "e": "C'est un renversement pédagogique important : une situation qui met l'enfant en difficulté, si elle reste à sa portée, fait davantage progresser qu'une tâche qu'il maîtrise déjà."}, {"q": "Au stade des opérations concrètes, le raisonnement logique de l'enfant :", "o": ["S'applique à toute situation, y compris verbale et abstraite", "A encore besoin d'objets et d'événements concrets", "Est identique à celui de l'adolescent", "Reste dominé par l'apparence"], "r": 1, "e": "Le même problème posé en termes purement verbaux échouera là où sa version manipulable réussit. C'est ce qui distingue les opérations concrètes des opérations formelles."}, {"q": "Le concept de nombre acquis aux opérations concrètes suppose :", "o": ["La capacité de compter à voix haute", "L'invariance : le nombre d'éléments ne change pas si on modifie leur disposition", "La connaissance des chiffres écrits", "La maîtrise des opérations arithmétiques"], "r": 1, "e": "Un enfant peut réciter la suite des nombres sans avoir la conservation : écarter les jetons d'une rangée lui fait croire qu'il y en a davantage."}, {"q": "Piaget est né en 1896 et mort en :", "o": ["1936", "1958", "1980", "1994"], "r": 2, "e": "Ses travaux, menés sur plus d'un demi-siècle, ont structuré durablement la psychologie du développement, même si ses datations par stade ont été révisées depuis."}, {"q": "L'idée d'évolution chez Piaget signifie que :", "o": ["Les espèces se transforment", "Les formes de vie ou de connaissance les plus simples se transforment par étapes en formes plus complexes et mieux adaptées", "La connaissance est innée", "L'enfant imite l'adulte"], "r": 1, "e": "Ce parallèle entre biologie et connaissance est constant chez lui : la pensée obéit aux mêmes principes d'adaptation que l'organisme."}, {"q": "Les monologues collectifs observés chez l'enfant préopératoire illustrent :", "o": ["Un retard de langage", "L'égocentrisme : plusieurs enfants parlent ensemble sans réellement s'adresser les uns aux autres", "Une pensée logique", "Un jeu de rôle élaboré"], "r": 1, "e": "Chacun poursuit son propre discours sans tenir compte de celui des autres. Pour Piaget, c'est un indice de la difficulté à décentrer son point de vue."}, {"q": "L'accommodation, chez Piaget, correspond à :", "o": ["L'absorption d'une information dans une structure existante", "La modification d'une structure cognitive pour intégrer du nouveau", "La coordination de plusieurs schèmes", "L'équilibre entre deux processus"], "r": 1, "e": "Assimilation et accommodation sont les deux versants de l'adaptation : l'une conserve les structures, l'autre les transforme. Leur équilibre est l'équilibration."}]};</script>
