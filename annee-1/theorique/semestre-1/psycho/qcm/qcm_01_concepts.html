<script>window.QUIZ={"titre": "QCM", "fiche": "../fiches/fiche_01_concepts.html", "questions": [{"q": "Selon la définition de Papalia &amp; Martorell, le développement correspond à :", "o": ["Une succession de changements biologiques uniquement", "Des changements aléatoires dépendant du contexte", "Des processus systématiques de changement et de stabilité", "Une évolution linéaire jusqu’à l’âge adulte"], "r": 2, "e": "La définition insiste sur deux points : les changements sont systématiques (ordonnés, cumulatifs), et le développement comporte aussi de la stabilité. Il ne s'arrête pas à l'âge adulte et ne se réduit pas au biologique."}, {"q": "Dire que le développement accompagne le cycle de vie signifie que :", "o": ["Il s’arrête à l’âge adulte", "Il concerne uniquement l’enfance", "Il s’étend de la conception à la mort", "Il est identique à chaque période de vie"], "r": 2, "e": "Le développement couvre l'ensemble du cycle de vie, de la conception à la mort : c'est la perspective life-span de Baltes, qui rompt avec l'idée d'un développement limité à l'enfance."}, {"q": "Lequel des objectifs suivants n’appartient PAS aux objectifs de l’étude du développement ? :", "o": ["Description", "Explication", "Prédiction", "Normalisation du comportement"], "r": 3, "e": "Les trois objectifs classiques sont décrire, expliquer et prédire — auxquels on ajoute souvent l'intervention. Normaliser les comportements est une visée prescriptive, étrangère à la démarche scientifique."}, {"q": "Un changement quantitatif correspond à :", "o": ["Une modification de structure cognitive", "Le passage du non-verbal au verbal", "Une augmentation du vocabulaire", "Une transformation qualitative du raisonnement"], "r": 2, "e": "Un changement quantitatif porte sur un « combien » : nombre de mots, taille, vitesse. Le passage aux opérations concrètes est au contraire une réorganisation de structure, donc qualitative."}, {"q": "Les trois domaines principaux du développement sont :", "o": ["Biologique, affectif, social", "Physique, cognitif, psychosocial", "Sensoriel, moteur, émotionnel", "Génétique, culturel, historique"], "r": 1, "e": "Papalia distingue le développement physique, cognitif et psychosocial. Ces trois domaines sont séparés pour l'étude mais constamment en interaction."}, {"q": "La division du cycle de vie en périodes est considérée comme :", "o": ["Universelle et exacte", "Fixée biologiquement", "Une construction sociale aux limites approximatives", "Identique dans toutes les cultures"], "r": 2, "e": "Le découpage en périodes (petite enfance, adolescence, troisième âge) varie selon les époques et les cultures : l'adolescence comme catégorie est récente. C'est un outil de description, aux frontières floues."}, {"q": "Les différences individuelles dans le développement s’expliquent notamment par :", "o": ["Uniquement l’hérédité", "Uniquement l’environnement", "Les caractéristiques personnelles et les contextes de vie", "Les stades universels identiques pour tous"], "r": 2, "e": "Les différences individuelles résultent de l'interaction entre caractéristiques propres (génétique, tempérament, santé) et contextes de vie (famille, école, culture, époque) : ni l'hérédité ni l'environnement seuls n'en rendent compte."}, {"q": "Une influence normative liée à l’âge est :", "o": ["Un accident d’avion", "Une guerre vécue par une génération", "La puberté", "Le décès d’un parent en bas âge"], "r": 2, "e": "La puberté survient chez tous les individus, à un âge relativement prévisible : c'est le prototype de l'influence normative liée à l'âge. La guerre est normative liée à l'histoire, l'accident est non normatif."}, {"q": "Une influence non normative est caractérisée par :", "o": ["Sa survenue chez toutes les personnes du même âge", "Son caractère prévisible", "Son impact significatif et individuel", "Son origine strictement biologique"], "r": 2, "e": "L'influence non normative est inattendue, ne touche pas tout le monde, mais marque durablement la trajectoire de celui qui la vit. C'est précisément son caractère atypique qui la définit."}, {"q": "Pourquoi le terme « période sensible » est-il préféré à « période critique » ? :", "o": ["Parce qu’il exclut toute influence biologique", "Parce qu’il reconnaît la plasticité du développement", "Parce qu’il signifie un changement irréversible", "Parce qu’il concerne uniquement le langage"], "r": 1, "e": "« Période critique » suppose une fenêtre rigide au-delà de laquelle rien n'est plus possible. « Période sensible » rend compte de la réalité observée : l'acquisition est plus facile à ce moment, mais reste possible ensuite grâce à la plasticité."}, {"q": "L'objectif de « modification » dans l'étude du développement correspond à :", "o": ["Décrire précisément le comportement", "Intervenir pour favoriser un développement optimal", "Prévoir le développement futur", "Expliquer les causes du comportement"], "r": 1, "e": "Aux trois objectifs classiques — décrire, expliquer, prédire — s'ajoute l'intervention. La thérapie orthophonique en est l'exemple donné par le cours : on n'observe plus seulement, on agit."}, {"q": "Prévoir si un enfant présentera des difficultés langagières relève de l'objectif :", "o": ["De description", "D'explication", "De prédiction", "De modification"], "r": 2, "e": "Décrire, c'est constater quand apparaît le premier mot ; expliquer, c'est comprendre comment le langage s'acquiert ; prédire, c'est anticiper la trajectoire ; modifier, c'est intervenir."}, {"q": "La saudade et la capacité à ressentir des émotions mixtes sont citées comme exemples :", "o": ["De dimensions fragilisées avec le temps", "De dimensions renforcées avec l'âge", "De changements quantitatifs", "D'influences non normatives"], "r": 1, "e": "Le développement n'est pas un déclin uniforme : les dimensions physique et cognitive peuvent se fragiliser pendant que les dimensions émotionnelle et psychosociale se renforcent — sagesse, nostalgie, émotions complexes."}, {"q": "Entrer à l'université après la retraite est mobilisé dans le cours comme exemple :", "o": ["D'un aspect positif du développement à l'âge avancé", "D'une influence normative liée à l'âge", "D'un changement quantitatif", "D'une période sensible"], "r": 0, "e": "Le cours l'oppose à l'isolement après la retraite, exemple d'aspect négatif. Le développement comporte les deux versants à tout âge."}, {"q": "Le passage du langage non verbal au langage verbal constitue un changement :", "o": ["Quantitatif", "Qualitatif", "Non normatif", "Purement biologique"], "r": 1, "e": "Ce n'est pas une augmentation de quantité mais un changement de type et de structure. L'augmentation du vocabulaire, de la taille ou du poids relève au contraire du quantitatif."}, {"q": "Le domaine cognitif du développement regroupe :", "o": ["Émotions, personnalité et relations sociales", "Apprentissage, attention, mémoire, langage, pensée, raisonnement et créativité", "Croissance du corps, capacités sensorielles et habiletés motrices", "Hérédité et maturation"], "r": 1, "e": "Les trois domaines sont interconnectés et s'influencent mutuellement : physique, cognitif et psychosocial. Aucun ne se développe indépendamment des autres."}, {"q": "Selon le découpage de Papalia et Martorell, la troisième enfance correspond à :", "o": ["0 à 3 ans", "3 à 6 ans", "6 à 11 ans", "11 à 20 ans"], "r": 2, "e": "Le découpage complet : prénatal, première enfance 0-3 ans, deuxième enfance 3-6 ans, troisième enfance 6-11 ans, adolescence 11-20 ans, jeune adulte 20-40 ans, âge moyen 40-65 ans, troisième âge au-delà."}, {"q": "La vie adulte intermédiaire, ou moyen âge, est située par le cours entre :", "o": ["20 et 40 ans", "40 et 65 ans", "65 et 80 ans", "30 et 50 ans"], "r": 1, "e": "Le jeune adulte, ou adulte émergent, couvre 20 à 40 ans, et la vie adulte tardive commence après 65 ans. Ces bornes restent approximatives, la division en périodes étant une construction sociale."}, {"q": "Parmi les facteurs universels d'influence du développement, la maturation désigne :", "o": ["Le potentiel génétique transmis par les parents", "Les changements séquentiels dépendant de la maturation du corps et du cerveau", "Le milieu familial et culturel", "Les événements imprévus de la vie"], "r": 1, "e": "Elle impose un ordre : l'enfant rampe avant de marcher, babille avant de parler. Les deux autres facteurs universels sont l'hérédité et l'environnement, à commencer par l'utérus."}, {"q": "Le premier environnement de développement mentionné dans le cours est :", "o": ["La famille", "L'utérus", "L'école", "La culture"], "r": 1, "e": "L'environnement commence avant la naissance. Viennent ensuite la famille, puis les contextes élargis — école, travail, loisirs, culture."}, {"q": "La ménopause est un exemple d'influence :", "o": ["Normative liée à l'âge, de nature biologique", "Normative historique", "Non normative", "Purement sociale"], "r": 0, "e": "Les influences normatives liées à l'âge se subdivisent en biologiques — puberté, ménopause — et sociales, plus variables, comme l'entrée à l'école ou la maternité."}, {"q": "Une génération née pendant une guerre civile constitue un exemple d'influence :", "o": ["Normative liée à l'âge", "Normative historique", "Non normative", "Individuelle"], "r": 1, "e": "Elle touche une cohorte entière — un groupe partageant la même époque et le même lieu. À la différence des influences liées à l'âge, elle ne se répète pas d'une génération à l'autre."}, {"q": "Une influence non normative peut être :", "o": ["Uniquement négative", "Soit un événement typique survenant à un moment atypique, soit un événement atypique en soi", "Toujours prévisible", "Commune à toute une cohorte"], "r": 1, "e": "Se marier à l'adolescence est typique mais à contretemps ; survivre à un accident d'avion est atypique en soi. Ces influences peuvent être négatives ou positives et échappent souvent au contrôle de l'individu."}, {"q": "L'imprinting mis en évidence par Konrad Lorenz en 1957 consiste en :", "o": ["L'apprentissage du langage par imitation", "Le fait que les canetons suivent instinctivement le premier objet en mouvement qu'ils voient", "Un conditionnement classique", "Un attachement acquis par la nourriture"], "r": 1, "e": "Peu importe que l'objet appartienne ou non à leur espèce. Lorenz en déduit l'existence d'une brève période critique pendant laquelle le système nerveux est prédisposé à former des liens."}, {"q": "Le principe « multidirectionnel » de Baltes signifie que :", "o": ["Le développement va toujours dans le sens du progrès", "Des gains dans un domaine coexistent avec des pertes dans d'autres", "Toutes les dimensions évoluent au même rythme", "Le développement s'arrête à l'âge adulte"], "r": 1, "e": "La sagesse peut progresser pendant que les capacités physiques déclinent. À ne pas confondre avec le principe multidimensionnel, qui porte sur la pluralité des dimensions en interaction."}, {"q": "Le principe de Baltes selon lequel « aucune période n'est plus importante qu'une autre » correspond au principe :", "o": ["Life-span", "Multidimensionnel", "De plasticité", "D'allocation des ressources"], "r": 0, "e": "C'est une rupture avec les théories centrées sur l'enfance : le développement dure toute la vie, et chaque période mérite d'être étudiée pour elle-même."}, {"q": "Selon Baltes, les lunettes, appareils auditifs et technologies illustrent :", "o": ["La plasticité", "Le rôle des supports culturels compensant les pertes biologiques", "L'allocation des ressources", "Le contexte historique"], "r": 1, "e": "C'est le principe des influences relatives entre biologie et culture : l'équilibre entre les deux se déplace au cours de la vie, la culture prenant le relais quand la biologie décline."}, {"q": "Le principe d'allocation des ressources de Baltes indique qu'à la vieillesse, les ressources sont surtout investies dans :", "o": ["La croissance", "La régulation de la perte", "L'acquisition de nouvelles compétences", "La reproduction"], "r": 1, "e": "Temps, énergie, talent, argent et soutien social se répartissent entre croissance, conservation ou récupération, et gestion des pertes. L'enfance et le début de l'âge adulte privilégient la croissance."}, {"q": "Le principe de plasticité de Baltes affirme que :", "o": ["Les capacités sont fixées dès l'enfance", "La mémoire, la force ou l'endurance peuvent être améliorées même à un âge avancé", "Seuls les enfants apprennent", "La biologie détermine tout"], "r": 1, "e": "C'est ce principe qui fonde l'intérêt de l'entraînement et de la rééducation chez la personne âgée, et qui justifie de préférer la notion de période sensible à celle de période critique."}, {"q": "Une étude transversale consiste à :", "o": ["Suivre le même groupe au fil du temps", "Comparer au même moment plusieurs groupes d'âges différents", "Étudier un seul individu en profondeur", "Manipuler une variable expérimentale"], "r": 1, "e": "Elle est rapide mais confond effets d'âge et effets de cohorte. L'étude longitudinale suit le même groupe dans la durée, l'étude séquentielle combine les deux approches."}, {"q": "Suivre l'apprentissage d'un même groupe à 20, 30 puis 40 ans correspond à une étude :", "o": ["Transversale", "Longitudinale", "Séquentielle", "De cas"], "r": 1, "e": "Elle permet d'observer le changement individuel réel, mais elle est longue, coûteuse et exposée à l'abandon progressif des participants."}, {"q": "L'étude séquentielle se caractérise par le fait :", "o": ["De ne suivre qu'un individu", "De combiner transversal et longitudinal, en mesurant plusieurs fois un échantillon de groupes d'âges différents", "De manipuler une variable indépendante", "De se limiter à l'observation naturaliste"], "r": 1, "e": "Des groupes de 10, 20 et 30 ans sont étudiés maintenant puis cinq ans plus tard. Ce croisement permet de démêler les effets d'âge des effets de cohorte."}, {"q": "Une étude ethnographique porte sur :", "o": ["Un seul individu", "Une culture ou une sous-culture", "La relation statistique entre deux variables", "Un groupe expérimental et un groupe témoin"], "r": 1, "e": "L'étude de cas s'attache à un individu, l'étude corrélationnelle à une relation entre variables, l'étude expérimentale à la manipulation d'une variable avec groupe témoin."}, {"q": "Une étude corrélationnelle permet d'établir :", "o": ["Une relation de cause à effet", "Une relation statistique entre deux variables, positive ou négative", "Un diagnostic individuel", "Une norme développementale"], "r": 1, "e": "Seule l'étude expérimentale, par manipulation contrôlée d'une variable et comparaison à un groupe témoin, autorise des conclusions causales."}, {"q": "L'observation naturaliste est illustrée dans le cours par :", "o": ["La Situation étrange d'Ainsworth", "Les travaux de Lorenz sur l'imprinting", "L'expérience du petit Albert", "La poupée Bobo de Bandura"], "r": 1, "e": "La Situation étrange relève au contraire de l'observation en laboratoire. L'opposition tient au degré de contrôle : milieu habituel et non manipulé d'un côté, dispositif standardisé de l'autre."}, {"q": "Le consentement éclairé suppose que le participant :", "o": ["Soit rémunéré", "Participe volontairement après avoir été informé des objectifs et de la confidentialité", "Soit suivi pendant toute l'étude", "Accepte de renoncer à son anonymat"], "r": 1, "e": "Avec le droit à la vie privée et à la confidentialité, il constitue l'un des deux piliers éthiques mentionnés par le cours. L'information doit précéder l'accord."}, {"q": "Le concept de cohorte désigne :", "o": ["Un groupe d'individus de même niveau social", "Un groupe partageant une expérience similaire, liée à une même époque et à un même lieu", "Un échantillon expérimental", "Une classe d'âge biologique"], "r": 1, "e": "Il est central pour comprendre les influences normatives historiques et pour interpréter les résultats des études transversales, où les différences observées peuvent tenir à la génération plutôt qu'à l'âge."}, {"q": "Dire que le développement est « biopsychosocial » signifie qu'il résulte :", "o": ["De la seule biologie", "De l'interaction entre facteurs biologiques, psychologiques et sociaux", "Du seul environnement", "De la maturation uniquement"], "r": 1, "e": "C'est la synthèse du cours, avec quatre autres qualificatifs : life-span, multidimensionnel, multidirectionnel et non linéaire. Aucun facteur isolé n'explique une trajectoire."}, {"q": "Affirmer que « l'individu est actif » dans son développement signifie que :", "o": ["Il subit les influences de son milieu", "Il contribue lui-même à façonner son parcours et ses contextes", "Son développement est imprévisible", "Seule l'hérédité compte"], "r": 1, "e": "Cette idée, centrale chez Piaget comme dans la perspective life-span, s'oppose à une conception du sujet comme simple réceptacle d'influences héréditaires ou environnementales."}, {"q": "Le questionnaire à questions fermées et l'entretien ouvert sont deux exemples :", "o": ["De types d'études", "De techniques de collecte de données", "De principes de Baltes", "De domaines du développement"], "r": 1, "e": "Les techniques de collecte — questionnaire, entretien, observation naturaliste, observation en laboratoire — sont à distinguer des types d'études, qui décrivent l'architecture temporelle de la recherche."}, {"q": "Pourquoi les divisions du cycle de vie par âge sont-elles qualifiées d'« approximatives » ?", "o": ["Parce que les chercheurs ne s'accordent pas sur les mesures", "Parce que la division en périodes est une construction sociale, variable selon les époques et les cultures", "Parce que les enfants se développent trop vite", "Parce que l'âge n'a aucune importance"], "r": 1, "e": "L'adolescence comme catégorie est récente, et ses bornes varient d'une société à l'autre. Les périodes sont des outils de description, non des réalités naturelles."}, {"q": "Le principe du contexte historique et culturel chez Baltes souligne que :", "o": ["L'histoire n'influence pas le développement individuel", "Chaque personne se développe dans des conditions spécifiques liées à son temps et à son lieu", "Seule la culture compte", "Les cohortes se développent de façon identique"], "r": 1, "e": "Naître en 1940 ou en 2010, à Lisbonne ou à Damas, n'expose pas aux mêmes possibles. C'est le principe qui introduit la notion de cohorte."}, {"q": "La période prénatale s'étend, selon Papalia et Martorell :", "o": ["Du troisième mois à la naissance", "De la conception à la naissance", "De la nidation au terme", "Des premiers mouvements fœtaux à l'accouchement"], "r": 1, "e": "Elle est la première des huit périodes du cycle de vie retenues par le manuel, ce qui traduit l'idée que le développement commence dès la conception."}, {"q": "L'entrée à l'école et la maternité sont citées comme des influences normatives liées à l'âge de nature :", "o": ["Biologique", "Sociale, donc plus variables", "Historique", "Non normative"], "r": 1, "e": "Le cours oppose les influences biologiques, comme la puberté et la ménopause, dont le calendrier est relativement stable, aux influences sociales, dont l'âge de survenue varie selon les époques et les milieux."}, {"q": "Une étude de cas se caractérise par :", "o": ["Un grand échantillon représentatif", "L'étude d'un seul individu, avec des informations détaillées et approfondies", "La comparaison de deux groupes", "La mesure répétée d'une cohorte"], "r": 1, "e": "Elle offre une richesse de détail inaccessible aux grandes enquêtes, mais ne permet aucune généralisation directe. C'est un outil d'exploration et de description, non de preuve."}, {"q": "Dans une étude expérimentale, le groupe témoin sert à :", "o": ["Augmenter la taille de l'échantillon", "Offrir un point de comparaison n'ayant pas reçu la manipulation de la variable", "Vérifier le consentement des participants", "Remplacer le groupe expérimental en cas d'abandon"], "r": 1, "e": "Sans lui, impossible de savoir si l'effet observé vient de la variable manipulée ou d'autre chose. C'est ce dispositif qui autorise l'inférence causale."}, {"q": "Dire que le développement est « non linéaire » signifie que :", "o": ["Il progresse à vitesse constante", "Il ne suit pas une progression régulière et uniforme, alternant avancées, plateaux et reculs", "Il ne concerne que l'enfance", "Il est imprévisible"], "r": 1, "e": "Ce qualificatif figure dans la synthèse du cours aux côtés de life-span, multidimensionnel, multidirectionnel et biopsychosocial. Il rappelle qu'aucune trajectoire ne se déroule en ligne droite."}, {"q": "Dans une étude transversale, une différence observée entre un groupe de 20 ans et un groupe de 60 ans peut s'expliquer :", "o": ["Uniquement par l'effet de l'âge", "Par l'effet de l'âge, mais aussi par un effet de cohorte lié aux conditions historiques vécues", "Uniquement par le hasard", "Par la maturation seule"], "r": 1, "e": "C'est la limite principale du plan transversal : les deux groupes n'ont pas seulement des âges différents, ils ont vécu des époques différentes. L'étude séquentielle permet de démêler les deux."}, {"q": "Le sentiment de sagesse mentionné dans le cours illustre :", "o": ["Une dimension qui se fragilise avec l'âge", "Une dimension émotionnelle et psychosociale susceptible de se renforcer avec le temps", "Un changement quantitatif", "Une influence non normative"], "r": 1, "e": "Le développement ne se réduit pas à une croissance suivie d'un déclin : certaines dimensions continuent de progresser précisément grâce à l'accumulation d'expérience."}, {"q": "Le droit à la vie privée et à la confidentialité en recherche impose de protéger :", "o": ["Uniquement les données médicales", "Toutes les informations obtenues directement ou indirectement sur les participants", "Uniquement l'identité des mineurs", "Uniquement les résultats publiés"], "r": 1, "e": "La formulation est volontairement large : ce qui a été appris de façon incidente est protégé au même titre que ce qui a été recueilli délibérément."}]};</script>
