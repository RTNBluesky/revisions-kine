<div class="quiz-head"><p>50 questions à choix multiple. Mode révision : correction immédiate. Mode examen : correction et score à la fin.</p><div class="bar"><i></i></div><p style="margin-top:8px" id="compteur"></p></div><div id="quiz"></div>

<script>window.QUIZ={"titre": "QCM", "fiche": "../fiches/fiche_07_prenatal.html", "questions": [{"q": "Les problèmes du développement prénatal se répartissent principalement en :", "o": ["Problèmes nutritionnels et hormonaux", "Erreurs génétiques et facteurs tératogènes", "Maladies infectieuses et traumatismes", "Facteurs psychologiques et sociaux", "Anomalies neurologiques uniquement"], "r": 1, "e": "Le cours distingue deux grandes catégories : les erreurs génétiques, présentes dès la conception, et les tératogènes — alcool, médicaments, infections, radiations — qui agissent pendant la grossesse."}, {"q": "Les erreurs génétiques surviennent :", "o": ["Après la naissance", "Pendant le 3ᵉ trimestre", "Au moment de la conception", "Uniquement après exposition à un toxique", "Pendant l’accouchement"], "r": 2, "e": "Les erreurs génétiques — anomalies chromosomiques ou géniques — sont présentes dès la conception, dans les gamètes ou lors des premières divisions. Les tératogènes, eux, agissent secondairement pendant la grossesse."}, {"q": "Le syndrome de Down est caractérisé par :", "o": ["Une absence du chromosome 21", "Une duplication partielle du chromosome 21", "Trois copies du chromosome 21", "Une anomalie du chromosome X", "Une mutation récessive unique"], "r": 2, "e": "La trisomie 21 est la présence de trois exemplaires du chromosome 21, le plus souvent par non-disjonction méiotique. Son risque croît nettement avec l'âge maternel."}, {"q": "Le syndrome de Klinefelter correspond au caryotype :", "o": ["XO", "XXX", "XXY", "XYY"], "r": 2, "e": "Le syndrome de Klinefelter est un caryotype 47,XXY. XO correspond au syndrome de Turner, XXX au triple X, XYY au syndrome de Jacobs."}, {"q": "Le syndrome de l’X fragile est :", "o": ["Un trouble environnemental non héréditaire", "Une anomalie chromosomique autosomique", "Une mutation sur le chromosome X", "Une trisomie", "Une conséquence exclusive de l’autisme"], "r": 2, "e": "L'X fragile résulte de l'expansion d'une répétition CGG sur le gène FMR1 du chromosome X. C'est la première cause héréditaire de déficience intellectuelle, plus fréquente et plus sévère chez le garçon, qui n'a pas de second X compensateur."}, {"q": "Le syndrome d’alcoolisme fœtal est lié :", "o": ["À une anomalie génétique", "À une carence en fer", "À un facteur tératogène", "À une infection virale", "À un excès de glucose"], "r": 2, "e": "L'alcool est le tératogène le mieux établi de la grossesse : il traverse le placenta et provoque dysmorphie faciale, retard de croissance et atteinte du système nerveux central. Aucun seuil de consommation n'est reconnu comme sûr."}, {"q": "Le principe céphalo-caudal signifie que le développement se fait :", "o": ["Du bas vers le haut", "Du centre vers la périphérie", "De la tête vers la queue", "Des extrémités vers le tronc", "De façon aléatoire"], "r": 2, "e": "Le développement progresse de la tête vers le bas : le contrôle de la tête précède celui du tronc, puis de la marche. Le principe proximo-distal, complémentaire, va du centre vers les extrémités."}, {"q": "Le principe proximal-distal décrit un développement :", "o": ["De la tête vers les pieds", "Du centre du corps vers les extrémités", "Des mains vers les bras", "Du bas vers le haut", "Uniquement moteur"], "r": 1, "e": "Le principe proximo-distal décrit une maturation du centre du corps vers la périphérie : le contrôle de l'épaule et du bras précède celui de la main, puis des doigts. D'où la préhension palmaire avant la pince fine."}, {"q": "Un score d’Apgar inférieur à 7 indique que le nouveau-né :", "o": ["Est en excellente santé", "Présente une anomalie génétique", "A besoin d’aide pour respirer", "Est prématuré", "Présente un trouble cognitif"], "r": 2, "e": "Le score d'Apgar évalue à 1 et 5 minutes fréquence cardiaque, respiration, tonus, réactivité et coloration. En dessous de 7, le nouveau-né nécessite une assistance, le plus souvent respiratoire ; ce n'est ni un diagnostic génétique ni un pronostic cognitif."}, {"q": "L’échelle NBAS (Brazelton) permet principalement :", "o": ["De mesurer le QI futur", "D’évaluer uniquement les réflexes", "D’évaluer l’organisation neurocomportementale du nouveau-né", "De diagnostiquer les trisomies", "De mesurer la croissance"], "r": 2, "e": "L'échelle de Brazelton évalue le fonctionnement neurocomportemental du nouveau-né : réflexes, mais aussi états de vigilance, capacité d'autorégulation et d'interaction. Elle ne prédit pas le QI."}, {"q": "Les erreurs génétiques se distinguent des facteurs tératogènes parce qu'elles :", "o": ["Surviennent à la conception et ne peuvent être modifiées", "Agissent uniquement au troisième trimestre", "Dépendent du mode de vie de la mère", "Sont toujours réversibles"], "r": 0, "e": "Les tératogènes, eux, peuvent affecter le développement à tout moment à partir de la fécondation. C'est cette différence de temporalité qui fonde toute la prévention prénatale."}, {"q": "Combien de types d'anomalies chromosomiques ont été identifiés selon le cours ?", "o": ["Moins de 10", "Environ 25", "Plus de 50", "Plus de 500"], "r": 2, "e": "Elles se caractérisent toutes par une absence ou un excès de matériel chromosomique. La plus fréquente est la trisomie 21."}, {"q": "Le syndrome de Down se caractérise notamment par :", "o": ["Un visage long et fin avec un menton pointu", "Un visage aplati et des yeux légèrement bridés", "De longs bras et des testicules peu développés", "Une petite taille avec un cou palmé"], "r": 1, "e": "S'y ajoutent parfois des problèmes cardiaques et cognitifs. Le visage long au menton pointu correspond à l'X fragile, les longs bras au syndrome de Klinefelter."}, {"q": "Le syndrome de Klinefelter se caractérise par :", "o": ["Des garçons présentant de longs bras, des testicules peu développés et des troubles fréquents du langage et de l'apprentissage", "Un développement féminin avec un seul chromosome X", "Un développement féminin avec trois X", "Une rupture du chromosome X"], "r": 0, "e": "C'est la plus courante des anomalies des chromosomes sexuels. Le caryotype XO correspond au syndrome de Turner, XXX au triple X, XYY au syndrome plus rare du même nom."}, {"q": "Le caryotype XO correspond au syndrome de :", "o": ["Klinefelter", "Turner, avec un développement féminin", "Down", "X fragile"], "r": 1, "e": "Il se caractérise par la présence d'un seul chromosome X. Le triple X, XXX, donne également un développement féminin ; XXY et XYY donnent un développement masculin."}, {"q": "Le syndrome de l'X fragile doit son nom au fait que :", "o": ["Le chromosome X est absent", "Le chromosome X a tendance à se rompre à l'endroit de la mutation", "Il ne touche que les filles", "Il n'est pas héréditaire"], "r": 1, "e": "Il est héréditaire et associe des traits faciaux distinctifs — visage long et fin, menton pointu, grandes oreilles proéminentes — à des retards intellectuels et à un lien avec l'autisme."}, {"q": "Parmi ces affections, laquelle relève des anomalies génétiques uniques par gènes récessifs ?", "o": ["La trisomie 21", "Le syndrome de Turner", "La drépanocytose", "Le syndrome de Klinefelter"], "r": 2, "e": "Le cours cite également la dystrophie musculaire et la fibrose kystique, ou mucoviscidose. Ces affections ne relèvent pas d'anomalies du nombre de chromosomes mais d'un gène défectueux."}, {"q": "Parmi les maladies maternelles citées comme facteurs tératogènes figurent :", "o": ["La rubéole et le sida", "La grippe et l'angine", "L'hypertension et le diabète", "L'asthme et l'eczéma"], "r": 0, "e": "Le cours distingue trois catégories de tératogènes : les maladies de la mère, les médicaments et substances, et divers autres facteurs environnementaux ou nutritionnels."}, {"q": "Parmi les « autres facteurs » tératogènes, le cours mentionne :", "o": ["L'excès de vitamine A, le plomb et la carence en acide folique", "Les antibiotiques et les antalgiques", "Les vaccins", "L'exercice physique"], "r": 0, "e": "S'y ajoutent l'excès d'aspirine associé à l'acide benzoïque, la mauvaise alimentation et le stress. La carence en acide folique justifie la supplémentation recommandée avant et en début de grossesse."}, {"q": "Le principe céphalo-caudal explique pourquoi :", "o": ["Les doigts se développent avant les bras", "La tête du bébé est disproportionnée, le cerveau se développant très rapidement avant la naissance", "Les jambes se développent avant le tronc", "Le développement va du centre vers l'extérieur"], "r": 1, "e": "À un an, le cerveau représente environ 70 % du poids adulte, contre 10 à 20 % pour le reste du corps. La tête devient proportionnellement plus petite à mesure que l'enfant grandit."}, {"q": "Une conséquence pratique du principe céphalo-caudal est que les bébés :", "o": ["Marchent avant de saisir des objets", "Voient et utilisent leurs mains avant de ramper ou de marcher", "Contrôlent leurs pieds avant leur tête", "Développent d'abord les doigts"], "r": 1, "e": "Le contrôle descend progressivement le long de l'axe du corps : tête, puis tronc, puis membres inférieurs. C'est ce qui donne son ordre à l'acquisition de la motricité."}, {"q": "Selon le principe proximo-distal, l'ordre de développement in utero est :", "o": ["Doigts, mains, bras, tronc", "Tête et tronc, puis bras et jambes, puis mains et pieds, enfin doigts et orteils", "Mains, tronc, tête", "Pieds, jambes, tronc"], "r": 1, "e": "Le développement va du centre du corps vers la périphérie. C'est le même principe qui explique, après la naissance, la préhension palmaire avant la pince fine."}, {"q": "Le score d'Apgar est évalué :", "o": ["Une seule fois, à la naissance", "À 1 minute et à 5 minutes après l'accouchement", "Toutes les heures pendant 24 h", "Au bout d'une semaine"], "r": 1, "e": "La double mesure permet d'apprécier non seulement l'état initial mais aussi la capacité d'adaptation du nouveau-né dans les premières minutes de vie."}, {"q": "L'acronyme Apgar correspond aux cinq critères :", "o": ["Apparence, Pouls, Grimace, Activité, Respiration", "Attention, Poids, Groupe, Âge, Réflexes", "Apparence, Poids, Glycémie, Activité, Rythme", "Audition, Pouls, Grimace, Alimentation, Respiration"], "r": 0, "e": "Soit la couleur, le rythme cardiaque, les réflexes, le tonus musculaire et la respiration. Chaque critère est coté de 0 à 2."}, {"q": "Un score d'Apgar inférieur à 4 signifie que le bébé :", "o": ["Est en excellente santé", "A besoin d'une aide pour respirer", "Doit être secouru", "Présente une anomalie génétique"], "r": 2, "e": "Trois seuils sont à retenir : 10 pour un nouveau-né en excellente santé, moins de 7 pour une aide respiratoire nécessaire, moins de 4 pour une réanimation."}, {"q": "L'échelle de Brazelton (NBAS) évalue notamment :", "o": ["Le quotient intellectuel futur", "L'organisation motrice, les réflexes, les changements d'état, l'attention et les capacités interactives", "Le poids et la taille", "Les anomalies chromosomiques"], "r": 1, "e": "Elle apprécie la sensibilité du nouveau-né à son environnement physique et social, identifie d'éventuels problèmes neurologiques et repère les signes d'instabilité du système nerveux."}, {"q": "Le poids moyen d'un nouveau-né est d'environ :", "o": ["2,5 kg", "3,4 kg", "4,5 kg", "5 kg"], "r": 1, "e": "La plage normale s'étend de 2,5 à 4,5 kg pour 95 % des nouveau-nés. La longueur moyenne est de 50 cm, dans une plage de 45 à 55 cm."}, {"q": "Parmi les six états de conscience du nouveau-né, l'état « vigilant » se caractérise par :", "o": ["Des yeux fermés et une respiration régulière", "Des yeux ouverts, une respiration régulière et des mouvements calmes", "Des yeux ouverts et des mouvements amples sans pleurs", "Une alternance d'ouverture et de fermeture des yeux"], "r": 1, "e": "C'est l'état le plus favorable aux interactions et aux apprentissages. L'état actif comporte des mouvements amples, et la somnolence une alternance des yeux ouverts et fermés."}, {"q": "Le sommeil profond du nouveau-né se reconnaît à :", "o": ["Une respiration irrégulière et de petits mouvements", "Des yeux fermés, une respiration régulière et une absence de mouvements", "Des yeux ouverts et calmes", "Des pleurs intermittents"], "r": 1, "e": "Le sommeil léger, dit irrégulier, s'accompagne au contraire d'une respiration irrégulière et de petits mouvements occasionnels."}, {"q": "Le réflexe de Moro est déclenché par :", "o": ["Une caresse de la paume", "Un déplacement brusque ou un bruit fort", "Une caresse de la plante du pied", "Le contact avec la joue"], "r": 1, "e": "Le bébé étend jambes, bras et doigts, se cambre et rejette la tête en arrière. Il apparaît au 7ᵉ mois de gestation et disparaît vers 3 mois."}, {"q": "Le réflexe darwinien, ou grasping, consiste à :", "o": ["Fermer le poing avec force au point de pouvoir être soulevé, en réponse à une caresse de la paume", "Écarter les orteils en éventail", "Tourner la tête vers la joue stimulée", "Ouvrir la bouche et fermer les yeux"], "r": 0, "e": "Il apparaît dès le 7ᵉ mois de gestation et disparaît vers 4 mois. Son nom évoque son origine phylogénétique : s'accrocher au pelage maternel."}, {"q": "Le réflexe tonique du cou est aussi appelé :", "o": ["Réflexe de Babkin", "Réflexe de l'escrimeur", "Réflexe de Babinski", "Réflexe des points cardinaux"], "r": 1, "e": "Couché sur le dos, le bébé tourne la tête, étend les membres du côté vers lequel il regarde et fléchit ceux du côté opposé — d'où l'image de la position d'escrime. Il disparaît vers 5 mois."}, {"q": "Le réflexe de Babinski se caractérise par :", "o": ["Une fermeture du poing", "Un écartement des orteils en éventail après caresse de la plante du pied", "Des mouvements de succion", "Une extension des bras"], "r": 1, "e": "Présent dès la naissance, il disparaît vers 4 mois. Sa réapparition chez l'adulte est un signe d'atteinte du faisceau pyramidal."}, {"q": "Le réflexe de succion disparaît normalement vers :", "o": ["3 mois", "4 mois", "9 mois", "18 mois"], "r": 2, "e": "C'est le plus tardif des réflexes archaïques listés, ce qui se comprend au regard de sa fonction nutritive. La plupart des autres s'éteignent entre 3 et 5 mois."}, {"q": "Le réflexe de marche automatique est déclenché lorsque le bébé est :", "o": ["Couché sur le dos", "Soutenu sous les bras, pieds nus sur une surface plane", "Placé dans l'eau face vers le bas", "Stimulé à la plante du pied"], "r": 1, "e": "Il apparaît vers 1 mois et disparaît vers 4 mois, bien avant la marche véritable. Le réflexe de nage, dans les mêmes délais, s'observe face dans l'eau."}, {"q": "Le réflexe de Babkin consiste, après caresse des deux paumes, à :", "o": ["Fermer les poings", "Ouvrir la bouche, fermer les yeux et fléchir le cou", "Écarter les orteils", "Tourner la tête"], "r": 1, "e": "Présent dès la naissance, il disparaît vers 3 mois. Il illustre la coordination initiale entre main et bouche, utile à l'alimentation."}, {"q": "La disparition normale des réflexes archaïques constitue :", "o": ["Un signe pathologique", "Un témoin de la maturation du système nerveux", "Une perte de compétence", "Un effet de l'apprentissage"], "r": 1, "e": "Leur persistance au-delà des délais attendus, comme leur absence initiale, sont au contraire des signes d'alerte neurologique. C'est pourquoi on les recherche systématiquement."}, {"q": "Le réflexe des points cardinaux apparaît :", "o": ["À la naissance", "Au 7ᵉ mois de gestation", "À 1 mois", "À 3 mois"], "r": 1, "e": "Comme les réflexes de Moro, darwinien et tonique du cou, il est déjà présent in utero. Il disparaît vers 4 mois."}, {"q": "Le syndrome d'alcoolisme fœtal relève de la catégorie :", "o": ["Des erreurs génétiques", "Des facteurs tératogènes, dans la sous-catégorie des médicaments et substances", "Des anomalies chromosomiques", "Des complications de l'accouchement"], "r": 1, "e": "Le cours range l'alcool aux côtés du tabac et de la cocaïne. Contrairement aux erreurs génétiques, ce risque est entièrement évitable."}, {"q": "Le cours précise que le développement prénatal se déroule :", "o": ["Le plus souvent dans des conditions normales, même si des problèmes peuvent survenir", "Presque toujours avec des complications", "Indépendamment de l'environnement maternel", "Sans aucun risque identifié"], "r": 0, "e": "Cette précision équilibre le propos : le chapitre détaille les anomalies, mais celles-ci restent minoritaires au regard du nombre de grossesses."}, {"q": "À un an, le cerveau représente environ quelle proportion de son poids adulte ?", "o": ["30 %", "50 %", "70 %", "90 %"], "r": 2, "e": "Cette croissance très précoce illustre le principe céphalo-caudal : le développement commence par le haut et par le système nerveux, le reste du corps suivant beaucoup plus lentement."}, {"q": "L'échelle de Brazelton se distingue de l'échelle d'Apgar parce qu'elle :", "o": ["Se limite aux réflexes", "Évalue l'organisation neurocomportementale et la capacité d'interaction, au-delà de l'adaptation immédiate à la naissance", "Est réalisée avant l'accouchement", "Mesure le poids et la taille"], "r": 1, "e": "Apgar évalue en quelques secondes l'adaptation vitale ; Brazelton explore plus longuement la façon dont le nouveau-né régule ses états et entre en relation."}, {"q": "La longueur moyenne d'un nouveau-né est d'environ :", "o": ["45 cm", "50 cm", "55 cm", "60 cm"], "r": 1, "e": "La plage normale couvrant 95 % des nouveau-nés s'étend de 45 à 55 cm, pour un poids moyen de 3,4 kg."}, {"q": "Le réflexe de nage est observé lorsque le nouveau-né est :", "o": ["Soutenu sous les bras au-dessus d'une surface plane", "Placé dans l'eau, face vers le bas", "Couché sur le dos", "Stimulé à la paume"], "r": 1, "e": "Il produit alors des mouvements de nage coordonnés. Comme la marche automatique, il apparaît vers 1 mois et s'éteint vers 4 mois."}, {"q": "Un score d'Apgar de 10 signifie que le nouveau-né :", "o": ["Nécessite une réanimation", "Est en excellente santé", "A besoin d'aide pour respirer", "Présente un trouble neurologique"], "r": 1, "e": "Les cinq critères sont alors tous cotés au maximum. En dessous de 7, une aide respiratoire est nécessaire ; en dessous de 4, une réanimation s'impose."}, {"q": "Parmi les substances tératogènes citées, on trouve :", "o": ["Le tabac, l'alcool et la cocaïne", "Le fer et le calcium", "Les probiotiques", "L'acide folique"], "r": 0, "e": "L'acide folique est au contraire protecteur : c'est sa carence qui figure parmi les facteurs de risque, aux côtés d'une mauvaise alimentation et du stress."}, {"q": "L'anomalie des chromosomes sexuels la plus courante est :", "o": ["Le syndrome de Turner", "Le syndrome de Klinefelter", "Le syndrome XYY", "Le triple X"], "r": 1, "e": "Le cours le signale explicitement. Le syndrome XYY est décrit comme plus rare, avec un développement masculin."}, {"q": "Le syndrome de l'X fragile est associé :", "o": ["À des problèmes cardiaques exclusivement", "À des retards intellectuels et à un lien avec l'autisme", "À une petite taille isolée", "À une surdité congénitale"], "r": 1, "e": "Il s'accompagne de traits faciaux distinctifs : visage long et fin, menton pointu et grandes oreilles proéminentes. Son caractère héréditaire le distingue des anomalies chromosomiques de nombre."}, {"q": "L'état de conscience « actif » du nouveau-né se caractérise par :", "o": ["Des yeux ouverts et des mouvements amples, sans pleurs", "Des yeux fermés et l'absence de mouvement", "Des pleurs continus", "Une respiration irrégulière avec les yeux fermés"], "r": 0, "e": "Il se distingue de l'état vigilant, où les mouvements restent calmes, et de l'état de pleurs, où les mouvements amples s'accompagnent de vocalisations."}, {"q": "La somnolence, chez le nouveau-né, se manifeste par :", "o": ["Une respiration parfaitement régulière", "Des yeux alternativement ouverts et fermés avec une respiration irrégulière", "Une absence totale de mouvement", "Des pleurs intermittents"], "r": 1, "e": "C'est un état de transition entre le sommeil et l'éveil. Repérer ces six états permet d'adapter le moment des soins et des interactions au nourrisson."}]};</script>
