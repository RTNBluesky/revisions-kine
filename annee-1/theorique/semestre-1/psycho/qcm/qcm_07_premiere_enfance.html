<script>window.QUIZ={"titre": "QCM", "fiche": "../fiches/fiche_08_premiere_enfance.html", "questions": [{"q": "Le sens le plus mature à la naissance est :", "o": ["La vision", "L’audition", "L’odorat", "Le toucher", "Le goût"], "r": 3, "e": "Le toucher est fonctionnel dès la vie intra-utérine et sert de premier canal de relation : réflexes des points cardinaux, peau à peau, apaisement. La vision est au contraire le sens le plus immature à la naissance."}, {"q": "Le réflexe des points cardinaux est déclenché par :", "o": ["Un stimulus auditif", "Une stimulation visuelle", "Une caresse de la joue", "Une odeur familière", "Un changement de posture"], "r": 2, "e": "Une caresse sur la joue ou au coin des lèvres fait tourner la tête du nouveau-né du côté stimulé, bouche ouverte : ce réflexe archaïque oriente vers le sein et disparaît vers 3-4 mois."}, {"q": "Les saveurs consommées par la mère pendant la grossesse peuvent être transmises au fœtus via :", "o": ["Le sang placentaire uniquement", "Le lait maternel", "Le liquide amniotique", "La salive", "Le cordon ombilical après la naissance"], "r": 2, "e": "Les arômes de l'alimentation maternelle passent dans le liquide amniotique, que le fœtus déglutit. Cette familiarisation précoce influence les préférences alimentaires après la naissance, et se poursuit dans le lait maternel."}, {"q": "La vision est le sens le moins développé à la naissance principalement parce que :", "o": ["Les yeux sont fermés", "Les structures rétiniennes sont immatures", "Les bébés ne prêtent pas attention aux stimuli", "Le cortex visuel est absent", "La vision est apprise socialement"], "r": 1, "e": "À la naissance, la fovéa, la myélinisation des voies optiques et le cortex visuel sont immatures : l'acuité est d'environ 1/20 et la mise au point ne se fait nettement qu'à 20-30 cm — la distance du visage maternel."}, {"q": "La vision binoculaire apparaît généralement vers :", "o": ["La naissance", "2 semaines", "2 mois", "4–5 mois", "12 mois"], "r": 3, "e": "La vision binoculaire, qui permet la perception fine de la profondeur par disparité rétinienne, s'installe vers 4-5 mois, avec la maturation des voies visuelles corticales."}, {"q": "Les bébés préfèrent visuellement :", "o": ["Les lignes droites aux courbes", "Les stimuli asymétriques", "Les objets statiques", "Les motifs complexes", "Les surfaces uniformes"], "r": 3, "e": "Les travaux de Fantz montrent une préférence pour les stimuli complexes, contrastés et structurés — au premier rang desquels le visage humain — plutôt que pour les surfaces uniformes."}, {"q": "Selon Frantz, le stimulus visuel qui obtient la plus grande préférence est :", "o": ["Le disque lisse", "Le contraste noir/blanc", "Le visage", "Les lignes droites", "Les formes géométriques simples"], "r": 2, "e": "Dans les travaux de Fantz, le visage humain — ou un schéma organisé de visage — recueille la plus longue fixation, avant même les damiers contrastés. La préférence est précoce et sert l'attachement."}, {"q": "La reconnaissance individuelle des visages apparaît généralement :", "o": ["À la naissance", "Entre 2 et 4 semaines", "Entre 6 et 9 semaines", "Vers 6 mois", "Après 1 an"], "r": 2, "e": "Le nourrisson distingue le visage de sa mère de celui d'une inconnue dès les premières semaines, en s'appuyant d'abord sur le contour, la voix et l'odeur."}, {"q": "L’expérience de la « falaise visuelle » (Gibson &amp; Walk) montre que les bébés :", "o": ["N’ont aucune perception de la profondeur", "Apprennent la profondeur uniquement par l’expérience", "Évitent la profondeur même en présence de leur mère", "Tombent systématiquement", "Dépendent exclusivement de la vision"], "r": 2, "e": "Sur la falaise visuelle, le bébé capable de ramper refuse de franchir le vide apparent, même appelé par sa mère : la perception de la profondeur est donc en place, liée à l'expérience de la locomotion."}, {"q": "Le langage télégraphique apparaît généralement vers :", "o": ["10 mois", "14 mois", "18 mois", "24 mois", "36 mois"], "r": 2, "e": "Vers 18-24 mois, l'enfant combine deux mots en supprimant les éléments grammaticaux : « papa parti », « encore lait ». Le sens passe, la syntaxe reste rudimentaire — d'où l'image du télégramme."}, {"q": "À quelle étape de la gestation toutes les parties du corps sont-elles sensibles au toucher ?", "o": ["20 semaines", "32 semaines", "36 semaines", "Dès la naissance seulement"], "r": 1, "e": "Le toucher est le premier sens à se développer et reste le plus mature durant les premiers mois. Sa sensibilité augmente encore au cours des cinq premiers jours de vie."}, {"q": "Des bébés allaités de 6 jours préfèrent l'odeur du sein de leur propre mère, alors que des bébés de 2 jours ne le font pas. Cela montre :", "o": ["Que l'odorat est inné et immuable", "Qu'une reconnaissance olfactive s'acquiert très rapidement par l'expérience", "Que l'odorat ne se développe qu'après un mois", "Que l'allaitement n'a aucun effet"], "r": 1, "e": "Le cours précise que les bébés nourris au biberon ne font pas cette distinction : c'est bien l'expérience répétée de l'allaitement qui construit la préférence."}, {"q": "La préférence innée des bébés pour les saveurs sucrées s'explique par :", "o": ["Un apprentissage postnatal", "Une valeur adaptative : le lait maternel est sucré et beaucoup de substances amères sont toxiques", "Une imitation des adultes", "Un conditionnement classique"], "r": 1, "e": "Le cours signale d'ailleurs que l'eau sucrée calme les pleurs. Cette préférence oriente vers ce qui nourrit et détourne de ce qui peut empoisonner."}, {"q": "Des bébés de moins de trois jours réagissent différemment à une histoire entendue in utero en :", "o": ["Tournant la tête", "Tétant davantage le sein qui en active l'enregistrement", "Fermant les yeux", "Pleurant"], "r": 1, "e": "Ce dispositif ingénieux utilise la succion comme réponse mesurable. Il démontre que l'audition fonctionne avant la naissance et laisse une trace mnésique."}, {"q": "Parmi les raisons de l'immaturité visuelle à la naissance, le cours cite :", "o": ["Des yeux plus petits, des structures rétiniennes incomplètes et un nerf optique non complètement développé", "Une absence de cristallin", "Des paupières soudées", "Une absence de cortex visuel"], "r": 0, "e": "Ces trois limitations anatomiques expliquent la faible acuité, les clignements face aux lumières vives et l'étroitesse initiale du champ visuel."}, {"q": "La vision périphérique du nouveau-né :", "o": ["Est identique à celle de l'adulte", "Est très étroite et double entre 2 et 10 semaines", "N'apparaît qu'à 6 mois", "Reste étroite toute la première année"], "r": 1, "e": "Le suivi d'objets en mouvement se développe également très vite dans les premiers mois, tout comme l'acuité visuelle au cours de la première année."}, {"q": "Parmi les couleurs, les bébés perçoivent en premier :", "o": ["Le bleu", "Les couleurs vibrantes comme le rouge", "Le vert", "Les nuances pastel"], "r": 1, "e": "Les fortes saturations et les contrastes marqués sont les premiers accessibles, ce qui explique le choix des jouets et des mobiles destinés aux nourrissons."}, {"q": "Parmi les préférences visuelles des bébés, le cours indique qu'ils préfèrent :", "o": ["Les motifs lisses aux motifs complexes", "Les objets bidimensionnels aux tridimensionnels", "Les lignes courbes aux lignes droites", "Les stimuli asymétriques aux symétriques"], "r": 2, "e": "La liste complète : complexe plutôt que lisse, tridimensionnel plutôt que plat, mobile plutôt que statique, très contrasté, courbe et symétrique."}, {"q": "Le visage humain concentre les préférences visuelles du nourrisson parce qu'il est :", "o": ["Uniquement familier", "Complexe, à motifs, symétrique, tridimensionnel, mobile et situé à distance idéale", "Toujours souriant", "De couleur vive"], "r": 1, "e": "Il réunit à lui seul toutes les caractéristiques préférées identifiées par Frantz, ce qui explique la préférence précoce et son utilité pour l'attachement."}, {"q": "La phase 1 de la perception du visage se caractérise par :", "o": ["Une reconnaissance individuelle des visages", "Une tendance réflexe et indiscriminée à se tourner vers les motifs ressemblant à des visages", "Une préférence pour les visages inconnus", "Une absence de réaction"], "r": 1, "e": "La phase 2, qui suit, porte sur la reconnaissance individuelle et l'attention aux caractéristiques internes. Elle se met en place entre la 6ᵉ et la 9ᵉ semaine."}, {"q": "Le dispositif de la falaise visuelle a été inventé par :", "o": ["Robert Frantz", "Eleanor Gibson", "Konrad Lorenz", "Harry Harlow"], "r": 1, "e": "Il comporte une moitié en damier solide et une moitié en verre laissant voir le damier plus bas. L'étude princeps est celle de Walk et Gibson en 1961."}, {"q": "Dans l'expérience de la falaise visuelle, les bébés de 6 à 14 mois :", "o": ["Traversent systématiquement la partie vitrée", "Évitent la « pente », même lorsque leur mère les appelle de l'autre côté", "Ne réagissent pas au dispositif", "Pleurent immédiatement"], "r": 1, "e": "Ce refus démontre que la perception de la profondeur est déjà en place. Elle est liée à l'expérience de la locomotion autonome."}, {"q": "Selon le test de Denver, entre 10 et 12 mois, l'enfant :", "o": ["S'assoit avec soutien", "Se met debout et marche en s'agrippant aux meubles", "Marche seul avec assurance", "Court et monte les escaliers"], "r": 1, "e": "La progression : lever la tête de 0 à 3 mois, se retourner et ramper de 4 à 6 mois, s'asseoir sans soutien de 7 à 9 mois, la marche autonome débutant entre 13 et 18 mois."}, {"q": "La maîtrise de la marche, la course et la montée des escaliers se situent selon le test de Denver entre :", "o": ["10 et 12 mois", "13 et 18 mois", "18 et 24 mois", "2 et 3 ans"], "r": 2, "e": "La marche seule commence entre 13 et 18 mois ; sa maîtrise et les acquisitions qui en découlent occupent la seconde moitié de la deuxième année."}, {"q": "À 9 mois, la manipulation d'objets se caractérise par :", "o": ["La simple tenue d'objets placés dans la main", "La préhension de petits objets en pinçant avec le pouce et le transfert d'une main à l'autre", "L'empilement de blocs", "La prise d'une cuillère dans la paume"], "r": 1, "e": "L'ordre suit le principe proximo-distal : tenir à 6 mois, pincer à 9 mois, prendre une cuillère en prise palmaire à 12 mois, empiler entre 13 et 18 mois."}, {"q": "Les pleurs du nourrisson constituent :", "o": ["Un simple réflexe sans signification", "Le mode de communication principal, dont les tonalités et intensités signalent faim, sommeil ou douleur", "Un signe de pathologie", "Un langage compréhensible par tous"], "r": 1, "e": "Le cours précise que les parents distinguent les types de pleurs, mais pas les étrangers. Cette discrimination s'acquiert par la familiarité quotidienne."}, {"q": "Le gazouillis apparaît :", "o": ["Dès la naissance", "Entre 6 semaines et 3 mois, avec des sons produits quand le bébé est content", "Vers 6 mois", "Vers 10 mois"], "r": 1, "e": "Entre 3 et 6 mois, l'enfant joue avec les sons : cris aigus, murmures, voyelles prolongées. Le babillage consonantique viendra ensuite."}, {"q": "Le babillage se caractérise par :", "o": ["Des sons gutturaux isolés", "Des sons consonantiques et vocaliques répétés, comme « ma-ma-ma », entre 6 et 10 mois", "Les premiers mots utilisés systématiquement", "Des phrases de deux mots"], "r": 1, "e": "Il est souvent pris pour les premiers mots. L'écholalie — la répétition de type « papapap » — en est une forme fréquente ; à 10 mois, l'enfant imite des sons sans les comprendre."}, {"q": "L'explosion lexicale, avec environ 200 mots, se situe vers :", "o": ["14 mois", "18 mois", "21 mois", "30 mois"], "r": 2, "e": "Repères du cours : premiers mots entre 10 et 14 mois, une vingtaine de mots à 18 mois, environ 200 à 21 mois. La progression n'est donc pas linéaire."}, {"q": "L'acquisition des règles grammaticales — articles, verbes — se situe selon le cours entre :", "o": ["10 et 14 mois", "18 et 21 mois", "24 et 30 mois", "3 et 4 ans"], "r": 2, "e": "À 3 ans, l'enfant parle déjà couramment. Le langage télégraphique, vers 18 mois, précède cette maîtrise grammaticale."}, {"q": "Selon le cours, les premiers mots désignent surtout :", "o": ["Des actions", "Des objets, des personnes et des animaux", "Des états", "Des fonctions"], "r": 1, "e": "L'ordre d'apparition suit ensuite les actions — « regarde, parti » —, les états — « rouge, beau, ça fait mal » — puis les fonctions — « encore, au revoir »."}, {"q": "L'étude de Stipek, Gralinski et Kopp (1990) sur le concept de soi a porté sur :", "o": ["123 mères d'enfants de 14 à 40 mois", "Des observations en laboratoire", "Des enfants d'âge scolaire", "Des jumeaux"], "r": 0, "e": "Elle a permis de dégager une séquence en trois temps : reconnaissance physique de soi, auto-évaluation et description, puis réaction émotionnelle aux mauvaises actions."}, {"q": "La reconnaissance de soi dans un miroir ou sur une photo apparaît entre :", "o": ["6 et 12 mois", "12 et 18 mois", "18 et 24 mois", "24 et 36 mois"], "r": 2, "e": "Elle marque l'émergence de la conscience de soi, condition des émotions auto-évaluatives comme la honte, la fierté ou la culpabilité."}, {"q": "Entre 19 et 30 mois, l'enfant commence à se décrire avec :", "o": ["Des termes uniquement descriptifs", "Des termes descriptifs comme grand ou petit, et évaluatifs comme bon ou beau", "Des termes abstraits", "Des comparaisons sociales élaborées"], "r": 1, "e": "C'est la deuxième étape de la séquence : l'enfant ne se reconnaît plus seulement, il se qualifie — et commence donc à se juger."}, {"q": "La troisième étape du concept de soi, la réaction émotionnelle aux mauvaises actions, constitue :", "o": ["Un signe de trouble du comportement", "Les bases de la compréhension morale", "Une simple imitation", "Un réflexe conditionné"], "r": 1, "e": "L'enfant est offensé par la réprobation et cesse son action. Cette sensibilité au jugement d'autrui précède l'intériorisation des normes."}, {"q": "La socialisation est définie dans le cours comme le processus par lequel les enfants :", "o": ["Apprennent à parler", "Développent habitudes, compétences, valeurs et motivations qui font d'eux des membres responsables d'une société", "Se séparent de leurs parents", "Acquièrent des réflexes"], "r": 1, "e": "L'internalisation en est l'aboutissement : l'enfant accepte les normes de comportement comme étant les siennes, et non plus comme des contraintes extérieures."}, {"q": "L'autorégulation se définit comme le contrôle de son propre comportement :", "o": ["Uniquement en présence d'un adulte", "Pour se conformer aux attentes d'un soignant, même en son absence", "Sans aucune influence sociale", "À partir de l'âge scolaire"], "r": 1, "e": "L'exemple de Katy, 2 ans, qui hésite devant la prise puis se dit « Non ! » à elle-même, condense les trois exigences : comprendre, contrôler ses émotions et se retenir physiquement."}, {"q": "Selon Erikson, la première enfance met en jeu :", "o": ["La confiance puis l'autonomie", "L'initiative puis la compétence", "L'identité", "L'intimité"], "r": 0, "e": "La confiance se construit par l'attachement et les relations affectives ; l'autonomie suppose un équilibre entre dépendance et autosuffisance."}, {"q": "La perception de la profondeur, d'après la falaise visuelle, s'acquiert :", "o": ["Très tôt, avant la fin de la première année", "Vers 2 ans", "À l'âge scolaire", "Uniquement par apprentissage explicite"], "r": 0, "e": "Les bébés testés avaient entre 6 et 14 mois et refusaient déjà de s'aventurer sur la partie vitrée, ce qui suppose une perception de la profondeur opérationnelle."}, {"q": "Les saveurs consommées par la mère atteignent le fœtus par :", "o": ["Le sang uniquement", "Le liquide amniotique, puis le lait maternel après la naissance", "La peau", "Le cordon ombilical après la naissance"], "r": 1, "e": "Cette continuité gustative, de la vie intra-utérine à l'allaitement, familiarise l'enfant avec l'alimentation de son milieu et influence ses préférences ultérieures."}, {"q": "La vision binoculaire, nécessaire à la perception de la profondeur et de la distance, apparaît :", "o": ["Dès la naissance", "Vers 2 mois", "Vers 4-5 mois", "Vers 1 an"], "r": 2, "e": "Elle suppose l'usage coordonné des deux yeux pour focaliser. Avant cet âge, le nourrisson dispose d'autres indices de profondeur, mais non de la disparité binoculaire."}, {"q": "Le langage télégraphique, vers 18 mois, se reconnaît à :", "o": ["L'emploi de phrases complètes", "Des phrases de deux mots supprimant les éléments grammaticaux, comme « poupée tomber »", "La répétition de syllabes", "L'usage correct des articles"], "r": 1, "e": "Le sens passe malgré l'absence de mots grammaticaux, d'où la comparaison avec un télégramme. La grammaire s'installera entre 24 et 30 mois."}, {"q": "Robert Frantz a montré que les bébés fixent plus longtemps :", "o": ["Les surfaces unies", "Les motifs complexes, le visage obtenant la plus grande préférence", "Les objets immobiles", "Les lignes droites"], "r": 1, "e": "Sa méthode consistait à mesurer le temps de fixation devant des stimuli présentés côte à côte, ce qui permet d'inférer une préférence chez un sujet qui ne parle pas."}, {"q": "L'écholalie observée pendant la période de babillage désigne :", "o": ["Le premier mot signifiant", "La répétition fréquente de syllabes, comme « papapap »", "Une phrase de deux mots", "Un trouble du langage à cet âge"], "r": 1, "e": "Elle est parfaitement normale dans cette phase prélinguistique. Vers 10 mois, l'enfant imite des sons entendus sans encore en comprendre le sens."}, {"q": "À 6 mois, la manipulation d'objets se limite à :", "o": ["Tenir les objets placés dans sa main", "Pincer de petits objets avec le pouce", "Empiler des blocs", "Utiliser une cuillère"], "r": 0, "e": "La préhension fine viendra à 9 mois avec la pince pouce-index. Cette progression illustre le principe proximo-distal, du centre du corps vers les extrémités."}, {"q": "Selon le test de Denver, entre 4 et 6 mois l'enfant :", "o": ["Marche seul", "Se retourne, s'assoit avec aide et rampe", "S'assoit sans soutien", "Se met debout"], "r": 1, "e": "Chaque tranche marque une étape : lever la tête de 0 à 3 mois, se retourner de 4 à 6, s'asseoir sans soutien de 7 à 9, se mettre debout de 10 à 12."}, {"q": "Le discours prélinguistique désigne :", "o": ["Les premiers mots", "La production de sons porteurs d'une signification émotionnelle, avant le langage proprement dit", "Les phrases de deux mots", "La lecture"], "r": 1, "e": "Il regroupe les pleurs, le gazouillis et le babillage. Ces productions communiquent sans utiliser le code linguistique."}, {"q": "L'internalisation, dans le processus de socialisation, correspond au moment où l'enfant :", "o": ["Obéit par crainte de la punition", "Accepte les normes de comportement comme étant les siennes", "Imite les adultes sans comprendre", "Refuse les règles"], "r": 1, "e": "C'est ce qui rend possible l'autorégulation : la norme continue d'agir même quand l'adulte n'est plus là pour la rappeler."}, {"q": "L'exemple de Katy et de la prise électrique illustre que l'autorégulation exige :", "o": ["Uniquement de la mémoire", "De comprendre cognitivement, de contrôler ses émotions et de se retenir physiquement", "Une punition antérieure sévère", "La présence continue d'un adulte"], "r": 1, "e": "Les trois composantes doivent être réunies simultanément, ce qui explique que l'autorégulation reste fragile et progressive à cet âge."}, {"q": "La reconnaissance individuelle des visages, phase 2 de la perception du visage, se produit :", "o": ["Dès la naissance", "Entre la 6ᵉ et la 9ᵉ semaine", "Vers 6 mois", "Vers 1 an"], "r": 1, "e": "Elle suppose une attention portée aux caractéristiques internes du visage, alors que la phase 1 ne reposait que sur la configuration globale."}]};</script>
