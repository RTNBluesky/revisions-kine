<script>window.QUIZ={"titre": "QCM", "fiche": "../fiches/fiche_10_emotionnel.html", "questions": [{"q": "Selon Scherer (2005), une émotion est avant tout :", "o": ["Un état affectif prolongé", "Un sentiment subjectif isolé", "Un épisode bref de processus synchronisés", "Une réaction purement physiologique", "Une construction linguistique"], "r": 2, "e": "Pour Scherer, l'émotion est un épisode bref au cours duquel plusieurs composantes — évaluation, physiologie, tendance à l'action, expression, sentiment — se synchronisent. Cela la distingue de l'humeur, plus longue et diffuse."}, {"q": "La composante motivationnelle d’une émotion correspond :", "o": ["Aux changements corporels", "À l’évaluation cognitive", "Aux tendances à l’action", "À l’expression faciale", "À l’état affectif de base"], "r": 2, "e": "La composante motivationnelle est la préparation à l'action : fuir dans la peur, s'approcher dans la colère. Elle se distingue de la composante physiologique, cognitive, expressive et du sentiment subjectif."}, {"q": "Dans le modèle du core affect , les états affectifs sont organisés selon :", "o": ["Trois dimensions", "Une hiérarchie de besoins", "Deux axes principaux", "Des catégories émotionnelles fixes", "Des émotions discrètes uniquement"], "r": 2, "e": "Le modèle circomplexe de Russell croise deux axes — valence et activation — sur lesquels se répartissent en cercle tous les états affectifs."}, {"q": "Les axes du core affect sont :", "o": ["Joie / tristesse", "Stress / détente", "Valence (agréable–désagréable) et activation", "Cognition / émotion", "Expression / régulation"], "r": 2, "e": "Le core affect de Russell organise les états affectifs sur deux dimensions continues : la valence (agréable-désagréable) et le niveau d'activation. Toute émotion s'y situe comme un point, plutôt que dans une catégorie fermée."}, {"q": "Les émotions sociales ou secondaires se caractérisent par :", "o": ["Une présence dès la naissance", "Une base exclusivement biologique", "Une apparition liée au développement social", "Une absence de valence", "Une fonction uniquement adaptative"], "r": 2, "e": "Les émotions secondaires émergent avec la conscience de soi et l'intériorisation des normes, entre 18 mois et 3 ans : elles supposent un regard social intériorisé."}, {"q": "La honte, la culpabilité et la fierté sont classées comme :", "o": ["Émotions primaires", "Émotions négatives uniquement", "Émotions morales", "États affectifs fondamentaux", "Réactions physiologiques"], "r": 2, "e": "Honte, culpabilité et fierté supposent une norme intériorisée et un jugement porté sur soi : ce sont des émotions auto-évaluatives, dites morales ou secondaires, absentes à la naissance."}, {"q": "Les display rules correspondent :", "o": ["À des règles biologiques universelles", "À des normes culturelles d’expression émotionnelle", "À des réflexes émotionnels", "À des stratégies automatiques", "À des réactions physiologiques"], "r": 1, "e": "Les display rules sont apprises et varient selon la culture, le genre et le contexte : sourire à un cadeau décevant, contenir ses larmes en public."}, {"q": "À partir de quel âge les enfants identifient correctement les expressions faciales de base ? :", "o": ["12 mois", "2 ans", "3 ans", "5 ans", "6 ans"], "r": 2, "e": "Vers 2 ans, l'enfant nomme et reconnaît correctement les expressions de base — joie, tristesse, colère, peur. La finesse et les émotions complexes viendront progressivement."}, {"q": "Selon Saarni (1999), la compétence émotionnelle :", "o": ["Est une capacité unique et globale", "Est indépendante de la compétence sociale", "Est un profil de compétences multiples", "Est acquise uniquement à l’adolescence", "Dépend exclusivement du langage"], "r": 2, "e": "Saarni décrit la compétence émotionnelle comme un ensemble de huit habiletés — conscience de ses émotions, décodage de celles d'autrui, vocabulaire émotionnel, empathie, gestion... — et non comme une aptitude unique."}, {"q": "La distanciation cognitive apparaît généralement :", "o": ["Avant 1 an", "Entre 1 et 3 ans", "Entre 3 et 5 ans", "À partir de 5 ans", "À l’adolescence"], "r": 3, "e": "La distanciation cognitive — se détacher de l'ici et maintenant pour évoquer l'absent, le passé, le futur — s'installe entre 3 et 5 ans, avec la fonction symbolique et le langage."}, {"q": "Le premier des trois aspects centraux de l'apprentissage émotionnel est :", "o": ["Contrôler l'expression manifeste", "La conscience de son propre état émotionnel", "Reconnaître les émotions chez les autres", "Réguler les émotions d'autrui"], "r": 1, "e": "Elle suppose d'apprendre quelles circonstances déclenchent quelle émotion, comment on la ressent, comment elle s'exprime et comment la nommer — ce qui exige une conscience de soi."}, {"q": "Le deuxième aspect, contrôler l'expression manifeste, repose sur le fait que :", "o": ["Toutes les sociétés ont des règles sur ce qui est acceptable", "Les émotions doivent être supprimées", "L'expression est purement innée", "Seule la colère est régulée"], "r": 0, "e": "Le cours précise que la colère doit être inhibée ou canalisée, mais que les expressions trop extériorisées de joie ou de fierté sont également découragées. Il s'agit de dissocier le ressenti de l'expression."}, {"q": "Reconnaître les émotions chez les autres consiste à :", "o": ["Deviner leurs pensées", "Lire les sentiments intérieurs à partir du comportement extérieur", "Les interroger directement", "Imiter leurs expressions"], "r": 1, "e": "Le cours donne deux exemples : un père silencieux à la bouche tournée vers le bas signale colère ou frustration ; une mère détendue autorise à chercher du réconfort."}, {"q": "Dans les six composantes de l'émotion (Parkinson, Fischer, Manstead, 2005), l'appraisal correspond à :", "o": ["L'événement déclencheur", "L'évaluation de l'événement — l'aimer ou non, le juger positif ou négatif", "Les changements physiologiques", "La régulation"], "r": 1, "e": "C'est la composante cognitive : ce n'est pas l'événement en soi qui émeut, mais le sens qu'on lui donne au regard de ses propres intérêts."}, {"q": "Les tendances à l'action, dans le modèle des six composantes, désignent :", "o": ["Les mouvements du visage", "Les pulsions qui poussent à agir d'une certaine manière", "Les changements cardiaques", "La verbalisation de l'émotion"], "r": 1, "e": "Crier ou sauter dans l'exemple de l'annonce d'un emploi. Elles se distinguent de l'expression proprement dite, qui est la manifestation visible : sourire, froncer les sourcils."}, {"q": "Dans l'exemple de l'annonce d'un emploi, la régulation consiste à :", "o": ["Évaluer positivement la nouvelle", "Se contrôler jusqu'à raccrocher, avant d'exploser de joie", "Ressentir une tachycardie", "Sourire"], "r": 1, "e": "La régulation peut porter sur les réactions, les expressions, les évaluations ou les événements eux-mêmes. Elle intervient ici entre le ressenti et son expression publique."}, {"q": "Selon Scherer (2005), une émotion est un épisode de modifications :", "o": ["Isolées et successives", "Interdépendantes et synchronisées dans la plupart des sous-systèmes de l'organisme", "Purement cognitives", "Strictement physiologiques"], "r": 1, "e": "Cette synchronisation est déclenchée par l'évaluation d'un événement jugé pertinent pour les intérêts de l'organisme. C'est la synchronisation qui distingue l'émotion de l'humeur."}, {"q": "Parmi les composantes de l'émotion selon Scherer, la composante « expression motrice » recouvre :", "o": ["Les tendances à l'action", "Les manifestations faciales et vocales", "L'expérience subjective", "L'évaluation cognitive"], "r": 1, "e": "Les cinq composantes sont : cognitive, neurophysiologique, motivationnelle, expression motrice et sentiment subjectif. Chacune correspond à un sous-système de l'organisme."}, {"q": "Le core affect se définit dans un espace bidimensionnel croisant :", "o": ["Agréabilité et activation", "Joie et tristesse", "Primaire et secondaire", "Conscience et inconscience"], "r": 0, "e": "Il englobe émotions, humeurs et états d'esprit. Le terme « affect » est plus général que celui d'émotion, qui suppose un épisode bref et synchronisé."}, {"q": "Selon Ekman, les émotions primaires ou basiques comprennent :", "o": ["La fierté, la honte et le mépris", "La peur, la colère, la surprise, la tristesse, la joie et le dégoût", "La gratitude et la haine", "L'embarras et la culpabilité"], "r": 1, "e": "Elles sont présentes dès les premières phases de la vie et signalent les besoins du bébé. Les émotions secondaires — fierté, honte, mépris, haine, gratitude — apparaissent avec le développement social."}, {"q": "Les émotions morales, ou auto-conscientes, se caractérisent par le fait d'être :", "o": ["Innées et universelles", "Ressenties par autoréflexion et auto-évaluation, liées à la conscience de soi", "Purement physiologiques", "Indépendantes du contexte social"], "r": 1, "e": "Honte, culpabilité, fierté et embarras supposent de se prendre soi-même pour objet d'évaluation, ce qui n'est possible qu'après l'émergence de la conscience de soi."}, {"q": "La fonction adaptative des émotions consiste à :", "o": ["Communiquer l'état émotionnel à autrui", "Préparer l'organisme à agir, en mobilisant énergie et comportements spécifiques", "Interpréter l'événement", "Faciliter le comportement prosocial"], "r": 1, "e": "Les trois fonctions sont adaptative, sociale — communiquer et informer le comportement d'autrui — et motivationnelle, qui facilite l'interprétation et la production de réponses alternatives."}, {"q": "Selon Wolff (1969), les pleurs de faim se caractérisent par :", "o": ["Une crise soudaine et intense", "Un caractère rythmique", "Deux ou trois longs cris", "Une variation rythmique"], "r": 1, "e": "Les quatre types : faim (rythmiques), colère (variation rythmique), douleur (crise soudaine intense) et frustration (deux ou trois longs cris)."}, {"q": "Les pleurs de douleur, selon Wolff, se reconnaissent à :", "o": ["Leur rythme régulier", "Une crise soudaine et intense", "Deux ou trois longs cris", "Une variation rythmique"], "r": 1, "e": "Cette soudaineté est ce qui alerte le plus fortement l'entourage, conformément à la fonction sociale des émotions : signaler un besoin urgent."}, {"q": "Les premiers sourires du nouveau-né apparaissent :", "o": ["À la 3ᵉ semaine, en état d'éveil", "Juste après la naissance, de façon spontanée en sommeil paradoxal", "Au 2ᵉ mois", "Au 4ᵉ mois"], "r": 1, "e": "Les premiers sourires en état d'éveil viennent à la 3ᵉ semaine, puis ils deviennent plus fréquents et sociaux vers 1 mois."}, {"q": "À quel âge le bébé sourit-il davantage aux visages connus ?", "o": ["Dès la naissance", "Au 2ᵉ mois", "Au 4ᵉ mois", "Au 8ᵉ mois"], "r": 1, "e": "Le rire aux éclats lors de chatouilles apparaît au 4ᵉ mois, et le rire déclenché par un jeu inattendu — la mère qui cache son visage — au 8ᵉ mois."}, {"q": "Nommer ce qu'il ressent permet à l'enfant de :", "o": ["Intensifier son émotion", "Prendre du recul, réfléchir et objectiver son état", "Éviter toute émotion", "Imiter les adultes"], "r": 1, "e": "C'est le rôle du langage dans le développement émotionnel. Au second semestre de la deuxième année, l'enfant emploie déjà des mots comme content, triste, en colère ou effrayé."}, {"q": "L'identification des expressions faciales émotionnelles est acquise vers :", "o": ["1 an", "2 ans", "3 ans", "6 ans"], "r": 2, "e": "À 6 ans, le vocabulaire émotionnel s'enrichit de nuances : ennuyé, inquiet, content, malheureux. La finesse progresse avec le langage et l'expérience relationnelle."}, {"q": "La display rule de « minimisation » consiste à :", "o": ["Amplifier l'expression d'une émotion positive", "Réduire l'intensité de l'expression par rapport au ressenti", "Adopter une expression neutre", "Remplacer une émotion par son opposée"], "r": 1, "e": "Les quatre normes sont la minimisation, la maximisation, la dissimulation — le visage impassible — et la substitution, qui remplace l'émotion par une autre, généralement opposée."}, {"q": "Sourire en recevant un cadeau qui ne plaît pas relève de la display rule de :", "o": ["Minimisation", "Maximisation", "Dissimulation", "Substitution"], "r": 3, "e": "L'expression affichée est l'opposé du ressenti. La maximisation, elle, consiste à amplifier une émotion positive réellement éprouvée, par exemple par un sourire plus enthousiaste."}, {"q": "Selon Saarni (1999), la compétence émotionnelle comporte :", "o": ["4 composantes", "6 composantes", "8 composantes", "12 composantes"], "r": 2, "e": "Elles vont de la conscience de son propre état à l'auto-efficacité émotionnelle, en passant par l'empathie, le vocabulaire émotionnel et la gestion des émotions douloureuses."}, {"q": "Parmi les composantes de Saarni figure la capacité à comprendre que :", "o": ["Toutes les émotions sont universelles", "Les états intérieurs ne correspondent pas nécessairement aux expressions extérieures", "Les émotions sont innées", "L'expression émotionnelle est identique dans toutes les cultures"], "r": 1, "e": "Cette compétence vaut pour soi comme pour autrui : elle permet de comprendre les display rules et d'éviter de prendre toute expression pour un reflet fidèle du ressenti."}, {"q": "L'auto-efficacité émotionnelle, chez Saarni, désigne :", "o": ["La capacité à supprimer ses émotions", "Le sentiment de contrôler ses expériences émotionnelles et de les accepter", "L'aptitude à influencer les autres", "La reconnaissance des expressions faciales"], "r": 1, "e": "Les deux termes comptent : contrôler et accepter. Il ne s'agit pas de maîtriser au sens de supprimer, mais de se sentir capable de composer avec ce que l'on éprouve."}, {"q": "Le cours souligne que la compétence émotionnelle est étroitement liée à :", "o": ["L'intelligence logique", "La compétence sociale", "La motricité", "La mémoire"], "r": 1, "e": "Saarni note d'ailleurs que les relations se définissent par la manière dont les émotions y sont communiquées et par leur réciprocité."}, {"q": "Entre 0 et 1 an, les premières autorégulations émotionnelles observées sont :", "o": ["Le langage et la réflexion", "Mettre le pouce dans la bouche et détourner le regard", "Les jeux de rôle", "La distanciation cognitive"], "r": 1, "e": "À cet âge, les bébés restent largement dépendants des adultes et crient pour les appeler. Ces premières stratégies sont corporelles et attentionnelles."}, {"q": "Entre 1 et 3 ans, la marche permet à l'enfant de :", "o": ["Verbaliser ses émotions", "Se retirer physiquement des situations indésirables", "Adopter une attitude abstraite", "Réguler les émotions des autres"], "r": 1, "e": "Il recherche aussi les adultes pour se rassurer et commence à utiliser les jeux de rôle comme moyen d'expression et de mise à distance."}, {"q": "Entre 3 et 5 ans, l'enfant devient capable de :", "o": ["Utiliser le langage et la réflexion pour évaluer ses émotions, et de les masquer ou minimiser", "Uniquement crier pour appeler l'adulte", "Réguler les émotions d'autrui", "Adopter une attitude entièrement abstraite"], "r": 0, "e": "La capacité de masquer suppose de distinguer ressenti et expression, ce qui correspond aux display rules. La régulation des émotions d'autrui vient après 5 ans."}, {"q": "La stratégie d'autorégulation par redirection de l'attention apparaît vers :", "o": ["3 mois", "1 an", "2 ans", "5 ans"], "r": 0, "e": "Détourner le regard est la toute première stratégie disponible. L'auto-apaisement — sucer son doigt, se balancer — apparaît vers 1 an."}, {"q": "La stratégie du « faire semblant », qui permet d'exprimer une émotion en toute sécurité par le jeu, apparaît entre :", "o": ["6 mois et 1 an", "1 et 2 ans", "2 et 3 ans", "5 et 7 ans"], "r": 2, "e": "Elle suppose la pensée symbolique. L'évitement physique, qui consiste à quitter les lieux, apparaît un peu avant, au début de la deuxième année."}, {"q": "La distanciation cognitive, comme stratégie d'autorégulation, apparaît :", "o": ["Vers 1 an", "Vers 3 ans", "À partir de 5 ans", "Dès 3 mois"], "r": 2, "e": "Comme la conceptualisation, qui consiste à verbaliser des idées abstraites, elle suppose une conscience de soi portant sur sa propre manière de gérer ses émotions."}, {"q": "Selon Goleman (1998), l'intelligence émotionnelle comporte cinq composantes dont :", "o": ["La conscience de soi, l'autorégulation, la motivation, l'empathie et les compétences sociales", "La perception, l'attention, la mémoire, le langage et le raisonnement", "L'identification, l'utilisation, la connaissance et la régulation", "La minimisation, la maximisation, la dissimulation et la substitution"], "r": 0, "e": "Le modèle en quatre compétences — identifier, utiliser, connaître et réguler les émotions — est celui de Mayer et Salovey (1997)."}, {"q": "Pour Mayer et Salovey (1997), « utiliser les émotions » signifie :", "o": ["Les exprimer librement", "S'en servir pour faciliter la réflexion", "Les supprimer", "Les communiquer aux autres"], "r": 1, "e": "Leur définition présente l'intelligence émotionnelle comme la capacité de percevoir, d'accéder et de générer des émotions qui aident la pensée, de les comprendre et de les réguler."}, {"q": "L'émotion, selon le cours, n'est pas un état ni un sentiment mais :", "o": ["Une humeur durable", "Un épisode bref de changements synchronisés dans l'esprit et le corps", "Une réaction purement physiologique", "Une construction linguistique"], "r": 1, "e": "C'est ce qui la distingue de l'humeur, plus longue et plus diffuse, et du core affect, qui désigne un état affectif de fond."}, {"q": "La fonction sociale des émotions consiste principalement à :", "o": ["Mobiliser l'énergie de l'organisme", "Communiquer l'état émotionnel et informer le comportement des autres, facilitant l'interaction et le comportement prosocial", "Interpréter l'événement", "Produire des réponses alternatives"], "r": 1, "e": "Une expression émotionnelle n'est pas seulement une décharge : c'est un signal adressé, qui oriente la conduite de ceux qui le perçoivent."}, {"q": "L'auto-apaisement — sucer son doigt, se balancer — apparaît comme stratégie de régulation vers :", "o": ["3 mois", "1 an", "2 ans", "3 ans"], "r": 1, "e": "La recherche d'un adulte et le recours à l'objet transitionnel apparaissent un peu plus tôt, dans la seconde moitié de la première année."}, {"q": "Après 5 ans, l'enfant devient capable de :", "o": ["Détourner simplement le regard", "Adopter une attitude abstraite vis-à-vis des émotions et de réguler aussi celles des autres", "Utiliser uniquement le jeu de rôle", "Dépendre entièrement de l'adulte"], "r": 1, "e": "Il peut se demander explicitement comment calmer sa peur. Cette réflexivité ouvre la voie à l'accompagnement émotionnel d'autrui."}, {"q": "La stratégie de « suppression » comme autorégulation émotionnelle consiste à :", "o": ["Nier l'existence de l'émotion", "Éloigner ses pensées de la cause de l'émotion", "Exprimer l'émotion par le jeu", "Verbaliser des idées abstraites"], "r": 1, "e": "Elle apparaît entre 3 et 5 ans, en même temps que le contrôle verbal. Ce sont les deux premières stratégies proprement mentales."}, {"q": "Les émotions secondaires ou sociales ont pour fonction principale de :", "o": ["Signaler les besoins physiologiques du bébé", "Faciliter l'interaction et le comportement social", "Préparer la fuite", "Réguler la température corporelle"], "r": 1, "e": "Fierté, honte, mépris, haine et gratitude supposent la référence à autrui et à des normes partagées, ce qui explique leur apparition plus tardive."}, {"q": "La display rule de « dissimulation » consiste à :", "o": ["Atténuer l'intensité de l'expression", "Adopter une expression neutre, un visage impassible", "Amplifier une émotion positive", "Afficher l'émotion opposée"], "r": 1, "e": "À la différence de la minimisation, qui réduit l'expression, la dissimulation la supprime entièrement au profit d'une neutralité affichée."}, {"q": "Selon le modèle des six composantes, la composante « causes » indique que les émotions sont :", "o": ["Spontanées et sans objet", "Liées à des événements ou à des objets", "Purement internes", "Indépendantes du contexte"], "r": 1, "e": "Une émotion porte toujours sur quelque chose. C'est cette intentionnalité qui la distingue d'une humeur, dont l'objet est souvent indéterminé."}]};</script>
