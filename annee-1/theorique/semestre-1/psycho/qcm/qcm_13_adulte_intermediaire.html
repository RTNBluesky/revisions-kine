<div class="quiz-head"><p>50 questions à choix multiple. Mode révision : correction immédiate. Mode examen : correction et score à la fin.</p><div class="bar"><i></i></div><p style="margin-top:8px" id="compteur"></p></div><div id="quiz"></div>

<script>window.QUIZ={"titre": "QCM", "fiche": "../fiches/fiche_14_adulte_intermediaire.html", "questions": [{"q": "Au moyen âge, la majorité des individus se caractérise par :", "o": ["Un déclin généralisé et rapide", "Une détérioration cognitive majeure", "Un fonctionnement globalement satisfaisant malgré des changements", "Une perte systématique d’autonomie", "Une baisse uniforme des performances"], "r": 2, "e": "L'âge moyen s'accompagne de changements réels (presbytie, baisse de force, ménopause) sans effondrement : le fonctionnement quotidien reste globalement satisfaisant et l'expertise professionnelle est souvent à son sommet."}, {"q": "La presbytie correspond à :", "o": ["Une perte auditive liée à l’âge", "Une perte de vision de loin", "Une diminution de la capacité à focaliser de près", "Une pathologie oculaire congénitale", "Une perte totale d’acuité visuelle"], "r": 2, "e": "La presbytie vient de la perte d'élasticité du cristallin, qui ne peut plus bomber pour accommoder de près. D'où le geste caractéristique d'éloigner son texte, dès la quarantaine."}, {"q": "Les personnes d’âge moyen ont besoin de plus de lumière principalement en raison :", "o": ["D’une atteinte de la rétine", "De modifications de la pupille", "D’une baisse du cortex visuel", "D’un ralentissement cognitif", "D’une fatigue oculaire chronique"], "r": 1, "e": "Avec l'âge, la pupille se rétrécit et réagit moins (myosis sénile) : moins de lumière atteint la rétine. D'où le besoin d'un éclairage nettement plus intense, avant même toute pathologie rétinienne."}, {"q": "La presbyacousie se caractérise par :", "o": ["Une perte auditive brutale", "Une atteinte des sons graves", "Une perte auditive progressive liée à l’âge", "Une perte auditive uniquement professionnelle", "Une atteinte égale chez les femmes et les hommes"], "r": 2, "e": "La presbyacousie est une perte progressive, bilatérale et symétrique, prédominant sur les aigus, liée à la dégénérescence des cellules ciliées de la cochlée. Elle gêne surtout la compréhension de la parole en milieu bruyant."}, {"q": "Concernant la sensibilité à la douleur à l’âge mûr :", "o": ["Elle augmente systématiquement", "Elle disparaît complètement", "Elle diminue mais reste protectrice", "Elle est mieux tolérée", "Elle n’est pas modifiée"], "r": 2, "e": "La sensibilité à la douleur diminue légèrement avec l'âge, ce qui retarde parfois la perception d'une lésion, mais la fonction d'alerte demeure. C'est un point de vigilance en rééducation."}, {"q": "La diminution du taux métabolique basal débute généralement :", "o": ["À partir de 25 ans", "À partir de 30 ans", "À partir de 40 ans", "À partir de 50 ans", "Après 65 ans"], "r": 2, "e": "Le métabolisme de base décline d'environ 2 à 3 % par décennie à partir de la trentaine, en grande partie par perte de masse maigre. À apport alimentaire constant, cela suffit à expliquer une prise de poids progressive."}, {"q": "Chez les femmes, on considère que la ménopause est installée :", "o": ["Dès la fin de l’ovulation", "Dès l’apparition des symptômes", "Un an après les dernières règles", "À 45 ans systématiquement", "À la fin de la périménopause"], "r": 2, "e": "Le diagnostic de ménopause est rétrospectif : il se pose après douze mois consécutifs d'aménorrhée, en l'absence d'autre cause. L'âge moyen est d'environ 51 ans, mais la variabilité est large."}, {"q": "Le développement cognitif à l’âge adulte intermédiaire se caractérise par :", "o": ["Une perte globale et uniforme", "Un déclin brutal des capacités", "Des gains et des pertes selon les domaines", "Une stagnation cognitive", "Une supériorité systématique des jeunes adultes"], "r": 2, "e": "Le vieillissement cognitif n'est pas un effondrement : la vitesse de traitement et la mémoire de travail baissent, tandis que le vocabulaire, les connaissances spécialisées et l'expertise progressent. C'est le modèle des gains et pertes de Baltes."}, {"q": "La particularité majeure de la cognition adulte est :", "o": ["La vitesse de traitement", "La mémoire sensorielle", "Les connaissances spécialisées", "Le raisonnement abstrait pur", "La mémoire à court terme"], "r": 2, "e": "Le propre de la cognition adulte est l'expertise : un savoir organisé, spécifique à un domaine, qui compense la baisse de vitesse et rend l'expert souvent plus performant que le jeune adulte dans son propre champ."}, {"q": "Selon Erikson, le conflit psychosocial central du moyen âge est :", "o": ["Intimité vs isolement", "Identité vs confusion des rôles", "Générativité vs stagnation", "Autonomie vs honte", "Productivité vs infériorité"], "r": 2, "e": "Le 7ᵉ stade, Générativité vs stagnation, couvre l'âge moyen : transmettre, encadrer, produire quelque chose qui survivra à soi — ou s'enfermer dans la répétition et le repli."}, {"q": "Le cours décrit la vie adulte intermédiaire comme une période marquée par :", "o": ["Une uniformité des trajectoires", "De grandes différences individuelles liées aux choix antérieurs, aux expériences et à la génétique", "Un déclin généralisé", "Une absence de stress"], "r": 1, "e": "Certains courent un marathon quand d'autres sont essoufflés dans un escalier : à âge égal, l'écart entre individus est ici maximal."}, {"q": "Parmi les sources de stress et de rôles multiples à l'âge mûr, le cours cite :", "o": ["L'entreprise, le foyer, la famille, l'indépendance des enfants, les parents âgés et une nouvelle carrière", "Uniquement le travail", "Uniquement la famille", "La retraite"], "r": 0, "e": "C'est une période décrite comme mouvementée, où le sentiment de réussite et de contrôle coexiste avec une conscience plus réaliste des limites."}, {"q": "La vie adulte intermédiaire est présentée comme un moment :", "o": ["D'insouciance", "De bilan et de réévaluation des objectifs et aspirations", "De repli", "De désengagement social"], "r": 1, "e": "Le cours mentionne aussi la réalisation de rêves anciens et la poursuite de nouveaux objectifs : le bilan n'est pas nécessairement une clôture."}, {"q": "Parmi les cinq domaines de la vision affectés à l'âge mûr, le cours cite :", "o": ["La vision de près, la vision dynamique, la sensibilité à la lumière, la recherche visuelle et la vitesse de traitement visuel", "La vision des couleurs uniquement", "La vision nocturne uniquement", "Le champ visuel périphérique uniquement"], "r": 0, "e": "Le besoin de luminosité augmente d'environ un tiers. S'y ajoutent une légère perte d'acuité et l'apparition de la presbytie."}, {"q": "Le préfixe « presbi », dans presbytie et presbyacousie, signifie :", "o": ["Diminution", "Avec l'âge", "Perte totale", "Vision"], "r": 1, "e": "D'où deux affections distinctes mais de même origine : la presbytie touche la focalisation de près, la presbyacousie l'audition."}, {"q": "La presbyacousie à l'âge mûr s'accélère à partir de :", "o": ["40 ans", "50 ans", "60 ans", "65 ans"], "r": 1, "e": "Le cours précise que la perte est deux fois plus rapide chez les hommes et qu'elle est accélérée par l'exposition continue ou soudaine au bruit."}, {"q": "Concernant le goût et l'odorat à l'âge mûr, le cours indique que :", "o": ["Les hommes conservent ces sens plus longtemps", "Les femmes conservent ces sens plus longtemps", "Il n'y a aucune différence", "Ces sens ne changent pas"], "r": 1, "e": "La baisse de sensibilité gustative et olfactive est par ailleurs accentuée par la prise de médicaments, fréquente à cette période."}, {"q": "Concernant la douleur après 50 ans, le cours indique que :", "o": ["La sensibilité augmente et la tolérance aussi", "La sensibilité diminue, mais la tolérance diminue également", "La sensibilité et la tolérance restent inchangées", "Seule la tolérance augmente"], "r": 1, "e": "Cette double évolution est importante en rééducation : le signal d'alarme s'atténue alors même que la douleur, quand elle est perçue, est moins bien supportée."}, {"q": "La sensibilité tactile se modifie, selon le cours, à partir de :", "o": ["35 ans", "45 ans", "55 ans", "65 ans"], "r": 1, "e": "Elle s'inscrit dans un ensemble de changements sensoriels progressifs qui débutent dès la quarantaine et s'accentuent ensuite."}, {"q": "Le cours illustre la compensation de l'âge par l'expérience avec l'exemple :", "o": ["Des athlètes de haut niveau", "Des ouvriers qualifiés de 40-50 ans, plus productifs parce que consciencieux et attentifs", "Des étudiants", "Des enfants"], "r": 1, "e": "Il note par ailleurs que les capacités exercées résistent mieux : les athlètes voient leurs performances décliner moins vite que la population générale."}, {"q": "La capacité vitale, volume maximal inspiré et expiré, commence à diminuer dès :", "o": ["30 ans", "40 ans", "50 ans", "60 ans"], "r": 1, "e": "S'y ajoutent une perte de densité osseuse, des articulations plus raides, un affaiblissement de la régulation thermique et des réponses immunitaires, et un sommeil moins profond."}, {"q": "La ménopause est considérée comme installée :", "o": ["Dès l'arrêt des règles", "Un an après le dernier cycle", "Après cinq ans sans règles", "Dès l'apparition des bouffées de chaleur"], "r": 1, "e": "Chez 80 % des femmes, elle survient entre 45 et 55 ans, avec une moyenne d'environ 51 ans. La périménopause désigne la période de changements physiologiques qui la précède."}, {"q": "Chez l'homme, à l'âge mûr, le cours signale :", "o": ["Un arrêt complet de la production de spermatozoïdes", "Une diminution de la quantité de spermatozoïdes et de possibles dysfonctions érectiles", "Une infertilité systématique", "Une absence de changement"], "r": 1, "e": "Le cours souligne qu'une sexualité active peut se maintenir toute la vie, chez l'homme comme chez la femme."}, {"q": "Selon le cours, la rapidité de perception commence à diminuer dès :", "o": ["25 ans", "40 ans", "50 ans", "60 ans"], "r": 0, "e": "La capacité numérique décline, elle, à partir de 40 ans. Ces pertes coexistent avec des gains dans d'autres domaines : le développement cognitif y est irrégulier."}, {"q": "Les quatre compétences qui atteignent leur pic à l'âge moyen sont :", "o": ["Le raisonnement inductif, l'orientation spatiale, le vocabulaire et la mémoire verbale", "La vitesse de traitement, la mémoire de travail, l'attention et le calcul", "La créativité, l'imagination, l'intuition et l'empathie", "La force, l'endurance, la souplesse et la coordination"], "r": 0, "e": "Les femmes obtiennent des scores plus élevés qu'à 25 ans ; chez les hommes, le maximum se situe à 50 ans pour l'orientation spatiale, le vocabulaire et la mémoire verbale."}, {"q": "Les connaissances spécialisées sont présentées comme :", "o": ["Dépendantes de l'intelligence générale", "Un aspect distinctif de l'âge adulte, relativement indépendant de l'intelligence générale et du déclin cérébral", "Déclinantes avec l'âge", "Réservées aux professions intellectuelles"], "r": 1, "e": "Les adultes traitent l'information plus lentement, mais compensent dans leur domaine grâce au jugement issu de l'expérience. C'est le mécanisme de l'expertise."}, {"q": "La pensée post-formelle intégrative de l'adulte mûr consiste notamment à :", "o": ["Appliquer une logique stricte", "Intégrer logique, intuition et émotion, et concilier faits et idées contradictoires", "Refuser les informations nouvelles", "Séparer strictement raison et affect"], "r": 1, "e": "Elle suppose aussi d'intégrer les informations nouvelles à ce que l'on sait déjà, et de les interpréter selon leur signification personnelle."}, {"q": "Le septième stade d'Erikson oppose :", "o": ["Intimité et isolement", "Générativité et stagnation", "Intégrité et désespoir", "Identité et confusion"], "r": 1, "e": "L'adulte mature éprouve le besoin de guider la génération suivante et d'investir dans la société. La vertu associée est la sollicitude."}, {"q": "La théorie du « train social » désigne :", "o": ["Les transports quotidiens", "Les cercles d'amis proches et de famille sur lesquels on peut compter tout au long de la vie", "Les réseaux professionnels", "Les groupes de pairs de l'adolescence"], "r": 1, "e": "Leur composition varie — frères et sœurs à un moment, amis à un autre —, leur nombre diminue après 50 ans, et ils sont plus importants chez les femmes."}, {"q": "Selon Carstensen, l'interaction sociale poursuit trois objectifs dont :", "o": ["La source d'informations, le maintien du sentiment d'identité et le bien-être émotionnel", "La compétition, la hiérarchie et le pouvoir", "L'apprentissage, l'imitation et la conformité", "Le travail, la famille et les loisirs"], "r": 0, "e": "À l'âge moyen, la sélectivité augmente : on préfère la compagnie de groupes sociaux fiables, au détriment du nombre de contacts."}, {"q": "Le « syndrome de la porte tournante » désigne :", "o": ["Le départ des enfants du foyer", "Le retour des enfants adultes au domicile parental", "Les changements fréquents d'emploi", "Les allers-retours à l'hôpital"], "r": 1, "e": "Il s'oppose au syndrome du nid vide, qui correspond au départ des enfants. Les deux figurent parmi les défis psychosociaux de la période."}, {"q": "Parmi les défis psychosociaux de l'âge mûr, le cours cite :", "o": ["Devenir aidant de ses parents âgés et devenir grand-parent", "L'entrée dans la vie active", "La construction identitaire", "La scolarisation des enfants"], "r": 0, "e": "S'y ajoutent le divorce et le remariage, le nid vide et le syndrome de la porte tournante. C'est la position dite « sandwich », entre enfants et parents vieillissants."}, {"q": "Selon le cours, les relations avec les autres à l'âge mûr sont :", "o": ["Moins importantes qu'aux périodes précédentes", "Très importantes, contrairement aux périodes précédentes", "Sans effet sur le bien-être", "Limitées à la famille"], "r": 1, "e": "Ce constat prépare la théorie de la sélectivité socio-émotionnelle : on réduit le nombre de relations tout en augmentant l'investissement dans celles qu'on garde."}, {"q": "La stagnation, pôle négatif du septième stade, se manifeste par :", "o": ["Un investissement excessif dans le travail", "Un appauvrissement relationnel, de l'égoïsme et une focalisation sur le bien-être matériel", "Une perte de mémoire", "Un désengagement professionnel"], "r": 1, "e": "Elle s'oppose à la générativité, qui s'exprime par l'affirmation personnelle au travail et dans la famille et le souci des générations suivantes."}, {"q": "La perte auditive à l'âge mûr touche surtout :", "o": ["Les sons de faible intensité", "Les sons de forte intensité", "Les sons graves exclusivement", "La parole uniquement"], "r": 1, "e": "Le cours indique aussi que la perte est deux fois plus rapide chez les hommes, différence souvent attribuée aux expositions professionnelles."}, {"q": "Le taux métabolique basal commence à diminuer après :", "o": ["30 ans", "40 ans", "50 ans", "60 ans"], "r": 1, "e": "Cette baisse accompagne la perte musculaire progressive. À apport alimentaire constant, elle suffit à expliquer une prise de poids graduelle."}, {"q": "Le cours indique qu'à l'âge mûr, la plupart des personnes :", "o": ["Présentent un déclin généralisé", "Sont en bonne forme physique, cognitive et émotionnelle et se sentent bien dans leur vie", "Souffrent de maladies chroniques invalidantes", "Ont perdu leur autonomie"], "r": 1, "e": "Ce constat contredit le stéréotype d'un âge moyen vécu comme un déclin, et rappelle l'ampleur des différences individuelles à cette période."}, {"q": "La sélectivité socio-émotionnelle de Carstensen a été formulée :", "o": ["Dans les années 1960", "Entre 1991 et 1996", "Dans les années 2010", "Au XIXᵉ siècle"], "r": 1, "e": "Elle explique pourquoi la réduction du réseau social avec l'âge n'est pas un abandon subi mais un tri actif, orienté vers les relations les plus gratifiantes."}, {"q": "Concernant la myopie à l'âge mûr, le cours indique que son incidence :", "o": ["Diminue", "Est en hausse", "Reste stable", "Disparaît avec la presbytie"], "r": 1, "e": "Presbytie et myopie peuvent coexister, ce qui explique le recours fréquent aux verres progressifs à partir de la quarantaine."}, {"q": "Le nombre de personnes composant le « train social » diminue selon le cours après :", "o": ["40 ans", "50 ans", "60 ans", "70 ans"], "r": 1, "e": "Ce resserrement est plus marqué chez les hommes, le cours soulignant que ces cercles sont plus importants chez les femmes."}, {"q": "Selon le cours, les adultes d'âge mûr traitent l'information :", "o": ["Plus rapidement que les jeunes adultes", "Plus lentement, mais compensent dans leur domaine par le jugement issu de l'expérience", "À la même vitesse", "Sans aucune stratégie compensatoire"], "r": 1, "e": "C'est le mécanisme central de l'expertise : ce qui est perdu en vitesse de traitement est regagné en pertinence des schémas mobilisés."}, {"q": "Les besoins de luminosité supplémentaires à l'âge mûr sont estimés à environ :", "o": ["Un dixième de plus", "Un tiers de plus", "Le double", "Le triple"], "r": 1, "e": "Cette exigence résulte notamment du myosis sénile, le rétrécissement de la pupille, qui laisse passer moins de lumière jusqu'à la rétine."}, {"q": "Parmi les modifications cutanées et pileuses de l'âge mûr, le cours cite :", "o": ["Les rides, les cheveux blancs ou la perte de cheveux", "Une pigmentation uniforme", "Un épaississement de la peau", "Une repousse des cheveux"], "r": 0, "e": "Ces changements visibles accompagnent des modifications moins apparentes : perte de densité osseuse, raideur articulaire, baisse de la capacité vitale."}, {"q": "La périménopause désigne :", "o": ["La période suivant la ménopause", "La période préalable de changements physiologiques", "L'arrêt définitif des règles", "Une pathologie hormonale"], "r": 1, "e": "La ménopause n'est reconnue qu'un an après le dernier cycle : la périménopause couvre les mois ou années de transition qui la précèdent."}, {"q": "Les capacités dites « exercées » à l'âge mûr :", "o": ["Déclinent plus vite que les autres", "Résistent mieux au déclin, comme le montrent les athlètes", "Ne sont pas concernées par l'âge", "Disparaissent après 50 ans"], "r": 1, "e": "C'est un argument direct en faveur du maintien de l'activité physique : l'usage protège la fonction, et son abandon accélère la perte."}, {"q": "Le sommeil à l'âge mûr devient selon le cours :", "o": ["Plus profond", "Moins profond", "Plus long", "Inchangé"], "r": 1, "e": "Ce changement accompagne l'affaiblissement de la régulation thermique et des réponses immunitaires, tous liés à la maturation physiologique de la période."}, {"q": "Chez les femmes, les quatre compétences cognitives au pic de l'âge moyen obtiennent :", "o": ["Des scores plus faibles qu'à 25 ans", "Des scores plus élevés qu'à 25 ans", "Des scores identiques", "Des scores non mesurables"], "r": 1, "e": "Chez les hommes, le maximum est atteint à 50 ans pour l'orientation spatiale, le vocabulaire et la mémoire verbale."}, {"q": "Le cours qualifie le développement cognitif de l'âge mûr d'« irrégulier » parce qu'il :", "o": ["Est imprévisible", "Comporte des gains et des pertes selon les compétences", "Ne concerne que la mémoire", "S'arrête brutalement"], "r": 1, "e": "Rapidité de perception et capacité numérique déclinent tôt, tandis que raisonnement inductif, orientation spatiale, vocabulaire et mémoire verbale culminent."}, {"q": "La vertu associée au septième stade d'Erikson est :", "o": ["L'amour", "La sollicitude, c'est-à-dire prendre soin de l'autre", "La sagesse", "La fidélité"], "r": 1, "e": "Elle traduit le déplacement du souci de soi vers le souci de ce qui suivra : transmettre, encadrer, contribuer à la société."}, {"q": "Le « nid vide » désigne :", "o": ["Le retour des enfants au domicile", "Le départ des enfants du foyer", "L'absence de petits-enfants", "La perte des parents"], "r": 1, "e": "Il figure parmi les défis psychosociaux de l'âge mûr, aux côtés du syndrome de la porte tournante, du divorce, du rôle d'aidant et de l'accès au statut de grand-parent."}]};</script>
