<script>window.QUIZ={"titre": "QCM", "fiche": "../fiches/fiche_04_apprentissage.html", "questions": [{"q": "Selon la perspective de l’apprentissage, le développement est principalement :", "o": ["Discontinu et structuré en stades", "Le résultat de conflits internes", "Le produit de l’apprentissage basé sur l’expérience", "Déterminé par la maturation biologique", "Indépendant de l’environnement"], "r": 2, "e": "Les théories de l'apprentissage (behaviorisme et apprentissage social) décrivent un développement continu, produit de l'expérience et des interactions avec le milieu, sans stades universels."}, {"q": "Le behaviorisme considère que le facteur le plus influent dans le développement est :", "o": ["L’hérédité", "La conscience", "L’environnement", "Les émotions", "La génétique"], "r": 2, "e": "Pour Watson et Skinner, le développement est le produit des contingences de l'environnement : ce qui est renforcé se maintient. L'hérédité et la vie mentale y jouent un rôle minime ou inaccessible à la science."}, {"q": "Selon John B. Watson, la psychologie doit être :", "o": ["L’étude de la vie mentale", "L’étude de la conscience", "Une science objective du comportement observable", "Une science des représentations internes", "Une branche de la psychanalyse"], "r": 2, "e": "Pour Watson (1913), la psychologie doit rompre avec l'introspection et devenir une science naturelle objective, portant sur le comportement observable et ses déterminants environnementaux."}, {"q": "Le conditionnement classique permet principalement :", "o": ["D’augmenter la probabilité d’un comportement volontaire", "De créer de nouvelles réponses motrices", "D’établir des associations entre des stimuli", "De supprimer un comportement par punition", "De renforcer un comportement par récompense"], "r": 2, "e": "Le conditionnement classique crée une association entre deux stimuli, et fait ainsi apparaître une réponse déjà existante devant un signal nouveau. Il n'agit pas sur des comportements volontaires."}, {"q": "Dans le conditionnement classique, un stimulus neutre devient stimulus conditionné lorsqu’il :", "o": ["Est présenté seul sans réponse", "Est associé à un stimulus inconditionnel", "Est suivi d’une punition", "Provoque une réponse innée", "Est renforcé positivement"], "r": 1, "e": "Le stimulus neutre devient conditionné par appariement répété avec un stimulus inconditionnel : la cloche de Pavlov, associée à la nourriture, finit par déclencher seule la salivation."}, {"q": "L’expérience du « petit Albert » illustre principalement :", "o": ["Le conditionnement opérant", "L’apprentissage par imitation", "Le conditionnement classique de la peur", "L’extinction d’une réponse", "Le renforcement négatif"], "r": 2, "e": "Watson et Rayner ont associé un rat blanc (stimulus neutre) à un bruit violent, jusqu'à ce que le rat seul déclenche la peur. C'est un conditionnement classique, avec généralisation à d'autres objets pileux."}, {"q": "Selon Skinner, un comportement est maintenu lorsqu’il est :", "o": ["Observé chez autrui", "Associé à un stimulus neutre", "Renforcé", "Automatique", "Innée"], "r": 2, "e": "Pour Skinner, c'est la conséquence qui gouverne : un comportement suivi d'un renforcement se répète, un comportement non renforcé s'éteint."}, {"q": "Le renforcement négatif consiste à :", "o": ["Ajouter un stimulus désagréable", "Retirer un stimulus agréable", "Retirer un stimulus aversif", "Ignorer un comportement", "Punir un comportement"], "r": 2, "e": "Le renforcement négatif retire un stimulus désagréable et augmente donc le comportement : prendre un antalgique supprime la douleur, ce qui renforce la prise. Il ne faut pas le confondre avec la punition, qui diminue le comportement."}, {"q": "La théorie de l’apprentissage social se distingue du behaviorisme classique car elle :", "o": ["Rejette totalement l’environnement", "Nie toute forme de conditionnement", "Intègre les processus cognitifs", "Est fondée uniquement sur l’animal", "Repose uniquement sur la maturation"], "r": 2, "e": "Bandura réintroduit ce que le behaviorisme excluait : attention, mémorisation, anticipation des conséquences, sentiment d'efficacité personnelle. On parle d'ailleurs de théorie sociale cognitive."}, {"q": "Selon Bandura, l’enfant apprend principalement par :", "o": ["Essais-erreurs uniquement", "Renforcement direct", "Observation et imitation de modèles", "Punition", "Répétition mécanique"], "r": 2, "e": "L'expérience de la poupée Bobo montre que l'enfant reproduit un comportement simplement observé, sans avoir été renforcé. L'apprentissage vicariant met la cognition au cœur du processus."}, {"q": "Dans la perspective de l'apprentissage, le développement est conçu comme :", "o": ["Discontinu et organisé en stades", "Continu, et non par étapes", "Déterminé par la maturation biologique", "Imprévisible"], "r": 1, "e": "C'est l'une des oppositions les plus nettes avec Piaget ou Erikson : aucun palier qualitatif, mais une accumulation progressive d'apprentissages sous l'effet de l'environnement."}, {"q": "L'apprentissage est défini dans le cours comme :", "o": ["Un changement momentané du comportement", "Un changement à long terme du comportement fondé sur l'expérience ou l'adaptation à l'environnement", "Une maturation du système nerveux", "Une réorganisation cognitive"], "r": 1, "e": "Deux éléments comptent : la durabilité du changement et son origine dans l'expérience. Un changement passager ou dû à la seule maturation n'est pas un apprentissage."}, {"q": "Les deux grandes branches de la perspective de l'apprentissage sont :", "o": ["Le behaviorisme et la théorie de l'apprentissage social", "Le conditionnement classique et opérant", "Piaget et Vygotsky", "La psychanalyse et le cognitivisme"], "r": 0, "e": "Le behaviorisme se subdivise ensuite en conditionnement classique et opérant ; la théorie de l'apprentissage social, avec Bandura, y ajoute les processus cognitifs."}, {"q": "Le behaviorisme de Watson est qualifié de théorie :", "o": ["Organismique", "Mécaniste, décrivant le comportement comme une réponse prévisible à l'expérience", "Interactionniste", "Psychodynamique"], "r": 1, "e": "L'analogie est celle de la machine : à un stimulus donné correspond une réponse déterminée. C'est ce mécanisme que la psychologie objective doit décrire pour pouvoir prédire et contrôler."}, {"q": "La citation de Watson (1913) définit l'objectif de la psychologie comme :", "o": ["La compréhension de la conscience", "La prédiction et le contrôle du comportement", "L'exploration de l'inconscient", "La description des stades de développement"], "r": 1, "e": "Cette formule condense le programme behavioriste : une branche purement objective et expérimentale de la science naturelle, dont l'objet est le comportement observable."}, {"q": "La célèbre déclaration de Watson sur « une douzaine d'enfants sains » illustre :", "o": ["Une position modérée sur l'hérédité", "Une position radicalement environnementaliste dans le débat nature/environnement", "Un intérêt pour la maturation", "Une théorie des stades"], "r": 1, "e": "Il s'engage à faire de n'importe lequel d'entre eux un médecin, un avocat ou un voleur. Les modèles innés existent selon lui, mais sont peu importants au regard de l'expérience."}, {"q": "Dans l'expérience de Pavlov, avant conditionnement, la sonnette est :", "o": ["Un stimulus inconditionnel", "Un stimulus neutre", "Un stimulus conditionné", "Une réponse conditionnée"], "r": 1, "e": "Elle ne déclenche rien au départ. C'est son association répétée avec la nourriture — stimulus inconditionnel — qui en fait un stimulus conditionné, capable de déclencher seul la salivation."}, {"q": "Selon le cours, la capacité à acquérir des réponses conditionnées est d'autant plus grande que :", "o": ["L'organisme est jeune", "L'organisme est complexe", "Le stimulus est intense", "L'environnement est stable"], "r": 1, "e": "Cette remarque situe le conditionnement classique sur une échelle phylogénétique : c'est un mécanisme universel du vivant, mais dont la richesse croît avec la complexité de l'organisme."}, {"q": "L'exemple du père photographiant sa fille avec un flash montre qu'à 11 mois, l'enfant :", "o": ["Cligne des yeux avant le flash, ayant associé l'appareil à la lumière intense", "Ne réagit pas à l'appareil photo", "Imite le geste du père", "Manifeste une peur généralisée"], "r": 0, "e": "C'est un conditionnement classique de la vie quotidienne : l'appareil photo, stimulus initialement neutre, déclenche à lui seul la réponse de protection."}, {"q": "Dans l'expérience du petit Albert, la généralisation s'est manifestée par :", "o": ["Une peur limitée au rat blanc", "Une extension de la peur à d'autres objets blancs et poilus, comme un lapin ou un masque", "Une disparition rapide de la réponse", "Une peur des bruits intenses uniquement"], "r": 1, "e": "La généralisation est une propriété du conditionnement classique : la réponse s'étend à des stimuli proches du stimulus conditionné. Albert avait 11 mois au moment de l'expérience."}, {"q": "Le conditionnement opérant, selon Skinner, conduit le sujet à :", "o": ["Associer deux stimuli", "Répéter un comportement renforcé ou supprimer un comportement puni", "Imiter un modèle observé", "Réorganiser ses schémas mentaux"], "r": 1, "e": "Le conditionnement classique agit sur des réponses involontaires en associant des stimuli ; le conditionnement opérant agit sur des comportements volontaires par leurs conséquences."}, {"q": "Dans l'exemple de l'enfant qui sourit, le cours souligne qu'un comportement accidentel :", "o": ["Disparaît rapidement", "Devient une réponse conditionnée lorsqu'il produit un effet agréable", "Ne peut pas être renforcé", "Est toujours imité"], "r": 1, "e": "Le sourire initial n'était pas intentionnel ; l'attention des parents le sélectionne et le stabilise. C'est le mécanisme de base du façonnement des conduites."}, {"q": "Le renforcement positif consiste à :", "o": ["Ajouter une récompense, ce qui augmente la probabilité du comportement", "Supprimer un événement aversif", "Ajouter un événement désagréable", "Retirer un événement agréable"], "r": 0, "e": "Quatre mécanismes sont à distinguer : deux renforcements, qui augmentent le comportement, par ajout ou par retrait ; deux punitions, qui le diminuent, également par ajout ou par retrait."}, {"q": "Supprimer l'accès à la télévision après une bêtise correspond à :", "o": ["Un renforcement négatif", "Une punition par retrait d'un événement agréable", "Un renforcement positif", "Une punition par ajout"], "r": 1, "e": "L'effet visé est une diminution du comportement, donc une punition. Le retrait d'un agréable diminue ; le retrait d'un désagréable, lui, renforce — c'est le renforcement négatif."}, {"q": "Dans la cage de Skinner, les pigeons ont notamment appris à :", "o": ["Parler", "Identifier des cercles, faire des calculs, jouer du piano et monter des escaliers", "Résoudre des problèmes abstraits", "Imiter d'autres pigeons"], "r": 1, "e": "Chaque action correcte était suivie d'un renfort de nourriture. Ces démonstrations spectaculaires visaient à montrer l'étendue de ce que le seul renforcement permet de façonner."}, {"q": "L'expérience de Rovee-Collier avec des bébés de 2 à 6 mois et un mobile a démontré :", "o": ["L'existence d'un attachement précoce", "L'existence d'une mémoire précoce", "La permanence de l'objet", "L'apprentissage par imitation"], "r": 1, "e": "Conditionnés à bouger la jambe pour actionner le mobile, les bébés reproduisaient le mouvement des jours ou des semaines plus tard, même sans connexion — preuve qu'ils avaient retenu."}, {"q": "Bandura se démarque du behaviorisme classique en considérant que la personne est :", "o": ["Purement réactive", "Active et contribuant à son propre apprentissage", "Déterminée par l'hérédité", "Indifférente à son environnement"], "r": 1, "e": "Il ajoute que l'enfant agit sur son environnement et le crée en partie, notamment par le choix des modèles qu'il observe et des situations qu'il recherche."}, {"q": "La théorie de Bandura est aussi appelée socio-cognitive parce qu'elle :", "o": ["Concerne uniquement les interactions sociales", "Reconnaît des réponses cognitives en plus des réponses automatiques au renforcement", "Rejette tout apprentissage par renforcement", "Se limite à la cognition"], "r": 1, "e": "Elle constitue ainsi un pont entre l'apprentissage classique et la perspective cognitive : attention, organisation mentale et jugement interviennent entre le modèle et l'imitation."}, {"q": "L'apprentissage vicariant désigne :", "o": ["L'apprentissage par essais et erreurs", "L'acquisition de compétences par l'observation d'autrui", "L'apprentissage par conditionnement classique", "L'apprentissage par renforcement direct"], "r": 1, "e": "Son caractère décisif est que l'imitation peut survenir alors que le modèle n'est plus présent — et sans que l'apprenant ait été renforcé lui-même."}, {"q": "Selon Bandura, le choix des modèles dépend :", "o": ["Uniquement des caractéristiques du modèle", "Des caractéristiques du modèle, de l'enfant et de l'environnement", "Du hasard", "Du seul milieu familial"], "r": 1, "e": "Les enfants tendent à choisir des personnes de statut élevé ou des personnalités qui leur ressemblent. Le cours note que les enfants agressifs imitent des personnages agressifs."}, {"q": "L'apprentissage vicariant est présenté comme un élément clé pour :", "o": ["Apprendre une langue, des comportements moraux ou faire face à l'agressivité", "Développer la motricité fine uniquement", "Acquérir des réflexes", "Mémoriser des listes"], "r": 0, "e": "Ces trois domaines ont en commun d'être trop complexes pour s'acquérir par simple essai-erreur : l'observation d'autrui y raccourcit considérablement l'apprentissage."}, {"q": "L'exemple de l'élève de danse qui finit par développer son propre style illustre :", "o": ["Une imitation servile", "La formation de modèles mentaux servant à juger son propre comportement", "Un conditionnement opérant", "Une absence d'apprentissage"], "r": 1, "e": "Elle imite sa professeure, observe une élève plus avancée, puis synthétise ses observations. L'apprentissage social n'est pas une copie mais une recomposition."}, {"q": "Parmi les apports de la perspective de l'apprentissage, le cours cite :", "o": ["La rigueur empirique et les fondements des thérapies cognitivo-comportementales", "La prise en compte de la maturation", "L'explication de la créativité", "La description des stades"], "r": 0, "e": "S'y ajoutent un large pouvoir explicatif sur les comportements quotidiens et, avec Bandura, l'intégration entre cognition et environnement."}, {"q": "Parmi les limites de la perspective de l'apprentissage, le cours retient qu'elle :", "o": ["Ignore l'environnement", "Sous-estime la maturation, les processus internes et la créativité", "Est trop centrée sur les stades", "Néglige l'expérimentation"], "r": 1, "e": "La critique porte sur une vision parfois mécaniste : ce qui se passe entre le stimulus et la réponse, et ce qui relève de la maturation, y reste largement hors champ."}, {"q": "Le stimulus inconditionnel se définit comme celui qui :", "o": ["Ne déclenche rien au départ", "Déclenche naturellement la réponse, sans apprentissage préalable", "N'apparaît qu'après conditionnement", "Supprime la réponse conditionnée"], "r": 1, "e": "La nourriture chez le chien de Pavlov, le bruit intense chez le petit Albert : dans les deux cas, la réponse existe avant tout apprentissage."}, {"q": "Le renforcement négatif se distingue de la punition parce qu'il :", "o": ["Diminue le comportement", "Augmente le comportement, en supprimant un événement aversif", "Ajoute un événement désagréable", "N'a aucun effet"], "r": 1, "e": "La confusion est très fréquente. Arrêter un bruit intense quand le sujet appuie sur un levier augmente la fréquence de l'appui : c'est bien un renforcement, malgré le mot « négatif »."}, {"q": "Dire que les influences environnementales « contrôlent le comportement » constitue :", "o": ["La position de Bandura", "L'idée centrale de la perspective de l'apprentissage dans sa version behavioriste", "La thèse de Piaget", "Une critique du behaviorisme"], "r": 1, "e": "Bandura nuance précisément cette formule : la personne est aussi productrice de son environnement, ce qui introduit une réciprocité que le behaviorisme classique ignorait."}, {"q": "Watson est né en 1878 et mort en :", "o": ["1936", "1958", "1990", "2021"], "r": 1, "e": "Repères du cours : Pavlov 1849-1936, Watson 1878-1958, Skinner 1904-1990, Bandura 1925-2021. Cette succession recouvre plus d'un siècle de théories de l'apprentissage."}, {"q": "Dans l'expérience du petit Albert, le stimulus conditionné final est :", "o": ["Le bruit intense", "Le rat blanc", "Les pleurs", "La caresse"], "r": 1, "e": "Le rat, initialement neutre et même attrayant, devient capable de déclencher seul la peur après association répétée avec le bruit intense, qui est le stimulus inconditionnel."}, {"q": "La théorie de l'apprentissage social explique notamment l'acquisition des comportements moraux, parce que ceux-ci :", "o": ["Sont innés", "S'apprennent en observant ce que font les modèles, et pas seulement par renforcement direct", "Résultent de la maturation cérébrale", "Sont conditionnés classiquement"], "r": 1, "e": "L'enfant ne peut pas être renforcé pour chaque situation morale possible : c'est l'observation des conduites d'autrui et de leurs conséquences qui lui fournit ses repères."}, {"q": "La formule selon laquelle l'enfant « crée en quelque sorte son environnement » signifie que :", "o": ["Il vit dans l'imaginaire", "Par ses choix, ses réactions et les modèles qu'il sélectionne, il façonne le milieu qui le façonne en retour", "Il ignore son milieu réel", "Son environnement n'a pas d'influence"], "r": 1, "e": "C'est le principe de réciprocité de Bandura : personne, comportement et environnement s'influencent mutuellement, au lieu d'une causalité à sens unique."}, {"q": "Le conditionnement classique agit principalement sur des réponses :", "o": ["Volontaires", "Involontaires, déjà existantes dans le répertoire du sujet", "Nouvelles et complexes", "Apprises par observation"], "r": 1, "e": "Il ne crée pas de comportement nouveau : il fait apparaître une réponse existante devant un signal nouveau. C'est le conditionnement opérant qui façonne des conduites volontaires."}, {"q": "Pavlov a vécu de :", "o": ["1849 à 1936", "1878 à 1958", "1904 à 1990", "1925 à 2021"], "r": 0, "e": "Physiologiste russe, il découvre le conditionnement classique en étudiant la digestion chez le chien. Ses travaux précèdent et inspirent le behaviorisme de Watson."}, {"q": "Dans la phase de conditionnement chez Pavlov, on présente :", "o": ["La sonnette seule", "Le stimulus inconditionnel et le stimulus neutre associés de façon répétée", "La nourriture seule", "Deux stimuli neutres"], "r": 1, "e": "C'est la répétition de l'association qui fait basculer le stimulus neutre au statut de stimulus conditionné, capable ensuite de déclencher seul la réponse."}, {"q": "Une fessée correspond, dans la typologie de Skinner, à :", "o": ["Un renforcement positif", "Une punition par ajout d'un événement désagréable", "Un renforcement négatif", "Une punition par retrait"], "r": 1, "e": "L'objectif est de faire diminuer le comportement, ce qui en fait une punition ; et c'est un ajout d'aversif, non un retrait d'agréable."}, {"q": "Le fait que le petit Albert ait été conditionné à 11 mois soulève aujourd'hui :", "o": ["Un problème de reproductibilité statistique", "Une question éthique majeure, incompatible avec les exigences actuelles de consentement et de protection des participants", "Un doute sur l'existence du conditionnement", "Une question de financement"], "r": 1, "e": "Induire délibérément une phobie chez un nourrisson sans procédure de déconditionnement serait aujourd'hui impossible. L'expérience reste citée pour sa valeur historique et démonstrative."}, {"q": "Dans la perspective de l'apprentissage, ce qui distingue le plus nettement Bandura de Skinner est :", "o": ["Le refus du renforcement", "La place accordée aux processus cognitifs et à l'activité du sujet", "L'usage de l'expérimentation animale", "Le rejet de l'environnement"], "r": 1, "e": "Bandura ne nie pas le renforcement : il montre qu'un apprentissage peut avoir lieu sans renforcement direct, par simple observation, ce qui suppose des processus internes."}, {"q": "Le cours indique que la perspective de l'apprentissage a fourni les fondements :", "o": ["De la psychanalyse", "Des thérapies cognitivo-comportementales", "De la théorie des stades", "De l'approche ethnographique"], "r": 1, "e": "Exposition graduée, renforcement différentiel, modelage : les TCC transposent directement en clinique les principes issus du conditionnement et de l'apprentissage social."}, {"q": "Dire que le behaviorisme « sous-estime les processus internes » signifie qu'il :", "o": ["Ignore l'environnement", "Traite ce qui se passe entre le stimulus et la réponse comme une boîte noire", "Néglige les données observables", "Refuse l'expérimentation"], "r": 1, "e": "C'est un choix méthodologique assumé au départ — ne retenir que l'observable — devenu une limite théorique dès lors qu'on veut expliquer la pensée, le langage ou la créativité."}, {"q": "Le renforcement, qu'il soit positif ou négatif, a toujours pour effet :", "o": ["De diminuer la fréquence du comportement", "D'augmenter la fréquence du comportement", "De supprimer le comportement", "De le rendre involontaire"], "r": 1, "e": "C'est le critère qui permet de trancher sans se tromper : renforcement égale augmentation, punition égale diminution. Les mots positif et négatif ne désignent que l'ajout ou le retrait."}]};</script>
