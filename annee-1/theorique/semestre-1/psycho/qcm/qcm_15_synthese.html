<div class="quiz-head"><p>30 questions à choix multiple. Mode révision : correction immédiate. Mode examen : correction et score à la fin.</p><div class="bar"><i></i></div><p style="margin-top:8px" id="compteur"></p></div><div id="quiz"></div>

<script>window.QUIZ={"titre": "QCM", "fiche": "../fiches/fiche_15_adulte_tardive.html", "questions": [{"q": "Dire que le développement est multidimensionnel signifie qu’il :", "o": ["Suit des stades fixes", "Concerne uniquement la cognition", "Implique plusieurs domaines en interaction", "Est identique pour tous", "Dépend uniquement de l’âge"], "r": 2, "e": "Multidimensionnel signifie que le développement se joue simultanément sur plusieurs plans (physique, cognitif, psychosocial) qui s'influencent mutuellement : une puberté précoce a des effets cognitifs et sociaux."}, {"q": "Un changement qualitatif est typiquement observé lors :", "o": ["De l’augmentation du vocabulaire", "De la poussée de croissance pubertaire", "Du passage aux opérations concrètes", "De l’amélioration de la vitesse motrice", "De l’entraînement répétitif"], "r": 2, "e": "Le passage d'un stade piagétien à un autre change la nature même du raisonnement, pas seulement son rendement : c'est la définition du changement qualitatif."}, {"q": "Quelle approche insiste le plus sur le rôle des interactions sociales dans le développement cognitif ? :", "o": ["Piaget", "Skinner", "Vygotsky", "Freud", "Watson"], "r": 2, "e": "Pour Vygotsky, les fonctions psychiques supérieures apparaissent d'abord entre les personnes, puis s'intériorisent : le développement cognitif est d'abord social. Piaget insiste davantage sur l'action individuelle sur le milieu."}, {"q": "La Zone de Développement Proximal implique nécessairement :", "o": ["Une maturation biologique", "Une activité solitaire", "Une aide sociale adaptée", "Un renforcement positif", "Une capacité innée"], "r": 2, "e": "La ZDP n'existe que dans l'interaction : elle désigne ce que l'enfant peut réussir avec un étayage adapté. Sans aide sociale ajustée, il n'y a pas de zone proximale, seulement le niveau actuel."}, {"q": "Le conditionnement opérant explique principalement :", "o": ["L’acquisition du langage", "Les réponses émotionnelles innées", "Le maintien d’un comportement par ses conséquences", "Le raisonnement abstrait", "L’attachement"], "r": 2, "e": "Skinner décrit un comportement volontaire modelé par ses conséquences : renforcé, il augmente ; puni ou non renforcé, il diminue. Le conditionnement classique concerne, lui, des réponses involontaires."}, {"q": "Un bébé qui préfère les visages dès la naissance illustre surtout :", "o": ["Un apprentissage social tardif", "Une construction culturelle", "Une sensibilité perceptive précoce", "Un raisonnement symbolique", "Une imitation consciente"], "r": 2, "e": "Cette préférence n'exige ni apprentissage social élaboré ni symbolisation : elle témoigne d'une sensibilité perceptive précoce aux configurations organisées, qui prépare et facilite le lien."}, {"q": "La permanence de l’objet est un exemple de :", "o": ["Changement quantitatif", "Apprentissage conditionné", "Réorganisation cognitive", "Maturation émotionnelle", "Influence normative historique"], "r": 2, "e": "Comprendre que l'objet caché continue d'exister n'est pas un progrès de quantité : c'est une réorganisation de la représentation du monde, acquise vers 8-12 mois au stade sensori-moteur."}, {"q": "Les émotions secondaires apparaissent lorsque l’enfant développe :", "o": ["La motricité fine", "La conscience de soi", "Le langage articulé", "La mémoire implicite", "L’autorégulation physiologique"], "r": 1, "e": "Les émotions secondaires — honte, culpabilité, fierté, embarras — supposent de se représenter soi-même comme objet d'évaluation. Elles apparaissent vers 18-24 mois, avec la conscience de soi."}, {"q": "Les display rules montrent que l’expression émotionnelle est :", "o": ["Universelle et immuable", "Entièrement innée", "Socialement modulée", "Identique chez l’enfant et l’adulte", "Dépendante uniquement du tempérament"], "r": 2, "e": "Les display rules sont les règles culturelles qui indiquent quelle émotion montrer, à qui et avec quelle intensité. L'enfant les acquiert progressivement, ce qui prouve que l'expression émotionnelle est modulée socialement même si les émotions de base sont universelles."}, {"q": "L’agression instrumentale est surtout caractéristique :", "o": ["De l’adolescence", "De la troisième enfance", "De la deuxième enfance", "Du jeune adulte", "Du nourrisson"], "r": 2, "e": "L'agression instrumentale vise l'obtention d'un objet ou d'un privilège, sans intention de nuire : c'est la forme dominante à la deuxième enfance, autour du jouet convoité."}, {"q": "La logique concrète se distingue de la logique formelle car elle :", "o": ["Est illogique", "Repose sur l’intuition", "Nécessite des supports réels", "Ignore la réversibilité", "Est émotionnelle"], "r": 2, "e": "Aux opérations concrètes, l'enfant raisonne logiquement mais seulement sur des objets manipulables ou représentables. La logique formelle, à l'adolescence, se détache du support réel et opère sur des propositions et des hypothèses."}, {"q": "L’effet Pygmalion illustre principalement l’influence :", "o": ["Des pairs", "Des hormones", "Des attentes sociales", "De la génétique", "De la motivation intrinsèque"], "r": 2, "e": "L'effet Pygmalion montre le pouvoir des attentes d'autrui : celles de l'enseignant modifient ses interactions avec l'élève, qui finit par s'y conformer."}, {"q": "La fable personnelle à l’adolescence est associée à :", "o": ["Une faible estime de soi", "Une anxiété généralisée", "Un sentiment d’unicité et d’invulnérabilité", "Une maturité émotionnelle élevée", "Une conformité sociale"], "r": 2, "e": "La fable personnelle, décrite par Elkind, est la conviction d'être unique et à l'abri des conséquences qui frappent les autres. Elle éclaire une part des conduites à risque de l'adolescence."}, {"q": "Le conflit Identité vs confusion des rôles est central pour :", "o": ["L’enfance", "La deuxième enfance", "L’adolescence", "Le jeune adulte", "Le moyen âge"], "r": 2, "e": "C'est le 5ᵉ stade d'Erikson, propre à l'adolescence : l'exploration des rôles doit aboutir à une identité choisie plutôt qu'à une confusion ou à un engagement subi."}, {"q": "La pensée post-formelle se caractérise par :", "o": ["Une logique binaire stricte", "Une absence d’émotion", "L’intégration de contradictions", "Un raisonnement purement abstrait", "Une dépendance aux règles formelles"], "r": 2, "e": "Intégrer des contradictions sans les réduire — reconnaître que deux positions opposées peuvent avoir leur part de justesse — est la marque de la pensée post-formelle."}, {"q": "Selon Sternberg, résoudre efficacement un conflit professionnel mobilise surtout :", "o": ["L’intelligence analytique", "L’intelligence créative uniquement", "L’intelligence pratique", "La mémoire de travail", "Le raisonnement formel"], "r": 2, "e": "Gérer un conflit au travail relève de l'intelligence pratique : lire implicitement les règles du milieu et adapter sa conduite, compétence peu corrélée aux tests classiques de QI."}, {"q": "La générativité au moyen âge implique principalement :", "o": ["La réussite personnelle", "La stabilité émotionnelle", "Le souci des générations suivantes", "L’autonomie totale", "Le désengagement social"], "r": 2, "e": "La générativité, c'est le souci de transmettre et de contribuer à ce qui suivra : élever, former, créer, encadrer. Son échec donne la stagnation, repli sur soi et sentiment d'inutilité."}, {"q": "La théorie de la sélectivité socio-émotionnelle explique :", "o": ["L’isolement affectif des personnes âgées", "La perte de relations sociales", "La priorité donnée aux relations émotionnellement significatives", "Le retrait imposé par la société", "Le déclin cognitif"], "r": 2, "e": "Pour Carstensen, la perception d'un temps restant limité fait privilégier les relations émotionnellement gratifiantes au détriment des contacts nombreux. La réduction du réseau social est donc un choix, non un abandon subi."}, {"q": "La mémoire la plus vulnérable au vieillissement normal est :", "o": ["La mémoire procédurale", "La mémoire implicite", "La mémoire épisodique récente", "La mémoire sémantique", "La mémoire émotionnelle"], "r": 2, "e": "La mémoire épisodique récente — où ai-je posé mes clés, qu'ai-je fait hier — est la plus sensible au vieillissement normal, alors que la mémoire sémantique et procédurale résiste."}, {"q": "La sagesse selon Erikson correspond à :", "o": ["Une intelligence élevée", "Une absence de regrets", "Une acceptation du parcours de vie", "Une autonomie fonctionnelle", "Une mémoire intacte"], "r": 2, "e": "La sagesse naît de la résolution du conflit Intégrité vs désespoir : c'est le regard porté sur sa propre vie comme ayant eu un sens, avec ses réussites et ses manques. Elle ne se confond ni avec les performances intellectuelles ni avec l'absence de regrets."}, {"q": "Un facteur non normatif est :", "o": ["La puberté", "L’entrée à l’école", "Un accident grave individuel", "La retraite", "Le vieillissement"], "r": 2, "e": "Un facteur non normatif touche un individu à un moment inattendu : accident, décès précoce d'un parent, gain imprévu. La puberté et la retraite sont au contraire des influences normatives liées à l'âge."}, {"q": "L’approche éthologique met l’accent sur :", "o": ["Les conflits inconscients", "L’apprentissage scolaire", "L’adaptation biologique", "La construction sociale", "Le langage symbolique"], "r": 2, "e": "L'éthologie explique le comportement par sa valeur adaptative dans l'évolution de l'espèce, observée en milieu naturel : l'attachement y est un dispositif de survie."}, {"q": "L’attachement sécurisé favorise surtout :", "o": ["Une dépendance prolongée", "Une autonomie émotionnelle ultérieure", "Une agressivité accrue", "Une inhibition sociale", "Une rigidité comportementale"], "r": 1, "e": "L'enfant sécurisé utilise la figure d'attachement comme base de sécurité pour explorer ; cette confiance intériorisée soutient plus tard l'autonomie, la régulation émotionnelle et la qualité des relations."}, {"q": "Le discours privé chez l’enfant sert principalement à :", "o": ["Communiquer avec les autres", "Montrer un retard cognitif", "Réguler sa pensée et son action", "Exprimer des émotions", "Apprendre le vocabulaire"], "r": 2, "e": "Pour Vygotsky, le discours privé est un outil d'autorégulation : il guide l'action, surtout dans les tâches difficiles, avant de s'intérioriser en pensée verbale silencieuse."}, {"q": "La résilience correspond à :", "o": ["L’absence de stress", "Une invulnérabilité biologique", "Une adaptation positive malgré l’adversité", "Une réussite scolaire", "Une intelligence élevée"], "r": 2, "e": "La résilience n'est ni l'absence de stress ni une invulnérabilité : c'est une trajectoire d'adaptation positive malgré une adversité avérée, qui dépend de ressources individuelles et de l'entourage."}, {"q": "Le modèle SOC de Baltes illustre :", "o": ["Une perte inévitable des capacités", "Un vieillissement passif", "Des stratégies adaptatives actives", "Une compensation uniquement cognitive", "Une sélection sociale imposée"], "r": 2, "e": "Sélection, Optimisation, Compensation : le pianiste âgé réduit son répertoire (sélection), le travaille davantage (optimisation) et ralentit les passages précédents pour faire paraître rapides les suivants (compensation). Le vieillissement y est actif, non subi."}, {"q": "Un changement normatif lié à l’histoire serait :", "o": ["La marche", "La puberté", "Une guerre", "La ménopause", "Le langage"], "r": 2, "e": "Une influence normative liée à l'histoire touche toute une cohorte au même moment : guerre, pandémie, crise économique. La puberté et la ménopause sont des influences normatives liées à l'âge."}, {"q": "L’alphabétisation en santé implique :", "o": ["Un niveau scolaire élevé", "La compréhension passive de l’information", "La capacité à prendre des décisions éclairées", "Une expertise médicale", "Une prévention tertiaire"], "r": 2, "e": "L'alphabétisation en santé (health literacy) est la capacité à obtenir, comprendre et utiliser l'information de santé pour décider. Elle est active, et un haut niveau scolaire ne la garantit pas."}, {"q": "La différence majeure entre développement et apprentissage est que :", "o": ["L’apprentissage est inné", "Le développement est uniquement biologique", "Le développement inclut des changements et des stabilités", "Ils sont synonymes", "L’apprentissage est toujours conscient"], "r": 2, "e": "Le développement est plus large que l'apprentissage : il englobe maturation, apprentissages et périodes de stabilité, et se déploie sur toute la vie. L'apprentissage en est l'une des composantes."}, {"q": "Une approche biopsychosociale du développement implique :", "o": ["Une analyse centrée sur l’individu", "Une causalité unique", "L’interaction de facteurs biologiques, psychologiques et sociaux", "Une vision strictement médicale", "Une explication uniquement culturelle"], "r": 2, "e": "Le modèle biopsychosocial refuse la causalité unique : un même trouble s'explique par la conjonction de facteurs biologiques, psychologiques et sociaux. C'est le cadre de référence de la rééducation contemporaine."}]};</script>
