<div class="quiz-head"><p>50 questions à choix multiple. Mode révision : correction immédiate. Mode examen : correction et score à la fin.</p><div class="bar"><i></i></div><p style="margin-top:8px" id="compteur"></p></div><div id="quiz"></div>

<script>window.QUIZ={"titre": "QCM", "fiche": "../fiches/fiche_15_adulte_tardive.html", "questions": [{"q": "Au troisième âge, la majorité des personnes :", "o": ["Présente un déclin généralisé rapide", "Est en mauvaise santé mentale", "Reste en relativement bonne santé physique et mentale", "Perd toute autonomie fonctionnelle", "Développe systématiquement une démence"], "r": 2, "e": "Contrairement au stéréotype, la majorité des personnes âgées vit à domicile, de façon autonome et sans trouble cognitif majeur. La démence reste minoritaire et sa fréquence, même croissante avec l'âge, ne concerne pas la majorité."}, {"q": "La réserve organique correspond :", "o": ["À la capacité maximale de performance", "À la quantité d’énergie disponible au repos", "À la capacité des systèmes corporels à faire face au stress", "À la vitesse de récupération musculaire", "À la mémoire physiologique"], "r": 2, "e": "La réserve organique est la capacité supplémentaire que chaque organe peut mobiliser en cas de stress, au-delà du fonctionnement de base. Elle diminue avec l'âge, ce qui explique la fragilité des personnes âgées face à une agression banale."}, {"q": "La dégénérescence maculaire liée à l’âge affecte principalement :", "o": ["La vision périphérique", "L’audition", "Le centre de la rétine", "La perception des couleurs", "Les réflexes oculaires"], "r": 2, "e": "La DMLA détruit la macula, zone centrale de la rétine : la vision centrale, fine, se trouble alors que la vision périphérique est conservée. C'est la première cause de malvoyance après 50 ans dans les pays occidentaux."}, {"q": "Concernant l’audition au troisième âge :", "o": ["Les femmes perdent plus les sons aigus", "Les hommes perdent surtout les sons aigus", "Les pertes auditives sont rares", "Les pertes concernent uniquement la parole", "L’audition n’affecte pas la vie quotidienne"], "r": 1, "e": "La presbyacousie touche d'abord les fréquences aiguës et est en moyenne plus précoce et plus marquée chez l'homme, notamment du fait des expositions professionnelles au bruit."}, {"q": "La mémoire inverse des chiffres diminue davantage que la mémoire directe car elle sollicite :", "o": ["La mémoire sensorielle", "La mémoire procédurale", "La mémoire de travail active", "La mémoire implicite", "La mémoire sémantique"], "r": 2, "e": "Répéter des chiffres à l'envers oblige à maintenir l'information tout en la manipulant : c'est la mémoire de travail, particulièrement sensible au vieillissement. L'empan direct, simple stockage, résiste mieux."}, {"q": "La mémoire la plus résistante au vieillissement normal est :", "o": ["La mémoire épisodique", "La mémoire de travail", "La mémoire sémantique", "La mémoire implicite / procédurale", "La mémoire autobiographique récente"], "r": 3, "e": "La mémoire procédurale — savoir faire du vélo, jouer d'un instrument — est remarquablement préservée dans le vieillissement normal, et même longtemps dans la maladie d'Alzheimer. C'est un appui majeur en rééducation."}, {"q": "Selon Erikson, la question clé du dernier stade est :", "o": ["Puis-je aimer ?", "Suis-je utile ?", "Qui suis-je ?", "Cela valait-il la peine de vivre ?", "Puis-je encore changer ?"], "r": 3, "e": "Le dernier stade est un bilan : « ma vie a-t-elle valu la peine d'être vécue ? ». Y répondre positivement, c'est l'intégrité ; ne pas pouvoir, c'est le désespoir."}, {"q": "La vertu sociale associée au 8ᵉ stade d’Erikson est :", "o": ["L’amour", "La considération", "La fidélité", "La sagesse", "L’espérance"], "r": 3, "e": "Le 8ᵉ stade, Intégrité vs désespoir, donne la sagesse. L'amour correspond au 6ᵉ, la considération (sollicitude) au 7ᵉ, la fidélité au 5ᵉ, l'espérance au 1ᵉʳ."}, {"q": "La théorie du désengagement (Cumming &amp; Henry) soutient que :", "o": ["L’activité sociale doit être maintenue à tout prix", "Le retrait social est pathologique", "Le vieillissement réussi implique un éloignement progressif de la société", "Le désengagement est imposé par la société", "Elle nie toute capacité d’adaptation"], "r": 2, "e": "Proposée en 1961, cette théorie voit dans le retrait mutuel de l'individu et de la société un processus normal et fonctionnel. Elle a été largement contestée par la théorie de l'activité et par celle de la sélectivité socio-émotionnelle."}, {"q": "Le modèle SOC de Baltes signifie :", "o": ["Soutien – Organisation – Continuité", "Sélection – Optimisation – Compensation", "Socialisation – Objectifs – Cognition", "Santé – Organisation – Cognition", "Spécialisation – Observation – Compensation"], "r": 1, "e": "Sélection, Optimisation, Compensation : le modèle de Baltes décrit le vieillissement réussi comme une gestion active des ressources — restreindre ses objectifs, y consacrer plus de moyens, contourner les pertes."}, {"q": "La baisse de taille observée au troisième âge peut atteindre :", "o": ["Environ 1 cm chez les deux sexes", "Jusqu'à 2,54 cm chez l'homme et 5,08 cm chez la femme", "Plus de 10 cm", "Aucune baisse notable"], "r": 1, "e": "Elle résulte notamment du tassement des disques intervertébraux et de la perte de densité osseuse, plus marquée chez la femme après la ménopause."}, {"q": "La capacité de réserve, qui diminue au troisième âge, désigne :", "o": ["Les réserves financières", "La capacité d'aide permettant aux systèmes de fonctionner en période de stress", "La mémoire à long terme", "La masse musculaire"], "r": 1, "e": "Sa diminution explique pourquoi une agression banale — une infection, une canicule — peut déstabiliser une personne âgée qui allait bien jusque-là."}, {"q": "La cataracte se caractérise par :", "o": ["Une perte de la vision centrale", "Des zones opaques dans le cristallin, qui troublent la vision", "Une atteinte du nerf optique", "Une paralysie des muscles oculaires"], "r": 1, "e": "La dégénérescence maculaire liée à l'âge touche, elle, le centre de la rétine et fait perdre la capacité de distinguer les détails, jusqu'à la cécité fonctionnelle."}, {"q": "Quelle proportion de personnes âgées souffre de pertes auditives nuisant à la vie quotidienne ?", "o": ["Environ un dixième", "Environ un tiers", "Environ la moitié", "La quasi-totalité"], "r": 1, "e": "Le cours précise que les hommes perdent la sensibilité aux hautes fréquences, conformément au profil de la presbyacousie."}, {"q": "Concernant le goût au troisième âge, le cours indique une sensibilité :", "o": ["Plus grande aux saveurs sucrées", "Plus grande aux saveurs acides, salées et amères qu'aux saveurs sucrées", "Identique à celle du jeune adulte", "Totalement abolie"], "r": 1, "e": "Les femmes conservent mieux le goût et l'odorat. Ces modifications peuvent altérer l'appétit et exposer à la dénutrition."}, {"q": "La diminution de sensibilité des cellules réceptrices transmettant la position du corps entraîne principalement :", "o": ["Une perte auditive", "Un risque accru de chutes", "Une baisse de la vision", "Des troubles de la mémoire"], "r": 1, "e": "Elle s'ajoute au ralentissement des réflexes, à la perte de force et de résistance. Le cours souligne que ces changements peuvent être réversibles par l'exercice, la gymnastique aérobique ou le tai-chi."}, {"q": "Parmi les problèmes chroniques fréquents au troisième âge, le cours cite :", "o": ["L'arthrite, l'hypertension, les maladies cardiaques, les cataractes, le diabète et les maladies respiratoires", "Uniquement les démences", "Uniquement les troubles sensoriels", "Les maladies infectieuses aiguës"], "r": 0, "e": "Avoir une pathologie chronique n'équivaut pas à être dépendant : le cours rappelle que la plupart des personnes âgées restent en bonne santé physique et mentale."}, {"q": "Le terme « démence » désigne :", "o": ["Toute perte de mémoire", "Des déclins cognitifs et comportementaux d'origine physiologique, suffisants pour affecter la vie quotidienne", "Une maladie psychiatrique", "Un vieillissement normal"], "r": 1, "e": "Deux éléments sont décisifs : l'origine physiologique et le retentissement sur la vie quotidienne. C'est un terme générique qui recouvre plusieurs pathologies."}, {"q": "La maladie d'Alzheimer est décrite comme :", "o": ["Une altération cérébrale dégénérative et progressive, avec détérioration irréversible de la mémoire, de l'intelligence, de la conscience et du contrôle des fonctions corporelles", "Un trouble réversible de l'humeur", "Une atteinte principalement motrice", "Une conséquence normale de l'âge"], "r": 0, "e": "La maladie de Parkinson, elle, se manifeste par des tremblements, une rigidité, un ralentissement et une instabilité posturale — un tableau d'abord moteur."}, {"q": "Le cours souligne qu'à cet âge, la dépression :", "o": ["Est toujours facile à diagnostiquer", "Peut voir ses symptômes confondus avec les effets du vieillissement", "N'existe pas", "Ne concerne que les personnes isolées"], "r": 1, "e": "Ralentissement, fatigue, perte d'intérêt et troubles du sommeil peuvent être attribués à tort à l'âge, ce qui retarde la prise en charge d'un trouble pourtant accessible au traitement."}, {"q": "Selon certains auteurs, le déclin cognitif au troisième âge peut être lié :", "o": ["Uniquement à la génétique", "Au manque d'utilisation et au mode de vie", "Exclusivement à l'âge", "À l'alimentation seule"], "r": 1, "e": "Le cours mentionne qu'un programme d'exercice mental, d'entraînement, de pratique et de soutien social peut activer la capacité de réserve cognitive et prévenir le déclin."}, {"q": "Dans l'évaluation de la mémoire à court terme par répétition de chiffres :", "o": ["La version directe et la version inverse déclinent également", "La version directe reste relativement stable, tandis que la version inverse diminue", "Les deux restent stables", "Les deux s'améliorent"], "r": 1, "e": "L'empan inverse exige de manipuler l'information en mémoire active, et non de la stocker simplement. C'est cette manipulation qui est vulnérable au vieillissement."}, {"q": "Parmi les mémoires à long terme, celle qui se détériore considérablement avec l'âge est :", "o": ["La mémoire sémantique", "La mémoire épisodique, portant sur les événements récents", "La mémoire procédurale", "La mémoire implicite"], "r": 1, "e": "La mémoire sémantique — faits historiques, coutumes, signification des mots — est même meilleure chez les personnes âgées ; la mémoire procédurale résiste au vieillissement."}, {"q": "La sagesse est présentée dans le cours comme un domaine où les personnes âgées :", "o": ["Déclinent comme ailleurs", "Conservent et perfectionnent leurs connaissances, surtout celles ayant vécu certaines expériences", "N'ont aucun avantage", "Sont égales aux jeunes adultes"], "r": 1, "e": "C'est le versant gain du modèle des gains et pertes : ce que l'expérience apporte ne se laisse pas rattraper par la seule vitesse de traitement."}, {"q": "Le huitième stade d'Erikson commence, selon ce cours, à partir de :", "o": ["50 ans", "60 ans", "70 ans", "80 ans"], "r": 1, "e": "Il oppose intégrité et désespoir autour de la question « cela valait-il la peine de vivre ? ». La vertu associée est la sagesse."}, {"q": "Le moral des personnes âgées est positivement associé, selon le cours, à trois types d'activité religieuse :", "o": ["Organisée, informelle et spirituelle", "Publique, privée et collective", "Rituelle, morale et sociale", "Traditionnelle, moderne et mystique"], "r": 0, "e": "Fréquenter l'église, prier ou lire des textes, et l'engagement personnel. De meilleurs scores s'accompagnent de plus de satisfaction, de moins de solitude et d'une meilleure attitude vis-à-vis du vieillissement."}, {"q": "La théorie du désengagement de Cumming et Henry date de :", "o": ["1951", "1961", "1987", "1997"], "r": 1, "e": "Elle soutient qu'un vieillissement réussi passe par un éloignement mutuel entre la personne âgée et la société, avec une préoccupation accrue pour soi-même. Elle est aujourd'hui largement contestée."}, {"q": "La théorie de la continuité soutient que :", "o": ["Il faut rester actif à tout prix", "Il faut maintenir un lien entre passé et présent, l'activité important parce qu'elle prolonge un mode de vie", "Le retrait social est souhaitable", "L'activité n'a aucune importance"], "r": 1, "e": "Elle nuance la théorie de l'activité : ce n'est pas la quantité d'activité qui compte, mais sa cohérence avec l'histoire et les valeurs de la personne."}, {"q": "Le terme « vieillissement réussi » a été employé pour la première fois par :", "o": ["Baltes", "Havighurst, dans les années 1960", "Rowe et Khan", "Carstensen"], "r": 1, "e": "Rowe et Khan l'ont ensuite défini en 1987 et 1997, en s'inspirant des théories de l'activité et de la continuité."}, {"q": "Selon Rowe et Khan, le vieillissement réussi se définit par :", "o": ["Une faible probabilité de maladie, une bonne capacité intellectuelle et physique, et une participation active à des activités sociales", "L'absence totale de pathologie", "Le retrait de la vie sociale", "La stabilité financière"], "r": 0, "e": "Le cours critique ce concept comme plutôt applicable au début de la retraite qu'aux personnes de plus de 80 ans : c'est un vieillissement idéalisé, un « vieillir sans vieillir »."}, {"q": "Selon Diener (2003), le bien-être comporte deux dimensions :", "o": ["Physique et mentale", "Affective — émotions positives et négatives, bonheur — et cognitive — satisfaction dans la vie", "Individuelle et collective", "Présente et future"], "r": 1, "e": "De nombreux gérontologues préfèrent parler de « bien vieillir » plutôt que de vieillissement réussi, précisément pour éviter la norme implicite de performance."}, {"q": "Le cours indique que le bien-être psychologique des personnes âgées :", "o": ["S'effondre avec l'âge", "Varie peu, car elles adaptent leurs aspirations et leurs désirs à leurs possibilités actuelles", "Dépend uniquement de la santé physique", "Augmente systématiquement"], "r": 1, "e": "C'est un résultat contre-intuitif et bien établi : l'ajustement des attentes protège le vécu subjectif malgré la réalité des pertes."}, {"q": "Le modèle SOC de Baltes a été formulé :", "o": ["Entre 1960 et 1970", "Entre 1990 et 1996", "En 2003", "En 1961"], "r": 1, "e": "C'est un modèle de développement life-span qui prend en compte à la fois les pertes et les gains, et voit dans le vieillissement réussi une gestion active des ressources."}, {"q": "Dans le modèle SOC, le processus de « sélection » consiste à :", "o": ["Optimiser ses ressources", "Sélectionner les activités et domaines importants", "Compenser les pertes existantes", "Réduire son réseau social"], "r": 1, "e": "L'optimisation mobilise les ressources au service de ces activités retenues, et la compensation contourne les pertes par des moyens de substitution."}, {"q": "Dans l'exemple d'Arthur Rubinstein, réduire son répertoire correspond à :", "o": ["La sélection", "L'optimisation", "La compensation", "Aucun des trois"], "r": 0, "e": "S'entraîner plus longtemps chaque jour relève de l'optimisation ; jouer plus lentement avant les passages rapides, pour accentuer le contraste, relève de la compensation."}, {"q": "Arthur Rubinstein a donné son dernier concert à l'âge de :", "o": ["75 ans", "80 ans", "89 ans", "95 ans"], "r": 2, "e": "Cet exemple montre qu'un très haut niveau de performance reste possible à un âge avancé, à condition de réorganiser sa façon de travailler."}, {"q": "Selon Carstensen, la sélectivité s'accentue avec l'âge parce que :", "o": ["Les contacts sociaux se raréfient objectivement", "Le temps qu'il reste à vivre est perçu comme de plus en plus court, ce qui conduit à investir dans des objectifs émotionnels", "Les personnes âgées sont moins sociables", "La mobilité diminue"], "r": 1, "e": "Les personnes restent en contact avec celles qui leur apportent une satisfaction personnelle, ce qui maximise les expériences émotionnelles positives et réduit les risques émotionnels."}, {"q": "Parmi les défis psychosociaux du troisième âge, le cours cite :", "o": ["Le travail et la retraite, l'autonomie financière, les alternatives de vie, les aidants et les cas de maltraitance", "Uniquement la santé", "Uniquement la solitude", "La construction identitaire"], "r": 0, "e": "Les alternatives de vie recouvrent le maintien à domicile seul, la cohabitation avec les enfants ou l'entrée en institution — un choix rarement entièrement libre."}, {"q": "Le cours précise que le débat sur le vieillissement « réussi » :", "o": ["Est tranché", "Reste ouvert, les personnes étant très différentes dans leur façon de vivre leurs dernières années", "Ne concerne que les médecins", "A été abandonné"], "r": 1, "e": "La critique principale est qu'un modèle unique de réussite risque de disqualifier ceux dont la santé ou les ressources ne permettent pas d'y correspondre."}, {"q": "Parmi les changements physiques du troisième âge, le cours mentionne :", "o": ["Un cœur plus efficace", "Un cœur moins efficace et plus sensible aux maladies", "Un sommeil plus profond", "Une peau plus épaisse"], "r": 1, "e": "S'y ajoutent une peau pâle, tachée et ridée, des varices, des cheveux gris et plus fins, une baisse de taille et une réduction du sommeil et des rêves."}, {"q": "Les changements de force, d'endurance et d'équilibre au troisième âge sont décrits comme :", "o": ["Irréversibles", "Potentiellement réversibles par l'exercice physique, la gymnastique aérobique ou le tai-chi", "Sans conséquence fonctionnelle", "Indépendants du mode de vie"], "r": 1, "e": "C'est un point majeur pour la kinésithérapie : une part importante de ce qui est attribué à l'âge relève en réalité du désentraînement."}, {"q": "La mémoire procédurale, portant sur les habiletés motrices et les habitudes :", "o": ["Est la première à se détériorer", "Résiste aux effets du vieillissement", "Disparaît dans la démence dès le début", "N'existe plus après 70 ans"], "r": 1, "e": "C'est un appui essentiel en rééducation : même lorsque la mémoire épisodique est très altérée, les gestes appris restent longtemps disponibles."}, {"q": "L'intégrité, au huitième stade d'Erikson, suppose :", "o": ["Que tous les rêves se soient réalisés", "Un bilan positif, même si tous les rêves ne se sont pas réalisés", "L'absence de regrets", "Une bonne santé physique"], "r": 1, "e": "Le désespoir correspond à l'inverse : la vie jugée mal déroulée et peu productive, avec des regrets et sans réconciliation avec soi-même."}, {"q": "La théorie de l'activité soutient que, pour bien vieillir, il faut :", "o": ["Se retirer progressivement de la société", "Rester aussi actif que possible", "Réduire ses ambitions", "Accepter la dépendance"], "r": 1, "e": "Elle s'oppose frontalement à la théorie du désengagement. La théorie de la continuité les nuance toutes deux en insistant sur la cohérence avec le mode de vie antérieur."}, {"q": "Le cours indique qu'au troisième âge, la mort :", "o": ["N'est jamais évoquée", "Devient une préoccupation inévitable", "Est niée systématiquement", "Ne concerne que les malades"], "r": 1, "e": "Cette conscience du temps restant est précisément ce qui, selon Carstensen, réoriente les priorités vers les relations et les objectifs émotionnellement gratifiants."}, {"q": "Dans le modèle SOC, la compensation consiste à :", "o": ["Choisir les domaines importants", "Mobiliser davantage de ressources sur les activités retenues", "Contourner les pertes existantes par des moyens de substitution", "Abandonner les activités difficiles"], "r": 2, "e": "Les trois processus interagissent : sans sélection préalable, l'optimisation se disperse ; sans compensation, certaines pertes rendraient l'activité impossible."}, {"q": "Le modèle SOC est qualifié de modèle « life-span » parce qu'il :", "o": ["Ne concerne que la vieillesse", "Prend en compte pertes et gains sur l'ensemble de la vie", "Se limite à l'enfance", "Ignore le vieillissement"], "r": 1, "e": "Il s'inscrit dans la perspective de Baltes, pour qui les personnes continuent à se développer et à agir sur leur environnement à tout âge."}, {"q": "Selon le cours, la plupart des personnes de plus de 65 ans :", "o": ["Sont dépendantes", "Sont en bonne santé physique et mentale", "Souffrent de démence", "Vivent en institution"], "r": 1, "e": "Certaines capacités diminuent, mais on peut rester en forme dans la plupart des domaines et même améliorer certaines compétences."}, {"q": "La dégénérescence maculaire liée à l'âge aboutit à :", "o": ["Une cécité fonctionnelle par perte de la vision centrale", "Une perte de la vision périphérique", "Une opacification du cristallin", "Une paralysie oculaire"], "r": 0, "e": "La vision périphérique est préservée, ce qui permet certaines adaptations, mais la lecture et la reconnaissance des visages deviennent très difficiles."}, {"q": "La mémoire sémantique, au troisième âge :", "o": ["Se détériore fortement", "Est meilleure chez les personnes âgées", "Disparaît", "Reste strictement identique"], "r": 1, "e": "Faits historiques, coutumes et signification des mots s'accumulent avec les années. C'est la mémoire épisodique des événements récents qui, elle, se détériore considérablement."}]};</script>
