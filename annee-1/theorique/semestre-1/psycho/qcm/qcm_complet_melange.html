<script>window.QUIZ={"titre": "QCM", "fiche": "../accueil-psycho.html", "questions": [{"q": "La vertu associée au stade Intimité vs isolement est :", "o": ["Fidélité", "Amour", "Sagesse", "Espoir", "Attention à l’autre"], "r": 1, "e": "Erikson associe une vertu à chaque crise résolue. Intimité vs isolement, au jeune adulte, donne l'amour : la capacité de se lier durablement sans se perdre. La fidélité appartient à l'adolescence, la sagesse au dernier stade, l'espoir au tout premier."}, {"q": "Le développement cognitif à l’âge adulte intermédiaire se caractérise par :", "o": ["Une perte globale et uniforme", "Un déclin brutal des capacités", "Des gains et des pertes selon les domaines", "Une stagnation cognitive", "Une supériorité systématique des jeunes adultes"], "r": 2, "e": "Le vieillissement cognitif n'est pas un effondrement : la vitesse de traitement et la mémoire de travail baissent, tandis que le vocabulaire, les connaissances spécialisées et l'expertise progressent. C'est le modèle des gains et pertes de Baltes."}, {"q": "La puberté est déclenchée notamment par :", "o": ["Une maturation du cortex préfrontal", "Une augmentation de la leptine circulante", "Une pression sociale accrue", "L’entrée dans un groupe de pairs", "Une baisse des hormones sexuelles"], "r": 1, "e": "La leptine, sécrétée par le tissu adipeux, informe l'hypothalamus qu'une masse grasse suffisante est atteinte : c'est l'un des signaux permissifs qui lèvent le frein sur l'axe gonadotrope. Cela explique le retard pubertaire des adolescentes très maigres."}, {"q": "Le syndrome de l’X fragile est :", "o": ["Un trouble environnemental non héréditaire", "Une anomalie chromosomique autosomique", "Une mutation sur le chromosome X", "Une trisomie", "Une conséquence exclusive de l’autisme"], "r": 2, "e": "L'X fragile résulte de l'expansion d'une répétition CGG sur le gène FMR1 du chromosome X. C'est la première cause héréditaire de déficience intellectuelle, plus fréquente et plus sévère chez le garçon, qui n'a pas de second X compensateur."}, {"q": "Les terreurs nocturnes se distinguent des cauchemars car :", "o": ["L’enfant s’en souvient clairement", "Elles surviennent en sommeil paradoxal", "L’enfant n’est pas réellement éveillé", "Elles persistent à l’âge adulte", "Elles sont déclenchées volontairement"], "r": 2, "e": "Les terreurs nocturnes surviennent en sommeil lent profond, en début de nuit : l'enfant crie, semble terrifié, mais n'est pas réveillé et n'en garde aucun souvenir. Le cauchemar, lui, survient en sommeil paradoxal, réveille l'enfant qui peut le raconter."}, {"q": "La théorie du désengagement (Cumming &amp; Henry) soutient que :", "o": ["L’activité sociale doit être maintenue à tout prix", "Le retrait social est pathologique", "Le vieillissement réussi implique un éloignement progressif de la société", "Le désengagement est imposé par la société", "Elle nie toute capacité d’adaptation"], "r": 2, "e": "Proposée en 1961, cette théorie voit dans le retrait mutuel de l'individu et de la société un processus normal et fonctionnel. Elle a été largement contestée par la théorie de l'activité et par celle de la sélectivité socio-émotionnelle."}, {"q": "La sagesse selon Erikson correspond à :", "o": ["Une intelligence élevée", "Une absence de regrets", "Une acceptation du parcours de vie", "Une autonomie fonctionnelle", "Une mémoire intacte"], "r": 2, "e": "La sagesse naît de la résolution du conflit Intégrité vs désespoir : c'est le regard porté sur sa propre vie comme ayant eu un sens, avec ses réussites et ses manques. Elle ne se confond ni avec les performances intellectuelles ni avec l'absence de regrets."}, {"q": "La logique concrète se distingue de la logique formelle car elle :", "o": ["Est illogique", "Repose sur l’intuition", "Nécessite des supports réels", "Ignore la réversibilité", "Est émotionnelle"], "r": 2, "e": "Aux opérations concrètes, l'enfant raisonne logiquement mais seulement sur des objets manipulables ou représentables. La logique formelle, à l'adolescence, se détache du support réel et opère sur des propositions et des hypothèses."}, {"q": "Le sens le plus mature à la naissance est :", "o": ["La vision", "L’audition", "L’odorat", "Le toucher", "Le goût"], "r": 3, "e": "Le toucher est fonctionnel dès la vie intra-utérine et sert de premier canal de relation : réflexes des points cardinaux, peau à peau, apaisement. La vision est au contraire le sens le plus immature à la naissance."}, {"q": "Pour Piaget, le développement cognitif résulte principalement :", "o": ["De la maturation biologique", "De l’imitation sociale", "De l’interaction active entre l’enfant et son environnement", "Du conditionnement", "De la transmission directe des connaissances"], "r": 2, "e": "Piaget est constructiviste : la connaissance n'est ni innée ni transmise, elle se construit par l'action du sujet sur son milieu, via l'assimilation et l'accommodation. L'enfant est acteur, pas récepteur."}, {"q": "L’accommodation se définit comme :", "o": ["L’utilisation d’un schéma inchangé", "L’ajout d’un stimulus externe", "La modification d’un schéma existant pour s’adapter à la réalité", "La répétition automatique d’une action", "Le renforcement d’un comportement"], "r": 2, "e": "L'accommodation modifie le schéma pour l'ajuster à un objet qui lui résiste : l'enfant qui appelle « chien » tous les quadrupèdes doit créer une catégorie « chat ». L'assimilation, elle, fait entrer le nouvel objet dans un schéma inchangé."}, {"q": "La particularité majeure de la cognition adulte est :", "o": ["La vitesse de traitement", "La mémoire sensorielle", "Les connaissances spécialisées", "Le raisonnement abstrait pur", "La mémoire à court terme"], "r": 2, "e": "Le propre de la cognition adulte est l'expertise : un savoir organisé, spécifique à un domaine, qui compense la baisse de vitesse et rend l'expert souvent plus performant que le jeune adulte dans son propre champ."}, {"q": "Le stade cognitif correspondant à la troisième enfance selon Piaget est :", "o": ["Préopératoire", "Sensori-moteur", "Opérations concrètes", "Opérations formelles", "Post-formel"], "r": 2, "e": "La troisième enfance (6-12 ans) correspond aux opérations concrètes : conservation, classification, sériation, réversibilité — mais toujours appuyées sur du concret."}, {"q": "La métamémoire correspond :", "o": ["À la capacité de mémorisation brute", "À la mémoire émotionnelle", "À la connaissance que l’on a de sa propre mémoire", "À la mémoire sensorielle", "À une stratégie d’apprentissage"], "r": 2, "e": "La métamémoire est un savoir sur son propre fonctionnement mnésique : savoir qu'on retient mieux en répétant, ou estimer si l'on saura répondre. Elle se développe à l'âge scolaire et rend l'apprentissage stratégique."}, {"q": "Lequel des objectifs suivants n’appartient PAS aux objectifs de l’étude du développement ? :", "o": ["Description", "Explication", "Prédiction", "Normalisation du comportement"], "r": 3, "e": "Les trois objectifs classiques sont décrire, expliquer et prédire — auxquels on ajoute souvent l'intervention. Normaliser les comportements est une visée prescriptive, étrangère à la démarche scientifique."}, {"q": "La vertu associée au stade Confiance vs Méfiance est :", "o": ["Volonté", "Compétence", "Espoir", "Fidélité", "Amour"], "r": 2, "e": "Confiance vs méfiance (0-18 mois) donne l'espoir : la conviction que les besoins seront satisfaits et que le monde est fiable. La volonté vient du stade 2, la compétence du stade 4, la fidélité de l'adolescence."}, {"q": "La conservation apparaît principalement au stade :", "o": ["Sensori-moteur", "Préopératoire", "Opérations concrètes", "Opérations formelles", "Adulte"], "r": 2, "e": "Conserver, c'est comprendre que la quantité ne change pas quand la forme change — le liquide transvasé dans un verre plus fin. Cette acquisition marque l'entrée dans les opérations concrètes et suppose la réversibilité."}, {"q": "Un facteur non normatif est :", "o": ["La puberté", "L’entrée à l’école", "Un accident grave individuel", "La retraite", "Le vieillissement"], "r": 2, "e": "Un facteur non normatif touche un individu à un moment inattendu : accident, décès précoce d'un parent, gain imprévu. La puberté et la retraite sont au contraire des influences normatives liées à l'âge."}, {"q": "Le syndrome de Down est caractérisé par :", "o": ["Une absence du chromosome 21", "Une duplication partielle du chromosome 21", "Trois copies du chromosome 21", "Une anomalie du chromosome X", "Une mutation récessive unique"], "r": 2, "e": "La trisomie 21 est la présence de trois exemplaires du chromosome 21, le plus souvent par non-disjonction méiotique. Son risque croît nettement avec l'âge maternel."}, {"q": "Le langage télégraphique apparaît généralement vers :", "o": ["10 mois", "14 mois", "18 mois", "24 mois", "36 mois"], "r": 2, "e": "Vers 18-24 mois, l'enfant combine deux mots en supprimant les éléments grammaticaux : « papa parti », « encore lait ». Le sens passe, la syntaxe reste rudimentaire — d'où l'image du télégramme."}, {"q": "À partir de quel âge environ les dents définitives commencent-elles à apparaître ? :", "o": ["4 ans", "5 ans", "6 ans", "8 ans", "10 ans"], "r": 2, "e": "Les premières dents permanentes, souvent les premières molaires et les incisives centrales, sortent vers 6 ans, au début de la troisième enfance. La dentition de lait est complète vers 3 ans."}, {"q": "Les bébés préfèrent visuellement :", "o": ["Les lignes droites aux courbes", "Les stimuli asymétriques", "Les objets statiques", "Les motifs complexes", "Les surfaces uniformes"], "r": 3, "e": "Les travaux de Fantz montrent une préférence pour les stimuli complexes, contrastés et structurés — au premier rang desquels le visage humain — plutôt que pour les surfaces uniformes."}, {"q": "Le stade des opérations formelles permet surtout :", "o": ["L’imitation différée", "La pensée symbolique simple", "Le raisonnement abstrait et hypothétique", "La conservation perceptive", "L’animisme"], "r": 2, "e": "Les opérations formelles ouvrent le raisonnement hypothético-déductif : envisager le possible, tester systématiquement les variables, raisonner sur des propositions indépendamment du réel."}, {"q": "Le microsystème de Bronfenbrenner correspond :", "o": ["Aux valeurs culturelles", "Aux événements historiques", "Aux environnements immédiats de l’enfant", "Aux institutions politiques", "Aux interactions indirectes"], "r": 2, "e": "Le microsystème est le niveau des relations directes : famille, crèche, école, voisinage. Les valeurs culturelles relèvent du macrosystème, les influences indirectes de l'exosystème."}, {"q": "Les axes du core affect sont :", "o": ["Joie / tristesse", "Stress / détente", "Valence (agréable–désagréable) et activation", "Cognition / émotion", "Expression / régulation"], "r": 2, "e": "Le core affect de Russell organise les états affectifs sur deux dimensions continues : la valence (agréable-désagréable) et le niveau d'activation. Toute émotion s'y situe comme un point, plutôt que dans une catégorie fermée."}, {"q": "Selon la définition de Papalia &amp; Martorell, le développement correspond à :", "o": ["Une succession de changements biologiques uniquement", "Des changements aléatoires dépendant du contexte", "Des processus systématiques de changement et de stabilité", "Une évolution linéaire jusqu’à l’âge adulte"], "r": 2, "e": "La définition insiste sur deux points : les changements sont systématiques (ordonnés, cumulatifs), et le développement comporte aussi de la stabilité. Il ne s'arrête pas à l'âge adulte et ne se réduit pas au biologique."}, {"q": "La question clé du stade Identité vs confusion des rôles est :", "o": ["Puis-je faire confiance au monde ?", "Suis-je compétent ?", "Qui suis-je ?", "Puis-je aimer ?", "Ma vie a-t-elle eu un sens ?"], "r": 2, "e": "« Qui suis-je ? » résume la crise adolescente : construire une identité cohérente à partir des rôles, valeurs et projets explorés. Les autres formulations renvoient aux stades 1, 4, 6 et 8."}, {"q": "Dans la théorie du traitement de l’information, la pensée est comparée à :", "o": ["Un réseau social", "Un organisme biologique", "Un ordinateur", "Un système émotionnel", "Une construction culturelle"], "r": 2, "e": "L'approche du traitement de l'information modélise la cognition comme un système d'entrée, de stockage et de sortie, avec ses registres et ses limites de capacité — d'où la métaphore informatique."}, {"q": "L’agression instrumentale est surtout caractéristique :", "o": ["De l’adolescence", "De la troisième enfance", "De la deuxième enfance", "Du jeune adulte", "Du nourrisson"], "r": 2, "e": "L'agression instrumentale vise l'obtention d'un objet ou d'un privilège, sans intention de nuire : c'est la forme dominante à la deuxième enfance, autour du jouet convoité."}, {"q": "La séquence correcte du traitement de l’information est :", "o": ["Mémoire long terme → mémoire sensorielle → mémoire court terme", "Mémoire sensorielle → mémoire court terme → mémoire long terme", "Mémoire court terme → attention → mémoire sensorielle", "Attention → mémoire long terme → mémoire sensorielle", "Mémoire long terme → attention → output"], "r": 1, "e": "L'information transite par le registre sensoriel (très bref), passe en mémoire de travail si elle est attentionnellement sélectionnée, puis est éventuellement encodée en mémoire à long terme."}, {"q": "Le désespoir, au dernier stade, est caractérisé par :", "o": ["Une peur de la mort uniquement", "Une incapacité à aimer", "Un regret des occasions manquées et une absence de réconciliation avec soi", "Une perte cognitive", "Une dépendance affective"], "r": 2, "e": "Le désespoir n'est pas seulement la crainte de mourir : c'est le sentiment que le temps manque désormais pour reprendre ce qui a été manqué, et l'impossibilité d'accepter sa vie telle qu'elle a été."}, {"q": "La pensée post-formelle se distingue par :", "o": ["Une logique rigide et binaire", "Une absence d’émotion dans le raisonnement", "Une capacité à gérer l’incertitude et la contradiction", "Une dépendance au raisonnement abstrait pur", "Une disparition de l’intuition"], "r": 2, "e": "La pensée post-formelle accepte que plusieurs vérités coexistent, intègre l'affect au raisonnement et sait décider en contexte incertain. Elle dépasse la logique binaire des opérations formelles sans la nier."}, {"q": "L’acuité visuelle est maximale en moyenne :", "o": ["Entre 10 et 20 ans", "Entre 15 et 25 ans", "Entre 20 et 40 ans", "Entre 30 et 50 ans", "Après 40 ans"], "r": 2, "e": "L'acuité visuelle culmine vers 20-40 ans ; la presbytie s'installe ensuite progressivement à partir de la quarantaine, par perte d'élasticité du cristallin."}, {"q": "L’énurésie est considérée comme problématique lorsqu’elle :", "o": ["Survient avant 3 ans", "Est occasionnelle", "Persiste après 5 ans à une fréquence définie", "Est uniquement diurne", "Est toujours d’origine psychologique"], "r": 2, "e": "On parle d'énurésie lorsque les mictions involontaires persistent au-delà de 5 ans avec une fréquence répétée. Avant cet âge, le contrôle n'est pas attendu, et la cause est souvent une maturation retardée, non un trouble psychologique."}, {"q": "La perspective éthologique met l’accent sur :", "o": ["Le conditionnement", "Les conflits inconscients", "Les bases biologiques et évolutionnistes du comportement", "Les processus cognitifs abstraits", "Les apprentissages scolaires"], "r": 2, "e": "L'éthologie (Lorenz, Tinbergen, Bowlby) étudie le comportement comme un produit de l'évolution, dans son milieu naturel : empreinte, périodes sensibles, valeur adaptative de l'attachement."}, {"q": "La poussée de croissance adolescente :", "o": ["Suit la maturité sexuelle", "Précède la maturité sexuelle", "Dure toute l’adolescence", "Commence après les premières règles", "Est identique chez les deux sexes"], "r": 1, "e": "Chez la fille, le pic de croissance précède les premières règles ; chez le garçon, il suit le début du développement génital. Dans les deux cas, la poussée précède l'achèvement de la maturité sexuelle et dure environ deux ans."}, {"q": "La résilience correspond à :", "o": ["L’absence de stress", "Une invulnérabilité biologique", "Une adaptation positive malgré l’adversité", "Une réussite scolaire", "Une intelligence élevée"], "r": 2, "e": "La résilience n'est ni l'absence de stress ni une invulnérabilité : c'est une trajectoire d'adaptation positive malgré une adversité avérée, qui dépend de ressources individuelles et de l'entourage."}, {"q": "La perte auditive observée chez le jeune adulte concerne d’abord :", "o": ["Les sons graves", "Les sons aigus", "Les sons médiums", "Toutes les fréquences de façon équivalente", "Uniquement la parole"], "r": 1, "e": "La perte porte d'abord sur les hautes fréquences, souvent dès la vingtaine et de façon infraclinique. Les sons graves sont épargnés bien plus longtemps."}, {"q": "Un changement quantitatif correspond à :", "o": ["Une modification de structure cognitive", "Le passage du non-verbal au verbal", "Une augmentation du vocabulaire", "Une transformation qualitative du raisonnement"], "r": 2, "e": "Un changement quantitatif porte sur un « combien » : nombre de mots, taille, vitesse. Le passage aux opérations concrètes est au contraire une réorganisation de structure, donc qualitative."}, {"q": "Un changement qualitatif est typiquement observé lors :", "o": ["De l’augmentation du vocabulaire", "De la poussée de croissance pubertaire", "Du passage aux opérations concrètes", "De l’amélioration de la vitesse motrice", "De l’entraînement répétitif"], "r": 2, "e": "Le passage d'un stade piagétien à un autre change la nature même du raisonnement, pas seulement son rendement : c'est la définition du changement qualitatif."}, {"q": "Les émotions secondaires apparaissent lorsque l’enfant développe :", "o": ["La motricité fine", "La conscience de soi", "Le langage articulé", "La mémoire implicite", "L’autorégulation physiologique"], "r": 1, "e": "Les émotions secondaires — honte, culpabilité, fierté, embarras — supposent de se représenter soi-même comme objet d'évaluation. Elles apparaissent vers 18-24 mois, avec la conscience de soi."}, {"q": "L’assimilation correspond au processus par lequel l’enfant :", "o": ["Modifie ses structures mentales", "Supprime un schéma inefficace", "Intègre une nouvelle information dans un schéma existant", "Crée un nouveau schéma", "Atteint un état d’équilibre"], "r": 2, "e": "Assimiler, c'est traiter du neuf avec de l'ancien : l'enfant applique un schéma déjà constitué à un objet inédit. C'est le versant conservateur de l'adaptation, l'accommodation en étant le versant transformateur."}, {"q": "La vertu sociale associée au 8ᵉ stade d’Erikson est :", "o": ["L’amour", "La considération", "La fidélité", "La sagesse", "L’espérance"], "r": 3, "e": "Le 8ᵉ stade, Intégrité vs désespoir, donne la sagesse. L'amour correspond au 6ᵉ, la considération (sollicitude) au 7ᵉ, la fidélité au 5ᵉ, l'espérance au 1ᵉʳ."}, {"q": "Le stade Autonomie vs honte et doute est particulièrement lié :", "o": ["À l’entrée à l’école", "À l’adolescence", "À l’apprentissage de la propreté", "À l’identité sociale", "À l’intimité affective"], "r": 2, "e": "Le stade 2 (18 mois - 3 ans) se joue autour du contrôle de soi, dont l'apprentissage de la propreté est le terrain symbolique : l'enfant y éprouve son pouvoir de retenir ou de lâcher."}, {"q": "La mémoire inverse des chiffres diminue davantage que la mémoire directe car elle sollicite :", "o": ["La mémoire sensorielle", "La mémoire procédurale", "La mémoire de travail active", "La mémoire implicite", "La mémoire sémantique"], "r": 2, "e": "Répéter des chiffres à l'envers oblige à maintenir l'information tout en la manipulant : c'est la mémoire de travail, particulièrement sensible au vieillissement. L'empan direct, simple stockage, résiste mieux."}, {"q": "Le modèle SOC de Baltes illustre :", "o": ["Une perte inévitable des capacités", "Un vieillissement passif", "Des stratégies adaptatives actives", "Une compensation uniquement cognitive", "Une sélection sociale imposée"], "r": 2, "e": "Sélection, Optimisation, Compensation : le pianiste âgé réduit son répertoire (sélection), le travaille davantage (optimisation) et ralentit les passages précédents pour faire paraître rapides les suivants (compensation). Le vieillissement y est actif, non subi."}, {"q": "Le discours privé chez l’enfant d’âge préscolaire est :", "o": ["Anormal et inquiétant", "Un signe de retard cognitif", "Un langage sans fonction", "Fréquent et normal", "Réservé aux enfants anxieux"], "r": 3, "e": "Le discours privé — l'enfant qui commente son action à voix haute — est fréquent et normal entre 3 et 7 ans. Pour Vygotsky, il s'intériorisera pour devenir la pensée verbale et l'autorégulation."}, {"q": "La vision binoculaire apparaît généralement vers :", "o": ["La naissance", "2 semaines", "2 mois", "4–5 mois", "12 mois"], "r": 3, "e": "La vision binoculaire, qui permet la perception fine de la profondeur par disparité rétinienne, s'installe vers 4-5 mois, avec la maturation des voies visuelles corticales."}, {"q": "Selon Piaget, l’adolescent atteint le stade :", "o": ["Préopératoire", "Opérations concrètes", "Opérations formelles", "Post-formel", "Sensori-moteur"], "r": 2, "e": "L'adolescence correspond aux opérations formelles : raisonnement sur l'abstrait, le possible et l'hypothétique. Tous les adolescents n'y accèdent d'ailleurs pas dans tous les domaines."}, {"q": "Le syndrome de Klinefelter correspond au caryotype :", "o": ["XO", "XXX", "XXY", "XYY"], "r": 2, "e": "Le syndrome de Klinefelter est un caryotype 47,XXY. XO correspond au syndrome de Turner, XXX au triple X, XYY au syndrome de Jacobs."}, {"q": "Dire que le développement accompagne le cycle de vie signifie que :", "o": ["Il s’arrête à l’âge adulte", "Il concerne uniquement l’enfance", "Il s’étend de la conception à la mort", "Il est identique à chaque période de vie"], "r": 2, "e": "Le développement couvre l'ensemble du cycle de vie, de la conception à la mort : c'est la perspective life-span de Baltes, qui rompt avec l'idée d'un développement limité à l'enfance."}, {"q": "Les trois domaines principaux du développement sont :", "o": ["Biologique, affectif, social", "Physique, cognitif, psychosocial", "Sensoriel, moteur, émotionnel", "Génétique, culturel, historique"], "r": 1, "e": "Papalia distingue le développement physique, cognitif et psychosocial. Ces trois domaines sont séparés pour l'étude mais constamment en interaction."}, {"q": "La division du cycle de vie en périodes est considérée comme :", "o": ["Universelle et exacte", "Fixée biologiquement", "Une construction sociale aux limites approximatives", "Identique dans toutes les cultures"], "r": 2, "e": "Le découpage en périodes (petite enfance, adolescence, troisième âge) varie selon les époques et les cultures : l'adolescence comme catégorie est récente. C'est un outil de description, aux frontières floues."}, {"q": "Les différences individuelles dans le développement s’expliquent notamment par :", "o": ["Uniquement l’hérédité", "Uniquement l’environnement", "Les caractéristiques personnelles et les contextes de vie", "Les stades universels identiques pour tous"], "r": 2, "e": "Les différences individuelles résultent de l'interaction entre caractéristiques propres (génétique, tempérament, santé) et contextes de vie (famille, école, culture, époque) : ni l'hérédité ni l'environnement seuls n'en rendent compte."}, {"q": "Une influence normative liée à l’âge est :", "o": ["Un accident d’avion", "Une guerre vécue par une génération", "La puberté", "Le décès d’un parent en bas âge"], "r": 2, "e": "La puberté survient chez tous les individus, à un âge relativement prévisible : c'est le prototype de l'influence normative liée à l'âge. La guerre est normative liée à l'histoire, l'accident est non normatif."}, {"q": "Une influence non normative est caractérisée par :", "o": ["Sa survenue chez toutes les personnes du même âge", "Son caractère prévisible", "Son impact significatif et individuel", "Son origine strictement biologique"], "r": 2, "e": "L'influence non normative est inattendue, ne touche pas tout le monde, mais marque durablement la trajectoire de celui qui la vit. C'est précisément son caractère atypique qui la définit."}, {"q": "Pourquoi le terme « période sensible » est-il préféré à « période critique » ? :", "o": ["Parce qu’il exclut toute influence biologique", "Parce qu’il reconnaît la plasticité du développement", "Parce qu’il signifie un changement irréversible", "Parce qu’il concerne uniquement le langage"], "r": 1, "e": "« Période critique » suppose une fenêtre rigide au-delà de laquelle rien n'est plus possible. « Période sensible » rend compte de la réalité observée : l'acquisition est plus facile à ce moment, mais reste possible ensuite grâce à la plasticité."}, {"q": "Selon Erikson, la personnalité se développe principalement sous l’influence :", "o": ["Des pulsions biologiques", "Des stades cognitifs", "Des influences sociales", "Du conditionnement", "De la maturation neurologique"], "r": 2, "e": "Erikson prolonge Freud en déplaçant l'accent des pulsions vers le social : chaque crise se joue dans la rencontre entre les attentes de la société et les capacités du sujet, et ce sur toute la vie."}, {"q": "La notion centrale de la théorie d’Erikson est :", "o": ["Le conflit œdipien", "La crise psychosociale", "Le renforcement", "L’intelligence", "L’attachement primaire"], "r": 1, "e": "Chez Erikson, toute la vie est structurée par une suite de huit crises psychosociales, chacune opposant deux pôles et débouchant sur une vertu. C'est le concept central de sa théorie."}, {"q": "Une résolution saine d’une crise psychosociale implique :", "o": ["L’élimination complète du pôle négatif", "La prédominance du pôle positif", "L’équilibre strict 50/50", "L’absence de conflit", "Une résolution définitive et irréversible"], "r": 1, "e": "Pour Erikson, une crise bien résolue ne supprime pas le pôle négatif : elle établit une dominance du pôle positif. Un minimum de méfiance est nécessaire pour se protéger, un minimum de doute pour rester prudent."}, {"q": "Le stade Initiative vs culpabilité se caractérise principalement par :", "o": ["Le raisonnement abstrait", "La dépendance affective", "L’exploration des rôles et le jeu symbolique", "La peur de l’échec scolaire", "L’isolement social"], "r": 2, "e": "Le stade 3 (3-6 ans) est celui de l'initiative : l'enfant entreprend, invente, joue des rôles. Réprimé ou excessivement jugé, il développe de la culpabilité à l'égard de ses propres désirs."}, {"q": "Le sentiment d’infériorité apparaît principalement lorsque :", "o": ["Le stade 1 est mal résolu", "L’enfant échoue à développer un sentiment de compétence", "L’adolescent ne trouve pas son identité", "Le jeune adulte évite l’intimité", "La personne âgée fait un bilan négatif"], "r": 1, "e": "Le stade 4 (6-12 ans) oppose Productivité et infériorité : confronté à l'école et aux pairs, l'enfant qui ne parvient pas à se sentir capable intériorise un sentiment d'infériorité."}, {"q": "Selon la perspective de l’apprentissage, le développement est principalement :", "o": ["Discontinu et structuré en stades", "Le résultat de conflits internes", "Le produit de l’apprentissage basé sur l’expérience", "Déterminé par la maturation biologique", "Indépendant de l’environnement"], "r": 2, "e": "Les théories de l'apprentissage (behaviorisme et apprentissage social) décrivent un développement continu, produit de l'expérience et des interactions avec le milieu, sans stades universels."}, {"q": "Le behaviorisme considère que le facteur le plus influent dans le développement est :", "o": ["L’hérédité", "La conscience", "L’environnement", "Les émotions", "La génétique"], "r": 2, "e": "Pour Watson et Skinner, le développement est le produit des contingences de l'environnement : ce qui est renforcé se maintient. L'hérédité et la vie mentale y jouent un rôle minime ou inaccessible à la science."}, {"q": "Selon John B. Watson, la psychologie doit être :", "o": ["L’étude de la vie mentale", "L’étude de la conscience", "Une science objective du comportement observable", "Une science des représentations internes", "Une branche de la psychanalyse"], "r": 2, "e": "Pour Watson (1913), la psychologie doit rompre avec l'introspection et devenir une science naturelle objective, portant sur le comportement observable et ses déterminants environnementaux."}, {"q": "Le conditionnement classique permet principalement :", "o": ["D’augmenter la probabilité d’un comportement volontaire", "De créer de nouvelles réponses motrices", "D’établir des associations entre des stimuli", "De supprimer un comportement par punition", "De renforcer un comportement par récompense"], "r": 2, "e": "Le conditionnement classique crée une association entre deux stimuli, et fait ainsi apparaître une réponse déjà existante devant un signal nouveau. Il n'agit pas sur des comportements volontaires."}, {"q": "Dans le conditionnement classique, un stimulus neutre devient stimulus conditionné lorsqu’il :", "o": ["Est présenté seul sans réponse", "Est associé à un stimulus inconditionnel", "Est suivi d’une punition", "Provoque une réponse innée", "Est renforcé positivement"], "r": 1, "e": "Le stimulus neutre devient conditionné par appariement répété avec un stimulus inconditionnel : la cloche de Pavlov, associée à la nourriture, finit par déclencher seule la salivation."}, {"q": "L’expérience du « petit Albert » illustre principalement :", "o": ["Le conditionnement opérant", "L’apprentissage par imitation", "Le conditionnement classique de la peur", "L’extinction d’une réponse", "Le renforcement négatif"], "r": 2, "e": "Watson et Rayner ont associé un rat blanc (stimulus neutre) à un bruit violent, jusqu'à ce que le rat seul déclenche la peur. C'est un conditionnement classique, avec généralisation à d'autres objets pileux."}, {"q": "Selon Skinner, un comportement est maintenu lorsqu’il est :", "o": ["Observé chez autrui", "Associé à un stimulus neutre", "Renforcé", "Automatique", "Innée"], "r": 2, "e": "Pour Skinner, c'est la conséquence qui gouverne : un comportement suivi d'un renforcement se répète, un comportement non renforcé s'éteint."}, {"q": "Le renforcement négatif consiste à :", "o": ["Ajouter un stimulus désagréable", "Retirer un stimulus agréable", "Retirer un stimulus aversif", "Ignorer un comportement", "Punir un comportement"], "r": 2, "e": "Le renforcement négatif retire un stimulus désagréable et augmente donc le comportement : prendre un antalgique supprime la douleur, ce qui renforce la prise. Il ne faut pas le confondre avec la punition, qui diminue le comportement."}, {"q": "La théorie de l’apprentissage social se distingue du behaviorisme classique car elle :", "o": ["Rejette totalement l’environnement", "Nie toute forme de conditionnement", "Intègre les processus cognitifs", "Est fondée uniquement sur l’animal", "Repose uniquement sur la maturation"], "r": 2, "e": "Bandura réintroduit ce que le behaviorisme excluait : attention, mémorisation, anticipation des conséquences, sentiment d'efficacité personnelle. On parle d'ailleurs de théorie sociale cognitive."}, {"q": "Selon Bandura, l’enfant apprend principalement par :", "o": ["Essais-erreurs uniquement", "Renforcement direct", "Observation et imitation de modèles", "Punition", "Répétition mécanique"], "r": 2, "e": "L'expérience de la poupée Bobo montre que l'enfant reproduit un comportement simplement observé, sans avoir été renforcé. L'apprentissage vicariant met la cognition au cœur du processus."}, {"q": "La psychologie génétique étudie principalement :", "o": ["Les différences individuelles de QI", "Les normes du développement", "L’origine et la construction de la connaissance", "Les troubles cognitifs", "Les apprentissages scolaires"], "r": 2, "e": "La psychologie génétique, au sens de Piaget, n'a rien à voir avec les gènes : « genèse » y signifie origine. Elle étudie comment se construit la connaissance chez l'enfant."}, {"q": "Le moteur du développement cognitif chez Piaget est :", "o": ["La maturation cérébrale", "Le langage", "Le déséquilibre cognitif", "Le renforcement", "L’imitation"], "r": 2, "e": "Le moteur est le déséquilibre : lorsqu'un schéma échoue, la tension pousse à accommoder et à retrouver un équilibre supérieur. C'est l'équilibration majorante."}, {"q": "Le stade préopératoire se caractérise notamment par :", "o": ["La réversibilité", "La conservation", "L’égocentrisme", "Le raisonnement hypothético-déductif", "La pensée abstraite"], "r": 2, "e": "Le stade préopératoire (2-6 ans) est marqué par l'égocentrisme intellectuel : l'enfant ne parvient pas encore à adopter le point de vue d'autrui, comme l'illustre l'épreuve des trois montagnes. Réversibilité et conservation viendront au stade suivant."}, {"q": "Le raisonnement transductif est typique du stade :", "o": ["Sensori-moteur", "Préopératoire", "Opérations concrètes", "Opérations formelles", "Post-formel"], "r": 1, "e": "Le raisonnement transductif va du particulier au particulier, sans passer par une règle générale : « je n'ai pas fait ma sieste, donc ce n'est pas l'après-midi ». Il est typique du stade préopératoire."}, {"q": "Pour Piaget, l’enfant est comparable à un scientifique car il :", "o": ["Imite passivement l’adulte", "Reçoit des connaissances toutes faites", "Teste activement des hypothèses pour comprendre le monde", "Évite l’erreur", "Apprend uniquement par répétition"], "r": 2, "e": "L'enfant piagétien observe, forme des hypothèses implicites, agit sur le réel et révise ses schémas lorsque le résultat le dément : l'erreur y est un moteur, non un accident."}, {"q": "Pour Vygotsky, le développement cognitif est avant tout :", "o": ["Un processus individuel", "Un produit de la maturation biologique", "Un processus coopératif et social", "Une succession de stades universels", "Déterminé génétiquement"], "r": 2, "e": "Pour Vygotsky, toute fonction supérieure apparaît deux fois : d'abord sur le plan interpsychique, dans l'échange, puis sur le plan intrapsychique, par intériorisation. Le développement est coopératif avant d'être individuel."}, {"q": "La Zone de Développement Proximal (ZDP) correspond :", "o": ["À ce que l’enfant sait faire seul", "À ce que l’enfant ne peut jamais faire", "À la différence entre performance autonome et assistée", "À une compétence innée", "À une limite biologique fixe"], "r": 2, "e": "La ZDP est l'écart entre ce que l'enfant réussit seul et ce qu'il réussit avec l'aide d'un adulte ou d'un pair plus avancé. C'est là que l'enseignement est efficace — et le fondement de la notion d'étayage."}, {"q": "L’ exosystème se définit comme :", "o": ["Une interaction directe avec l’enfant", "Un environnement qui n’affecte pas l’enfant", "Un environnement indirect influençant l’enfant", "Un environnement biologique", "Le système de valeurs culturelles"], "r": 2, "e": "L'exosystème regroupe les milieux où l'enfant n'est pas présent mais dont les décisions le touchent : le lieu de travail d'un parent, le conseil municipal, le réseau d'amis des parents."}, {"q": "Selon Bowlby, le besoin d’attachement est :", "o": ["Secondaire à l’alimentation", "Appris par conditionnement", "Un besoin primaire", "Culturel", "Dépendant du langage"], "r": 2, "e": "Bowlby rompt avec l'idée d'un attachement dérivé du besoin de nourriture : c'est un besoin primaire, sélectionné par l'évolution pour la protection. Les singes de Harlow, préférant la mère en tissu à celle qui nourrit, l'ont confirmé."}, {"q": "La Strange Situation permet principalement :", "o": ["D’évaluer le QI", "De mesurer la mémoire", "D’évaluer la qualité de l’attachement", "De tester la peur innée", "De diagnostiquer des troubles neurologiques"], "r": 2, "e": "La procédure d'Ainsworth alterne séparations et retrouvailles avec la mère en présence d'un inconnu. C'est la réaction aux retrouvailles qui classe l'attachement : sécure, évitant, ambivalent ou désorganisé."}, {"q": "Selon Maslow, les besoins qui motivent le comportement humain sont :", "o": ["Indépendants les uns des autres", "Hiérarchisés", "Purement biologiques", "Aléatoires", "Exclusivement sociaux"], "r": 1, "e": "La pyramide de Maslow ordonne les besoins des plus fondamentaux (physiologiques, sécurité) aux plus élevés (appartenance, estime, accomplissement), les premiers devant être suffisamment satisfaits pour que les suivants deviennent motivants."}, {"q": "Les problèmes du développement prénatal se répartissent principalement en :", "o": ["Problèmes nutritionnels et hormonaux", "Erreurs génétiques et facteurs tératogènes", "Maladies infectieuses et traumatismes", "Facteurs psychologiques et sociaux", "Anomalies neurologiques uniquement"], "r": 1, "e": "Le cours distingue deux grandes catégories : les erreurs génétiques, présentes dès la conception, et les tératogènes — alcool, médicaments, infections, radiations — qui agissent pendant la grossesse."}, {"q": "Les erreurs génétiques surviennent :", "o": ["Après la naissance", "Pendant le 3ᵉ trimestre", "Au moment de la conception", "Uniquement après exposition à un toxique", "Pendant l’accouchement"], "r": 2, "e": "Les erreurs génétiques — anomalies chromosomiques ou géniques — sont présentes dès la conception, dans les gamètes ou lors des premières divisions. Les tératogènes, eux, agissent secondairement pendant la grossesse."}, {"q": "Le syndrome d’alcoolisme fœtal est lié :", "o": ["À une anomalie génétique", "À une carence en fer", "À un facteur tératogène", "À une infection virale", "À un excès de glucose"], "r": 2, "e": "L'alcool est le tératogène le mieux établi de la grossesse : il traverse le placenta et provoque dysmorphie faciale, retard de croissance et atteinte du système nerveux central. Aucun seuil de consommation n'est reconnu comme sûr."}, {"q": "Le principe céphalo-caudal signifie que le développement se fait :", "o": ["Du bas vers le haut", "Du centre vers la périphérie", "De la tête vers la queue", "Des extrémités vers le tronc", "De façon aléatoire"], "r": 2, "e": "Le développement progresse de la tête vers le bas : le contrôle de la tête précède celui du tronc, puis de la marche. Le principe proximo-distal, complémentaire, va du centre vers les extrémités."}, {"q": "Le principe proximal-distal décrit un développement :", "o": ["De la tête vers les pieds", "Du centre du corps vers les extrémités", "Des mains vers les bras", "Du bas vers le haut", "Uniquement moteur"], "r": 1, "e": "Le principe proximo-distal décrit une maturation du centre du corps vers la périphérie : le contrôle de l'épaule et du bras précède celui de la main, puis des doigts. D'où la préhension palmaire avant la pince fine."}, {"q": "Un score d’Apgar inférieur à 7 indique que le nouveau-né :", "o": ["Est en excellente santé", "Présente une anomalie génétique", "A besoin d’aide pour respirer", "Est prématuré", "Présente un trouble cognitif"], "r": 2, "e": "Le score d'Apgar évalue à 1 et 5 minutes fréquence cardiaque, respiration, tonus, réactivité et coloration. En dessous de 7, le nouveau-né nécessite une assistance, le plus souvent respiratoire ; ce n'est ni un diagnostic génétique ni un pronostic cognitif."}, {"q": "L’échelle NBAS (Brazelton) permet principalement :", "o": ["De mesurer le QI futur", "D’évaluer uniquement les réflexes", "D’évaluer l’organisation neurocomportementale du nouveau-né", "De diagnostiquer les trisomies", "De mesurer la croissance"], "r": 2, "e": "L'échelle de Brazelton évalue le fonctionnement neurocomportemental du nouveau-né : réflexes, mais aussi états de vigilance, capacité d'autorégulation et d'interaction. Elle ne prédit pas le QI."}, {"q": "Le réflexe des points cardinaux est déclenché par :", "o": ["Un stimulus auditif", "Une stimulation visuelle", "Une caresse de la joue", "Une odeur familière", "Un changement de posture"], "r": 2, "e": "Une caresse sur la joue ou au coin des lèvres fait tourner la tête du nouveau-né du côté stimulé, bouche ouverte : ce réflexe archaïque oriente vers le sein et disparaît vers 3-4 mois."}, {"q": "Les saveurs consommées par la mère pendant la grossesse peuvent être transmises au fœtus via :", "o": ["Le sang placentaire uniquement", "Le lait maternel", "Le liquide amniotique", "La salive", "Le cordon ombilical après la naissance"], "r": 2, "e": "Les arômes de l'alimentation maternelle passent dans le liquide amniotique, que le fœtus déglutit. Cette familiarisation précoce influence les préférences alimentaires après la naissance, et se poursuit dans le lait maternel."}, {"q": "La vision est le sens le moins développé à la naissance principalement parce que :", "o": ["Les yeux sont fermés", "Les structures rétiniennes sont immatures", "Les bébés ne prêtent pas attention aux stimuli", "Le cortex visuel est absent", "La vision est apprise socialement"], "r": 1, "e": "À la naissance, la fovéa, la myélinisation des voies optiques et le cortex visuel sont immatures : l'acuité est d'environ 1/20 et la mise au point ne se fait nettement qu'à 20-30 cm — la distance du visage maternel."}, {"q": "Selon Frantz, le stimulus visuel qui obtient la plus grande préférence est :", "o": ["Le disque lisse", "Le contraste noir/blanc", "Le visage", "Les lignes droites", "Les formes géométriques simples"], "r": 2, "e": "Dans les travaux de Fantz, le visage humain — ou un schéma organisé de visage — recueille la plus longue fixation, avant même les damiers contrastés. La préférence est précoce et sert l'attachement."}, {"q": "La reconnaissance individuelle des visages apparaît généralement :", "o": ["À la naissance", "Entre 2 et 4 semaines", "Entre 6 et 9 semaines", "Vers 6 mois", "Après 1 an"], "r": 2, "e": "Le nourrisson distingue le visage de sa mère de celui d'une inconnue dès les premières semaines, en s'appuyant d'abord sur le contour, la voix et l'odeur."}, {"q": "L’expérience de la « falaise visuelle » (Gibson &amp; Walk) montre que les bébés :", "o": ["N’ont aucune perception de la profondeur", "Apprennent la profondeur uniquement par l’expérience", "Évitent la profondeur même en présence de leur mère", "Tombent systématiquement", "Dépendent exclusivement de la vision"], "r": 2, "e": "Sur la falaise visuelle, le bébé capable de ramper refuse de franchir le vide apparent, même appelé par sa mère : la perception de la profondeur est donc en place, liée à l'expérience de la locomotion."}, {"q": "Pendant la deuxième enfance, les proportions corporelles évoluent de sorte que :", "o": ["La tête devient proportionnellement plus grande", "Le tronc et les membres s’allongent", "Le ventre devient plus proéminent", "Les os restent mous", "La masse grasse augmente fortement"], "r": 1, "e": "Entre 3 et 6 ans, la silhouette s'affine : le tronc et les membres s'allongent, la tête devient proportionnellement plus petite et le ventre proéminent du nourrisson s'efface."}, {"q": "À cet âge, l’enfant a tendance à :", "o": ["Augmenter spontanément son apport calorique", "Ne plus réguler sa consommation alimentaire", "Réguler sa consommation calorique s’il n’est pas forcé à manger", "Présenter systématiquement une dénutrition", "Ne plus avoir besoin d’encadrement alimentaire"], "r": 2, "e": "Laissé libre, le jeune enfant ajuste ses apports d'un repas à l'autre et sur la journée. Forcer ou restreindre perturbe cette régulation spontanée — argument central de l'éducation alimentaire respectueuse des signaux de faim."}, {"q": "À 3 ans, la dentition se caractérise par :", "o": ["L’apparition des premières dents permanentes", "L’absence de dents de lait", "La présence de toutes les dents primaires", "La perte des incisives", "Une dentition définitive complète"], "r": 2, "e": "Les 20 dents temporaires sont généralement toutes sorties vers 2 ans et demi - 3 ans. Les permanentes n'apparaissent que vers 6 ans."}, {"q": "Jusqu’à environ 5 ans, la majorité des enfants :", "o": ["N’ont plus besoin de dormir en journée", "Ont besoin d’une sieste ou d’un petit somme", "Dorment moins bien que les adolescents", "Présentent tous des troubles sévères du sommeil", "Ont un rythme identique à celui des adultes"], "r": 1, "e": "Jusque vers 5 ans, la plupart des enfants ont encore besoin d'une sieste ou d'un temps calme en journée. Sa disparition est progressive et très variable d'un enfant à l'autre."}, {"q": "Les objets transitionnels, selon Winnicott, servent principalement à :", "o": ["Stimuler l’intelligence", "Favoriser le langage", "Gérer l’angoisse de séparation", "Remplacer la figure parentale", "Développer l’autonomie motrice"], "r": 2, "e": "L'objet transitionnel — doudou, coin de tissu — est ni tout à fait moi ni tout à fait l'autre : il occupe l'espace laissé par l'absence de la mère et permet d'en supporter la séparation. Il ne la remplace pas, il en fait le deuil progressif."}, {"q": "Le stade cognitif correspondant à la deuxième enfance est :", "o": ["Sensori-moteur", "Opérations concrètes", "Opérations formelles", "Préopératoire", "Post-formel"], "r": 3, "e": "La deuxième enfance (3-6 ans) correspond au stade préopératoire : fonction symbolique et langage, mais aussi égocentrisme, animisme, centration et absence de conservation."}, {"q": "Le type d’agression le plus courant entre 2,5 et 5 ans est :", "o": ["Agression hostile", "Agression verbale intentionnelle", "Agression instrumentale", "Violence préméditée", "Agression défensive"], "r": 2, "e": "Entre 2 ans et demi et 5 ans domine l'agression instrumentale : l'enfant pousse ou arrache pour obtenir l'objet, sans viser à faire mal. L'agression hostile, intentionnellement blessante, apparaît plus tard."}, {"q": "Selon Scherer (2005), une émotion est avant tout :", "o": ["Un état affectif prolongé", "Un sentiment subjectif isolé", "Un épisode bref de processus synchronisés", "Une réaction purement physiologique", "Une construction linguistique"], "r": 2, "e": "Pour Scherer, l'émotion est un épisode bref au cours duquel plusieurs composantes — évaluation, physiologie, tendance à l'action, expression, sentiment — se synchronisent. Cela la distingue de l'humeur, plus longue et diffuse."}, {"q": "La composante motivationnelle d’une émotion correspond :", "o": ["Aux changements corporels", "À l’évaluation cognitive", "Aux tendances à l’action", "À l’expression faciale", "À l’état affectif de base"], "r": 2, "e": "La composante motivationnelle est la préparation à l'action : fuir dans la peur, s'approcher dans la colère. Elle se distingue de la composante physiologique, cognitive, expressive et du sentiment subjectif."}, {"q": "Dans le modèle du core affect , les états affectifs sont organisés selon :", "o": ["Trois dimensions", "Une hiérarchie de besoins", "Deux axes principaux", "Des catégories émotionnelles fixes", "Des émotions discrètes uniquement"], "r": 2, "e": "Le modèle circomplexe de Russell croise deux axes — valence et activation — sur lesquels se répartissent en cercle tous les états affectifs."}, {"q": "Les émotions sociales ou secondaires se caractérisent par :", "o": ["Une présence dès la naissance", "Une base exclusivement biologique", "Une apparition liée au développement social", "Une absence de valence", "Une fonction uniquement adaptative"], "r": 2, "e": "Les émotions secondaires émergent avec la conscience de soi et l'intériorisation des normes, entre 18 mois et 3 ans : elles supposent un regard social intériorisé."}, {"q": "La honte, la culpabilité et la fierté sont classées comme :", "o": ["Émotions primaires", "Émotions négatives uniquement", "Émotions morales", "États affectifs fondamentaux", "Réactions physiologiques"], "r": 2, "e": "Honte, culpabilité et fierté supposent une norme intériorisée et un jugement porté sur soi : ce sont des émotions auto-évaluatives, dites morales ou secondaires, absentes à la naissance."}, {"q": "Les display rules correspondent :", "o": ["À des règles biologiques universelles", "À des normes culturelles d’expression émotionnelle", "À des réflexes émotionnels", "À des stratégies automatiques", "À des réactions physiologiques"], "r": 1, "e": "Les display rules sont apprises et varient selon la culture, le genre et le contexte : sourire à un cadeau décevant, contenir ses larmes en public."}, {"q": "À partir de quel âge les enfants identifient correctement les expressions faciales de base ? :", "o": ["12 mois", "2 ans", "3 ans", "5 ans", "6 ans"], "r": 2, "e": "Vers 2 ans, l'enfant nomme et reconnaît correctement les expressions de base — joie, tristesse, colère, peur. La finesse et les émotions complexes viendront progressivement."}, {"q": "Selon Saarni (1999), la compétence émotionnelle :", "o": ["Est une capacité unique et globale", "Est indépendante de la compétence sociale", "Est un profil de compétences multiples", "Est acquise uniquement à l’adolescence", "Dépend exclusivement du langage"], "r": 2, "e": "Saarni décrit la compétence émotionnelle comme un ensemble de huit habiletés — conscience de ses émotions, décodage de celles d'autrui, vocabulaire émotionnel, empathie, gestion... — et non comme une aptitude unique."}, {"q": "La distanciation cognitive apparaît généralement :", "o": ["Avant 1 an", "Entre 1 et 3 ans", "Entre 3 et 5 ans", "À partir de 5 ans", "À l’adolescence"], "r": 3, "e": "La distanciation cognitive — se détacher de l'ici et maintenant pour évoquer l'absent, le passé, le futur — s'installe entre 3 et 5 ans, avec la fonction symbolique et le langage."}, {"q": "Durant la troisième enfance, la croissance corporelle se caractérise par :", "o": ["Une accélération comparable à celle de la puberté", "Une croissance lente et régulière", "Une stagnation pondérale", "Une perte de masse musculaire", "Une augmentation rapide du tissu adipeux chez tous les enfants"], "r": 1, "e": "Entre 6 et 12 ans, la croissance est lente et régulière — environ 5 à 6 cm et 2 à 3 kg par an — ce qui contraste avec la poussée pubertaire qui suivra."}, {"q": "Concernant les différences filles/garçons à cet âge :", "o": ["Les garçons se développent plus tôt que les filles", "Les filles présentent davantage de tissu adipeux", "Les garçons conservent plus de masse grasse", "Il n’existe aucune différence", "Les différences apparaissent uniquement à l’adolescence"], "r": 1, "e": "Dès l'enfance, et plus nettement à la puberté, les filles présentent une proportion de masse grasse supérieure et les garçons davantage de masse musculaire."}, {"q": "La pensée de l’enfant à ce stade est dite « concrète » car :", "o": ["Elle est illogique", "Elle repose sur l’intuition", "Elle nécessite des objets ou situations concrètes", "Elle est purement perceptive", "Elle est entièrement abstraite"], "r": 2, "e": "Concrète ne veut pas dire illogique : l'enfant applique une logique réelle, mais qui doit s'appuyer sur des objets ou des situations qu'il peut se représenter. Il échouera au même raisonnement posé en termes purement verbaux."}, {"q": "La mémoire qui se développe le plus durant l’âge scolaire est :", "o": ["Mémoire sensorielle", "Mémoire à long terme", "Mémoire procédurale", "Mémoire à court terme / mémoire de travail", "Mémoire autobiographique"], "r": 3, "e": "L'âge scolaire est marqué par l'essor de la mémoire de travail et surtout par l'apparition des stratégies (répétition, organisation, élaboration) et de la métamémoire qui les pilote."}, {"q": "Selon Erikson, le conflit psychosocial central de la troisième enfance est :", "o": ["Initiative vs culpabilité", "Identité vs confusion des rôles", "Autonomie vs honte", "Productivité (industrie) vs infériorité", "Intimité vs isolement"], "r": 3, "e": "Le 4ᵉ stade, Productivité (industrie) vs infériorité, couvre 6-12 ans : l'enfant se mesure à des tâches réelles et évaluées, à l'école comme dans les activités, et en tire un sentiment de compétence ou d'insuffisance."}, {"q": "À cet âge, l’agression devient principalement :", "o": ["Physique", "Instrumentale", "Relationnelle ou sociale", "Accidentelle", "Inexistante"], "r": 2, "e": "À l'âge scolaire, l'agression se déplace du physique vers le relationnel : exclusion du groupe, rumeurs, mise à l'écart. Elle est plus discrète mais tout aussi délétère."}, {"q": "L’« effet Pygmalion » montre que :", "o": ["Les capacités intellectuelles sont innées", "Les attentes des enseignants influencent la réussite des élèves", "Le QI est immuable", "Les élèves surdoués réussissent toujours", "L’école n’a aucun impact sur le développement"], "r": 1, "e": "Rosenthal et Jacobson ont montré qu'une attente positive induite chez l'enseignant améliore effectivement les résultats de l'élève : l'attente modifie les interactions, qui modifient la performance. C'est une prophétie autoréalisatrice."}, {"q": "L’adolescence débute classiquement avec :", "o": ["L’entrée au collège", "Le développement cognitif abstrait", "La puberté", "La majorité légale", "L’autonomie émotionnelle"], "r": 2, "e": "L'adolescence est classiquement bornée par un repère biologique à son début — la puberté — et par des repères sociaux à sa fin (autonomie, majorité), d'où le flou de son terme."}, {"q": "En moyenne, la puberté commence :", "o": ["Plus tôt chez les garçons que chez les filles", "En même temps chez les deux sexes", "Plus tôt chez les filles que chez les garçons", "Après 15 ans chez tous", "Uniquement à 12 ans"], "r": 2, "e": "La puberté débute en moyenne un à deux ans plus tôt chez les filles (vers 10-11 ans) que chez les garçons (vers 12-13 ans), d'où le décalage de taille observé au collège."}, {"q": "La pensée hypothético-déductive permet à l’adolescent :", "o": ["De raisonner uniquement sur le concret", "De résoudre des problèmes par essais-erreurs", "De raisonner sur des abstractions et des hypothèses", "D’imiter les adultes", "De supprimer l’égocentrisme"], "r": 2, "e": "Le raisonnement hypothético-déductif consiste à poser des hypothèses, en déduire des conséquences, puis les tester en faisant varier une seule variable à la fois. C'est la marque des opérations formelles."}, {"q": "Selon Elkind, le public imaginaire correspond :", "o": ["À une hallucination", "À la croyance que tout le monde observe et juge l’adolescent", "À un trouble anxieux", "À une stratégie sociale consciente", "À une construction propre à l’enfance"], "r": 1, "e": "Le public imaginaire est la sensation constante d'être observé et évalué, qui explique l'hypersensibilité au regard d'autrui à l'adolescence. C'est une forme d'égocentrisme cognitif, non un trouble."}, {"q": "La fable personnelle est principalement associée à :", "o": ["Une peur excessive du danger", "Une estime de soi faible", "Une présomption d’invulnérabilité", "Une maturité émotionnelle accrue", "Un retrait social"], "r": 2, "e": "La fable personnelle est la conviction d'être une exception : « ça n'arrive qu'aux autres ». Elle abaisse la perception du risque et participe des conduites dangereuses de l'adolescence."}, {"q": "Selon Erikson, le conflit psychosocial central de l’adolescence est :", "o": ["Intimité vs isolement", "Productivité vs infériorité", "Autonomie vs honte", "Identité vs confusion des rôles", "Initiative vs culpabilité"], "r": 3, "e": "Le 5ᵉ stade oppose Identité et confusion des rôles : l'adolescent doit unifier ce qu'il a été, ce qu'il ressent et ce que la société attend en un sentiment cohérent de soi."}, {"q": "La vertu sociale développée à l’adolescence est :", "o": ["L’amour", "L’espérance", "La compétence", "La fidélité", "La sagesse"], "r": 3, "e": "Identité vs confusion des rôles donne la fidélité : la capacité de se tenir à des engagements, des valeurs et des liens choisis."}, {"q": "Sur le plan physique, le jeune adulte se caractérise généralement par :", "o": ["Un déclin rapide des capacités motrices", "Un apogée de la force, de l’énergie et de l’endurance", "Une diminution précoce de l’acuité visuelle", "Une augmentation importante des maladies chroniques", "Une instabilité sensorielle marquée"], "r": 1, "e": "Entre 20 et 30 ans, force, endurance, vitesse, acuité sensorielle et fonction immunitaire sont à leur maximum : c'est le sommet physique, qui rend d'ailleurs cette période peu consommatrice de soins."}, {"q": "Selon l’OMS, la santé est définie comme :", "o": ["L’absence totale de maladie", "Un état biologique optimal", "Un état de bien-être physique, mental et social", "Une performance fonctionnelle maximale", "Une ressource uniquement individuelle"], "r": 2, "e": "La définition de 1946, reprise en 1948, pose la santé comme « un état de complet bien-être physique, mental et social, et non seulement l'absence de maladie ou d'infirmité ». Elle fonde l'approche biopsychosociale."}, {"q": "Le lien entre comportement et santé implique que :", "o": ["Les connaissances suffisent à adopter de bons comportements", "Les comportements n’influencent pas les émotions", "Les émotions et le contexte social influencent les comportements de santé", "La santé dépend uniquement de facteurs biologiques", "Les habitudes sont indépendantes de la personnalité"], "r": 2, "e": "Savoir ne suffit pas à faire : les comportements de santé dépendent aussi des émotions, des habitudes, de l'entourage et des conditions matérielles. C'est pourquoi l'information seule change peu les pratiques."}, {"q": "La pensée caractéristique du jeune adulte est dite :", "o": ["Concrète", "Préopératoire", "Hypothético-déductive uniquement", "Post-formelle", "Intuitive exclusive"], "r": 3, "e": "Le jeune adulte accède à la pensée post-formelle : relativiste, contextuelle, capable d'intégrer la contradiction et l'affect dans le raisonnement."}, {"q": "Selon Sinnott, la causalité multiple correspond à :", "o": ["Une cause unique pour chaque problème", "Une explication strictement logique", "La reconnaissance de plusieurs causes et solutions possibles", "Une pensée immature", "Une stratégie purement émotionnelle"], "r": 2, "e": "La causalité multiple est un trait de la pensée post-formelle : admettre qu'un problème a plusieurs causes et plusieurs solutions acceptables, dont le choix dépend du contexte."}, {"q": "Dans la théorie triarchique de Sternberg, l’intelligence pratique est liée :", "o": ["À la résolution de problèmes abstraits", "À la créativité artistique uniquement", "À l’adaptation aux situations concrètes de la vie quotidienne", "À la mémoire de travail", "À la vitesse de traitement"], "r": 2, "e": "L'intelligence pratique, chez Sternberg, est le sens commun appliqué : savoir agir efficacement dans des situations mal définies de la vie réelle. Elle complète l'intelligence analytique et créative."}, {"q": "Selon Erikson, le conflit psychosocial central du jeune adulte est :", "o": ["Identité vs confusion des rôles", "Productivité vs infériorité", "Intimité vs isolement", "Générativité vs stagnation", "Autonomie vs honte"], "r": 2, "e": "Le 6ᵉ stade, Intimité vs isolement, concerne le jeune adulte : la capacité à s'engager dans une relation profonde suppose une identité déjà constituée, sans quoi la fusion est vécue comme une menace."}, {"q": "Au moyen âge, la majorité des individus se caractérise par :", "o": ["Un déclin généralisé et rapide", "Une détérioration cognitive majeure", "Un fonctionnement globalement satisfaisant malgré des changements", "Une perte systématique d’autonomie", "Une baisse uniforme des performances"], "r": 2, "e": "L'âge moyen s'accompagne de changements réels (presbytie, baisse de force, ménopause) sans effondrement : le fonctionnement quotidien reste globalement satisfaisant et l'expertise professionnelle est souvent à son sommet."}, {"q": "La presbytie correspond à :", "o": ["Une perte auditive liée à l’âge", "Une perte de vision de loin", "Une diminution de la capacité à focaliser de près", "Une pathologie oculaire congénitale", "Une perte totale d’acuité visuelle"], "r": 2, "e": "La presbytie vient de la perte d'élasticité du cristallin, qui ne peut plus bomber pour accommoder de près. D'où le geste caractéristique d'éloigner son texte, dès la quarantaine."}, {"q": "Les personnes d’âge moyen ont besoin de plus de lumière principalement en raison :", "o": ["D’une atteinte de la rétine", "De modifications de la pupille", "D’une baisse du cortex visuel", "D’un ralentissement cognitif", "D’une fatigue oculaire chronique"], "r": 1, "e": "Avec l'âge, la pupille se rétrécit et réagit moins (myosis sénile) : moins de lumière atteint la rétine. D'où le besoin d'un éclairage nettement plus intense, avant même toute pathologie rétinienne."}, {"q": "La presbyacousie se caractérise par :", "o": ["Une perte auditive brutale", "Une atteinte des sons graves", "Une perte auditive progressive liée à l’âge", "Une perte auditive uniquement professionnelle", "Une atteinte égale chez les femmes et les hommes"], "r": 2, "e": "La presbyacousie est une perte progressive, bilatérale et symétrique, prédominant sur les aigus, liée à la dégénérescence des cellules ciliées de la cochlée. Elle gêne surtout la compréhension de la parole en milieu bruyant."}, {"q": "Concernant la sensibilité à la douleur à l’âge mûr :", "o": ["Elle augmente systématiquement", "Elle disparaît complètement", "Elle diminue mais reste protectrice", "Elle est mieux tolérée", "Elle n’est pas modifiée"], "r": 2, "e": "La sensibilité à la douleur diminue légèrement avec l'âge, ce qui retarde parfois la perception d'une lésion, mais la fonction d'alerte demeure. C'est un point de vigilance en rééducation."}, {"q": "La diminution du taux métabolique basal débute généralement :", "o": ["À partir de 25 ans", "À partir de 30 ans", "À partir de 40 ans", "À partir de 50 ans", "Après 65 ans"], "r": 2, "e": "Le métabolisme de base décline d'environ 2 à 3 % par décennie à partir de la trentaine, en grande partie par perte de masse maigre. À apport alimentaire constant, cela suffit à expliquer une prise de poids progressive."}, {"q": "Chez les femmes, on considère que la ménopause est installée :", "o": ["Dès la fin de l’ovulation", "Dès l’apparition des symptômes", "Un an après les dernières règles", "À 45 ans systématiquement", "À la fin de la périménopause"], "r": 2, "e": "Le diagnostic de ménopause est rétrospectif : il se pose après douze mois consécutifs d'aménorrhée, en l'absence d'autre cause. L'âge moyen est d'environ 51 ans, mais la variabilité est large."}, {"q": "Selon Erikson, le conflit psychosocial central du moyen âge est :", "o": ["Intimité vs isolement", "Identité vs confusion des rôles", "Générativité vs stagnation", "Autonomie vs honte", "Productivité vs infériorité"], "r": 2, "e": "Le 7ᵉ stade, Générativité vs stagnation, couvre l'âge moyen : transmettre, encadrer, produire quelque chose qui survivra à soi — ou s'enfermer dans la répétition et le repli."}, {"q": "Au troisième âge, la majorité des personnes :", "o": ["Présente un déclin généralisé rapide", "Est en mauvaise santé mentale", "Reste en relativement bonne santé physique et mentale", "Perd toute autonomie fonctionnelle", "Développe systématiquement une démence"], "r": 2, "e": "Contrairement au stéréotype, la majorité des personnes âgées vit à domicile, de façon autonome et sans trouble cognitif majeur. La démence reste minoritaire et sa fréquence, même croissante avec l'âge, ne concerne pas la majorité."}, {"q": "La réserve organique correspond :", "o": ["À la capacité maximale de performance", "À la quantité d’énergie disponible au repos", "À la capacité des systèmes corporels à faire face au stress", "À la vitesse de récupération musculaire", "À la mémoire physiologique"], "r": 2, "e": "La réserve organique est la capacité supplémentaire que chaque organe peut mobiliser en cas de stress, au-delà du fonctionnement de base. Elle diminue avec l'âge, ce qui explique la fragilité des personnes âgées face à une agression banale."}, {"q": "La dégénérescence maculaire liée à l’âge affecte principalement :", "o": ["La vision périphérique", "L’audition", "Le centre de la rétine", "La perception des couleurs", "Les réflexes oculaires"], "r": 2, "e": "La DMLA détruit la macula, zone centrale de la rétine : la vision centrale, fine, se trouble alors que la vision périphérique est conservée. C'est la première cause de malvoyance après 50 ans dans les pays occidentaux."}, {"q": "Concernant l’audition au troisième âge :", "o": ["Les femmes perdent plus les sons aigus", "Les hommes perdent surtout les sons aigus", "Les pertes auditives sont rares", "Les pertes concernent uniquement la parole", "L’audition n’affecte pas la vie quotidienne"], "r": 1, "e": "La presbyacousie touche d'abord les fréquences aiguës et est en moyenne plus précoce et plus marquée chez l'homme, notamment du fait des expositions professionnelles au bruit."}, {"q": "La mémoire la plus résistante au vieillissement normal est :", "o": ["La mémoire épisodique", "La mémoire de travail", "La mémoire sémantique", "La mémoire implicite / procédurale", "La mémoire autobiographique récente"], "r": 3, "e": "La mémoire procédurale — savoir faire du vélo, jouer d'un instrument — est remarquablement préservée dans le vieillissement normal, et même longtemps dans la maladie d'Alzheimer. C'est un appui majeur en rééducation."}, {"q": "Selon Erikson, la question clé du dernier stade est :", "o": ["Puis-je aimer ?", "Suis-je utile ?", "Qui suis-je ?", "Cela valait-il la peine de vivre ?", "Puis-je encore changer ?"], "r": 3, "e": "Le dernier stade est un bilan : « ma vie a-t-elle valu la peine d'être vécue ? ». Y répondre positivement, c'est l'intégrité ; ne pas pouvoir, c'est le désespoir."}, {"q": "Le modèle SOC de Baltes signifie :", "o": ["Soutien – Organisation – Continuité", "Sélection – Optimisation – Compensation", "Socialisation – Objectifs – Cognition", "Santé – Organisation – Cognition", "Spécialisation – Observation – Compensation"], "r": 1, "e": "Sélection, Optimisation, Compensation : le modèle de Baltes décrit le vieillissement réussi comme une gestion active des ressources — restreindre ses objectifs, y consacrer plus de moyens, contourner les pertes."}, {"q": "Dire que le développement est multidimensionnel signifie qu’il :", "o": ["Suit des stades fixes", "Concerne uniquement la cognition", "Implique plusieurs domaines en interaction", "Est identique pour tous", "Dépend uniquement de l’âge"], "r": 2, "e": "Multidimensionnel signifie que le développement se joue simultanément sur plusieurs plans (physique, cognitif, psychosocial) qui s'influencent mutuellement : une puberté précoce a des effets cognitifs et sociaux."}, {"q": "Quelle approche insiste le plus sur le rôle des interactions sociales dans le développement cognitif ? :", "o": ["Piaget", "Skinner", "Vygotsky", "Freud", "Watson"], "r": 2, "e": "Pour Vygotsky, les fonctions psychiques supérieures apparaissent d'abord entre les personnes, puis s'intériorisent : le développement cognitif est d'abord social. Piaget insiste davantage sur l'action individuelle sur le milieu."}, {"q": "La Zone de Développement Proximal implique nécessairement :", "o": ["Une maturation biologique", "Une activité solitaire", "Une aide sociale adaptée", "Un renforcement positif", "Une capacité innée"], "r": 2, "e": "La ZDP n'existe que dans l'interaction : elle désigne ce que l'enfant peut réussir avec un étayage adapté. Sans aide sociale ajustée, il n'y a pas de zone proximale, seulement le niveau actuel."}, {"q": "Le conditionnement opérant explique principalement :", "o": ["L’acquisition du langage", "Les réponses émotionnelles innées", "Le maintien d’un comportement par ses conséquences", "Le raisonnement abstrait", "L’attachement"], "r": 2, "e": "Skinner décrit un comportement volontaire modelé par ses conséquences : renforcé, il augmente ; puni ou non renforcé, il diminue. Le conditionnement classique concerne, lui, des réponses involontaires."}, {"q": "Un bébé qui préfère les visages dès la naissance illustre surtout :", "o": ["Un apprentissage social tardif", "Une construction culturelle", "Une sensibilité perceptive précoce", "Un raisonnement symbolique", "Une imitation consciente"], "r": 2, "e": "Cette préférence n'exige ni apprentissage social élaboré ni symbolisation : elle témoigne d'une sensibilité perceptive précoce aux configurations organisées, qui prépare et facilite le lien."}, {"q": "La permanence de l’objet est un exemple de :", "o": ["Changement quantitatif", "Apprentissage conditionné", "Réorganisation cognitive", "Maturation émotionnelle", "Influence normative historique"], "r": 2, "e": "Comprendre que l'objet caché continue d'exister n'est pas un progrès de quantité : c'est une réorganisation de la représentation du monde, acquise vers 8-12 mois au stade sensori-moteur."}, {"q": "Les display rules montrent que l’expression émotionnelle est :", "o": ["Universelle et immuable", "Entièrement innée", "Socialement modulée", "Identique chez l’enfant et l’adulte", "Dépendante uniquement du tempérament"], "r": 2, "e": "Les display rules sont les règles culturelles qui indiquent quelle émotion montrer, à qui et avec quelle intensité. L'enfant les acquiert progressivement, ce qui prouve que l'expression émotionnelle est modulée socialement même si les émotions de base sont universelles."}, {"q": "L’effet Pygmalion illustre principalement l’influence :", "o": ["Des pairs", "Des hormones", "Des attentes sociales", "De la génétique", "De la motivation intrinsèque"], "r": 2, "e": "L'effet Pygmalion montre le pouvoir des attentes d'autrui : celles de l'enseignant modifient ses interactions avec l'élève, qui finit par s'y conformer."}, {"q": "La fable personnelle à l’adolescence est associée à :", "o": ["Une faible estime de soi", "Une anxiété généralisée", "Un sentiment d’unicité et d’invulnérabilité", "Une maturité émotionnelle élevée", "Une conformité sociale"], "r": 2, "e": "La fable personnelle, décrite par Elkind, est la conviction d'être unique et à l'abri des conséquences qui frappent les autres. Elle éclaire une part des conduites à risque de l'adolescence."}, {"q": "Le conflit Identité vs confusion des rôles est central pour :", "o": ["L’enfance", "La deuxième enfance", "L’adolescence", "Le jeune adulte", "Le moyen âge"], "r": 2, "e": "C'est le 5ᵉ stade d'Erikson, propre à l'adolescence : l'exploration des rôles doit aboutir à une identité choisie plutôt qu'à une confusion ou à un engagement subi."}, {"q": "La pensée post-formelle se caractérise par :", "o": ["Une logique binaire stricte", "Une absence d’émotion", "L’intégration de contradictions", "Un raisonnement purement abstrait", "Une dépendance aux règles formelles"], "r": 2, "e": "Intégrer des contradictions sans les réduire — reconnaître que deux positions opposées peuvent avoir leur part de justesse — est la marque de la pensée post-formelle."}, {"q": "Selon Sternberg, résoudre efficacement un conflit professionnel mobilise surtout :", "o": ["L’intelligence analytique", "L’intelligence créative uniquement", "L’intelligence pratique", "La mémoire de travail", "Le raisonnement formel"], "r": 2, "e": "Gérer un conflit au travail relève de l'intelligence pratique : lire implicitement les règles du milieu et adapter sa conduite, compétence peu corrélée aux tests classiques de QI."}, {"q": "La générativité au moyen âge implique principalement :", "o": ["La réussite personnelle", "La stabilité émotionnelle", "Le souci des générations suivantes", "L’autonomie totale", "Le désengagement social"], "r": 2, "e": "La générativité, c'est le souci de transmettre et de contribuer à ce qui suivra : élever, former, créer, encadrer. Son échec donne la stagnation, repli sur soi et sentiment d'inutilité."}, {"q": "La théorie de la sélectivité socio-émotionnelle explique :", "o": ["L’isolement affectif des personnes âgées", "La perte de relations sociales", "La priorité donnée aux relations émotionnellement significatives", "Le retrait imposé par la société", "Le déclin cognitif"], "r": 2, "e": "Pour Carstensen, la perception d'un temps restant limité fait privilégier les relations émotionnellement gratifiantes au détriment des contacts nombreux. La réduction du réseau social est donc un choix, non un abandon subi."}, {"q": "La mémoire la plus vulnérable au vieillissement normal est :", "o": ["La mémoire procédurale", "La mémoire implicite", "La mémoire épisodique récente", "La mémoire sémantique", "La mémoire émotionnelle"], "r": 2, "e": "La mémoire épisodique récente — où ai-je posé mes clés, qu'ai-je fait hier — est la plus sensible au vieillissement normal, alors que la mémoire sémantique et procédurale résiste."}, {"q": "L’approche éthologique met l’accent sur :", "o": ["Les conflits inconscients", "L’apprentissage scolaire", "L’adaptation biologique", "La construction sociale", "Le langage symbolique"], "r": 2, "e": "L'éthologie explique le comportement par sa valeur adaptative dans l'évolution de l'espèce, observée en milieu naturel : l'attachement y est un dispositif de survie."}, {"q": "L’attachement sécurisé favorise surtout :", "o": ["Une dépendance prolongée", "Une autonomie émotionnelle ultérieure", "Une agressivité accrue", "Une inhibition sociale", "Une rigidité comportementale"], "r": 1, "e": "L'enfant sécurisé utilise la figure d'attachement comme base de sécurité pour explorer ; cette confiance intériorisée soutient plus tard l'autonomie, la régulation émotionnelle et la qualité des relations."}, {"q": "Le discours privé chez l’enfant sert principalement à :", "o": ["Communiquer avec les autres", "Montrer un retard cognitif", "Réguler sa pensée et son action", "Exprimer des émotions", "Apprendre le vocabulaire"], "r": 2, "e": "Pour Vygotsky, le discours privé est un outil d'autorégulation : il guide l'action, surtout dans les tâches difficiles, avant de s'intérioriser en pensée verbale silencieuse."}, {"q": "Un changement normatif lié à l’histoire serait :", "o": ["La marche", "La puberté", "Une guerre", "La ménopause", "Le langage"], "r": 2, "e": "Une influence normative liée à l'histoire touche toute une cohorte au même moment : guerre, pandémie, crise économique. La puberté et la ménopause sont des influences normatives liées à l'âge."}, {"q": "L’alphabétisation en santé implique :", "o": ["Un niveau scolaire élevé", "La compréhension passive de l’information", "La capacité à prendre des décisions éclairées", "Une expertise médicale", "Une prévention tertiaire"], "r": 2, "e": "L'alphabétisation en santé (health literacy) est la capacité à obtenir, comprendre et utiliser l'information de santé pour décider. Elle est active, et un haut niveau scolaire ne la garantit pas."}, {"q": "La différence majeure entre développement et apprentissage est que :", "o": ["L’apprentissage est inné", "Le développement est uniquement biologique", "Le développement inclut des changements et des stabilités", "Ils sont synonymes", "L’apprentissage est toujours conscient"], "r": 2, "e": "Le développement est plus large que l'apprentissage : il englobe maturation, apprentissages et périodes de stabilité, et se déploie sur toute la vie. L'apprentissage en est l'une des composantes."}, {"q": "Une approche biopsychosociale du développement implique :", "o": ["Une analyse centrée sur l’individu", "Une causalité unique", "L’interaction de facteurs biologiques, psychologiques et sociaux", "Une vision strictement médicale", "Une explication uniquement culturelle"], "r": 2, "e": "Le modèle biopsychosocial refuse la causalité unique : un même trouble s'explique par la conjonction de facteurs biologiques, psychologiques et sociaux. C'est le cadre de référence de la rééducation contemporaine."}]};</script>
