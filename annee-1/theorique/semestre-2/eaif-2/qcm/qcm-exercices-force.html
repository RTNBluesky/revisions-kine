<script>window.QUIZ={"titre": "Exercices — Force", "fiche": "../fiches/exercices-force.html", "questions": [{"q": "Combien de principes fondamentaux régissent l'entraînement musculaire ?", "o": ["2", "3", "4", "6"], "r": 2, "e": "4 principes : surcharge, spécificité, maintien/réversibilité, action retardée."}, {"q": "Le principe de SURCHARGE stipule :", "o": ["Toujours utiliser sa charge maximale", "Pour ↑ force, le muscle doit être surchargé (exigence progressive)", "Toujours réduire la charge", "Aucun principe"], "r": 1, "e": "Surcharge progressive : ↑ exigence pour ↑ adaptation."}, {"q": "Le principe de SPÉCIFICITÉ :", "o": ["Tous les muscles s'entraînent identiquement", "Seuls les systèmes sollicités s'adaptent", "Chaque exercice a un seul effet", "Pas de spécificité"], "r": 1, "e": "Spécificité : adaptation des systèmes sollicités selon les besoins."}, {"q": "Le principe de MAINTIEN / RÉVERSIBILITÉ :", "o": ["Les gains sont éternels", "Si le muscle n'est pas exercé, il revient à son état initial", "Aucune perte possible", "Toujours détérioration"], "r": 1, "e": "Réversibilité : pertes en cas d'arrêt."}, {"q": "Le principe d'ACTION RETARDÉE :", "o": ["Résultats immédiats", "Résultats apparaissent en différé (surcompensation)", "Pas d'effet", "Effets aléatoires"], "r": 1, "e": "Surcompensation = adaptation différée."}, {"q": "Les fibres de TYPE I sont :", "o": ["Rapides, fatigables", "Lentes, oxydatives, peu fatigables", "Mixtes", "Inactives"], "r": 1, "e": "Type I = lentes, posturales, oxydatives, peu fatigables."}, {"q": "Les fibres de TYPE IIb sont :", "o": ["Lentes", "Très rapides, glycolytiques + ATP-CP, très fatigables", "Aérobies", "Toniques"], "r": 1, "e": "Type IIb = rapides explosives, anaérobies, fatigables."}, {"q": "Les fibres de TYPE IIa sont :", "o": ["Lentes pures", "Intermédiaires (glycolytiques + oxydatives, rapides, modérément fatigables)", "Identiques à IIb", "Aérobies pures"], "r": 1, "e": "Type IIa = intermédiaires."}, {"q": "Les mitochondries sont nombreuses dans :", "o": ["IIb uniquement", "I et IIa (oxydatives)", "Aucune fibre", "Toutes identiquement"], "r": 1, "e": "Type I et IIa = beaucoup de mitochondries (métabolisme oxydatif)."}, {"q": "La myoglobine est élevée dans :", "o": ["IIb", "I et IIa", "Aucune fibre", "Indépendant du type"], "r": 1, "e": "Myoglobine élevée dans les fibres oxydatives (I et IIa)."}, {"q": "Le système ATP-CP fournit l'énergie pour :", "o": ["1-2 heures", "< 30 sec (sprint, sauts)", "30 min", "Aucun usage"], "r": 1, "e": "ATP-CP : 1/2 sec ATP, 2-10 sec CP. < 30 sec d'effort intense."}, {"q": "La voie glycolytique (anaérobie lactique) couvre :", "o": ["< 5 sec", "Jusqu'à 60 sec (glycogène musculaire), 1-3 min (hépatique)", "> 30 min", "Aucun effort"], "r": 1, "e": "Glycolyse : 30 sec - 3 min selon le glycogène."}, {"q": "La voie aérobie (oxydative) est :", "o": ["Très limitée", "Illimitée (glucides puis lipides)", "Inactive", "Uniquement anaérobie"], "r": 1, "e": "Aérobie : illimitée en capacité, mais puissance faible."}, {"q": "Facteur limitant de la voie glycolytique :", "o": ["Manque d'O2", "Acidose (acide lactique, ions H) → inhibition glycolyse", "Manque d'ATP", "Manque de glucose seul"], "r": 1, "e": "Métabolites acides → acidose → inhibition."}, {"q": "Un sprint 100 m utilise :", "o": ["ATP-PC principalement", "Glycolytique secondairement", "Aérobie principalement", "Lipides"], "r": [0, 1], "e": "Effort < 30 sec : ATP-PC, glycolytique en complément."}, {"q": "Un marathon utilise principalement :", "o": ["ATP-PC", "Glycolytique", "Aérobie (glucides puis lipides)", "Anaérobie alactique"], "r": 2, "e": "> 3 min = oxydative."}, {"q": "Un sprint 400 m (30-90 sec) utilise principalement :", "o": ["ATP-PC", "Glycolytique", "Aérobie", "Lipides"], "r": 1, "e": "30-90 sec = glycolytique."}, {"q": "Un faible taux d'innervation (peu de fibres / motoneurone) caractérise :", "o": ["Quadriceps, biceps", "Larynx, globe oculaire, doigts (mouvements précis)", "Tous les muscles", "Aucun muscle"], "r": 1, "e": "Faible ratio = précision motrice (mouvements fins)."}, {"q": "Un grand nombre de fibres / motoneurone caractérise :", "o": ["Mouvements précis", "Mouvements grossiers (jumeaux, biceps, quadriceps)", "Doigts", "Globe oculaire"], "r": 1, "e": "Grand ratio = mouvements grossiers, force."}, {"q": "Co-contraction agoniste/antagoniste :", "o": ["Mouvements rapides balistiques", "Mouvements lents avec ↑ stabilité articulaire", "Aucune activation", "Inversion d'activation"], "r": 1, "e": "Co-contraction = stabilité, mouvements lents."}, {"q": "Innervation réciproque :", "o": ["Co-contraction", "Inversion de l'activation agoniste/antagoniste (mouvements rapides, balistiques)", "Aucune", "Aléatoire"], "r": 1, "e": "Réciproque = inversion → rapidité (sport, balistique)."}, {"q": "Contraction CONCENTRIQUE :", "o": ["Maintien", "Diminution de longueur (raccourcissement)", "Augmentation de longueur", "Aucun changement"], "r": 1, "e": "Concentrique = raccourcissement."}, {"q": "Contraction EXCENTRIQUE :", "o": ["Diminution", "Augmentation de longueur (allongement sous tension)", "Maintien", "Repos"], "r": 1, "e": "Excentrique = allongement sous tension."}, {"q": "Contraction ISOMÉTRIQUE :", "o": ["Diminution", "Augmentation", "Maintien (pas de mouvement, ↑ tension)", "Aucune force"], "r": 2, "e": "Isométrique = statique, pas de mouvement visible."}, {"q": "Quel type de contraction ↑ la force avec la vitesse ?", "o": ["Concentrique", "Excentrique", "Isométrique", "Aucune"], "r": 1, "e": "Excentrique : ↑ force avec ↑ vitesse (concentrique ↓ force avec ↑ vitesse)."}, {"q": "L'isométrique ne doit pas dépasser :", "o": ["3 min", "10 minutes", "30 min", "1 h"], "r": 1, "e": "Isométrie : ≤ 10 min/séance, jamais en apnée."}, {"q": "L'isocinétique est :", "o": ["Statique", "Dynamique à vitesse constante (résistance variable)", "Anaérobie pure", "Sans matériel"], "r": 1, "e": "Isocinétique : vitesse constante, résistance variable proportionnelle."}, {"q": "Avantage majeur de l'isocinétique :", "o": ["Coût faible", "Résistance variable proportionnelle à la force → force max à tous les angles", "Pas besoin de matériel", "Toujours fonctionnel"], "r": 1, "e": "Isocinétique : force max à chaque degré de l'amplitude."}, {"q": "L'isométrique a comme inconvénient majeur :", "o": ["Aucun", "↑ travail cardiaque (Valsalva si apnée), gain limité à l'amplitude travaillée", "Toujours douloureuse", "Gain immédiat trop important"], "r": 1, "e": "Isométrie : limites cardiovasculaires (apnée) et gain limité à l'angle travaillé."}, {"q": "Force ANALYTIQUE :", "o": ["Groupe musculaire isolé (ex. extension du genou)", "Modèle de mouvement complet", "Aucune mesure", "Force au quotidien"], "r": 0, "e": "Analytique = muscle/groupe isolé."}, {"q": "Le principe de surcharge suppose une exigence :", "o": ["Constante", "Progressive", "Décroissante", "Maximale d'emblée"], "r": 1, "e": "Pour augmenter force et résistance, le muscle doit être surchargé, mais de façon graduée."}, {"q": "Les fibres de type IIa se caractérisent par une capillarisation :", "o": ["Faible", "Élevée", "Nulle", "Variable selon l'âge"], "r": 1, "e": "Elles partagent avec les fibres I une capillarisation et un taux de mitochondries élevés, mais s'en distinguent par une contraction rapide."}, {"q": "L'excitabilité des fibres de type I est décrite comme :", "o": ["Tonique", "Phasique", "Intermédiaire", "Absente"], "r": 0, "e": "Les fibres IIb sont phasiques et les IIa intermédiaires."}, {"q": "La myoglobine des fibres de type IIa est :", "o": ["Faible", "Modérément élevée", "Nulle", "Identique à celle des IIb"], "r": 1, "e": "Elle est élevée dans les fibres I et faible dans les fibres IIb."}, {"q": "La voie anaérobie alactique fournit de l'énergie pendant :", "o": ["Une demi-seconde pour l'ATP et 2 à 10 secondes pour la créatine-phosphate", "Jusqu'à 60 secondes", "1 à 3 minutes", "Plus de 3 minutes"], "r": 0, "e": "Sa puissance est très élevée mais sa capacité très limitée."}, {"q": "La voie aérobie se caractérise par :", "o": ["Une capacité illimitée et une puissance faible", "Une capacité limitée et une puissance élevée", "Une capacité et une puissance très élevées", "Une durée inférieure à 30 secondes"], "r": 0, "e": "La voie anaérobie alactique a au contraire une puissance très élevée pour une capacité très limitée."}, {"q": "Une activité de 90 à 180 secondes, comme une course de 800 mètres ou la boxe, mobilise :", "o": ["L'ATP-PC seul", "Les voies glycolytique et oxydative", "La voie oxydative seule", "La voie alactique"], "r": 1, "e": "Au-delà de 3 minutes, la voie oxydative domine ; en deçà de 30 secondes, l'ATP-PC."}, {"q": "Une activité de 30 à 90 secondes, comme un sprint de 400 mètres ou la natation, mobilise principalement :", "o": ["Le système ATP-PC", "Le système glycolytique", "Le système oxydatif", "Aucun des trois"], "r": 1, "e": "Le glycogène hépatique y est sollicité de 1 à 3 minutes, la voie couvrant jusqu'à 60 secondes."}, {"q": "La co-contraction agoniste/antagoniste correspond à :", "o": ["Des mouvements lents, avec une stabilité articulaire accrue", "Des mouvements rapides et balistiques", "Une inversion de l'activation", "Une contraction isolée"], "r": 0, "e": "L'innervation réciproque, par inversion de l'activation, sous-tend au contraire les mouvements rapides et balistiques."}, {"q": "La force analytique se travaille :", "o": ["Sur un groupe musculaire isolé, comme l'extension du genou", "Sur un modèle de mouvement, comme le contrôle actif de l'épaule", "En chaîne fermée uniquement", "Avec un partenaire"], "r": 0, "e": "La force fonctionnelle s'organise, elle, autour d'un modèle de mouvement."}, {"q": "La contraction excentrique se caractérise, par rapport à la concentrique, par :", "o": ["Un gain de force à court terme et une acquisition précoce", "Un gain de force à long terme et une acquisition plus tardive", "Une moindre exigence de coordination", "Une diminution de force avec la vitesse"], "r": 1, "e": "Elle exige aussi davantage de coordination et voit sa force augmenter avec la vitesse."}, {"q": "La contraction concentrique se caractérise par :", "o": ["Une augmentation de force avec la vitesse", "Une diminution de force avec l'augmentation de la vitesse", "Une longueur constante", "Une vitesse constante imposée"], "r": 1, "e": "Elle apporte un gain de force à court terme, s'acquiert plus tôt et exige moins de coordination."}, {"q": "La contraction isométrique se caractérise sur le plan tissulaire par :", "o": ["Une modification de la taille des fibres", "Aucune modification de la taille des fibres, mais une modification de la tension", "Un allongement des fibres", "Un raccourcissement des fibres"], "r": 1, "e": "Elle est courante dans les muscles posturaux et stabilisateurs."}, {"q": "Parmi les avantages de la contraction isométrique, le cours cite :", "o": ["Sa praticabilité n'importe où, un matériel minimal et un gain de force rapide", "Un gain sur toute l'amplitude", "Une variété importante", "Une absence d'effet cardiaque"], "r": 0, "e": "Ses inconvénients sont l'augmentation du travail cardiaque par l'apnée, la monotonie et un gain limité à l'amplitude travaillée."}, {"q": "La durée totale de travail isométrique dans une séance ne doit pas dépasser :", "o": ["5 minutes", "10 minutes", "20 minutes", "30 minutes"], "r": 1, "e": "L'apnée y est par ailleurs proscrite, et un étirement avec relaxation est recommandé à la fin."}, {"q": "La contraction isocinétique se définit par :", "o": ["Une charge constante", "Une vitesse constante, par exemple 60°/s, avec une résistance variable", "Une absence de mouvement", "Une résistance constante"], "r": 1, "e": "Elle peut être concentrique ou excentrique, la résistance étant proportionnelle à la force du patient."}, {"q": "L'avantage majeur de l'isocinétique est :", "o": ["Une résistance variable proportionnelle à la force développée à chaque instant", "Un coût réduit", "Une praticabilité partout", "L'absence de matériel"], "r": 0, "e": "C'est ce qui permet de solliciter le muscle au maximum de ses possibilités sur toute l'amplitude."}, {"q": "Le principe d'action retardée signifie que :", "o": ["Les résultats apparaissent en différé, par surcompensation", "L'effort doit être différé", "Le muscle se contracte avec retard", "La récupération est immédiate"], "r": 0, "e": "C'est ce qui justifie la planification des cycles d'entraînement et des périodes de récupération."}, {"q": "Le principe de spécificité énonce que :", "o": ["Seuls les systèmes sollicités s'adaptent", "Tous les systèmes s'adaptent simultanément", "L'adaptation est générale", "La surcharge suffit"], "r": 0, "e": "L'entraînement doit donc respecter les besoins propres du muscle visé."}, {"q": "Le principe de maintien ou réversibilité énonce que :", "o": ["Les gains sont définitifs", "Si le muscle n'est pas exercé, il revient à son état initial", "La force se maintient six mois", "Seule la masse se perd"], "r": 1, "e": "C'est l'argument central de la poursuite d'un entretien après la phase de gain."}]};</script>
