    <script>window.QUIZ={"titre": "Exercices — Force", "fiche": "../fiches/exercices-force.html", "questions": [{"q": "Combien de principes fondamentaux régissent l'entraînement musculaire ?", "o": ["2", "3", "4", "6"], "r": 2, "e": "4 principes : surcharge, spécificité, maintien/réversibilité, action retardée."}, {"q": "Le principe de SURCHARGE stipule :", "o": ["Toujours utiliser sa charge maximale, dès la première séance", "Une exigence progressive, au-delà de l'habituel", "Toujours réduire la charge, à chaque séance", "Aucun principe établi, au hasard"], "r": 1, "e": "Surcharge progressive : ↑ exigence pour ↑ adaptation. Pour gagner en force, le muscle doit être surchargé."}, {"q": "Le principe de SPÉCIFICITÉ :", "o": ["Tous les muscles s'entraînent identiquement", "Seuls les systèmes sollicités s'adaptent", "Chaque exercice a un seul effet", "Pas de spécificité"], "r": 1, "e": "Spécificité : adaptation des systèmes sollicités selon les besoins."}, {"q": "Le principe de MAINTIEN / RÉVERSIBILITÉ :", "o": ["Les gains sont définitifs, une fois acquis", "Sans exercice, le muscle revient à son état initial", "Aucune perte n'est possible, même après un arrêt", "La détérioration est toujours inévitable"], "r": 1, "e": "Réversibilité : pertes en cas d'arrêt."}, {"q": "Le principe d'ACTION RETARDÉE :", "o": ["Des résultats immédiats, dès la séance", "Des résultats différés, par surcompensation", "Une absence d'effet, quel que soit le programme suivi", "Des effets aléatoires, imprévisibles"], "r": 1, "e": "Surcompensation = adaptation différée."}, {"q": "Les fibres de TYPE I sont :", "o": ["Rapides, glycolytiques et fatigables", "Lentes, oxydatives et peu fatigables", "Mixtes, entre lentes et rapides, selon l'entraînement", "Inactives au repos, sans tonus"], "r": 1, "e": "Type I = lentes, posturales, oxydatives, peu fatigables."}, {"q": "Les fibres de TYPE IIb sont :", "o": ["Lentes, oxydatives et résistantes à la fatigue", "Très rapides, glycolytiques et très fatigables", "Aérobies, riches en mitochondries", "Toniques et posturales, au repos"], "r": 1, "e": "Type IIb = rapides explosives, anaérobies, fatigables. Elles utilisent aussi l'ATP-CP."}, {"q": "Les fibres de TYPE IIa sont :", "o": ["Lentes et purement oxydatives", "Intermédiaires, rapides et modérément fatigables", "Identiques aux IIb, très fatigables", "Aérobies pures, comme les fibres de type I des muscles posturaux"], "r": 1, "e": "Type IIa = intermédiaires. Elles sont à la fois glycolytiques et oxydatives."}, {"q": "Les mitochondries sont nombreuses dans :", "o": ["Les seules fibres de type IIb, glycolytiques", "Les fibres de type I et IIa, oxydatives", "Aucune fibre musculaire", "Toutes les fibres, de façon égale"], "r": 1, "e": "Type I et IIa = beaucoup de mitochondries (métabolisme oxydatif)."}, {"q": "La myoglobine est élevée dans :", "o": ["IIb", "I et IIa", "Aucune fibre", "Indépendant du type"], "r": 1, "e": "Myoglobine élevée dans les fibres oxydatives (I et IIa)."}, {"q": "Le système ATP-CP fournit l'énergie pour :", "o": ["Des efforts de 1 à 2 heures, comme le marathon ou le vélo", "Des efforts de moins de 30 secondes, comme le sprint", "Des efforts de 30 minutes", "Aucun usage pratique, à l'effort"], "r": 1, "e": "ATP-CP : 1/2 sec ATP, 2-10 sec CP. < 30 sec d'effort intense."}, {"q": "La voie glycolytique (anaérobie lactique) couvre :", "o": ["Moins de 5 secondes, comme un saut ou un lancer bref", "Jusqu'à 60 secondes, puis 1 à 3 minutes par le foie", "Plus de 30 minutes, à faible intensité", "Aucun type d'effort, au repos"], "r": 1, "e": "Glycolyse : 30 sec - 3 min selon le glycogène. Le glycogène musculaire, puis hépatique, l'alimente."}, {"q": "La voie aérobie (oxydative) est :", "o": ["Très limitée en capacité, de 10 s", "Illimitée, avec les glucides puis les lipides", "Inactive à l'effort, utilisée seulement pendant le sommeil", "Uniquement anaérobie, sans oxygène"], "r": 1, "e": "Aérobie : illimitée en capacité, mais puissance faible."}, {"q": "Facteur limitant de la voie glycolytique :", "o": ["Le manque d'oxygène dans les mitochondries", "L'acidose, qui inhibe la glycolyse", "Le manque d'ATP disponible", "Le manque de glucose, seul"], "r": 1, "e": "Métabolites acides → acidose → inhibition. Elle est due aux ions H⁺ et à l'acide lactique."}, {"q": "Un sprint 100 m utilise :", "o": ["L'ATP-PC, principalement", "La glycolyse, secondairement", "La voie aérobie, principalement", "Les lipides, secondairement"], "r": [0, 1], "e": "Effort < 30 sec : ATP-PC, glycolytique en complément."}, {"q": "Un marathon utilise principalement :", "o": ["L'ATP-PC, en continu, au long cours", "La glycolyse anaérobie, avec production de lactate", "L'aérobie, avec les glucides puis les lipides", "L'anaérobie alactique, rapide"], "r": 2, "e": "> 3 min = oxydative."}, {"q": "Un sprint 400 m (30-90 sec) utilise principalement :", "o": ["ATP-PC", "Glycolytique", "Aérobie", "Lipides"], "r": 1, "e": "30-90 sec = glycolytique."}, {"q": "Un faible taux d'innervation (peu de fibres / motoneurone) caractérise :", "o": ["Le quadriceps et le biceps", "Le larynx, le globe oculaire et les doigts", "Tous les muscles du corps", "Aucun muscle, ce ratio étant toujours élevé chez l'homme"], "r": 1, "e": "Faible ratio = précision motrice (mouvements fins). Ce sont des muscles de mouvements précis."}, {"q": "Un grand nombre de fibres / motoneurone caractérise :", "o": ["Les mouvements précis, comme ceux de l'œil", "Les gros muscles, comme le quadriceps", "Les muscles des doigts", "Le globe oculaire et le larynx"], "r": 1, "e": "Grand ratio = mouvements grossiers, force. Ils assurent des mouvements grossiers."}, {"q": "Co-contraction agoniste/antagoniste :", "o": ["Des mouvements rapides et balistiques", "Des mouvements lents, avec une stabilité accrue", "Une absence d'activation, au repos", "Une inversion de l'activation, comme dans un lancer rapide"], "r": 1, "e": "Co-contraction = stabilité, mouvements lents."}, {"q": "Innervation réciproque :", "o": ["Une co-contraction, pour stabiliser", "Une inversion de l'activation, pour les gestes rapides", "Aucune activation, le geste étant passif et entièrement réflexe", "Une activation aléatoire des deux muscles"], "r": 1, "e": "Réciproque = inversion → rapidité (sport, balistique). Elle concerne agoniste et antagoniste, dans les gestes balistiques."}, {"q": "Contraction CONCENTRIQUE :", "o": ["Un maintien de la longueur", "Un raccourcissement du muscle", "Un allongement du muscle, sous une tension croissante", "Aucun changement de tension"], "r": 1, "e": "Concentrique = raccourcissement."}, {"q": "Contraction EXCENTRIQUE :", "o": ["Un raccourcissement du muscle", "Un allongement du muscle, sous tension", "Un maintien de la longueur, avec une tension constante", "Un repos complet du muscle"], "r": 1, "e": "Excentrique = allongement sous tension."}, {"q": "Contraction ISOMÉTRIQUE :", "o": ["Un raccourcissement du muscle", "Un allongement du muscle, sous charge", "Un maintien de la longueur, avec tension", "Aucune force produite"], "r": 2, "e": "Isométrique = statique, pas de mouvement visible."}, {"q": "Quel type de contraction ↑ la force avec la vitesse ?", "o": ["Concentrique", "Excentrique", "Isométrique", "Aucune"], "r": 1, "e": "Excentrique : ↑ force avec ↑ vitesse (concentrique ↓ force avec ↑ vitesse)."}, {"q": "L'isométrique ne doit pas dépasser :", "o": ["3 min", "10 minutes", "30 min", "1 h"], "r": 1, "e": "Isométrie : ≤ 10 min/séance, jamais en apnée."}, {"q": "L'isocinétique est :", "o": ["Une contraction statique, fixe", "Un travail à vitesse constante", "Un effort anaérobie pur", "Un travail sans matériel"], "r": 1, "e": "Isocinétique : vitesse constante, résistance variable proportionnelle. La résistance y est variable."}, {"q": "Avantage majeur de l'isocinétique :", "o": ["Un coût très faible, à l'achat", "Une résistance adaptée, donc une force maximale à tout angle", "L'absence de matériel, pour un travail à domicile, sans appareil", "Un caractère toujours fonctionnel"], "r": 1, "e": "Isocinétique : force max à chaque degré de l'amplitude. La résistance est proportionnelle à la force."}, {"q": "L'isométrique a comme inconvénient majeur :", "o": ["Aucun inconvénient notable", "Un travail cardiaque accru et un gain limité à l'angle", "Une douleur constante, quelle que soit l'intensité du travail", "Un gain immédiat trop important"], "r": 1, "e": "Isométrie : limites cardiovasculaires (apnée) et gain limité à l'angle travaillé. L'apnée provoque un effet Valsalva."}, {"q": "Force ANALYTIQUE :", "o": ["Un groupe musculaire isolé, comme l'extension du genou", "Un modèle de mouvement complet", "Une absence de mesure, au hasard", "La force utile au quotidien, dans les gestes de la vie courante"], "r": 0, "e": "Analytique = muscle/groupe isolé."}, {"q": "Le principe de surcharge suppose une exigence :", "o": ["Constante", "Progressive", "Décroissante", "Maximale d'emblée"], "r": 1, "e": "Pour augmenter force et résistance, le muscle doit être surchargé, mais de façon graduée."}, {"q": "Les fibres de type IIa se caractérisent par une capillarisation :", "o": ["Faible", "Élevée", "Nulle", "Variable selon l'âge"], "r": 1, "e": "Elles partagent avec les fibres I une capillarisation et un taux de mitochondries élevés, mais s'en distinguent par une contraction rapide."}, {"q": "L'excitabilité des fibres de type I est décrite comme :", "o": ["Tonique", "Phasique", "Intermédiaire", "Absente"], "r": 0, "e": "Les fibres IIb sont phasiques et les IIa intermédiaires."}, {"q": "La myoglobine des fibres de type IIa est :", "o": ["Faible", "Modérément élevée", "Nulle", "Identique à celle des IIb"], "r": 1, "e": "Elle est élevée dans les fibres I et faible dans les fibres IIb."}, {"q": "La voie anaérobie alactique fournit de l'énergie pendant :", "o": ["Une demi-seconde pour l'ATP et 2 à 10 s pour la CP", "Jusqu'à 60 secondes, avec le glycogène et l'ATP", "De 1 à 3 minutes, avec le foie", "Plus de 3 minutes, avec l'oxygène"], "r": 0, "e": "Sa puissance est très élevée mais sa capacité très limitée. La CP est la créatine-phosphate."}, {"q": "La voie aérobie se caractérise par :", "o": ["Une capacité illimitée et une puissance faible", "Une capacité limitée et une puissance élevée", "Une capacité et une puissance très élevées", "Une durée inférieure à 30 secondes"], "r": 0, "e": "La voie anaérobie alactique a au contraire une puissance très élevée pour une capacité très limitée."}, {"q": "Une activité de 90 à 180 secondes, comme une course de 800 mètres ou la boxe, mobilise :", "o": ["L'ATP-PC seul, sur un effort bref", "Les voies glycolytique et oxydative", "La voie oxydative seule, de longue durée", "La voie alactique, comme pour un saut ou un départ de sprint"], "r": 1, "e": "Au-delà de 3 minutes, la voie oxydative domine ; en deçà de 30 secondes, l'ATP-PC."}, {"q": "Une activité de 30 à 90 secondes, comme un sprint de 400 mètres ou la natation, mobilise principalement :", "o": ["Le système ATP-PC", "Le système glycolytique", "Le système oxydatif", "Aucun des trois"], "r": 1, "e": "Le glycogène hépatique y est sollicité de 1 à 3 minutes, la voie couvrant jusqu'à 60 secondes."}, {"q": "La co-contraction agoniste/antagoniste correspond à :", "o": ["Des mouvements lents, avec une stabilité accrue", "Des mouvements rapides et balistiques", "Une inversion de l'activation, comme lors d'un lancer de balle", "Une contraction isolée de l'agoniste"], "r": 0, "e": "L'innervation réciproque, par inversion de l'activation, sous-tend au contraire les mouvements rapides et balistiques. La stabilité est articulaire."}, {"q": "La force analytique se travaille :", "o": ["Sur un groupe musculaire isolé, comme l'extension du genou", "Sur un modèle de mouvement, comme le contrôle de l'épaule", "En chaîne fermée uniquement, avec un appui au sol et des charges", "Avec un partenaire, en duo, face à face"], "r": 0, "e": "La force fonctionnelle s'organise, elle, autour d'un modèle de mouvement."}, {"q": "La contraction excentrique se caractérise, par rapport à la concentrique, par :", "o": ["Un gain de force à court terme et une acquisition précoce", "Un gain de force à long terme et une acquisition plus tardive", "Une moindre exigence de coordination", "Une diminution de force avec la vitesse"], "r": 1, "e": "Elle exige aussi davantage de coordination et voit sa force augmenter avec la vitesse."}, {"q": "La contraction concentrique se caractérise par :", "o": ["Une hausse de la force avec la vitesse du geste", "Une baisse de la force quand la vitesse augmente", "Une longueur constante du muscle", "Une vitesse imposée par une machine"], "r": 1, "e": "Elle apporte un gain de force à court terme, s'acquiert plus tôt et exige moins de coordination."}, {"q": "La contraction isométrique se caractérise sur le plan tissulaire par :", "o": ["Une modification de la taille des fibres", "Une tension modifiée, sans changement de taille des fibres", "Un allongement des fibres, sous tension", "Un raccourcissement des fibres, avec une hypertrophie immédiate"], "r": 1, "e": "Elle est courante dans les muscles posturaux et stabilisateurs."}, {"q": "Parmi les avantages de la contraction isométrique, le cours cite :", "o": ["Un matériel minimal et un gain de force rapide", "Un gain sur toute l'amplitude", "Une grande variété d'exercices", "Une absence totale d'effet sur le cœur et la pression artérielle"], "r": 0, "e": "Ses inconvénients sont l'augmentation du travail cardiaque par l'apnée, la monotonie et un gain limité à l'amplitude travaillée. Elle se pratique n'importe où."}, {"q": "La durée totale de travail isométrique dans une séance ne doit pas dépasser :", "o": ["5 minutes", "10 minutes", "20 minutes", "30 minutes"], "r": 1, "e": "L'apnée y est par ailleurs proscrite, et un étirement avec relaxation est recommandé à la fin."}, {"q": "La contraction isocinétique se définit par :", "o": ["Une charge constante, de 10 kg", "Une vitesse constante, par exemple 60°/s", "Une absence de mouvement, en statique", "Une résistance constante, quelle que soit la force produite"], "r": 1, "e": "Elle peut être concentrique ou excentrique, la résistance étant proportionnelle à la force du patient. La résistance y est variable."}, {"q": "L'avantage majeur de l'isocinétique est :", "o": ["Une résistance qui s'adapte à la force à chaque instant", "Un coût réduit, pour le cabinet", "Une praticabilité partout, même au domicile du patient", "L'absence de matériel, à la maison"], "r": 0, "e": "C'est ce qui permet de solliciter le muscle au maximum de ses possibilités sur toute l'amplitude."}, {"q": "Le principe d'action retardée signifie que :", "o": ["Les résultats apparaissent en différé, par surcompensation", "L'effort doit être différé de quelques jours, après la blessure", "Le muscle se contracte avec retard", "La récupération est immédiate"], "r": 0, "e": "C'est ce qui justifie la planification des cycles d'entraînement et des périodes de récupération."}, {"q": "Le principe de spécificité énonce que :", "o": ["Seuls les systèmes sollicités s'adaptent", "Tous les systèmes s'adaptent simultanément", "L'adaptation est générale", "La surcharge suffit"], "r": 0, "e": "L'entraînement doit donc respecter les besoins propres du muscle visé."}, {"q": "Le principe de maintien ou réversibilité énonce que :", "o": ["Les gains sont définitifs", "Sans exercice, le muscle revient à son état initial", "La force se maintient six mois", "Seule la masse se perd, la force restant intacte des années"], "r": 1, "e": "C'est l'argument central de la poursuite d'un entretien après la phase de gain."}]};</script>
