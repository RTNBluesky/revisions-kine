      <div class="quiz-head"><p>50 questions à choix multiple. Mode révision : correction immédiate. Mode examen : correction et score à la fin.</p><div class="bar"><i></i></div><p style="margin-top:8px" id="compteur"></p></div><div id="quiz"></div>

    <script>window.QUIZ={"titre": "Exercices — RSM", "fiche": "../fiches/exercices-rsm.html", "questions": [{"q": "La RSM vise principalement :", "o": ["La force maximale, en charge", "La qualité du mouvement et le contrôle moteur", "La consommation d'oxygène, à l'effort maximal", "La masse musculaire, en volume"], "r": 1, "e": "RSM = effet direct sur la physiologie neuromusculaire et le contrôle moteur."}, {"q": "Les propriocepteurs incluent :", "o": ["Les mécanorécepteurs articulaires", "Les récepteurs musculaires", "Les récepteurs cutanés", "Les cônes et les bâtonnets", "Les glandes endocrines"], "r": [0, 1, 2], "e": "Propriocepteurs : articulaires + musculaires + cutanés. La capsule, les ligaments, le fuseau et le motoneurone gamma en font partie."}, {"q": "Rôle des propriocepteurs :", "o": ["Réguler la tension artérielle", "Indiquer la position des segments dans l'espace", "Assurer une sécrétion hormonale", "Aucun rôle, en dehors de la douleur et de la température"], "r": 1, "e": "Fondamentaux pour le contrôle moteur. Ils renseignent aussi dans le temps."}, {"q": "Le cycle vicieux de l'instabilité commence par :", "o": ["Une maladie cardiaque, puis une fatigue à l'effort", "Un dysfonctionnement musculo-squelettique", "Un stress mental, chronique", "Une hypoglycémie, à jeun"], "r": 1, "e": "Dysfonction MSK → ↓ proprio → perte d'activation/stabilisation → schéma moteur altéré. La proprioception baisse ensuite."}, {"q": "Stabilité STRUCTURELLE (passive) :", "o": ["Le système sensorimoteur, réflexe et rapide", "La capsule, les ligaments et la congruence", "Le cerveau, par la planification", "Le cœur, par la perfusion"], "r": 1, "e": "Passive = anatomie passive (capsule, ligaments, surfaces)."}, {"q": "Stabilité FONCTIONNELLE (active) :", "o": ["L'anatomie seule, capsule, ligaments et surfaces", "Le système sensorimoteur et les muscles", "Aucune structure, en pratique", "La posture uniquement, au repos et debout"], "r": 1, "e": "Active = dynamique, dépend des muscles et du SN. L'activation est neuromusculaire, par des mécanismes locaux et globaux."}, {"q": "Stabilisation LOCALE :", "o": ["Un mécanisme réflexe", "Un circuit entre mécanorécepteurs et muscles", "La vitesse de contraction, plus que la force", "Une stabilisation par les chaînes globales", "Des schémas de co-contraction"], "r": [0, 1, 2, 4], "e": "Locale : réflexe, vitesse > force, co-contraction. Globale = quadrants."}, {"q": "Stabilisation GLOBALE :", "o": ["Un réflexe articulaire isolé, local et rapide", "Des chaînes, scapulo-thoracique et lombo-pelvienne", "Aucune chaîne musculaire, seulement des ligaments", "Une stabilisation par le cœur"], "r": 1, "e": "Globale = stabilisation proximale par chaînes. Ce sont les quadrants supérieur et inférieur."}, {"q": "Le quadrant supérieur correspond à :", "o": ["Lombo-pelvien", "Scapulo-thoracique", "Cervico-céphalique", "Plantaire"], "r": 1, "e": "Quadrant supérieur = stabilité scapulo-thoracique."}, {"q": "Le quadrant inférieur correspond à :", "o": ["Scapulo-thoracique", "Lombo-pelvien", "Cervical", "Pied uniquement"], "r": 1, "e": "Quadrant inférieur = stabilité lombo-pelvienne."}, {"q": "Les 3 systèmes intégrés pour l'équilibre :", "o": ["Vestibulaire", "Visuel", "Proprioceptif", "Cardiaque", "Digestif"], "r": [0, 1, 2], "e": "3 piliers de l'équilibre : vestibulaire + visuel + proprioceptif."}, {"q": "Réactions d'équilibre automatiques :", "o": ["TT (tibio-tarsienne)", "Hanche", "Pas", "Suspension", "Genou"], "r": [0, 1, 2, 3], "e": "4 réactions : TT, hanche, pas, suspension."}, {"q": "Le TSM (entraînement sensorimoteur) a été développé par :", "o": ["George Maitland, en Australie", "Vladimir Janda, en Tchéquie", "Carl Kaltenborn, en Norvège", "Robert Lovett, aux États-Unis"], "r": 1, "e": "Janda = TSM, philosophie équilibre > force. Il a vécu de 1928 à 2002."}, {"q": "Selon Janda, dans les activités fonctionnelles :", "o": ["La force prime sur tout le reste, toujours", "L'équilibre et la stabilisation réflexe priment sur la force", "L'aérobie prime sur la force et l'équilibre", "La souplesse seule prime, quelle que soit l'activité fonctionnelle"], "r": 1, "e": "Janda : équilibre/stabilisation réflexe > force pure pour le quotidien."}, {"q": "Avantages du TSM :", "o": ["Une hausse de l'activité EMG", "Une hausse de l'équilibre postural", "Une hausse de la proprioception", "Une baisse des chutes et des récidives", "Une prévention des blessures sportives", "Une hausse de la VO2 maximale"], "r": [0, 1, 2, 3, 4], "e": "Pas d'effet direct sur la VO2max."}, {"q": "3 points clés du TSM :", "o": ["La posture neutre des pieds, des lombaires et du cou", "La respiration diaphragmatique", "Le contrôle du centre de gravité", "L'apnée volontaire, pendant l'effort", "La force maximale, en charge"], "r": [0, 1, 2], "e": "3 piliers : posture + respiration + contrôle CG."}, {"q": "Le TSM commence à quel niveau ?", "o": ["Avec partenaire", "Fonctionnel", "Statique", "Dynamique"], "r": 2, "e": "Progression : Statique → Dynamique → Fonctionnel → Avec partenaire."}, {"q": "Niveau STATIQUE :", "o": ["Des mouvements des membres, sur un sol stable et dur", "L'équilibre sur surfaces instables, yeux fermés", "Des mouvements fonctionnels, comme le squat", "Des activités en binôme, avec un ballon"], "r": 1, "e": "Statique : maintien sur surfaces instables progressives. Il comprend aussi des transferts de poids."}, {"q": "Niveau DYNAMIQUE :", "o": ["Un maintien statique de l'équilibre, yeux fermés", "Des mouvements des membres, en gardant l'équilibre", "Un travail sans aucun matériel", "Des activités exclusivement assises"], "r": 1, "e": "Dynamique : ajout de mouvements + matériel d'instabilité. Bandes, ballons et poids légers y sont utilisés."}, {"q": "Niveau FONCTIONNEL :", "o": ["Un travail statique pur, debout", "Des gestes fonctionnels, comme la fente, sur surface instable", "Un travail sans aucune charge", "Un niveau inutile, à supprimer de la progression du programme"], "r": 1, "e": "Fonctionnel : tâches motrices complexes. Le squat et le step en sont d'autres exemples."}, {"q": "Matériel typique du TSM :", "o": ["Surfaces en mousse", "Planches d'équilibre", "BOSU", "Trampoline", "Tapis de course", "Haltères lourds"], "r": [0, 1, 2, 3], "e": "4 matériels d'instabilité progressive. Pas tapis de course ni haltères lourds."}, {"q": "Surfaces en mousse — code couleur de difficulté :", "o": ["Rouge, puis bleue, puis jaune", "Verte, puis bleue, puis noire", "Un ordre aléatoire, selon la marque", "Aucun code, seule l'épaisseur indiquant la difficulté"], "r": 1, "e": "Verte (plus dure) → bleue → noire (plus instable). La difficulté est croissante."}, {"q": "L'instabilité progressive est obtenue par :", "o": ["La base de soutien réduite et le centre de gravité déplacé", "L'augmentation progressive des charges, en kilogrammes", "L'ajout d'haltères uniquement, sur un sol stable", "L'absence de variation, d'une séance à l'autre"], "r": 0, "e": "Progression : ↓ BS, déplacement CG, instabilité augmentée."}, {"q": "Mécanismes locaux de stabilisation :", "o": ["Stabilisation articulaire réflexe", "Circuit mécanorécepteurs → muscles péri-articulaires", "Schémas de co-contraction", "Stabilisation lombo-pelvienne globale", "Réaction du quadrant supérieur"], "r": [0, 1, 2], "e": "Locaux : réflexes péri-articulaires. Globaux = chaînes."}, {"q": "Le motoneurone gamma intervient dans :", "o": ["Le contrôle du rythme cardiaque", "La sensibilité du fuseau musculaire à l'étirement", "La sécrétion d'adrénaline", "La vision, par le réglage du cristallin et de la pupille"], "r": 1, "e": "Gamma = sensibilité du fuseau musculaire."}, {"q": "Une dysfonction MSK altère la proprioception parce que :", "o": ["Aucun lien n'existe entre les deux", "Elle modifie les afférences des mécanorécepteurs", "Elle active uniquement la vision", "Elle n'a aucun rapport avec le système nerveux"], "r": 1, "e": "Lésion articulaire → ↓ informations proprioceptives → schémas moteurs altérés."}, {"q": "Le TSM avec partenaire est :", "o": ["Le niveau initial du programme", "Le niveau avancé, en binôme ou en groupe", "Un niveau inutile, à éviter en rééducation fonctionnelle", "Un niveau réservé aux enfants"], "r": 1, "e": "Avec partenaire = niveau final, activités complexes en binôme. Il se pratique sur surfaces instables."}, {"q": "Le TSM aide à :", "o": ["Augmenter la force pure, à l'EMG", "Améliorer l'activité EMG et la réaction", "Réduire la digestion, après les repas", "Baisser la tension artérielle, au repos"], "r": 1, "e": "Bénéfices neuromusculaires (EMG, activation, vitesse). Les schémas d'activation s'améliorent aussi."}, {"q": "Pour la prévention des récidives, le TSM est :", "o": ["Inutile, faute de preuve scientifique solide et récente", "Très efficace, contre les chutes et les récidives", "Dangereux, à l'âge adulte", "Sans aucune preuve, ni pour ni contre"], "r": 1, "e": "Études soutiennent l'efficacité du TSM pour la prévention."}, {"q": "Sur surface instable, la posture neutre des pieds, lombaires et cervicales est :", "o": ["Optionnelle, selon le confort", "Essentielle, comme premier point clé", "Inutile, sur surface instable", "À éviter, car elle fige le mouvement et limite la réaction"], "r": 1, "e": "Posture neutre = base de stabilité réflexe. C'est le premier point clé de Janda."}, {"q": "La reprogrammation sensorimotrice vise à maintenir ou améliorer :", "o": ["La qualité du mouvement et le contrôle moteur", "L'amplitude articulaire, passive", "La longueur des fibres musculaires, par des étirements longs", "La puissance musculaire, explosive"], "r": 0, "e": "C'est le cinquième pilier de l'exercice thérapeutique. Elle agit directement sur la physiologie neuromusculaire."}, {"q": "Les mécanorécepteurs articulaires siègent :", "o": ["Dans la capsule et les ligaments", "Dans le tendon, uniquement", "Dans le muscle, uniquement", "Dans la peau, uniquement, sous l'épiderme"], "r": 0, "e": "Les récepteurs musculaires, avec le motoneurone gamma, et les récepteurs cutanés complètent le système proprioceptif."}, {"q": "Le rôle des propriocepteurs est d'indiquer :", "o": ["La position des segments dans l'espace et le temps", "La force développée par le muscle, en newtons", "La température de la peau, au contact", "La douleur, par les nocicepteurs"], "r": 0, "e": "Ils sont fondamentaux pour le contrôle et la qualité du mouvement."}, {"q": "Le cycle vicieux de l'instabilité débute par :", "o": ["Un dysfonctionnement musculo-squelettique", "Un programme moteur altéré", "Un modèle de mouvement anormal", "Une perte d'activation musculaire, autour de l'articulation"], "r": 0, "e": "Il entraîne une baisse de proprioception, puis une perte d'activation, un programme moteur altéré et un mouvement anormal — qui relance le cycle."}, {"q": "La stabilité structurelle, dite passive, repose sur :", "o": ["La capsule, les ligaments et la congruence articulaire", "Le système sensorimoteur, réflexe, et l'activation des muscles", "L'activation neuromusculaire", "Les chaînes musculaires, globales"], "r": 0, "e": "La stabilité fonctionnelle, active, repose au contraire sur le système sensorimoteur et l'activation neuromusculaire."}, {"q": "La stabilisation articulaire réflexe, mécanisme local, repose sur :", "o": ["Un circuit entre récepteurs articulaires et muscles", "Les chaînes neuromusculaires proximales, globales", "Le système vestibulaire, dans l'oreille", "La force maximale, développée par le muscle"], "r": 0, "e": "Elle se réalise par des schémas de co-contraction."}, {"q": "Dans la stabilisation réflexe locale, ce qui compte le plus est :", "o": ["La force du muscle elle-même", "La réaction réflexe et la vitesse de contraction", "L'amplitude disponible, sur toute la course articulaire", "L'endurance du muscle, au long cours"], "r": 1, "e": "C'est l'un des arguments centraux de Janda : l'équilibre et la stabilisation réflexe priment sur la force dans les activités fonctionnelles."}, {"q": "La stabilisation globale du quadrant supérieur correspond à :", "o": ["La stabilité scapulo-thoracique", "La stabilité lombo-pelvienne", "La stabilité de la cheville", "La stabilité cervicale"], "r": 0, "e": "Le quadrant inférieur correspond, lui, à la stabilité lombo-pelvienne."}, {"q": "Les réactions d'équilibre automatiques citées par le cours sont :", "o": ["Tibio-tarsienne, hanche, pas et suspension", "Cheville et hanche uniquement", "Pas et protection", "Vestibulaire, visuelle et proprioceptive"], "r": 0, "e": "L'équilibre lui-même résulte de l'intégration des systèmes vestibulaire, visuel et proprioceptif."}, {"q": "Vladimir Janda a vécu de :", "o": ["1928 à 2002", "1900 à 1975", "1940 à 2010", "1950 à 2015"], "r": 0, "e": "Il a défendu l'idée que l'équilibre et la stabilisation réflexe importent davantage que la force dans les activités fonctionnelles."}, {"q": "Parmi les avantages de l'entraînement sensorimoteur, le cours cite :", "o": ["Une hausse de l'activité mesurée en EMG", "Une hausse de la masse musculaire, à l'IRM", "Une hausse de l'amplitude passive, mesurée au goniomètre", "Une baisse du tonus, au repos"], "r": 0, "e": "S'y ajoutent l'amélioration des schémas d'activation et des temps de réaction, de l'équilibre, de la proprioception et de la force."}, {"q": "L'entraînement sensorimoteur permet notamment :", "o": ["De diminuer le risque de chutes et de récidives", "D'augmenter la vitesse de course, sur sprint court et long", "D'augmenter la capacité aérobie", "De réduire la masse grasse"], "r": 0, "e": "Il prévient et réduit également les blessures sportives."}, {"q": "Les trois points clés du TSM sont :", "o": ["La posture, la respiration et le centre de gravité", "La force, la vitesse et l'endurance", "L'amplitude, la souplesse et la force", "Les niveaux statique, dynamique et fonctionnel"], "r": 0, "e": "La posture concerne les pieds, les lombaires et les cervicales, en position neutre ; le contrôle du centre de gravité s'accompagne de mouvements excentriques. La respiration est diaphragmatique."}, {"q": "Le niveau statique du TSM comprend notamment :", "o": ["L'équilibre sur surfaces instables et l'appui unipodal", "L'ajout de mouvements des membres", "Des gestes fonctionnels, comme le squat, la fente et le step", "Des activités en binôme, avec ballon"], "r": 0, "e": "Les mouvements de la tête et la variation des bases d'appui s'y ajoutent. Les transferts de poids et les yeux fermés en font aussi partie."}, {"q": "Le niveau dynamique du TSM consiste à :", "o": ["D'ajouter des mouvements des membres en gardant l'équilibre", "De maintenir une position statique, yeux fermés", "De réaliser des squats et des fentes, sur un sol stable", "De travailler en binôme, avec un partenaire"], "r": 0, "e": "Bandes, flexbars, ballons et poids légers y sont utilisés."}, {"q": "Le niveau fonctionnel du TSM utilise :", "o": ["Le squat, la fente et le step, sur surface instable", "Le seul maintien statique", "Des mouvements des membres, en position stable", "Des activités de groupe, en binôme, avec des jeux de ballon"], "r": 0, "e": "Le niveau avec partenaire ajoute ensuite des activités dynamiques en binôme ou en groupe."}, {"q": "Le matériel du TSM comprend :", "o": ["Mousses, planches d'équilibre, BOSU et trampoline", "Des haltères, des barres et des machines de musculation", "Des élastiques, uniquement", "Un tapis de course et un TRX"], "r": 0, "e": "Les surfaces en mousse sont codées par couleur — verte, bleue, noire — selon la difficulté."}, {"q": "La progression complète du TSM est :", "o": ["Statique → dynamique → fonctionnel → avec partenaire", "Fonctionnel → dynamique → statique → avec partenaire", "Dynamique → statique → fonctionnel", "Avec partenaire → fonctionnel → statique"], "r": 0, "e": "Chaque niveau s'accompagne de surfaces instables progressives."}, {"q": "La respiration recommandée pendant le TSM est :", "o": ["Diaphragmatique", "En apnée", "Thoracique haute", "Forcée"], "r": 0, "e": "Elle figure parmi les trois points clés, avec la posture neutre et le contrôle du centre de gravité."}, {"q": "La stabilité fonctionnelle repose sur des mécanismes :", "o": ["Locaux et globaux", "Locaux uniquement", "Globaux uniquement", "Purement passifs"], "r": 0, "e": "Les mécanismes locaux relèvent de la stabilisation articulaire réflexe, les globaux des chaînes neuromusculaires proximales."}]};</script>
