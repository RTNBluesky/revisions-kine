<script>window.QUIZ={"titre": "Exercices — RSM", "fiche": "../fiches/exercices-rsm.html", "questions": [{"q": "La RSM vise principalement :", "o": ["La force", "La qualité du mouvement (physiologie neuromusculaire, contrôle moteur)", "La VO2max", "La masse musculaire"], "r": 1, "e": "RSM = effet direct sur la physiologie neuromusculaire et le contrôle moteur."}, {"q": "Les propriocepteurs incluent :", "o": ["Mécanorécepteurs articulaires (capsule, ligaments)", "Récepteurs musculaires (fuseau, motoneurone gamma)", "Récepteurs musculaires cutanés", "Cônes et bâtonnets", "Glandes endocrines"], "r": [0, 1, 2], "e": "Propriocepteurs : articulaires + musculaires + cutanés."}, {"q": "Rôle des propriocepteurs :", "o": ["Régulation de la TA", "Indiquer la position des segments dans l'espace et le temps", "Sécrétion hormonale", "Aucun rôle"], "r": 1, "e": "Fondamentaux pour le contrôle moteur."}, {"q": "Le cycle vicieux de l'instabilité commence par :", "o": ["Maladie cardiaque", "Dysfonctionnement musculo-squelettique → ↓ proprioception", "Stress mental", "Hypoglycémie"], "r": 1, "e": "Dysfonction MSK → ↓ proprio → perte d'activation/stabilisation → schéma moteur altéré."}, {"q": "Stabilité STRUCTURELLE (passive) :", "o": ["Système sensorimoteur", "Capsule, ligaments, congruence articulaire", "Cerveau", "Cœur"], "r": 1, "e": "Passive = anatomie passive (capsule, ligaments, surfaces)."}, {"q": "Stabilité FONCTIONNELLE (active) :", "o": ["Anatomie pure", "Système sensorimoteur, activation neuromusculaire, mécanismes locaux + globaux", "Aucune", "Liée uniquement à la posture"], "r": 1, "e": "Active = dynamique, dépend des muscles et du SN."}, {"q": "Stabilisation LOCALE :", "o": ["Réflexe", "Circuit entre mécanorécepteurs articulaires et muscles", "Réaction réflexe + vitesse de contraction > force", "Stabilisation par chaînes globales", "Schémas de co-contraction"], "r": [0, 1, 2, 4], "e": "Locale : réflexe, vitesse > force, co-contraction. Globale = quadrants."}, {"q": "Stabilisation GLOBALE :", "o": ["Réflexe articulaire isolé", "Chaînes neuromusculaires : quadrant supérieur (scapulo-thoracique), quadrant inférieur (lombo-pelvienne)", "Aucune", "Cardiaque"], "r": 1, "e": "Globale = stabilisation proximale par chaînes."}, {"q": "Le quadrant supérieur correspond à :", "o": ["Lombo-pelvien", "Scapulo-thoracique", "Cervico-céphalique", "Plantaire"], "r": 1, "e": "Quadrant supérieur = stabilité scapulo-thoracique."}, {"q": "Le quadrant inférieur correspond à :", "o": ["Scapulo-thoracique", "Lombo-pelvien", "Cervical", "Pied uniquement"], "r": 1, "e": "Quadrant inférieur = stabilité lombo-pelvienne."}, {"q": "Les 3 systèmes intégrés pour l'équilibre :", "o": ["Vestibulaire", "Visuel", "Proprioceptif", "Cardiaque", "Digestif"], "r": [0, 1, 2], "e": "3 piliers de l'équilibre : vestibulaire + visuel + proprioceptif."}, {"q": "Réactions d'équilibre automatiques :", "o": ["TT (tibio-tarsienne)", "Hanche", "Pas", "Suspension", "Genou"], "r": [0, 1, 2, 3], "e": "4 réactions : TT, hanche, pas, suspension."}, {"q": "Le TSM (entraînement sensorimoteur) a été développé par :", "o": ["George Maitland", "Vladimir Janda (1928-2002)", "Carl Kaltenborn", "Robert Lovett"], "r": 1, "e": "Janda = TSM, philosophie équilibre > force."}, {"q": "Selon Janda, dans les activités fonctionnelles :", "o": ["La force prime", "L'équilibre et la stabilisation réflexe sont plus importants que la force", "L'aérobie prime", "La souplesse seule prime"], "r": 1, "e": "Janda : équilibre/stabilisation réflexe > force pure pour le quotidien."}, {"q": "Avantages du TSM :", "o": ["↑ activité EMG", "↑ équilibre et stabilité posturale", "↑ proprioception", "↓ chutes et récidives", "Prévient les blessures sportives", "↑ VO2max"], "r": [0, 1, 2, 3, 4], "e": "Pas d'effet direct sur la VO2max."}, {"q": "3 points clés du TSM :", "o": ["Posture (pieds, lombaires, cervicales neutres)", "Respiration (diaphragmatique)", "Contrôle du centre de gravité", "Apnée volontaire", "Force maximale"], "r": [0, 1, 2], "e": "3 piliers : posture + respiration + contrôle CG."}, {"q": "Le TSM commence à quel niveau ?", "o": ["Avec partenaire", "Fonctionnel", "Statique", "Dynamique"], "r": 2, "e": "Progression : Statique → Dynamique → Fonctionnel → Avec partenaire."}, {"q": "Niveau STATIQUE :", "o": ["Mouvements MS/MI", "Maintien équilibre sur surfaces instables, transferts de poids, yeux fermés", "Mouvements fonctionnels", "Activités en binôme"], "r": 1, "e": "Statique : maintien sur surfaces instables progressives."}, {"q": "Niveau DYNAMIQUE :", "o": ["Maintien statique", "Mouvements MS et/ou MI tout en maintenant l'équilibre, bandes/ballons/poids", "Sans matériel", "Activités exclusivement assises"], "r": 1, "e": "Dynamique : ajout de mouvements + matériel d'instabilité."}, {"q": "Niveau FONCTIONNEL :", "o": ["Statique pur", "Mouvements fonctionnels (squat, fente, step) sur surfaces instables", "Sans charge", "Inutile"], "r": 1, "e": "Fonctionnel : tâches motrices complexes."}, {"q": "Matériel typique du TSM :", "o": ["Surfaces en mousse", "Planches d'équilibre", "BOSU", "Trampoline", "Tapis de course", "Haltères lourds"], "r": [0, 1, 2, 3], "e": "4 matériels d'instabilité progressive. Pas tapis de course ni haltères lourds."}, {"q": "Surfaces en mousse — code couleur de difficulté :", "o": ["Rouge → bleu → jaune", "Verte → bleue → noire (difficulté croissante)", "Aléatoire", "Aucun code"], "r": 1, "e": "Verte (plus dure) → bleue → noire (plus instable)."}, {"q": "L'instabilité progressive est obtenue par :", "o": ["Modification progressive de la BS (base de soutien) et du CG", "Augmentation des charges", "Ajout d'haltères uniquement", "Sans variation"], "r": 0, "e": "Progression : ↓ BS, déplacement CG, instabilité augmentée."}, {"q": "Mécanismes locaux de stabilisation :", "o": ["Stabilisation articulaire réflexe", "Circuit mécanorécepteurs → muscles péri-articulaires", "Schémas de co-contraction", "Stabilisation lombo-pelvienne globale", "Réaction du quadrant supérieur"], "r": [0, 1, 2], "e": "Locaux : réflexes péri-articulaires. Globaux = chaînes."}, {"q": "Le motoneurone gamma intervient dans :", "o": ["Le cœur", "La régulation du fuseau musculaire (sensibilité à l'étirement)", "La sécrétion d'adrénaline", "La vision"], "r": 1, "e": "Gamma = sensibilité du fuseau musculaire."}, {"q": "Une dysfonction MSK altère la proprioception parce que :", "o": ["Aucun lien", "Modifie l'afférence des mécanorécepteurs articulaires", "Active uniquement les yeux", "Sans rapport avec le SN"], "r": 1, "e": "Lésion articulaire → ↓ informations proprioceptives → schémas moteurs altérés."}, {"q": "Le TSM avec partenaire est :", "o": ["Niveau initial", "Niveau avancé : activités en binôme/groupe sur surfaces instables", "Inutile", "Réservé aux enfants"], "r": 1, "e": "Avec partenaire = niveau final, activités complexes en binôme."}, {"q": "Le TSM aide à :", "o": ["Augmenter la force pure", "↑ niveaux d'activité EMG, schémas d'activation, temps de réaction", "Réduire la digestion", "↓ tension artérielle"], "r": 1, "e": "Bénéfices neuromusculaires (EMG, activation, vitesse)."}, {"q": "Pour la prévention des récidives, le TSM est :", "o": ["Inutile", "Très efficace pour ↓ chutes et récidives", "Dangereux", "Sans preuve"], "r": 1, "e": "Études soutiennent l'efficacité du TSM pour la prévention."}, {"q": "Sur surface instable, la posture neutre des pieds, lombaires et cervicales est :", "o": ["Optionnelle", "Essentielle (1er point clé Janda)", "Inutile", "À éviter"], "r": 1, "e": "Posture neutre = base de stabilité réflexe."}, {"q": "La reprogrammation sensorimotrice vise à maintenir ou améliorer :", "o": ["La qualité du mouvement, avec des effets directs sur la physiologie neuromusculaire et le contrôle moteur", "L'amplitude articulaire", "La longueur des fibres", "La puissance"], "r": 0, "e": "C'est le cinquième pilier de l'exercice thérapeutique."}, {"q": "Les mécanorécepteurs articulaires siègent :", "o": ["Dans la capsule et les ligaments", "Dans le tendon uniquement", "Dans le muscle uniquement", "Dans la peau uniquement"], "r": 0, "e": "Les récepteurs musculaires, avec le motoneurone gamma, et les récepteurs cutanés complètent le système proprioceptif."}, {"q": "Le rôle des propriocepteurs est d'indiquer :", "o": ["La position des segments dans l'espace et le temps", "La force développée", "La température", "La douleur"], "r": 0, "e": "Ils sont fondamentaux pour le contrôle et la qualité du mouvement."}, {"q": "Le cycle vicieux de l'instabilité débute par :", "o": ["Un dysfonctionnement musculo-squelettique", "Un programme moteur altéré", "Un modèle de mouvement anormal", "Une perte d'activation musculaire"], "r": 0, "e": "Il entraîne une baisse de proprioception, puis une perte d'activation, un programme moteur altéré et un mouvement anormal — qui relance le cycle."}, {"q": "La stabilité structurelle, dite passive, repose sur :", "o": ["La capsule, les ligaments et la congruence articulaire", "Le système sensorimoteur", "L'activation neuromusculaire", "Les chaînes musculaires"], "r": 0, "e": "La stabilité fonctionnelle, active, repose au contraire sur le système sensorimoteur et l'activation neuromusculaire."}, {"q": "La stabilisation articulaire réflexe, mécanisme local, repose sur :", "o": ["Un circuit réflexe entre mécanorécepteurs articulaires et muscles entourant l'articulation", "Les chaînes neuromusculaires proximales", "Le système vestibulaire", "La force maximale"], "r": 0, "e": "Elle se réalise par des schémas de co-contraction."}, {"q": "Dans la stabilisation réflexe locale, ce qui compte le plus est :", "o": ["La force elle-même", "La réaction réflexe et la vitesse de contraction", "L'amplitude disponible", "L'endurance"], "r": 1, "e": "C'est l'un des arguments centraux de Janda : l'équilibre et la stabilisation réflexe priment sur la force dans les activités fonctionnelles."}, {"q": "La stabilisation globale du quadrant supérieur correspond à :", "o": ["La stabilité scapulo-thoracique", "La stabilité lombo-pelvienne", "La stabilité de la cheville", "La stabilité cervicale"], "r": 0, "e": "Le quadrant inférieur correspond, lui, à la stabilité lombo-pelvienne."}, {"q": "Les réactions d'équilibre automatiques citées par le cours sont :", "o": ["Tibio-tarsienne, hanche, pas et suspension", "Cheville et hanche uniquement", "Pas et protection", "Vestibulaire, visuelle et proprioceptive"], "r": 0, "e": "L'équilibre lui-même résulte de l'intégration des systèmes vestibulaire, visuel et proprioceptif."}, {"q": "Vladimir Janda a vécu de :", "o": ["1928 à 2002", "1900 à 1975", "1940 à 2010", "1950 à 2015"], "r": 0, "e": "Il a défendu l'idée que l'équilibre et la stabilisation réflexe importent davantage que la force dans les activités fonctionnelles."}, {"q": "Parmi les avantages de l'entraînement sensorimoteur, le cours cite :", "o": ["Une augmentation des niveaux d'activité mesurés en EMG", "Une augmentation de la masse musculaire", "Une augmentation de l'amplitude passive", "Une diminution du tonus"], "r": 0, "e": "S'y ajoutent l'amélioration des schémas d'activation et des temps de réaction, de l'équilibre, de la proprioception et de la force."}, {"q": "L'entraînement sensorimoteur permet notamment :", "o": ["De diminuer le risque de chutes et de récidives", "D'augmenter la vitesse de course", "D'augmenter la capacité aérobie", "De réduire la masse grasse"], "r": 0, "e": "Il prévient et réduit également les blessures sportives."}, {"q": "Les trois points clés du TSM sont :", "o": ["Posture, respiration diaphragmatique et contrôle du centre de gravité", "Force, vitesse et endurance", "Amplitude, souplesse et force", "Statique, dynamique et fonctionnel"], "r": 0, "e": "La posture concerne les pieds, les lombaires et les cervicales, en position neutre ; le contrôle du centre de gravité s'accompagne de mouvements excentriques."}, {"q": "Le niveau statique du TSM comprend notamment :", "o": ["Le maintien de l'équilibre sur surfaces instables progressives, les transferts de poids, la fermeture des yeux et l'appui unipodal", "L'ajout de mouvements des membres", "Des mouvements fonctionnels comme le squat", "Des activités en binôme"], "r": 0, "e": "Les mouvements de la tête et la variation des bases d'appui s'y ajoutent."}, {"q": "Le niveau dynamique du TSM consiste à :", "o": ["Ajouter des mouvements des membres supérieurs et/ou inférieurs tout en maintenant l'équilibre", "Maintenir une position statique", "Réaliser des squats et des fentes", "Travailler en binôme"], "r": 0, "e": "Bandes, flexbars, ballons et poids légers y sont utilisés."}, {"q": "Le niveau fonctionnel du TSM utilise :", "o": ["Des mouvements fonctionnels comme le squat, la fente et le step, sur surfaces instables progressives", "Le seul maintien statique", "Des mouvements des membres en position stable", "Des activités de groupe"], "r": 0, "e": "Le niveau avec partenaire ajoute ensuite des activités dynamiques en binôme ou en groupe."}, {"q": "Le matériel du TSM comprend :", "o": ["Surfaces en mousse, planches d'équilibre, BOSU et trampoline", "Haltères et barres", "Élastiques uniquement", "Tapis de course"], "r": 0, "e": "Les surfaces en mousse sont codées par couleur — verte, bleue, noire — selon la difficulté."}, {"q": "La progression complète du TSM est :", "o": ["Statique → dynamique → fonctionnel → avec partenaire", "Fonctionnel → dynamique → statique", "Dynamique → statique → fonctionnel", "Avec partenaire → fonctionnel → statique"], "r": 0, "e": "Chaque niveau s'accompagne de surfaces instables progressives."}, {"q": "La respiration recommandée pendant le TSM est :", "o": ["Diaphragmatique", "En apnée", "Thoracique haute", "Forcée"], "r": 0, "e": "Elle figure parmi les trois points clés, avec la posture neutre et le contrôle du centre de gravité."}, {"q": "La stabilité fonctionnelle repose sur des mécanismes :", "o": ["Locaux et globaux", "Locaux uniquement", "Globaux uniquement", "Purement passifs"], "r": 0, "e": "Les mécanismes locaux relèvent de la stabilisation articulaire réflexe, les globaux des chaînes neuromusculaires proximales."}]};</script>
