<script>window.QUIZ={"titre": "Exercices — Mobilité", "fiche": "../fiches/exercices-mobilite.html", "questions": [{"q": "Les exercices de mobilité visent à :", "o": ["↑ la force musculaire", "Maintenir/améliorer l'amplitude articulaire (physiologie articulaire)", "↓ la masse osseuse", "Augmenter la VO2max"], "r": 1, "e": "Mobilité : effet direct sur l'amplitude et la physiologie articulaire."}, {"q": "L'immobilisation peut être bénéfique pour :", "o": ["Le repos après blessure (cicatrisation)", "Toujours néfaste", "Renforcer le muscle", "Augmenter la mobilité"], "r": 0, "e": "Repos = bénéfique pour la cicatrisation initiale."}, {"q": "Effets systémiques nuisibles de l'immobilisation :", "o": ["Musculo-squelettique", "Cardiovasculaire", "Respiratoire", "Tégumentaire", "Endocrinien"], "r": [0, 1, 2, 3], "e": "4 grands systèmes affectés : MSK, CV, respi, tégumentaire."}, {"q": "Effets MSK de l'immobilisation :", "o": ["↓ masse osseuse (ostéopénie)", "Atrophie musculaire", "↓ ROM", "↑ masse graisseuse", "↑ masse osseuse"], "r": [0, 1, 2, 3], "e": "Tous sauf ↑ masse osseuse (qui diminue)."}, {"q": "Effets cardiovasculaires de l'immobilisation :", "o": ["↓ volume sanguin", "↓ débit cardiaque", "↑ retour veineux", "Hypotension orthostatique", "Thromboses veineuses profondes"], "r": [0, 1, 3, 4], "e": "Retour veineux diminué, pas augmenté."}, {"q": "Effets respiratoires de l'immobilisation :", "o": ["Pneumonies", "Embolie pulmonaire", "Asthme", "BPCO"], "r": [0, 1], "e": "Pneumonies et EP fréquentes. Asthme et BPCO sont chroniques préexistantes."}, {"q": "L'effet local nuisible de l'immobilisation est :", "o": ["Renforcement musculaire", "Modifications tissulaires (capsule, ligaments, tendons)", "Augmentation de la ROM", "Aucun"], "r": 1, "e": "Local : capsule, ligaments, tendons s'altèrent (rétraction)."}, {"q": "Le tégumentaire peut être affecté par :", "o": ["Augmentation de la peau", "Escarres", "Cicatrisation accrue", "Aucun problème"], "r": 1, "e": "Immobilisation → escarres."}, {"q": "Avantages de la mobilité :", "o": ["Indépendance et fonctionnalité", "↑ et maintien de l'amplitude", "Stimule la circulation/retour veineux", "Charge nécessaire à l'os (prévention ostéoporose)", "Prévient les escarres", "Augmentation de la raideur capsulaire"], "r": [0, 1, 2, 3, 4], "e": "5 avantages majeurs. La raideur capsulaire résulte de l'immobilisation ; la mobilité la combat."}, {"q": "Idées clés pour la mobilité active :", "o": ["Mouvement libre", "Qualité du mouvement (schéma)", "Amplitude", "Force maximale", "Répétition"], "r": [0, 1, 2, 4], "e": "La force max n'est pas un objectif de la mobilité."}, {"q": "En thérapie manuelle, la mobilité est :", "o": ["Active", "Passive (accessoire + physiologique)", "Volontaire", "Réflexe"], "r": 1, "e": "Thérapie manuelle = mobilité passive."}, {"q": "En exercice, la mobilité est :", "o": ["Passive", "Active (volontaire)", "Réflexe", "Imposée"], "r": 1, "e": "Exercice = mobilité active."}, {"q": "L'ostéoporose se prévient par :", "o": ["L'immobilisation", "La charge mécanique sur l'os", "Le repos", "L'alcool"], "r": 1, "e": "L'os a besoin de charges pour maintenir sa densité (loi de Wolff)."}, {"q": "L'hypotension orthostatique survient :", "o": ["Au repos", "Au passage couché → debout après alitement prolongé", "En position assise", "En décubitus"], "r": 1, "e": "Alitement → ↓ volume sanguin → hypotension orthostatique au levée."}, {"q": "Les thromboses veineuses profondes (TVP) sont favorisées par :", "o": ["Mouvement", "Stase veineuse (immobilisation)", "Exercice", "Hydratation"], "r": 1, "e": "Stase veineuse = facteur principal de TVP (triade de Virchow)."}, {"q": "L'embolie pulmonaire est :", "o": ["Une infection", "Complication d'une TVP, urgence vitale", "Une allergie", "Une rétention urinaire"], "r": 1, "e": "EP : migration d'un thrombus de la TVP vers les artères pulmonaires."}, {"q": "L'amplitude se perd à quelle vitesse en immobilisation ?", "o": ["Très lentement", "Rapidement (atrophie musculaire, raccourcissement)", "Jamais", "Variable selon l'humeur"], "r": 1, "e": "Pertes rapides : muscle (5% force/jour) + raccourcissement capsulo-ligamentaire."}, {"q": "Pour prévenir les escarres lors d'immobilisation :", "o": ["Maintenir la même position", "Redistribuer les pressions (mobilité, changements de position)", "Aucune mesure", "Compression continue"], "r": 1, "e": "Redistribuer pressions par mobilité et changements de position."}, {"q": "La mobilité active est :", "o": ["Réalisée par l'évaluateur", "Réalisée volontairement par le patient", "Sous anesthésie", "Sans contrôle moteur"], "r": 1, "e": "Active = par le patient lui-même."}, {"q": "La mobilité passive est :", "o": ["Réalisée par le patient", "Réalisée par l'évaluateur (segment proximal stabilisé)", "Aucune mobilité", "Mouvement réflexe"], "r": 1, "e": "Passive = réalisée par l'évaluateur sans participation active."}, {"q": "Un mouvement analytique cible :", "o": ["Plusieurs articulations en même temps", "Une articulation/segment précis", "Tout le corps", "Aucune cible"], "r": 1, "e": "Analytique = ciblé, articulation/segment isolé."}, {"q": "Un mouvement fonctionnel intègre :", "o": ["Une seule articulation", "Plusieurs articulations dans une tâche cohérente", "Aucune articulation", "Du repos"], "r": 1, "e": "Fonctionnel = tâche globale, multi-articulaire (ex : se lever)."}, {"q": "L'atrophie musculaire en alitement :", "o": ["Touche le muscle striée", "Touche surtout les muscles posturaux (type I) puis tous", "Aucun effet musculaire", "Augmente la force"], "r": 1, "e": "Atrophie touche surtout les fibres lentes posturales d'abord."}, {"q": "Quels facteurs limitent la perte de ROM en immobilisation ?", "o": ["Restriction stricte", "Mobilisation précoce et régulière", "Pression élevée", "Compression durable"], "r": 1, "e": "Mobilisation précoce préserve l'amplitude."}, {"q": "L'augmentation de la masse graisseuse en immobilisation est due à :", "o": ["Renforcement", "Baisse de la dépense énergétique sans baisse calorique", "Alimentation seule", "Activité"], "r": 1, "e": "↓ DE sans ↓ alimentation → bilan calorique positif → ↑ graisse."}, {"q": "L'objectif principal de la mobilité chez la personne alitée :", "o": ["Performance sportive", "Maintenir l'indépendance et la fonctionnalité", "Esthétique", "Réduction du sommeil"], "r": 1, "e": "Indépendance et fonctionnalité = priorité."}, {"q": "Le mouvement libre désigne :", "o": ["Mouvement contre résistance", "Mouvement sans résistance externe ni contrainte", "Mouvement passif", "Aucun mouvement"], "r": 1, "e": "Libre = sans résistance externe."}, {"q": "Indications principales de la mobilité :", "o": ["Post-immobilisation", "Maladies chroniques", "Personnes âgées", "Sportif sain", "Pré-opératoire"], "r": [0, 1, 2, 4], "e": "Le sportif sain en bonne santé pratique mais c'est moins un objectif de soin."}, {"q": "La mobilité contre-indications :", "o": ["Aucune", "Fractures non consolidées, hémorragies actives", "Toutes pathologies", "Douleur légère"], "r": 1, "e": "CI : fractures non consolidées, hémorragies, lésions instables."}, {"q": "L'objectif premier de la mobilité après une chirurgie est :", "o": ["Renforcement maximal", "Restaurer l'amplitude articulaire perdue, éviter les adhérences", "Compétition", "Esthétique"], "r": 1, "e": "Post-chirurgie : récupérer ROM, prévenir adhérences."}, {"q": "La mobilité se définit dans le cours comme un ensemble d'exercices visant à :", "o": ["Maintenir ou améliorer l'amplitude articulaire, avec des effets directs sur la physiologie articulaire", "Allonger les fibres musculaires", "Augmenter la puissance", "Restaurer le contrôle moteur"], "r": 0, "e": "C'est ce qui la distingue de la souplesse, dont l'effet porte directement sur la fibre musculaire."}, {"q": "Parmi les effets musculo-squelettiques nuisibles de l'immobilisation, le cours cite :", "o": ["Une diminution de la masse osseuse, une atrophie musculaire, une diminution d'amplitude et une augmentation de la masse graisseuse", "Une hypertrophie musculaire", "Une augmentation de la densité osseuse", "Une augmentation de l'amplitude"], "r": 0, "e": "La diminution de masse osseuse conduit à l'ostéopénie puis à l'ostéoporose."}, {"q": "Parmi les effets cardiovasculaires de l'immobilisation figurent :", "o": ["Une diminution du volume sanguin, du volume systolique, du débit cardiaque et du retour veineux", "Une augmentation du débit cardiaque", "Une hypertension", "Une bradycardie isolée"], "r": 0, "e": "S'y ajoutent l'hypotension orthostatique et les thromboses veineuses profondes."}, {"q": "Les complications respiratoires de l'immobilisation citées sont :", "o": ["Les pneumonies et l'embolie pulmonaire", "L'asthme", "La bronchite chronique", "L'apnée du sommeil"], "r": 0, "e": "L'atteinte tégumentaire se manifeste, elle, par les escarres."}, {"q": "Les effets locaux nuisibles de l'immobilisation concernent :", "o": ["Les tissus : capsule, ligaments et tendons", "Le système cardiovasculaire", "Le système respiratoire", "La peau uniquement"], "r": 0, "e": "Les effets systémiques touchent, eux, les appareils musculo-squelettique, cardiovasculaire, respiratoire et tégumentaire."}, {"q": "L'immobilisation présente un effet bénéfique dans le cas :", "o": ["Du repos après blessure, pour la cicatrisation", "De la prévention de l'ostéoporose", "De l'entretien musculaire", "De la circulation veineuse"], "r": 0, "e": "C'est son seul bénéfice cité, à mettre en balance avec l'ensemble de ses effets nuisibles."}, {"q": "Parmi les avantages de la mobilité, le cours cite le fait :", "o": ["De redistribuer la pression sur les surfaces et de prévenir les escarres", "D'augmenter la masse musculaire", "D'améliorer la capacité aérobie", "De réduire la douleur nociceptive"], "r": 0, "e": "S'y ajoutent l'indépendance fonctionnelle, l'entretien de l'amplitude, la stimulation circulatoire et la charge nécessaire à l'os."}, {"q": "La mobilité apporte à l'os :", "o": ["La charge nécessaire à la prévention de l'ostéoporose", "Un repos protecteur", "Une décharge", "Une immobilisation relative"], "r": 0, "e": "L'immobilisation entraîne au contraire une diminution de la masse osseuse."}, {"q": "Parmi les idées clés de la mobilité active figure :", "o": ["La qualité du mouvement, c'est-à-dire son schéma", "La résistance maximale", "La vitesse d'exécution maximale", "L'apnée"], "r": 0, "e": "S'y ajoutent le mouvement libre, l'amplitude, le caractère analytique et fonctionnel, général et spécifique, et la répétition."}, {"q": "La mobilité active se travaille selon un mouvement :", "o": ["Analytique et fonctionnel, général et spécifique", "Exclusivement analytique", "Exclusivement fonctionnel", "Exclusivement passif"], "r": 0, "e": "Cette double lecture permet de relier le travail segmentaire à la tâche."}, {"q": "En thérapie manuelle, la mobilité passive comprend :", "o": ["Les composantes accessoire et physiologique", "La seule composante physiologique", "La seule composante accessoire", "Le renforcement"], "r": 0, "e": "L'exercice relève, lui, de la mobilité active."}, {"q": "L'hypotension orthostatique après immobilisation prolongée relève :", "o": ["Des effets musculo-squelettiques", "Des effets cardiovasculaires", "Des effets respiratoires", "Des effets tégumentaires"], "r": 1, "e": "Elle accompagne la diminution du volume sanguin, du volume systolique et du retour veineux."}, {"q": "Les escarres relèvent des effets :", "o": ["Musculo-squelettiques", "Cardiovasculaires", "Respiratoires", "Tégumentaires"], "r": 3, "e": "La mobilité les prévient en redistribuant la pression sur les surfaces d'appui."}, {"q": "L'augmentation de la masse graisseuse en immobilisation figure parmi les effets :", "o": ["Musculo-squelettiques", "Cardiovasculaires", "Tégumentaires", "Locaux"], "r": 0, "e": "Elle y accompagne la diminution de la masse maigre et de la force."}, {"q": "La mobilité stimule notamment :", "o": ["La circulation et le retour veineux", "La sécrétion hormonale", "La digestion", "La thermorégulation"], "r": 0, "e": "C'est l'un des arguments de la mobilisation précoce chez le patient alité."}, {"q": "Les thromboses veineuses profondes sont classées par le cours parmi les effets :", "o": ["Musculo-squelettiques", "Cardiovasculaires", "Respiratoires", "Locaux"], "r": 1, "e": "L'embolie pulmonaire, qui peut en résulter, est classée parmi les effets respiratoires."}, {"q": "La mobilité contribue à l'indépendance du patient parce qu'elle :", "o": ["Maintient la fonctionnalité", "Augmente la force maximale", "Améliore la capacité aérobie", "Réduit la douleur"], "r": 0, "e": "Indépendance et fonctionnalité figurent en tête des avantages cités."}, {"q": "Le mouvement libre, parmi les idées clés de la mobilité active, s'oppose :", "o": ["Au mouvement assisté ou contraint", "Au mouvement analytique", "Au mouvement fonctionnel", "À la répétition"], "r": 0, "e": "Il figure avec la qualité du mouvement, l'amplitude, le caractère analytique/fonctionnel et la répétition."}, {"q": "L'atrophie musculaire liée à l'immobilisation se traduit par :", "o": ["Une diminution de la force et de la masse maigre", "Une augmentation de la force", "Une augmentation de la masse maigre", "Une hypertrophie compensatrice"], "r": 0, "e": "Elle s'accompagne d'une augmentation de la masse graisseuse."}, {"q": "La perte d'amplitude articulaire en immobilisation est classée parmi les effets :", "o": ["Systémiques musculo-squelettiques", "Cardiovasculaires", "Locaux tissulaires uniquement", "Tégumentaires"], "r": 0, "e": "Les effets locaux tissulaires concernent, eux, la capsule, les ligaments et les tendons."}]};</script>
