      <div class="quiz-head"><p>50 questions à choix multiple. Mode révision : correction immédiate. Mode examen : correction et score à la fin.</p><div class="bar"><i></i></div><p style="margin-top:8px" id="compteur"></p></div><div id="quiz"></div>

    <script>window.QUIZ={"titre": "Exercices — Mobilité", "fiche": "../fiches/exercices-mobilite.html", "questions": [{"q": "Les exercices de mobilité visent à :", "o": ["Augmenter la force musculaire, en charge progressive", "Maintenir ou améliorer l'amplitude articulaire", "Diminuer la masse osseuse", "Augmenter la consommation maximale d'oxygène"], "r": 1, "e": "Mobilité : effet direct sur l'amplitude et la physiologie articulaire. Ils ont un effet direct sur la physiologie articulaire."}, {"q": "L'immobilisation peut être bénéfique pour :", "o": ["Le repos initial, pour la cicatrisation", "Rien, l'immobilisation étant toujours néfaste, à tout moment", "Le renforcement du muscle", "Le gain de mobilité articulaire"], "r": 0, "e": "Repos = bénéfique pour la cicatrisation initiale."}, {"q": "Effets systémiques nuisibles de l'immobilisation :", "o": ["Musculo-squelettique", "Cardiovasculaire", "Respiratoire", "Tégumentaire", "Endocrinien"], "r": [0, 1, 2, 3], "e": "4 grands systèmes affectés : MSK, CV, respi, tégumentaire."}, {"q": "Effets MSK de l'immobilisation :", "o": ["↓ masse osseuse (ostéopénie)", "Atrophie musculaire", "↓ ROM", "↑ masse graisseuse", "↑ masse osseuse"], "r": [0, 1, 2, 3], "e": "Tous sauf ↑ masse osseuse (qui diminue)."}, {"q": "Effets cardiovasculaires de l'immobilisation :", "o": ["↓ volume sanguin", "↓ débit cardiaque", "↑ retour veineux", "Hypotension orthostatique", "Thromboses veineuses profondes"], "r": [0, 1, 3, 4], "e": "Retour veineux diminué, pas augmenté."}, {"q": "Effets respiratoires de l'immobilisation :", "o": ["Des pneumonies", "Une embolie pulmonaire", "Un asthme bronchique", "Une bronchite chronique"], "r": [0, 1], "e": "Pneumonies et EP fréquentes. Asthme et BPCO sont chroniques préexistantes."}, {"q": "L'effet local nuisible de l'immobilisation est :", "o": ["Un renforcement musculaire, par le repos", "Une altération de la capsule, des ligaments et des tendons", "Une hausse de l'amplitude, par relâchement capsulaire et tendineux", "Aucun effet local, à court terme"], "r": 1, "e": "Local : capsule, ligaments, tendons s'altèrent (rétraction)."}, {"q": "Le tégumentaire peut être affecté par :", "o": ["Augmentation de la peau", "Escarres", "Cicatrisation accrue", "Aucun problème"], "r": 1, "e": "Immobilisation → escarres."}, {"q": "Avantages de la mobilité :", "o": ["Indépendance et fonctionnalité", "↑ et maintien de l'amplitude", "Stimule la circulation/retour veineux", "Charge nécessaire à l'os (prévention ostéoporose)", "Prévient les escarres", "Augmentation de la raideur capsulaire"], "r": [0, 1, 2, 3, 4], "e": "5 avantages majeurs. La raideur capsulaire résulte de l'immobilisation ; la mobilité la combat."}, {"q": "Idées clés pour la mobilité active :", "o": ["Mouvement libre", "Qualité du mouvement (schéma)", "Amplitude", "Force maximale", "Répétition"], "r": [0, 1, 2, 4], "e": "La force max n'est pas un objectif de la mobilité."}, {"q": "En thérapie manuelle, la mobilité est :", "o": ["Active, faite par le patient", "Passive, accessoire et physiologique", "Volontaire, contre une résistance", "Réflexe, par étirement"], "r": 1, "e": "Thérapie manuelle = mobilité passive."}, {"q": "En exercice, la mobilité est :", "o": ["Passive, faite par l'évaluateur", "Active, faite par le patient", "Réflexe, déclenchée par un étirement brusque du muscle", "Imposée par une machine"], "r": 1, "e": "Exercice = mobilité active."}, {"q": "L'ostéoporose se prévient par :", "o": ["L'immobilisation stricte, au lit", "Une charge mécanique sur l'os", "Le repos au lit, prolongé", "L'alcool, à dose modérée, qui renforcerait la trame osseuse"], "r": 1, "e": "L'os a besoin de charges pour maintenir sa densité (loi de Wolff)."}, {"q": "L'hypotension orthostatique survient :", "o": ["Au repos, allongé sur le dos", "Au passage debout, après un alitement prolongé", "En position assise, au bureau", "En décubitus, la nuit, après un repas copieux et un bain chaud"], "r": 1, "e": "Alitement → ↓ volume sanguin → hypotension orthostatique au levée."}, {"q": "Les thromboses veineuses profondes (TVP) sont favorisées par :", "o": ["Le mouvement régulier", "La stase veineuse de l'immobilisation", "L'exercice physique intense, surtout en altitude", "Une bonne hydratation"], "r": 1, "e": "Stase veineuse = facteur principal de TVP (triade de Virchow). C'est un élément de la triade de Virchow."}, {"q": "L'embolie pulmonaire est :", "o": ["Une infection du poumon", "Une complication de la TVP, et une urgence vitale", "Une allergie respiratoire, aux pollens, sans gravité", "Une rétention urinaire, en HBP"], "r": 1, "e": "EP : migration d'un thrombus de la TVP vers les artères pulmonaires."}, {"q": "L'amplitude se perd à quelle vitesse en immobilisation ?", "o": ["Très lentement, sur des années", "Rapidement, par atrophie et raccourcissement", "Jamais, l'articulation gardant son amplitude malgré le repos", "De façon variable selon l'humeur"], "r": 1, "e": "Pertes rapides : muscle (5% force/jour) + raccourcissement capsulo-ligamentaire. La force musculaire baisse d'environ 5 % par jour."}, {"q": "Pour prévenir les escarres lors d'immobilisation :", "o": ["Maintenir la même position, sans bouger, au lit", "Redistribuer les pressions, en changeant de position", "Aucune mesure particulière", "Une compression continue, sur les talons"], "r": 1, "e": "Redistribuer pressions par mobilité et changements de position."}, {"q": "La mobilité active est :", "o": ["Réalisée par l'évaluateur", "Réalisée volontairement par le patient", "Réalisée sous anesthésie", "Réalisée sans contrôle moteur, par réflexe médullaire"], "r": 1, "e": "Active = par le patient lui-même."}, {"q": "La mobilité passive est :", "o": ["Réalisée par le patient lui-même", "Réalisée par l'évaluateur, segment proximal stabilisé", "Une absence de mobilité, segment fixé par une orthèse rigide", "Un mouvement réflexe, médullaire"], "r": 1, "e": "Passive = réalisée par l'évaluateur sans participation active."}, {"q": "Un mouvement analytique cible :", "o": ["Plusieurs articulations en même temps", "Une articulation/segment précis", "Tout le corps", "Aucune cible"], "r": 1, "e": "Analytique = ciblé, articulation/segment isolé."}, {"q": "Un mouvement fonctionnel intègre :", "o": ["Une seule articulation, isolée du reste du membre et du tronc", "Plusieurs articulations, dans une tâche cohérente", "Aucune articulation, en statique", "Du repos, entre les séries"], "r": 1, "e": "Fonctionnel = tâche globale, multi-articulaire (ex : se lever). Se lever d'une chaise en est un exemple."}, {"q": "L'atrophie musculaire en alitement :", "o": ["Touche seulement le muscle strié cardiaque", "Touche d'abord les muscles posturaux", "N'a aucun effet musculaire", "Augmente la force, par le repos"], "r": 1, "e": "Atrophie touche surtout les fibres lentes posturales d'abord. Ce sont des fibres de type I, puis tous les muscles."}, {"q": "Quels facteurs limitent la perte de ROM en immobilisation ?", "o": ["Une restriction stricte du mouvement", "Une mobilisation précoce et régulière", "Une pression articulaire élevée", "Une compression durable"], "r": 1, "e": "Mobilisation précoce préserve l'amplitude."}, {"q": "L'augmentation de la masse graisseuse en immobilisation est due à :", "o": ["Un renforcement musculaire", "Une dépense qui baisse sans baisse des apports", "L'alimentation seule, quelle que soit l'activité", "Une activité physique intense"], "r": 1, "e": "↓ DE sans ↓ alimentation → bilan calorique positif → ↑ graisse. Le bilan calorique devient positif."}, {"q": "L'objectif principal de la mobilité chez la personne alitée :", "o": ["La performance sportive, en club", "Le maintien de l'indépendance et de la fonction", "L'esthétique corporelle, avant tout", "La réduction du temps de sommeil, pour accélérer la récupération"], "r": 1, "e": "Indépendance et fonctionnalité = priorité."}, {"q": "Le mouvement libre désigne :", "o": ["Un mouvement contre résistance", "Un mouvement sans résistance externe ni contrainte", "Un mouvement passif, imposé", "Une absence de mouvement, en contraction isométrique maintenue"], "r": 1, "e": "Libre = sans résistance externe."}, {"q": "Indications principales de la mobilité :", "o": ["Post-immobilisation", "Maladies chroniques", "Personnes âgées", "Sportif sain", "Pré-opératoire"], "r": [0, 1, 2, 4], "e": "Le sportif sain en bonne santé pratique mais c'est moins un objectif de soin."}, {"q": "La mobilité contre-indications :", "o": ["Aucune contre-indication, jamais", "Les fractures non consolidées et les hémorragies actives", "Toutes les pathologies, sans exception, même les plus bénignes", "Une douleur légère, passagère"], "r": 1, "e": "CI : fractures non consolidées, hémorragies, lésions instables. Les lésions instables en font aussi partie."}, {"q": "L'objectif premier de la mobilité après une chirurgie est :", "o": ["Un renforcement maximal, d'emblée", "Restaurer l'amplitude et éviter les adhérences", "La reprise de la compétition, dès la sortie de l'hôpital", "L'esthétique de la cicatrice"], "r": 1, "e": "Post-chirurgie : récupérer ROM, prévenir adhérences."}, {"q": "La mobilité se définit dans le cours comme un ensemble d'exercices visant à :", "o": ["Maintenir ou améliorer l'amplitude articulaire", "Allonger les fibres musculaires, par étirement prolongé", "Augmenter la puissance, en charge", "Restaurer le contrôle moteur"], "r": 0, "e": "C'est ce qui la distingue de la souplesse, dont l'effet porte directement sur la fibre musculaire. Ses effets sont directs sur la physiologie articulaire."}, {"q": "Parmi les effets musculo-squelettiques nuisibles de l'immobilisation, le cours cite :", "o": ["Une perte osseuse, une atrophie et une perte d'amplitude", "Une hypertrophie musculaire, due au repos prolongé", "Une augmentation de la densité osseuse, au repos", "Une augmentation de l'amplitude"], "r": 0, "e": "La diminution de masse osseuse conduit à l'ostéopénie puis à l'ostéoporose. La masse graisseuse augmente aussi."}, {"q": "Parmi les effets cardiovasculaires de l'immobilisation figurent :", "o": ["Une baisse du volume sanguin et du débit cardiaque", "Une hausse du débit cardiaque", "Une hypertension artérielle", "Une bradycardie isolée, sans autre changement cardiovasculaire"], "r": 0, "e": "S'y ajoutent l'hypotension orthostatique et les thromboses veineuses profondes. Le volume systolique et le retour veineux diminuent aussi."}, {"q": "Les complications respiratoires de l'immobilisation citées sont :", "o": ["Les pneumonies et l'embolie pulmonaire", "L'asthme et la bronchite chronique obstructive", "La bronchite chronique", "L'apnée du sommeil, obstructive"], "r": 0, "e": "L'atteinte tégumentaire se manifeste, elle, par les escarres."}, {"q": "Les effets locaux nuisibles de l'immobilisation concernent :", "o": ["Les tissus, comme la capsule, les ligaments et les tendons", "Le système cardiovasculaire, en entier", "Le système respiratoire, au lit", "La peau uniquement, par les escarres sur les zones d'appui osseux"], "r": 0, "e": "Les effets systémiques touchent, eux, les appareils musculo-squelettique, cardiovasculaire, respiratoire et tégumentaire."}, {"q": "L'immobilisation présente un effet bénéfique dans le cas :", "o": ["Du repos après une blessure, pour la cicatrisation", "De la prévention de l'ostéoporose", "De l'entretien musculaire, chez le sujet âgé et alité", "De la circulation veineuse, au lit"], "r": 0, "e": "C'est son seul bénéfice cité, à mettre en balance avec l'ensemble de ses effets nuisibles."}, {"q": "Parmi les avantages de la mobilité, le cours cite le fait :", "o": ["De redistribuer la pression et de prévenir les escarres", "D'augmenter la masse musculaire", "D'améliorer la capacité aérobie et la consommation d'oxygène", "De réduire la douleur nociceptive"], "r": 0, "e": "S'y ajoutent l'indépendance fonctionnelle, l'entretien de l'amplitude, la stimulation circulatoire et la charge nécessaire à l'os. La pression porte sur les surfaces d'appui."}, {"q": "La mobilité apporte à l'os :", "o": ["La charge nécessaire à la prévention de l'ostéoporose", "Un repos protecteur, contre l'usure articulaire", "Une décharge, pour limiter les microfractures", "Une immobilisation relative, en position de repos"], "r": 0, "e": "L'immobilisation entraîne au contraire une diminution de la masse osseuse."}, {"q": "Parmi les idées clés de la mobilité active figure :", "o": ["La qualité du mouvement, c'est-à-dire son schéma", "La résistance maximale, à chaque essai", "La vitesse maximale, quelle que soit la qualité du geste", "L'apnée, pour stabiliser"], "r": 0, "e": "S'y ajoutent le mouvement libre, l'amplitude, le caractère analytique et fonctionnel, général et spécifique, et la répétition."}, {"q": "La mobilité active se travaille selon un mouvement :", "o": ["Analytique et fonctionnel, général et spécifique", "Exclusivement analytique, segment par segment, isolé", "Exclusivement fonctionnel, dans la tâche", "Exclusivement passif, par le thérapeute"], "r": 0, "e": "Cette double lecture permet de relier le travail segmentaire à la tâche."}, {"q": "En thérapie manuelle, la mobilité passive comprend :", "o": ["Les composantes accessoire et physiologique", "La seule composante physiologique", "La seule composante accessoire, par glissement des surfaces", "Le renforcement contre résistance"], "r": 0, "e": "L'exercice relève, lui, de la mobilité active."}, {"q": "L'hypotension orthostatique après immobilisation prolongée relève :", "o": ["Des effets musculo-squelettiques", "Des effets cardiovasculaires", "Des effets respiratoires", "Des effets tégumentaires"], "r": 1, "e": "Elle accompagne la diminution du volume sanguin, du volume systolique et du retour veineux."}, {"q": "Les escarres relèvent des effets :", "o": ["Musculo-squelettiques", "Cardiovasculaires", "Respiratoires", "Tégumentaires"], "r": 3, "e": "La mobilité les prévient en redistribuant la pression sur les surfaces d'appui."}, {"q": "L'augmentation de la masse graisseuse en immobilisation figure parmi les effets :", "o": ["Musculo-squelettiques", "Cardiovasculaires", "Tégumentaires", "Locaux"], "r": 0, "e": "Elle y accompagne la diminution de la masse maigre et de la force."}, {"q": "La mobilité stimule notamment :", "o": ["La circulation et le retour veineux", "La sécrétion hormonale", "La digestion et le transit, chez la personne alitée", "La thermorégulation, par la sueur"], "r": 0, "e": "C'est l'un des arguments de la mobilisation précoce chez le patient alité."}, {"q": "Les thromboses veineuses profondes sont classées par le cours parmi les effets :", "o": ["Musculo-squelettiques", "Cardiovasculaires", "Respiratoires", "Locaux"], "r": 1, "e": "L'embolie pulmonaire, qui peut en résulter, est classée parmi les effets respiratoires."}, {"q": "La mobilité contribue à l'indépendance du patient parce qu'elle :", "o": ["Maintient la fonctionnalité", "Augmente la force maximale", "Améliore la capacité aérobie", "Réduit la douleur"], "r": 0, "e": "Indépendance et fonctionnalité figurent en tête des avantages cités."}, {"q": "Le mouvement libre, parmi les idées clés de la mobilité active, s'oppose :", "o": ["Au mouvement assisté ou contraint", "Au mouvement analytique, segment par segment", "Au mouvement fonctionnel", "À la répétition des gestes"], "r": 0, "e": "Il figure avec la qualité du mouvement, l'amplitude, le caractère analytique/fonctionnel et la répétition."}, {"q": "L'atrophie musculaire liée à l'immobilisation se traduit par :", "o": ["Une baisse de la force et de la masse maigre", "Une hausse de la force, au repos", "Une hausse de la masse maigre", "Une hypertrophie compensatrice, par les fibres restantes"], "r": 0, "e": "Elle s'accompagne d'une augmentation de la masse graisseuse."}, {"q": "La perte d'amplitude articulaire en immobilisation est classée parmi les effets :", "o": ["Systémiques musculo-squelettiques", "Cardiovasculaires", "Locaux tissulaires uniquement", "Tégumentaires"], "r": 0, "e": "Les effets locaux tissulaires concernent, eux, la capsule, les ligaments et les tendons."}]};</script>
