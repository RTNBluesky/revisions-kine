<script>window.QUIZ={"titre": "Test musculaire", "fiche": "../fiches/testing.html", "questions": [{"q": "Que signifie la « force » musculaire selon le cours ?", "o": ["La taille du muscle au repos", "La capacité d'un muscle à générer une tension dans un temps et à une vitesse donnés", "La résistance d'un muscle à l'étirement passif", "La quantité d'ATP stockée dans le muscle"], "r": 1, "e": "La force est une qualité physique de caractéristique neuromusculaire."}, {"q": "Plus le nombre d'unités motrices activées est élevé...", "o": ["...plus la fatigue diminue", "...plus la force développée est importante", "...plus la vitesse de contraction diminue", "...plus la taille du muscle augmente immédiatement"], "r": 1, "e": "Le nombre d'unités motrices recrutées détermine la force produite."}, {"q": "Le test musculaire manuel est né dans le contexte de l'étude de quelle pathologie ?", "o": ["La sclérose en plaques", "La myopathie de Duchenne", "La poliomyélite", "Les AVC"], "r": 2, "e": "Études du début du XXe siècle aux États-Unis. Robert W. Lovett a introduit la méthode utilisant la résistance à la gravité."}, {"q": "Qui a introduit la méthode de test utilisant la résistance à la gravité ?", "o": ["Henry Kendall", "Robert W. Lovett", "Daniels & Worthingham", "George Maitland"], "r": 1, "e": "Lovett a posé les bases du testing manuel utilisant la gravité comme résistance."}, {"q": "La méthode de Daniels & Worthingham teste principalement :", "o": ["L'activité musculaire groupée dans un mouvement articulaire", "L'action d'un muscle spécifique", "L'endurance musculaire uniquement", "La proprioception articulaire"], "r": 0, "e": "Daniels & Worthingham : groupes musculaires. Kendall & McCreary : muscles spécifiques."}, {"q": "Selon la méthode Kendall & McCreary, combien de tests sont nécessaires pour évaluer les abducteurs de la hanche ?", "o": ["1 test", "2 tests", "3 tests (moyen fessier, TFL, petit fessier)", "4 tests"], "r": 2, "e": "Chaque muscle abducteur est isolé : moyen fessier, TFL, petit fessier."}, {"q": "Quel est l'avantage principal de la méthode Daniels & Worthingham ?", "o": ["Plus précise pour identifier les substitutions", "Plus pratique et rapide pour un dépistage", "Permet de tester chaque muscle séparément", "Évite les compensations"], "r": 1, "e": "Daniels & Worthingham est plus rapide, surtout en dépistage."}, {"q": "Les auteurs phares dont provient la plupart des tests musculaires manuels modernes sont :", "o": ["Cyriax et Maitland", "Henry et Florence Kendall", "Lovett et McCreary", "Janda et Lewit"], "r": 1, "e": "Auteurs de Muscles: Testing and Function."}, {"q": "Pour garantir la fiabilité du test musculaire manuel, il faut :", "o": ["Effectuer chaque test au moins 5 fois", "Utiliser un dynamomètre électronique systématiquement", "Effectuer les tests de la même manière et au même point de l'amplitude", "Toujours tester le côté affecté en premier"], "r": 2, "e": "La standardisation est la condition de la reproductibilité."}, {"q": "Lequel de ces facteurs n'influence PAS la reproductibilité d'un test musculaire ?", "o": ["La méthode utilisée", "Le ton de la voix du thérapeute", "La fatigue du patient", "La couleur des vêtements du patient"], "r": 3, "e": "Tous les autres sont listés comme facteurs influençants."}, {"q": "L'amplitude de test correspond à :", "o": ["L'amplitude maximale du segment dans toutes les directions", "L'amplitude spécifique au muscle testé, qui ne coïncide pas forcément avec l'amplitude de mouvement", "L'amplitude minimale clinique", "L'amplitude active uniquement"], "r": 1, "e": "L'amplitude de test est spécifique à chaque muscle."}, {"q": "Comment doit-on positionner les muscles biarticulaires lors du test ?", "o": ["À leur position d'allongement maximal", "À leur position de raccourcissement maximal", "À la position intermédiaire de l'amplitude totale du muscle", "En appui contre la gravité"], "r": 2, "e": "Les biarticulaires sont évalués à la position intermédiaire pour éviter une perte de tension active."}, {"q": "Lors du test, le segment proximal doit être :", "o": ["Mobilisé activement par le patient", "Stabilisé", "Étiré au maximum", "Maintenu en flexion"], "r": 1, "e": "La stabilisation du segment proximal isole le mouvement testé."}, {"q": "Quel type de contraction est requis lors du test musculaire manuel à la fin de l'amplitude ?", "o": ["Isotonique concentrique", "Isotonique excentrique", "Isométrique", "Isocinétique"], "r": 2, "e": "Test isométrique en fin d'amplitude pour mesurer la force statique maximale."}, {"q": "La résistance doit être appliquée :", "o": ["Avec une seule main, l'autre stabilisant", "Avec les deux mains pour mieux contrôler", "Toujours sur l'articulation", "Très rapidement et brusquement"], "r": 0, "e": "Une main pour la résistance, une main pour la stabilisation. Jamais sur l'articulation."}, {"q": "Que signifie un degré 0 ?", "o": ["Aucune contraction perceptible", "Contraction ressentie sans mouvement", "Mouvement complet sans gravité", "Mouvement complet avec résistance maximale"], "r": 0, "e": "Degré 0 = absence totale de contraction."}, {"q": "Que signifie un degré 1 ?", "o": ["Aucune contraction", "Contraction ressentie mais sans mouvement", "Mouvement complet contre gravité", "Mouvement complet contre résistance modérée"], "r": 1, "e": "Degré 1 = contraction perceptible (palpation), pas de mouvement."}, {"q": "Que signifie un degré 3 ?", "o": ["Mouvement contre résistance maximale", "Mouvement avec gravité éliminée", "Amplitude complète sans application de résistance (mais contre la gravité)", "Aucune contraction"], "r": 2, "e": "3 = ROM complète contre gravité, sans résistance externe ajoutée."}, {"q": "Que signifie un degré 5 ?", "o": ["Position complète sans résistance", "Position complète avec résistance modérée", "Test complet et résistance maximale", "Test impossible à effectuer"], "r": 2, "e": "Degré 5 correspond à la force normale, résistance maximale."}, {"q": "Comment doivent être notés les degrés inférieurs à 3 ?", "o": ["En noir", "En rouge", "En bleu", "En vert"], "r": 1, "e": "Convention : < 3 en rouge, ≥ 3 en noir."}, {"q": "Pour tester un muscle faible qui ne peut pas vaincre la gravité, on utilise :", "o": ["Une position contre la gravité avec résistance", "Une position dans le plan horizontal (gravité éliminée)", "Une position pendante", "Une posture en suspension"], "r": 1, "e": "Plan horizontal pour éliminer l'effet gravitaire chez le muscle faible (degrés 0-2)."}, {"q": "Lequel de ces facteurs PEUT diminuer la force musculaire ?", "o": ["L'augmentation de la masse maigre", "L'entraînement régulier", "La douleur", "L'hydratation correcte"], "r": 2, "e": "Atrophie, atteinte SN, douleur, fatigue, lésion musculaire diminuent la force."}, {"q": "Chez la personne âgée, on observe une perte de fibres préférentiellement :", "o": ["De type I (lentes)", "De type II (rapides)", "De type III", "Toutes au même rythme"], "r": 1, "e": "Atteinte préférentielle des fibres de type II → ralentissement, perte d'explosivité."}, {"q": "Les conséquences neuromusculaires du vieillissement incluent :", "o": ["Augmentation du nombre de motoneurones", "Diminution du nombre et de la taille des unités motrices", "Augmentation de la vitesse de conduction", "Hypertrophie des axones"], "r": 1, "e": "Réduction des UM et de leur taille, diamètre axonal réduit, conduction plus lente."}, {"q": "Quel objectif n'est PAS un objectif typique du test musculaire ?", "o": ["Aide au diagnostic différentiel", "Pronostic", "Suivi du traitement", "Mesure de la consommation d'oxygène"], "r": 3, "e": "Le test musculaire ne mesure pas la VO2."}, {"q": "Quel est l'inconvénient principal de la méthode Kendall & McCreary ?", "o": ["Elle est moins fiable", "Elle prend plus de temps et nécessite une connaissance précise de l'orientation des muscles", "Elle ne permet pas de détecter les substitutions", "Elle ne peut pas être utilisée en clinique"], "r": 1, "e": "Kendall = précis mais long, requérant des connaissances anatomiques pointues."}, {"q": "Avant le test, on doit :", "o": ["Faire courir le patient pour échauffer le muscle", "Expliquer la procédure et démontrer ce qu'on attend du patient", "Donner un anti-douleur", "Tester d'abord le membre douloureux sans préavis"], "r": 1, "e": "Communication et préparation = base de la coopération."}, {"q": "Lors du test, l'utilisation de leviers longs :", "o": ["Est recommandée autant que possible", "Est interdite", "Est utilisée uniquement chez l'enfant", "N'a pas d'incidence"], "r": 0, "e": "Levier long = meilleure mécanique, sauf si la fixation proximale est impossible."}, {"q": "Quelle compétence n'est PAS essentielle chez l'observateur ?", "o": ["Connaissances anatomiques", "Compétences techniques", "Expérience clinique", "Capacité à courir un marathon"], "r": 3, "e": "L'observateur a besoin de compétences cognitives et techniques."}, {"q": "Lequel de ces effets fait partie des adaptations positives à l'exercice chez la personne âgée ?", "o": ["Diminution du volume musculaire", "Réduction des unités motrices", "Adaptations neuronales et remodelage musculaire", "Atrophie sélective des fibres I"], "r": 2, "e": "L'exercice induit augmentation du volume musculaire, remodelage et adaptations neuronales."}, {"q": "La force se définit dans le cours comme la capacité à générer une tension :", "o": ["Dans un temps donné et à une vitesse donnée", "Sans limite de temps", "Indépendamment de la vitesse", "À vitesse maximale uniquement"], "r": 0, "e": "C'est une qualité physique de caractéristique neuromusculaire."}, {"q": "Le test musculaire évalue trois capacités :", "o": ["Activer les muscles squelettiques, provoquer un mouvement, stabiliser et soutenir", "Force, endurance et puissance", "Amplitude, force et souplesse", "Coordination, équilibre et vitesse"], "r": 0, "e": "Le muscle joue en effet, outre le mouvement, un rôle de soutien des structures squelettiques."}, {"q": "Le cours énonce qu'un muscle doit être :", "o": ["Le plus long possible", "Suffisamment long pour la mobilité normale mais suffisamment court pour contribuer à la stabilité articulaire", "Le plus court possible", "De longueur indifférente"], "r": 1, "e": "C'est ce double impératif qui fonde l'évaluation de la longueur autant que de la force."}, {"q": "Les trois utilisations cliniques du test musculaire sont :", "o": ["Diagnostic, pronostic et traitement", "Dépistage, prévention et suivi", "Recherche, enseignement et clinique", "Force, endurance et puissance"], "r": 0, "e": "Le diagnostic vise le différentiel des troubles neuromusculaires et musculo-squelettiques."}, {"q": "Le test musculaire manuel est né :", "o": ["Aux États-Unis au début des années 1900, lors d'une étude sur la poliomyélite", "En Europe dans les années 1950", "Au Japon dans les années 1970", "En Australie dans les années 1980"], "r": 0, "e": "Robert W. Lovett y a introduit la méthode utilisant la résistance à la gravité."}, {"q": "La méthode Daniels & Worthingham teste :", "o": ["L'action d'un muscle spécifique", "L'activité musculaire groupée, par le mouvement articulaire", "La seule endurance", "La seule amplitude"], "r": 1, "e": "Kendall & McCreary testent, eux, l'action d'un muscle spécifique — d'où trois tests séparés pour les abducteurs de hanche."}, {"q": "L'inconvénient principal de la méthode Kendall & McCreary est :", "o": ["Son manque de spécificité", "Sa durée et l'exigence d'une connaissance précise de l'orientation musculaire", "Son imprécision", "Son coût"], "r": 1, "e": "Daniels & Worthingham est au contraire plus pratique et rapide pour un dépistage, mais moins spécifique."}, {"q": "Les auteurs de Muscles: Testing and Function sont :", "o": ["Henry et Florence Kendall", "Daniels et Worthingham", "Lovett et Cyriax", "Janda et Kaltenborn"], "r": 0, "e": "La plupart des tests musculaires modernes en proviennent."}, {"q": "La fiabilité inter- et intra-examinateurs n'est garantie que si les tests sont réalisés :", "o": ["De la même manière et au même point de l'amplitude à chaque fois", "Par le même examinateur", "Avec le même instrument", "Au même moment de la journée"], "r": 0, "e": "Le problème central reste la variable « cadre de référence » utilisée pour l'évaluation."}, {"q": "Parmi les facteurs de variabilité liés à la technique, le cours cite :", "o": ["Le point et la ligne d'application de la résistance, son amplitude, sa vitesse, la durée de contraction, les instructions et le ton de la voix", "La seule méthode employée", "La seule fatigue du patient", "La seule expérience de l'observateur"], "r": 0, "e": "S'y ajoutent des facteurs liés au patient et à l'observateur."}, {"q": "Parmi les facteurs liés au patient figurent :", "o": ["La coopération, la fatigue, les influences perturbatrices comme la douleur et l'anxiété, et l'interaction thérapeute-patient", "Les connaissances anatomiques", "La compétence technique", "L'expérience clinique"], "r": 0, "e": "Les trois derniers items relèvent des facteurs liés à l'observateur."}, {"q": "L'amplitude de test se distingue de l'amplitude de mouvement en ce qu'elle :", "o": ["Est spécifique au muscle testé et ne coïncide pas nécessairement avec l'amplitude de mouvement", "Est toujours plus grande", "Est toujours plus petite", "Est identique"], "r": 0, "e": "L'amplitude de mouvement est l'espace parcouru de la position neutre à la position extrême."}, {"q": "Les muscles biarticulaires sont testés :", "o": ["En amplitude complète", "À la position intermédiaire de l'amplitude totale", "En position raccourcie maximale", "En position allongée maximale"], "r": 1, "e": "Les muscles mono-articulaires doivent, eux, compléter l'amplitude articulaire."}, {"q": "Le positionnement du patient pour le test peut être :", "o": ["En décubitus dorsal, ventral ou latéral, selon ce qui permet la meilleure fixation", "Exclusivement assis", "Exclusivement debout", "Indifférent"], "r": 0, "e": "La stabilisation porte sur le segment proximal à la zone testée."}, {"q": "Lorsque les muscles sont faibles, la zone testée est placée :", "o": ["Contre la gravité", "En plan horizontal, gravité éliminée", "En position déclive", "En charge"], "r": 1, "e": "La position contre gravité s'emploie pour la plupart des muscles du tronc et certains muscles des extrémités."}, {"q": "La contraction demandée lors du test est :", "o": ["Isotonique concentrique", "Isométrique, à la fin de l'amplitude testée", "Excentrique", "Isocinétique"], "r": 1, "e": "Elle permet une comparaison reproductible en un point précis de l'amplitude."}, {"q": "Concernant les leviers, le cours recommande de les prendre :", "o": ["Longs autant que possible, et courts si les muscles ne permettent pas une fixation importante", "Toujours courts", "Toujours longs", "Indifféremment"], "r": 0, "e": "Le levier long augmente le moment résistant et affine la discrimination des grades élevés."}, {"q": "Avant le test, la checklist prévoit notamment :", "o": ["De déterminer passivement l'amplitude de mouvement du segment", "De mesurer la force au dynamomètre", "De faire un échauffement complet", "De réaliser un bilan goniométrique complet"], "r": 0, "e": "S'y ajoutent l'explication, l'exposition de la zone, le placement en position initiale, la stabilisation, la palpation et la surveillance des substitutions."}, {"q": "La résistance doit être, selon le cours :", "o": ["Douce, ferme et graduée", "Maximale d'emblée", "Brève et brutale", "Maintenue longuement"], "r": 0, "e": "Il ne faut ni la maintenir trop longtemps ni la répéter, afin d'éviter la fatigue."}, {"q": "Le degré 2 de Lovett correspond à :", "o": ["Aucune contraction", "Une contraction palpable sans mouvement", "Une amplitude complète sans gravité", "Une amplitude complète contre gravité"], "r": 2, "e": "Le degré 3 correspond à l'amplitude complète contre gravité sans résistance, le 4 avec résistance modérée et le 5 avec résistance maximale."}]};</script>
