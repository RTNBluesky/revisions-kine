      <div class="quiz-head"><p>50 questions à choix multiple. Mode révision : correction immédiate. Mode examen : correction et score à la fin.</p><div class="bar"><i></i></div><p style="margin-top:8px" id="compteur"></p></div><div id="quiz"></div>

    <script>window.QUIZ={"titre": "Test musculaire", "fiche": "../fiches/testing.html", "questions": [{"q": "Que signifie la « force » musculaire selon le cours ?", "o": ["La taille du muscle au repos, en section transversale", "La capacité d'un muscle à générer une tension", "La résistance du muscle à l'étirement passif", "La quantité d'ATP stockée dans les fibres"], "r": 1, "e": "La force est une qualité physique de caractéristique neuromusculaire. Elle s'exerce dans un temps et à une vitesse donnés."}, {"q": "Plus le nombre d'unités motrices activées est élevé...", "o": ["...plus la fatigue diminue", "...plus la force développée est importante", "...plus la vitesse de contraction diminue", "...plus la taille du muscle augmente immédiatement"], "r": 1, "e": "Le nombre d'unités motrices recrutées détermine la force produite."}, {"q": "Le test musculaire manuel est né dans le contexte de l'étude de quelle pathologie ?", "o": ["La sclérose en plaques", "La myopathie de Duchenne", "La poliomyélite", "Les AVC"], "r": 2, "e": "Études du début du XXe siècle aux États-Unis. Robert W. Lovett a introduit la méthode utilisant la résistance à la gravité."}, {"q": "Qui a introduit la méthode de test utilisant la résistance à la gravité ?", "o": ["Henry Kendall", "Robert W. Lovett", "Daniels & Worthingham", "George Maitland"], "r": 1, "e": "Lovett a posé les bases du testing manuel utilisant la gravité comme résistance."}, {"q": "La méthode de Daniels & Worthingham teste principalement :", "o": ["L'activité groupée des muscles d'un mouvement", "L'action d'un muscle spécifique, isolé de ses synergistes", "L'endurance musculaire uniquement, sur répétitions", "La proprioception articulaire des membres"], "r": 0, "e": "Daniels & Worthingham : groupes musculaires. Kendall & McCreary : muscles spécifiques."}, {"q": "Selon la méthode Kendall & McCreary, combien de tests sont nécessaires pour évaluer les abducteurs de la hanche ?", "o": ["1 test, pour tous les abducteurs ensemble", "2 tests, un par fessier", "3 tests, un par muscle abducteur", "4 tests, avec le piriforme"], "r": 2, "e": "Chaque muscle abducteur est isolé : moyen fessier, TFL, petit fessier."}, {"q": "Quel est l'avantage principal de la méthode Daniels & Worthingham ?", "o": ["Plus précise pour identifier les substitutions", "Plus pratique et rapide pour un dépistage", "Permet de tester chaque muscle séparément", "Évite les compensations"], "r": 1, "e": "Daniels & Worthingham est plus rapide, surtout en dépistage."}, {"q": "Les auteurs phares dont provient la plupart des tests musculaires manuels modernes sont :", "o": ["Cyriax, Maitland et Paris", "Henry O. et Florence P. Kendall", "Janda, Lewit et Kolář", "Mulligan, McKenzie et Cyriax"], "r": 1, "e": "Auteurs de Muscles: Testing and Function."}, {"q": "Pour garantir la fiabilité du test musculaire manuel, il faut :", "o": ["Effectuer chaque test au moins 5 fois, puis faire la moyenne", "Utiliser systématiquement un dynamomètre électronique", "Les réaliser de la même manière, au même point d'amplitude", "Toujours tester le côté affecté en premier"], "r": 2, "e": "La standardisation est la condition de la reproductibilité."}, {"q": "Lequel de ces facteurs n'influence PAS la reproductibilité d'un test musculaire ?", "o": ["La méthode utilisée", "Le ton de la voix du thérapeute", "La fatigue du patient", "La couleur des vêtements du patient"], "r": 3, "e": "Tous les autres sont listés comme facteurs influençants."}, {"q": "L'amplitude de test correspond à :", "o": ["L'amplitude maximale du segment, dans toutes les directions", "L'amplitude spécifique au muscle testé", "L'amplitude minimale utile en clinique", "L'amplitude active uniquement, sans aide"], "r": 1, "e": "L'amplitude de test est spécifique à chaque muscle. Elle ne coïncide pas forcément avec l'amplitude de mouvement."}, {"q": "Comment doit-on positionner les muscles biarticulaires lors du test ?", "o": ["À leur position d'allongement maximal", "À leur position de raccourcissement maximal, en fin de course", "À la position intermédiaire de leur amplitude totale", "En appui contre la gravité, segment pendant"], "r": 2, "e": "Les biarticulaires sont évalués à la position intermédiaire pour éviter une perte de tension active."}, {"q": "Lors du test, le segment proximal doit être :", "o": ["Mobilisé activement par le patient", "Stabilisé", "Étiré au maximum", "Maintenu en flexion"], "r": 1, "e": "La stabilisation du segment proximal isole le mouvement testé."}, {"q": "Quel type de contraction est requis lors du test musculaire manuel à la fin de l'amplitude ?", "o": ["Isotonique concentrique", "Isotonique excentrique", "Isométrique", "Isocinétique"], "r": 2, "e": "Test isométrique en fin d'amplitude pour mesurer la force statique maximale."}, {"q": "La résistance doit être appliquée :", "o": ["Avec une seule main, l'autre stabilisant", "Avec les deux mains, pour mieux contrôler", "Toujours sur l'articulation, pour plus de bras de levier", "Très rapidement, et de façon brusque"], "r": 0, "e": "Une main pour la résistance, une main pour la stabilisation. Jamais sur l'articulation."}, {"q": "Que signifie un degré 0 ?", "o": ["Aucune contraction perceptible", "Contraction ressentie sans mouvement", "Mouvement complet sans gravité", "Mouvement complet avec résistance maximale"], "r": 0, "e": "Degré 0 = absence totale de contraction."}, {"q": "Que signifie un degré 1 ?", "o": ["Aucune contraction", "Contraction ressentie mais sans mouvement", "Mouvement complet contre gravité", "Mouvement complet contre résistance modérée"], "r": 1, "e": "Degré 1 = contraction perceptible (palpation), pas de mouvement."}, {"q": "Que signifie un degré 3 ?", "o": ["Un mouvement contre une résistance maximale", "Un mouvement avec la gravité éliminée", "Une amplitude complète contre la seule gravité", "Aucune contraction visible ni palpable du muscle testé"], "r": 2, "e": "3 = ROM complète contre gravité, sans résistance externe ajoutée."}, {"q": "Que signifie un degré 5 ?", "o": ["Position complète sans résistance", "Position complète avec résistance modérée", "Test complet et résistance maximale", "Test impossible à effectuer"], "r": 2, "e": "Degré 5 correspond à la force normale, résistance maximale."}, {"q": "Comment doivent être notés les degrés inférieurs à 3 ?", "o": ["En noir", "En rouge", "En bleu", "En vert"], "r": 1, "e": "Convention : < 3 en rouge, ≥ 3 en noir."}, {"q": "Pour tester un muscle faible qui ne peut pas vaincre la gravité, on utilise :", "o": ["Une position contre la gravité, avec résistance", "Une position dans le plan horizontal, sans gravité", "Une position pendante, segment relâché", "Une posture en suspension, dans des sangles élastiques"], "r": 1, "e": "Plan horizontal pour éliminer l'effet gravitaire chez le muscle faible (degrés 0-2)."}, {"q": "Lequel de ces facteurs PEUT diminuer la force musculaire ?", "o": ["L'augmentation de la masse maigre", "L'entraînement régulier et progressif", "La douleur ressentie pendant le test", "Une bonne hydratation de base"], "r": 2, "e": "Atrophie, atteinte SN, douleur, fatigue, lésion musculaire diminuent la force."}, {"q": "Chez la personne âgée, on observe une perte de fibres préférentiellement :", "o": ["De type I (lentes)", "De type II (rapides)", "De type III", "Toutes au même rythme"], "r": 1, "e": "Atteinte préférentielle des fibres de type II → ralentissement, perte d'explosivité."}, {"q": "Les conséquences neuromusculaires du vieillissement incluent :", "o": ["Une augmentation du nombre de motoneurones", "Une baisse du nombre et de la taille des unités motrices", "Une augmentation de la vitesse de conduction nerveuse motrice", "Une hypertrophie des axones, de diamètre accru"], "r": 1, "e": "Réduction des UM et de leur taille, diamètre axonal réduit, conduction plus lente."}, {"q": "Quel objectif n'est PAS un objectif typique du test musculaire ?", "o": ["Aide au diagnostic différentiel", "Pronostic", "Suivi du traitement", "Mesure de la consommation d'oxygène"], "r": 3, "e": "Le test musculaire ne mesure pas la VO2."}, {"q": "Quel est l'inconvénient principal de la méthode Kendall & McCreary ?", "o": ["Elle est moins fiable que les autres méthodes", "Elle est plus longue et exige une anatomie précise", "Elle ne permet pas de détecter les substitutions", "Elle ne peut pas être utilisée en clinique"], "r": 1, "e": "Kendall = précis mais long, requérant des connaissances anatomiques pointues."}, {"q": "Avant le test, on doit :", "o": ["Faire courir le patient pour échauffer le muscle", "Expliquer la procédure et la démontrer au patient", "Donner un antalgique avant de commencer", "Tester d'abord le membre douloureux, sans prévenir le patient"], "r": 1, "e": "Communication et préparation = base de la coopération."}, {"q": "Lors du test, l'utilisation de leviers longs :", "o": ["Est recommandée autant que possible", "Est interdite", "Est utilisée uniquement chez l'enfant", "N'a pas d'incidence"], "r": 0, "e": "Levier long = meilleure mécanique, sauf si la fixation proximale est impossible."}, {"q": "Quelle compétence n'est PAS essentielle chez l'observateur ?", "o": ["Connaissances anatomiques", "Compétences techniques", "Expérience clinique", "Capacité à courir un marathon"], "r": 3, "e": "L'observateur a besoin de compétences cognitives et techniques."}, {"q": "Lequel de ces effets fait partie des adaptations positives à l'exercice chez la personne âgée ?", "o": ["Une diminution du volume musculaire, par atrophie", "Une réduction du nombre d'unités motrices", "Des adaptations neuronales et un remodelage", "Une atrophie sélective des fibres de type I"], "r": 2, "e": "L'exercice induit augmentation du volume musculaire, remodelage et adaptations neuronales. Le remodelage est musculaire."}, {"q": "La force se définit dans le cours comme la capacité à générer une tension :", "o": ["Dans un temps donné et à une vitesse donnée", "Sans aucune limite de temps, quelle que soit la vitesse", "Indépendamment de la vitesse du mouvement", "À vitesse maximale uniquement, sans durée"], "r": 0, "e": "C'est une qualité physique de caractéristique neuromusculaire."}, {"q": "Le test musculaire évalue trois capacités :", "o": ["Activer les muscles, produire un mouvement et stabiliser", "La force, l'endurance et la puissance du muscle", "L'amplitude, la force et la souplesse articulaire", "La coordination, l'équilibre et la vitesse du geste"], "r": 0, "e": "Le muscle joue en effet, outre le mouvement, un rôle de soutien des structures squelettiques. Stabiliser revient aussi à soutenir les structures."}, {"q": "Le cours énonce qu'un muscle doit être :", "o": ["Le plus long possible, pour la mobilité", "Assez long pour la mobilité, assez court pour la stabilité", "Le plus court possible, pour la stabilité articulaire maximale", "De longueur indifférente, seule la force comptant"], "r": 1, "e": "C'est ce double impératif qui fonde l'évaluation de la longueur autant que de la force."}, {"q": "Les trois utilisations cliniques du test musculaire sont :", "o": ["Diagnostic, pronostic et traitement", "Dépistage, prévention et suivi", "Recherche, enseignement et clinique", "Force, endurance et puissance"], "r": 0, "e": "Le diagnostic vise le différentiel des troubles neuromusculaires et musculo-squelettiques."}, {"q": "Le test musculaire manuel est né :", "o": ["Aux États-Unis, au début des années 1900", "En Europe, dans les années 1950", "Au Japon, dans les années 1970", "En Australie, au cours des années 1980"], "r": 0, "e": "Robert W. Lovett y a introduit la méthode utilisant la résistance à la gravité. C'était lors d'une étude sur la poliomyélite."}, {"q": "La méthode Daniels & Worthingham teste :", "o": ["L'action d'un muscle spécifique, isolé de ses synergistes", "L'activité musculaire groupée d'un mouvement", "La seule endurance, sur répétitions", "La seule amplitude articulaire"], "r": 1, "e": "Kendall & McCreary testent, eux, l'action d'un muscle spécifique — d'où trois tests séparés pour les abducteurs de hanche."}, {"q": "L'inconvénient principal de la méthode Kendall & McCreary est :", "o": ["Son manque de spécificité, faute de tester chaque muscle", "Sa durée, et l'exigence d'une anatomie précise", "Son imprécision, liée à la cotation", "Son coût, lié au matériel nécessaire"], "r": 1, "e": "Daniels & Worthingham est au contraire plus pratique et rapide pour un dépistage, mais moins spécifique. Il faut connaître l'orientation précise de chaque muscle."}, {"q": "Les auteurs de Muscles: Testing and Function sont :", "o": ["Henry et Florence Kendall", "Daniels et Worthingham", "Lovett et Cyriax", "Janda et Kaltenborn"], "r": 0, "e": "La plupart des tests musculaires modernes en proviennent."}, {"q": "La fiabilité inter- et intra-examinateurs n'est garantie que si les tests sont réalisés :", "o": ["De la même manière, au même point de l'amplitude", "Par le même examinateur, à chaque séance", "Avec le même instrument, étalonné avant chaque mesure", "Au même moment de la journée, le matin"], "r": 0, "e": "Le problème central reste la variable « cadre de référence » utilisée pour l'évaluation."}, {"q": "Parmi les facteurs de variabilité liés à la technique, le cours cite :", "o": ["Le point d'application de la résistance, sa vitesse, sa durée", "La seule méthode employée, Kendall ou Daniels", "La seule fatigue du patient, en fin de séance", "La seule expérience de l'observateur, débutant ou expert"], "r": 0, "e": "S'y ajoutent des facteurs liés au patient et à l'observateur. La ligne d'application, l'amplitude, les instructions et le ton de la voix en font aussi partie."}, {"q": "Parmi les facteurs liés au patient figurent :", "o": ["La coopération, la fatigue, la douleur et l'anxiété", "Les connaissances anatomiques, sur l'orientation des fibres", "La compétence technique, dans la prise et la résistance", "L'expérience clinique, acquise au fil des années"], "r": 0, "e": "Les trois derniers items relèvent des facteurs liés à l'observateur. L'interaction thérapeute-patient en fait aussi partie."}, {"q": "L'amplitude de test se distingue de l'amplitude de mouvement en ce qu'elle :", "o": ["Est propre au muscle testé et diffère souvent d'elle", "Est toujours plus grande, quel que soit le muscle", "Est toujours plus petite de moitié", "Est identique, la mesure étant la même dans les deux cas"], "r": 0, "e": "L'amplitude de mouvement est l'espace parcouru de la position neutre à la position extrême."}, {"q": "Les muscles biarticulaires sont testés :", "o": ["En amplitude complète, d'une extrémité à l'autre", "À la position intermédiaire de l'amplitude totale", "En position raccourcie maximale", "En position allongée maximale"], "r": 1, "e": "Les muscles mono-articulaires doivent, eux, compléter l'amplitude articulaire."}, {"q": "Le positionnement du patient pour le test peut être :", "o": ["En décubitus dorsal, ventral ou latéral, selon la fixation", "Exclusivement assis, pieds au sol", "Exclusivement debout, en appui bipodal, face au thérapeute assis", "Indifférent, au choix du patient"], "r": 0, "e": "La stabilisation porte sur le segment proximal à la zone testée."}, {"q": "Lorsque les muscles sont faibles, la zone testée est placée :", "o": ["Contre la gravité, avec une résistance", "En plan horizontal, gravité éliminée", "En position déclive, la tête plus basse que le segment", "En charge, sur le membre testé"], "r": 1, "e": "La position contre gravité s'emploie pour la plupart des muscles du tronc et certains muscles des extrémités."}, {"q": "La contraction demandée lors du test est :", "o": ["Isotonique concentrique, sur toute l'amplitude", "Isométrique, en fin d'amplitude testée", "Excentrique, freinant la résistance", "Isocinétique, à vitesse constante imposée par une machine"], "r": 1, "e": "Elle permet une comparaison reproductible en un point précis de l'amplitude."}, {"q": "Concernant les leviers, le cours recommande de les prendre :", "o": ["Longs si possible, et courts si la fixation est limitée", "Toujours courts, pour protéger l'articulation et le muscle", "Toujours longs, quelle que soit la fixation", "Indifféremment, selon l'habitude du thérapeute"], "r": 0, "e": "Le levier long augmente le moment résistant et affine la discrimination des grades élevés."}, {"q": "Avant le test, la checklist prévoit notamment :", "o": ["De déterminer passivement l'amplitude du segment", "De mesurer la force au dynamomètre, sur chaque muscle", "De faire un échauffement complet, à vélo", "De réaliser un bilan goniométrique complet"], "r": 0, "e": "S'y ajoutent l'explication, l'exposition de la zone, le placement en position initiale, la stabilisation, la palpation et la surveillance des substitutions."}, {"q": "La résistance doit être, selon le cours :", "o": ["Douce, ferme et graduée", "Maximale, dès le début", "Brève et brutale", "Maintenue longuement"], "r": 0, "e": "Il ne faut ni la maintenir trop longtemps ni la répéter, afin d'éviter la fatigue."}, {"q": "Le degré 2 de Lovett correspond à :", "o": ["Aucune contraction", "Une contraction palpable sans mouvement", "Une amplitude complète sans gravité", "Une amplitude complète contre gravité"], "r": 2, "e": "Le degré 3 correspond à l'amplitude complète contre gravité sans résistance, le 4 avec résistance modérée et le 5 avec résistance maximale."}]};</script>
