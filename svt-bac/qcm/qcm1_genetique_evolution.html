<script>window.QUIZ={"titre": "Génétique et évolution", "fiche": "../fiches/fiche1_genetique_evolution.html", "questions": [{"q": "La méiose produit, à partir d'une cellule diploïde 2n :", "o": ["2 cellules diploïdes identiques", "4 cellules haploïdes génétiquement uniques", "4 cellules diploïdes", "2 cellules haploïdes"], "r": 1, "e": "La méiose comporte 2 divisions et produit 4 cellules haploïdes (n) génétiquement différentes grâce au brassage."}, {"q": "Le brassage intrachromosomique a lieu :", "o": ["En anaphase I", "En prophase I lors du crossing-over", "En métaphase II", "Au cours de la mitose"], "r": 1, "e": "Le brassage intrachromosomique = crossing-over en prophase I de méiose, entre chromatides de chromosomes homologues."}, {"q": "La mitose assure :", "o": ["La diversité génétique de l'organisme", "Une division conforme : 2 cellules-filles identiques à la cellule-mère", "Le brassage chromosomique", "La fécondation"], "r": 1, "e": "Mitose = division conforme. Elle assure la stabilité génétique au sein d'un clone cellulaire. Pas de brassage, pas de réduction chromatidique."}, {"q": "Les points de contrôle du cycle cellulaire :", "o": ["Vérifient l'intégrité de l'ADN avant de poursuivre", "Sont notamment situés aux transitions G1/S, G2/M et lors du fuseau (M)", "Peuvent déclencher l'apoptose si l'ADN est trop endommagé", "Sont sans rapport avec les cancers"], "r": [0, 1, 2], "e": "Points de contrôle = surveillent l'ADN. P53 est un acteur clé qui arrête le cycle, déclenche réparation ou apoptose. Leur défaillance favorise les cancers."}, {"q": "Cocher les conditions de l'équilibre de Hardy-Weinberg :", "o": ["Grande population", "Pas de mutation, ni migration, ni sélection", "Population avec sélection forte", "Panmixie (croisements aléatoires)"], "r": [0, 1, 3], "e": "Hardy-Weinberg suppose une grande population, panmixie, pas de mutation/sélection/migration, ni dérive."}, {"q": "La dérive génétique est d'autant plus marquée que :", "o": ["La population est grande", "La population est petite", "La sélection est forte", "Les mutations sont rares"], "r": 1, "e": "Plus la population est petite, plus les variations aléatoires d'allèles (dérive) sont importantes."}, {"q": "L'évolution clonale désigne :", "o": ["L'évolution d'une espèce sur des millions d'années", "L'apparition de sous-clones génétiquement distincts au sein d'un clone cellulaire", "Le clonage thérapeutique", "Le brassage méiotique"], "r": 1, "e": "Évolution clonale = accumulation de mutations somatiques dans une lignée cellulaire → sous-clones → sélection cellulaire. Concept central en cancérologie."}, {"q": "L'endosymbiose explique :", "o": ["L'origine des mitochondries et chloroplastes", "L'apparition du noyau", "Les mutations somatiques", "Le crossing-over"], "r": 0, "e": "Théorie de Margulis : mitochondries (et chloroplastes) proviennent de bactéries internalisées par une cellule ancestrale."}, {"q": "Une spéciation allopatrique :", "o": ["Se produit dans la même zone géographique", "Implique un isolement géographique", "Conduit à des hybrides fertiles", "Est synonyme d'évolution convergente"], "r": 1, "e": "Allopatrique = isolement géographique (barrière physique) → divergence puis isolement reproductif."}, {"q": "L'espèce biologique (Mayr) est définie par :", "o": ["Une ressemblance morphologique", "Une zone géographique commune", "L'interfécondité et la fertilité de la descendance", "Le même nombre de chromosomes"], "r": 2, "e": "Définition de Mayr : populations naturelles inter-fécondes produisant une descendance viable et fertile."}, {"q": "Une mutation neutre :", "o": ["Disparaît rapidement", "N'affecte pas la valeur sélective", "Est toujours létale", "Est obligatoirement sélectionnée"], "r": 1, "e": "Mutation neutre = sans effet sur la fitness ; son destin dans la population dépend de la dérive génétique."}, {"q": "Cocher les barrières d'isolement reproductif post-zygotiques :", "o": ["Inviabilité de l'hybride", "Stérilité de l'hybride", "Habitats différents", "Faiblesse sélective des descendants F2"], "r": [0, 1, 3], "e": "Post-zygotique = après fécondation (inviabilité, stérilité ex. mulet, faiblesse F2). Pré-zygotique = avant (écologique, comportementale, mécanique, gamétique)."}, {"q": "Dans le cycle cellulaire, la réplication de l'ADN a lieu :", "o": ["En phase G1", "En phase S", "En phase G2", "En mitose"], "r": 1, "e": "Le cycle se déroule en G1 (croissance) → S (synthèse, l'ADN est répliqué) → G2 (préparation) → M (mitose). C'est en S que chaque chromosome passe de une à deux chromatides."}, {"q": "La réplication de l'ADN est dite semi-conservative parce que :", "o": ["Seule la moitié du génome est copiée", "Chaque molécule fille garde un brin parental et un brin néosynthétisé", "La copie n'est fidèle qu'à 50 %", "Elle ne concerne que la moitié des chromosomes"], "r": 1, "e": "La double hélice s'ouvre et chaque brin sert de matrice. Les deux molécules obtenues contiennent donc chacune un brin ancien conservé et un brin neuf — d'où « semi-conservative ». L'enzyme responsable est l'ADN polymérase."}, {"q": "Le point de contrôle G2/M vérifie principalement :", "o": ["La taille de la cellule et les nutriments disponibles", "Que la réplication est achevée et sans erreur avant d'engager la mitose", "L'attachement des chromosomes au fuseau avant l'anaphase", "La séparation correcte des cellules filles"], "r": 1, "e": "Chaque point de contrôle a sa mission : G1/S contrôle les conditions avant de répliquer, G2/M vérifie que la réplication est complète et correcte, et le point M (fuseau) contrôle l'attachement des chromosomes avant l'anaphase."}, {"q": "La protéine p53 est surnommée « gardien du génome » parce qu'elle :", "o": ["Répare directement toutes les cassures de l'ADN", "Arrête le cycle cellulaire en cas d'ADN endommagé et peut déclencher l'apoptose", "Accélère la réplication pour limiter les erreurs", "Empêche toute mutation d'apparaître"], "r": 1, "e": "p53 ne répare pas elle-même : elle bloque le cycle pour laisser le temps à la réparation, et si les dégâts sont irréparables elle déclenche l'apoptose. Sa perte de fonction est l'une des altérations les plus fréquentes dans les cancers."}, {"q": "Les mutations somatiques :", "o": ["Sont transmises à la descendance de l'individu", "Apparaissent dans les cellules non germinales et ne sont transmises qu'aux cellules filles", "Ne surviennent qu'après exposition à un agent mutagène", "Sont toujours immédiatement réparées"], "r": 1, "e": "Une mutation somatique touche une cellule du corps : elle se propage dans le clone issu de cette cellule mais ne passe pas aux enfants. Leur accumulation explique l'évolution clonale, la cancérogenèse et le mosaïcisme du vieillissement."}, {"q": "Dans un clone cellulaire, l'apparition d'une mutation conférant un avantage prolifératif aboutit à :", "o": ["L'élimination du sous-clone concerné", "L'expansion de ce sous-clone au détriment des autres, par sélection cellulaire", "Un retour à l'uniformité génétique du clone", "L'arrêt définitif des divisions"], "r": 1, "e": "C'est le principe de l'évolution clonale : la sélection naturelle s'applique aussi à l'échelle des cellules d'un même organisme. Le sous-clone avantagé se multiplie plus vite — mécanisme central de la cancérogenèse."}, {"q": "La maturation de l'affinité des anticorps par les lymphocytes B repose sur :", "o": ["Une méiose des lymphocytes", "Une hypermutation somatique suivie d'une sélection clonale", "Un transfert horizontal de gènes", "Une endosymbiose"], "r": 1, "e": "Les gènes des immunoglobulines subissent un taux de mutation très élevé dans les centres germinatifs ; les clones dont l'anticorps se lie le mieux à l'antigène sont sélectionnés et se multiplient. C'est de l'évolution clonale au service de l'immunité."}, {"q": "Le brassage interchromosomique a lieu :", "o": ["En prophase I, par crossing-over", "En anaphase I, par répartition aléatoire des chromosomes homologues", "En anaphase II, par séparation des chromatides", "Lors de la fécondation"], "r": 1, "e": "En anaphase I, chaque paire d'homologues se sépare indépendamment des autres : c'est le hasard de l'orientation des bivalents en métaphase I qui produit 2ⁿ combinaisons. Le crossing-over de prophase I est, lui, le brassage intrachromosomique."}, {"q": "Chez l'Homme (n = 23), le nombre de combinaisons chromosomiques issues du seul brassage interchromosomique est d'environ :", "o": ["23", "46", "8 millions (2²³)", "70 000 milliards"], "r": 2, "e": "2²³ ≈ 8,4 millions de gamètes chromosomiquement différents. Le chiffre de 70 000 milliards correspond à la fécondation, c'est-à-dire (2²³)², et ne tient pas encore compte des crossing-overs."}, {"q": "La reproduction sexuée :", "o": ["Crée de nouveaux allèles", "Réassortit des allèles préexistants sans en créer de nouveaux", "Supprime les allèles délétères", "Empêche toute mutation"], "r": 1, "e": "C'est un point clé du programme : méiose et fécondation ne font que redistribuer la diversité allélique existante. La seule source de nouveauté allélique est la mutation."}, {"q": "Deux gènes portés par le même chromosome et distants de 12 cM donneront, dans la descendance d'un test-cross :", "o": ["12 % de descendants recombinés", "50 % de descendants recombinés", "12 % de descendants parentaux", "Aucun recombiné"], "r": 0, "e": "Par définition, 1 centiMorgan correspond à 1 % de recombinaison. 12 cM signifie donc 12 % de phénotypes recombinés et 88 % de parentaux — signature de deux gènes liés."}, {"q": "Deux gènes situés à plus de 50 cM l'un de l'autre sur un même chromosome :", "o": ["Sont toujours transmis ensemble", "Se comportent statistiquement comme des gènes indépendants", "Ne peuvent pas être cartographiés du tout", "Donnent 100 % de recombinés"], "r": 1, "e": "Au-delà de 50 cM, les crossing-overs sont si fréquents qu'on observe 50 % de recombinés, exactement comme pour deux gènes sur des chromosomes différents. La liaison génétique devient indétectable par simple test-cross."}, {"q": "Le transfert horizontal de gènes se distingue de la transmission verticale parce qu'il :", "o": ["Se fait d'un parent vers sa descendance", "Se fait entre organismes non apparentés, sans reproduction", "N'existe que chez les eucaryotes", "Ne concerne que l'ARN"], "r": 1, "e": "La transmission verticale suit la filiation ; le transfert horizontal fait circuler des gènes latéralement, entre lignées distinctes. C'est pourquoi l'histoire génétique des procaryotes ressemble davantage à un réseau qu'à un arbre."}, {"q": "La conjugaison bactérienne correspond à :", "o": ["La captation d'ADN libre présent dans le milieu", "Le transfert d'un plasmide par un pont cytoplasmique entre deux bactéries", "Le transfert de gènes par un bactériophage", "La fusion de deux bactéries en une seule"], "r": 1, "e": "Trois mécanismes de transfert horizontal chez les procaryotes : la transformation (ADN libre capté dans le milieu), la conjugaison (plasmide transmis via un pilus) et la transduction (gènes véhiculés par un virus bactérien)."}, {"q": "La transduction désigne le transfert de gènes bactériens :", "o": ["Par contact direct entre deux bactéries", "Par l'intermédiaire d'un bactériophage", "Par absorption d'ADN libre", "Par division cellulaire"], "r": 1, "e": "Un bactériophage qui a emporté par erreur un fragment d'ADN de la bactérie précédente l'injecte dans la suivante. C'est l'un des trois mécanismes de transfert horizontal, avec la transformation et la conjugaison."}, {"q": "La diffusion rapide de la résistance aux antibiotiques entre bactéries s'explique surtout par :", "o": ["Des mutations apparaissant simultanément chez toutes les bactéries", "Le transfert horizontal de plasmides porteurs de gènes de résistance", "La reproduction sexuée des bactéries", "L'endosymbiose"], "r": 1, "e": "Les gènes de résistance sont souvent portés par des plasmides, qui circulent d'une bactérie à l'autre — y compris entre espèces différentes. C'est ce qui rend la résistance bien plus rapide à se répandre qu'une simple accumulation de mutations."}, {"q": "L'expérience de Griffith (1928) a mis en évidence :", "o": ["La nature chimique du matériel génétique", "L'existence d'un « principe transformant » transmissible entre bactéries", "La structure en double hélice de l'ADN", "Le code génétique"], "r": 1, "e": "Griffith a montré que des bactéries R vivantes non pathogènes deviennent pathogènes au contact de bactéries S tuées : quelque chose se transmet. Mais il ignorait la nature de ce « principe transformant » ; c'est Avery qui l'identifiera."}, {"q": "Dans l'expérience d'Avery, MacLeod et McCarty (1944), la perte du pouvoir transformant après traitement à la DNase prouve que :", "o": ["Les protéines sont le support de l'hérédité", "L'ARN est le support de l'hérédité", "L'ADN est le support de l'information génétique", "Les lipides membranaires portent l'information"], "r": 2, "e": "Le raisonnement est une élimination : ni la protéase ni la RNase ne suppriment la transformation, seule la DNase le fait. La molécule détruite par la DNase — l'ADN — est donc bien le support de l'information génétique."}, {"q": "Chez un rétrovirus, la transcriptase inverse permet :", "o": ["De traduire l'ARN viral en protéines", "De synthétiser de l'ADN à partir de l'ARN viral", "De répliquer l'ARN en ARN", "De découper le génome de l'hôte"], "r": 1, "e": "C'est l'inverse du flux habituel ADN → ARN, d'où le nom. L'ADN viral ainsi produit s'intègre dans le génome de la cellule hôte sous forme de provirus. Le VIH en est l'exemple type."}, {"q": "Les rétrovirus endogènes (ERV) représentent environ quelle part du génome humain ?", "o": ["Moins de 0,1 %", "Environ 1 %", "Environ 8 à 10 %", "Plus de 50 %"], "r": 2, "e": "Ces séquences sont les traces d'infections rétrovirales anciennes ayant touché des cellules germinales, puis transmises de génération en génération. Certaines ont été recyclées par l'organisme : une protéine d'enveloppe virale, la syncytine, intervient dans la formation du placenta des mammifères."}, {"q": "La production industrielle d'insuline humaine par des bactéries repose sur :", "o": ["Une endosymbiose", "L'insertion du gène humain dans un plasmide introduit dans une bactérie", "Une mutation dirigée du génome bactérien", "La méiose bactérienne"], "r": 1, "e": "Le génie génétique exploite les mécanismes naturels de transfert horizontal : le gène d'intérêt est cloné dans un plasmide, la bactérie transformée devient une « usine moléculaire ». Même principe pour l'hormone de croissance ou les interférons."}, {"q": "Selon la théorie de l'endosymbiose, la mitochondrie dérive :", "o": ["D'une cyanobactérie", "D'une α-protéobactérie", "D'un virus intégré", "D'un repliement de la membrane plasmique"], "r": 1, "e": "Margulis (1967) : une α-protéobactérie aérobie englobée par une cellule hôte est devenue la mitochondrie ; une cyanobactérie photosynthétique, dans une seconde endosymbiose, est devenue le chloroplaste."}, {"q": "Parmi ces arguments, lequel NE soutient PAS l'origine endosymbiotique des mitochondries ?", "o": ["Elles possèdent un ADN circulaire", "Leurs ribosomes sont de type 70S", "Elles sont entourées de deux membranes", "Elles sont dépourvues de tout génome propre"], "r": 3, "e": "C'est précisément l'inverse : la présence d'un génome propre est un argument majeur. Les mitochondries ont bien un ADN circulaire, des ribosomes 70S procaryotes, une double membrane et un ARNr 16S proche de celui des α-protéobactéries."}, {"q": "Le génome des mitochondries actuelles est très réduit par rapport à celui d'une bactérie libre parce que :", "o": ["Une grande partie des gènes a été transférée vers le noyau de la cellule hôte", "Les gènes ont été détruits par des mutations", "La mitochondrie n'a jamais eu beaucoup de gènes", "Le génome mitochondrial se dégrade à chaque division"], "r": 0, "e": "C'est le transfert de gènes endosymbiotiques vers le noyau (EGNT). L'organite reste dépendant de la cellule hôte, qui fabrique et lui adresse la plupart de ses protéines."}, {"q": "Une famille multigénique résulte typiquement :", "o": ["D'un transfert horizontal depuis une bactérie", "De la duplication d'un gène ancestral suivie de mutations indépendantes des copies", "D'une endosymbiose", "D'un brassage interchromosomique"], "r": 1, "e": "La duplication fournit une copie surnuméraire, libre de muter sans coût immédiat ; les copies divergent et peuvent se spécialiser. La famille des globines — myoglobine, α-globine, β-globine, hémoglobine fœtale — en est l'exemple classique."}, {"q": "L'hémoglobine fœtale (HbF) et la β-globine adulte sont issues :", "o": ["De deux gènes sans lien de parenté", "De copies divergentes d'un même gène ancestral", "D'un transfert horizontal viral", "De deux espèces différentes"], "r": 1, "e": "Ce sont des gènes homologues de la famille des globines, nés de duplications successives. Leur parenté de séquence est la trace de leur ancêtre commun, et leur divergence a permis à l'HbF d'acquérir une affinité pour l'O₂ supérieure à celle de l'hémoglobine maternelle."}, {"q": "Le pool génique d'une population désigne :", "o": ["L'ensemble des individus de la population", "L'ensemble des allèles de tous les gènes présents dans la population", "Le génome d'un individu représentatif", "L'ensemble des mutations apparues"], "r": 1, "e": "C'est le réservoir allélique collectif. L'évolution d'une population se lit comme une modification des fréquences alléliques dans ce pool au fil des générations."}, {"q": "Dans une population à l'équilibre de Hardy-Weinberg, si la fréquence de l'allèle a est q = 0,2, la fréquence des hétérozygotes Aa est :", "o": ["0,04", "0,16", "0,32", "0,64"], "r": 2, "e": "p = 1 − 0,2 = 0,8 ; les hétérozygotes valent 2pq = 2 × 0,8 × 0,2 = 0,32, soit 32 %. On vérifie : p² = 0,64, 2pq = 0,32, q² = 0,04, dont la somme fait bien 1."}, {"q": "Dans une population à l'équilibre de Hardy-Weinberg, une maladie récessive touche 1 individu sur 10 000. La fréquence de l'allèle morbide est :", "o": ["0,0001", "0,01", "0,1", "0,5"], "r": 1, "e": "Les malades sont les homozygotes récessifs : q² = 1/10 000 = 0,0001, donc q = 0,01. Les porteurs sains valent 2pq ≈ 2 × 0,99 × 0,01 ≈ 2 %, soit environ 200 fois plus nombreux que les malades."}, {"q": "Le modèle de Hardy-Weinberg décrit une population :", "o": ["Réelle et représentative", "Théorique et idéale, qui n'évolue pas", "En cours de spéciation", "Soumise à une forte sélection"], "r": 1, "e": "C'est un modèle de référence : il décrit ce qui se passerait en l'absence de toute force évolutive. Son intérêt est justement comparatif — un écart entre fréquences observées et fréquences théoriques signale qu'une force évolutive est à l'œuvre."}, {"q": "La sélection stabilisante :", "o": ["Déplace la moyenne du caractère vers un extrême", "Élimine les phénotypes extrêmes et favorise la moyenne", "Favorise les deux extrêmes au détriment de la moyenne", "N'a aucun effet sur les fréquences"], "r": 1, "e": "Le poids de naissance humain en est l'exemple classique : les nouveau-nés très légers comme très lourds ont une survie moindre. La sélection directionnelle déplace la moyenne (phalène du bouleau), la diversifiante favorise les extrêmes (becs des pinsons)."}, {"q": "Le mélanisme industriel de la phalène du bouleau illustre une sélection :", "o": ["Stabilisante", "Directionnelle", "Diversifiante", "Sexuelle"], "r": 1, "e": "Le noircissement des troncs par la suie a rendu la forme sombre moins visible des prédateurs : la fréquence de la forme claire s'est effondrée, la moyenne du caractère s'est déplacée vers un extrême. C'est la définition de la sélection directionnelle."}, {"q": "Le maintien de l'allèle drépanocytaire HbS en zone de paludisme s'explique par :", "o": ["L'absence de sélection sur cet allèle", "L'avantage sélectif des hétérozygotes HbA/HbS, protégés du paludisme", "Un taux de mutation exceptionnellement élevé", "Une migration massive"], "r": 1, "e": "L'homozygote HbS/HbS est gravement atteint et l'homozygote HbA/HbA est vulnérable au paludisme : c'est l'hétérozygote qui est le mieux loti. Cette sélection balancée maintient les deux allèles dans la population — un polymorphisme stable."}, {"q": "La dérive génétique est d'autant plus efficace que :", "o": ["La sélection naturelle est forte", "La population est de petite taille", "Le taux de mutation est élevé", "La migration est importante"], "r": 1, "e": "La dérive est un effet d'échantillonnage aléatoire des gamètes. Dans une grande population les écarts se compensent ; dans une petite, le hasard peut fixer ou éliminer un allèle indépendamment de sa valeur sélective."}, {"q": "L'effet fondateur correspond à :", "o": ["La réduction brutale d'une population par une catastrophe", "La colonisation d'un nouveau milieu par quelques individus au pool génique peu représentatif", "L'arrivée massive de migrants dans une population", "L'apparition d'un nouvel allèle avantageux"], "r": 1, "e": "Effet fondateur et goulot d'étranglement produisent le même résultat — une population dont la diversité génétique est réduite et décalée par rapport à la population d'origine — mais le premier vient d'un départ, le second d'un effondrement sur place."}, {"q": "La migration entre deux populations tend à :", "o": ["Accentuer leur différenciation génétique", "Homogénéiser leurs fréquences alléliques", "Supprimer toute mutation", "Provoquer une spéciation immédiate"], "r": 1, "e": "Le flux de gènes fait circuler les allèles d'une population à l'autre et s'oppose donc à la divergence. C'est pourquoi l'isolement géographique, qui interrompt ce flux, est la condition de la spéciation allopatrique."}, {"q": "Parmi les forces évolutives, laquelle est la seule à créer de nouveaux allèles ?", "o": ["La sélection naturelle", "La dérive génétique", "La mutation", "La migration"], "r": 2, "e": "Sélection, dérive et migration ne font que modifier les fréquences d'allèles déjà présents. Seule la mutation fournit la matière première de l'évolution — et elle est aléatoire, non orientée par les besoins de l'organisme."}, {"q": "La spéciation sympatrique se distingue de la spéciation allopatrique par :", "o": ["L'absence d'isolement géographique entre les populations qui divergent", "Une durée beaucoup plus longue", "L'absence de barrières reproductives", "Le fait qu'elle ne concerne que les animaux"], "r": 0, "e": "En sympatrie, les populations divergent alors qu'elles occupent le même territoire — par polyploïdisation chez les plantes, ou sous l'effet d'une sélection divergente très forte. L'allopatrie, plus fréquente, suppose une séparation géographique préalable."}]};</script>
