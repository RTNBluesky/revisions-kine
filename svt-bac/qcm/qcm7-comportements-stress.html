    <script>window.QUIZ={"titre": "Comportements et stress", "fiche": "../fiches/fiche7-comportements-stress.html", "questions": [{"q": "La réponse de stress aiguë met en jeu :", "o": ["Le système nerveux parasympathique, par le nerf vague", "Le sympathique et la médullosurrénale", "Uniquement le cortisol, plus lent", "Le système digestif, à jeun"], "r": 1, "e": "Stress aigu (qq secondes) : sympathique active la médullosurrénale → adrénaline → tachycardie, vigilance, mobilisation glucose. La médullosurrénale libère l'adrénaline."}, {"q": "L'axe HHC désigne :", "o": ["Hypothalamus-Hypophyse-Corticosurrénales", "Hypothalamus-Hippocampe-Cortex cérébral", "Hypophyse-Hépatique-Cardiovasculaire", "Hypothalamus-Hypophyse-Cervelet"], "r": 0, "e": "Axe corticotrope = HHC : CRH (hypothalamus) → ACTH (hypophyse) → cortisol (corticosurrénales)."}, {"q": "Le cortisol :", "o": ["Est sécrété en quelques secondes, par réflexe", "Est sécrété en minutes à heures, si le stress dure", "Augmente la glycémie, par néoglucogenèse", "A un effet anti-inflammatoire"], "r": [1, 2, 3], "e": "Cortisol = glucocorticoïde du stress chronique. Effet hyperglycémiant + anti-inflammatoire + immunodépresseur."}, {"q": "L'adrénaline :", "o": ["Est sécrétée par la médullosurrénale", "Augmente la fréquence cardiaque et la glycémie", "Dilate les bronches", "Est libérée en quelques secondes", "Est sécrétée par le cortex surrénalien"], "r": [0, 1, 2, 3], "e": "Adrénaline : hormone du stress aigu, sécrétée en secondes par la médullosurrénale, effets cardiovasculaires, métaboliques et respiratoires. Le cortex surrénalien sécrète le cortisol ; l'adrénaline vient de la médullosurrénale."}, {"q": "Un phéochromocytome est :", "o": ["Une tumeur de la médullosurrénale, à catécholamines", "Une maladie virale, des surrénales", "Un syndrome auto-immun, avec destruction des deux surrénales", "Une carence en cortisol, ou insuffisance surrénale"], "r": 0, "e": "Phéochromocytome : tumeur (souvent bénigne) de la médullosurrénale → excès d'adrénaline/noradrénaline → HTA, tachycardie, sueurs. Ces catécholamines sont sécrétées en excès."}, {"q": "Le GABA est :", "o": ["Un neurotransmetteur excitateur, du cortex", "Le principal neurotransmetteur inhibiteur du cerveau", "Un acide aminé essentiel, apporté uniquement par l'alimentation", "Sécrété par l'hypophyse, dans le sang"], "r": 1, "e": "GABA (acide γ-aminobutyrique) = principal neurotransmetteur inhibiteur du système nerveux central."}, {"q": "Les benzodiazépines :", "o": ["Activent les récepteurs GABA-A", "Sont stimulantes, comme la caféine", "Traitent l'anxiété, l'insomnie et l'épilepsie", "Peuvent créer une dépendance"], "r": [0, 2, 3], "e": "Benzodiazépines : agonistes du GABA-A → effet anxiolytique, sédatif, hypnotique, anti-épileptique. Tolérance et dépendance possibles. Leur effet est anxiolytique."}, {"q": "Le stress chronique :", "o": ["Augmente la résistance aux infections", "Favorise la dépression et l'HTA", "Affaiblit le système immunitaire", "Est sans conséquence sur la santé"], "r": [1, 2], "e": "Stress chronique : cortisol chronique → effets délétères (dépression, HTA, diabète, immunodépression, troubles du sommeil). Il favorise aussi les troubles cardiovasculaires, par un cortisol élevé."}, {"q": "Le système nerveux parasympathique :", "o": ["Est activé en situation de stress", "Est activé au repos et en digestion", "Ralentit le rythme cardiaque", "Libère surtout de l'acétylcholine"], "r": [1, 2, 3], "e": "Parasympathique = repos. Antagoniste du sympathique. Neurotransmetteur : acétylcholine. Bradycardie, digestion."}, {"q": "Une rétroaction négative dans l'axe HHC :", "o": ["Le cortisol stimule sa propre sécrétion, par la CRH", "Le cortisol inhibe la libération de CRH et d'ACTH", "L'adrénaline contrôle le cortisol", "L'hypothalamus n'est pas concerné"], "r": 1, "e": "Boucle de rétrocontrôle négatif : cortisol élevé inhibe l'hypothalamus (CRH) et l'hypophyse (ACTH)."}, {"q": "Les 3 phases de Selye (syndrome général d'adaptation) sont :", "o": ["L'alarme, par l'adrénaline", "La résistance, par le cortisol", "L'épuisement de la réponse", "La latence, sans réaction"], "r": [0, 1, 2], "e": "Selye (1936) : Alarme → Résistance → Épuisement. Modèle classique de la réponse au stress chronique."}, {"q": "L'amygdale :", "o": ["Détecte les menaces et suscite la peur", "Active rapidement l'axe sympathique", "N'a aucun rôle dans la réponse au stress", "Appartient au système limbique"], "r": [0, 1, 3], "e": "Amygdale = sentinelle émotionnelle du système limbique. Active hypothalamus → réponse de stress avant analyse corticale."}, {"q": "Le rythme circadien du cortisol :", "o": ["Pic le matin au réveil (~ 8h)", "Baisse durant la journée", "Minimal la nuit", "Plat (sans variation)"], "r": [0, 1, 2], "e": "Cortisol = rythme circadien marqué : pic matinal (réveil), décroissance journée, minimum nocturne. Lié à l'horloge biologique."}, {"q": "Une vision intégrée de l'organisme face au stress fait intervenir :", "o": ["Le système nerveux", "Le système endocrinien", "Le système immunitaire", "Aucun lien entre eux"], "r": [0, 1, 2], "e": "Vision intégrée : axes neuro-endocrino-immunitaires interconnectés. Cortisol immunodépresseur, cytokines modulent cerveau (sickness behavior)."}, {"q": "La résilience face au stress dépend :", "o": ["Du capital génétique", "Du soutien social", "De l'environnement précoce", "D'activités qui gèrent le stress", "Du groupe sanguin"], "r": [0, 1, 2, 3], "e": "Résilience = facteurs multiples : génétique (récepteurs aux glucocorticoïdes), expériences précoces, soutien social, stratégies d'adaptation. Aucun lien n'est établi entre groupe sanguin et résilience au stress. Sport et méditation en sont des exemples."}, {"q": "Selon la définition de Selye (1936), le stress est :", "o": ["Une réaction spécifique à chaque type d'agression subie", "La réponse non spécifique de l'organisme à toute demande", "Un trouble psychologique durable", "Une maladie du système nerveux"], "r": 1, "e": "Ce qui frappait Selye, c'est que des agressions très différentes — froid, blessure, peur, infection — déclenchent le même cortège de réponses physiologiques. D'où le mot « non spécifique »."}, {"q": "Dans le système limbique, l'amygdale :", "o": ["Contextualise la peur grâce à la mémoire", "Détecte le danger et active l'hypothalamus", "Évalue rationnellement la situation", "Sécrète le cortisol du stress"], "r": 1, "e": "Trois structures se partagent le travail : l'amygdale détecte et alerte, l'hippocampe replace la menace dans son contexte et peut inhiber la réponse, le cortex préfrontal évalue et module. Elle déclenche ainsi la réponse de stress."}, {"q": "L'hippocampe intervient dans la réponse au stress en :", "o": ["Déclenchant la réaction de peur, en toute urgence", "Contextualisant la peur, et en freinant la réponse", "Sécrétant l'adrénaline dans le sang", "Dilatant les pupilles, par réflexe"], "r": 1, "e": "C'est lui qui permet de reconnaître qu'une situation ressemblante n'est pas dangereuse ici et maintenant. Le stress chronique l'altère, ce qui explique à la fois les troubles de mémoire et la difficulté à éteindre la réponse au stress."}, {"q": "Dans l'axe HHC, l'hypothalamus sécrète :", "o": ["L'ACTH", "La CRH", "Le cortisol", "L'adrénaline"], "r": 1, "e": "La cascade à retenir : hypothalamus → CRH, hypophyse antérieure → ACTH, cortex surrénalien → cortisol. Chaque étage amplifie et relaie le signal."}, {"q": "L'ACTH est sécrétée par :", "o": ["L'hypothalamus", "L'hypophyse antérieure", "Le cortex surrénalien", "La médullosurrénale"], "r": 1, "e": "Les cellules adrénocorticotropes de l'antéhypophyse répondent à la CRH hypothalamique et libèrent l'ACTH dans la circulation générale, où elle va stimuler la zone fasciculée du cortex surrénalien."}, {"q": "Le cortisol est sécrété par :", "o": ["La médullosurrénale, interne", "La zone fasciculée du cortex surrénalien", "L'hypophyse antérieure", "L'hypothalamus, par le noyau paraventriculaire"], "r": 1, "e": "La glande surrénale comprend deux tissus bien distincts : le cortex périphérique, qui produit le cortisol, et la médulla centrale, qui produit l'adrénaline. Ils relèvent de deux voies de commande différentes."}, {"q": "Dans la phase d'alarme de la réponse au stress, le médiateur principal est :", "o": ["Le cortisol", "L'adrénaline", "La CRH", "Le GABA"], "r": 1, "e": "Trois phases se succèdent : alarme en quelques secondes sous l'effet de l'adrénaline, résistance en quelques minutes sous l'effet du cortisol, puis résilience grâce au rétrocontrôle négatif."}, {"q": "La phase de résilience de la réponse au stress repose sur :", "o": ["L'épuisement des surrénales", "Le rétrocontrôle négatif du cortisol sur l'axe", "Une libération accrue d'adrénaline, par la médullosurrénale", "L'activation du système sympathique"], "r": 1, "e": "Le cortisol freine sa propre production en inhibant la sécrétion de CRH et d'ACTH, ce qui ramène l'organisme à son état de base. Si le stress se prolonge, cette boucle est débordée et le dérèglement s'installe. Il s'exerce sur l'hypothalamus et l'hypophyse."}, {"q": "Le cortisol est une hormone :", "o": ["Peptidique, agissant sur un récepteur membranaire du foie", "Stéroïdienne, à récepteur intracellulaire", "Dérivée d'un acide aminé, la tyrosine", "Sécrétée par le pancréas"], "r": 1, "e": "Étant liposoluble, il traverse les membranes et se fixe à un récepteur intracellulaire, puis modifie l'expression des gènes. D'où une action plus lente mais plus durable que celle de l'adrénaline. Elle dérive du cholestérol."}, {"q": "Parmi les effets métaboliques du cortisol, on retrouve :", "o": ["Une baisse de la glycémie", "Une hausse de la glycémie, par néoglucogenèse", "Un stockage du glycogène, dans le foie et dans les muscles", "Une inhibition de la lipolyse"], "r": 1, "e": "Le cortisol mobilise les réserves : il fabrique du glucose à partir des acides aminés issus du catabolisme musculaire et libère des acides gras. La logique est de fournir de l'énergie pour faire face à l'agression. La néoglucogenèse est hépatique."}, {"q": "L'effet du cortisol sur le système immunitaire est :", "o": ["Une stimulation de l'inflammation", "Une immunosuppression, utile mais délétère si elle dure", "Aucun effet notable sur l'immunité", "Une augmentation des cytokines, et donc de l'inflammation locale"], "r": 1, "e": "C'est sur cet effet que repose l'usage thérapeutique des corticoïdes de synthèse. Maintenu dans la durée, il expose aux infections récurrentes et, paradoxalement, à une inflammation chronique de bas grade."}, {"q": "Le rythme circadien du cortisol se caractérise par :", "o": ["Un pic nocturne et un creux matinal", "Un pic matinal vers 8 h et un creux nocturne", "Une concentration constante sur les 24 h", "Deux pics, à midi et à minuit"], "r": 1, "e": "Ce rythme est piloté par le noyau suprachiasmatique de l'hypothalamus. Sa perturbation est un marqueur du stress chronique, et l'aplatissement de la courbe s'observe notamment dans le burn-out."}, {"q": "Le syndrome de Cushing résulte :", "o": ["D'un déficit en cortisol", "D'un excès de cortisol", "D'un excès d'adrénaline", "D'une carence en GABA"], "r": 1, "e": "L'hypercortisolisme, spontané ou iatrogène, se traduit par une obésité abdominale, une hypertension, une fonte musculaire, une ostéoporose et une immunodépression. C'est le revers des effets adaptatifs à court terme."}, {"q": "L'adrénaline est synthétisée à partir de la noradrénaline par l'enzyme codée par le gène :", "o": ["CYP11A1", "PNMT", "CRH", "GABA-A"], "r": 1, "e": "Le gène PNMT s'exprime dans la médullosurrénale, CYP11A1 exclusivement dans le cortex surrénalien. L'immunomarquage de ces deux protéines permet d'identifier le tissu concerné dans une tumeur."}, {"q": "Les cellules chromaffines sont :", "o": ["Les cellules du cortex surrénalien, qui sécrètent le cortisol", "Des cellules neuroendocrines de la médullosurrénale", "Des neurones de l'hypothalamus", "Des cellules de l'hypophyse"], "r": 1, "e": "Elles sont l'équivalent d'un ganglion sympathique modifié : au lieu de libérer un neurotransmetteur dans une synapse, elles déversent l'adrénaline directement dans le sang. D'où la rapidité de la phase d'alarme. Elles sont innervées par le système sympathique."}, {"q": "L'adrénaline agit sur :", "o": ["Un récepteur intracellulaire, en modifiant l'expression des gènes", "Des récepteurs membranaires, avec des effets rapides", "Le noyau des cellules cibles uniquement", "Les récepteurs GABA-A du cerveau"], "r": 1, "e": "C'est ce qui explique la différence de cinétique avec le cortisol : action en quelques secondes pour l'adrénaline via des récepteurs de surface, en quelques dizaines de minutes pour le cortisol via la transcription. Ce sont des récepteurs α et β-adrénergiques."}, {"q": "Parmi ces effets, lequel n'est PAS un effet de l'adrénaline lors d'un stress aigu ?", "o": ["Une bronchodilatation", "Une hausse de la fréquence cardiaque", "Une vasoconstriction des muscles", "Une mydriase, par dilatation des pupilles"], "r": 2, "e": "C'est l'inverse : les vaisseaux des muscles se dilatent pour y amener le sang, tandis que ceux de la peau et de l'intestin se contractent. Toute la réponse « fight or flight » vise à irriguer et oxygéner les muscles."}, {"q": "L'effet de l'adrénaline sur le foie est :", "o": ["La glycogenèse, qui stocke le glucose en réserve", "La glycogénolyse, qui élève la glycémie", "La lipogenèse, à partir du glucose", "La synthèse de cortisol"], "r": 1, "e": "Il faut du carburant immédiatement disponible : l'adrénaline dégrade le glycogène hépatique en glucose. Le cortisol prendra le relais plus tard, par la néoglucogenèse."}, {"q": "Dans l'hypothalamus, les neurones GABAergiques du noyau préoptique :", "o": ["Stimulent la sécrétion de CRH, en continu", "Inhibent le noyau paraventriculaire, réduisant la CRH", "Sécrètent l'ACTH, directement dans le sang de la circulation générale", "Produisent l'adrénaline du stress"], "r": 1, "e": "C'est le frein inhibiteur de l'axe HHC. En cas de stress chronique, l'expression des récepteurs au GABA diminue : le frein s'affaiblit, la CRH augmente et l'axe se dérègle."}, {"q": "Les benzodiazépines exercent leur effet anxiolytique en :", "o": ["Bloquant les récepteurs à l'adrénaline", "Potentialisant l'action du GABA sur ses récepteurs", "Inhibant directement la sécrétion d'ACTH par l'hypophyse", "Stimulant le cortex surrénalien"], "r": 1, "e": "En renforçant l'inhibition GABAergique, elles atténuent l'activation de l'axe HHC. Elles sont aussi somnifères, antiépileptiques et myorelaxantes — toutes conséquences de cette même inhibition renforcée."}, {"q": "Le risque de dépendance aux benzodiazépines s'explique par :", "o": ["Leur action sur les récepteurs opioïdes, comme la morphine", "Leur action dans l'aire tegmentale, qui désinhibe la dopamine", "Leur effet myorelaxant, sur les muscles", "Leur métabolisme hépatique, lent"], "r": 1, "e": "En levant l'inhibition qui pesait sur les neurones à dopamine, elles activent indirectement le circuit de récompense — le même mécanisme final que l'héroïne ou le cannabis, par des portes d'entrée différentes. Elles agissent sur des récepteurs GABA-A de type α1 et désinhibent les neurones dopaminergiques."}, {"q": "Concernant le traitement du stress chronique, il est exact que les benzodiazépines :", "o": ["Guérissent la cause même du stress", "Ne traitent que les symptômes, sans agir sur la résilience", "Sont dénuées de tout risque, même en traitement prolongé de plusieurs mois", "Sont le seul traitement possible"], "r": 1, "e": "Elles agissent sur l'anxiété, l'insomnie et les tremblements, mais laissent intacts le stresseur et le dérèglement de l'axe. Les approches non médicamenteuses agissent sur la capacité de récupération elle-même. Méditation, yoga et activité physique favorisent la résilience sans dépendance."}, {"q": "Le burn-out se caractérise sur le plan hormonal par :", "o": ["Un excès permanent de cortisol, jour et nuit, sans pause", "Un effondrement du cortisol, après une longue activation", "Une absence totale d'adrénaline sanguine", "Une hypersécrétion de GABA, dans le cerveau"], "r": 1, "e": "L'axe finit par s'épuiser après une sollicitation continue. L'OMS le reconnaît comme syndrome lié au travail depuis 2019 — il n'est pas classé comme une maladie mais comme un phénomène professionnel. C'est l'axe HHC qui s'épuise."}, {"q": "Le stress chronique entraîne au niveau de l'hippocampe :", "o": ["Une augmentation de la neurogenèse", "Une baisse de la neurogenèse et des dendrites", "Une hyperactivité comparable à celle de l'amygdale", "Aucune modification structurale, seulement fonctionnelle et réversible"], "r": 1, "e": "Hippocampe et cortex préfrontal régressent, tandis que l'amygdale devient hyperactive. D'où l'association caractéristique : troubles de mémoire, difficulté de contrôle exécutif et hypervigilance anxieuse."}, {"q": "Les modifications cérébrales induites par le stress chronique :", "o": ["Sont définitives, quel que soit l'âge", "Sont réversibles si le stress cesse", "Ne concernent que l'amygdale, sans autre zone", "Touchent uniquement les enfants, dont le cerveau est en développement"], "r": 1, "e": "C'est un message essentiel du chapitre : le cerveau se remodèle sous l'effet de l'environnement, dans un sens comme dans l'autre. La plasticité qui a permis la dégradation permet aussi la récupération. Cela illustre la plasticité cérébrale."}, {"q": "Parmi les conséquences métaboliques du stress chronique, on retrouve :", "o": ["Une hypoglycémie chronique, à jeun", "Une obésité viscérale et un risque de diabète de type 2", "Une prise de masse musculaire, en 2 mois", "Une baisse de la pression artérielle, avec des malaises au lever"], "r": 1, "e": "L'hyperglycémie entretenue par le cortisol finit par favoriser l'insulinorésistance, et l'adipogenèse centrale redistribue la graisse vers l'abdomen. S'y ajoute une fonte musculaire liée au catabolisme protéique."}, {"q": "Dans les expériences de Weiss (1972) sur le rat, le stress est réduit lorsque l'animal :", "o": ["Ne peut pas prévoir le choc", "Peut contrôler la survenue des chocs", "Reçoit des chocs plus intenses", "Est isolé"], "r": 1, "e": "Contrôle, prédictibilité et rétroaction pertinente diminuent l'impact du stresseur — les lésions gastriques sont moindres à agression physique identique. À l'inverse, des règles qui changent amplifient le stress."}, {"q": "L'étude randomisée en double aveugle de Walach (2001) sur les remèdes de Bach a montré :", "o": ["Une efficacité supérieure au placebo", "Une efficacité équivalente à celle d'un placebo", "Une aggravation de l'anxiété", "Une efficacité uniquement chez l'enfant anxieux"], "r": 1, "e": "L'intérêt de cet exemple est méthodologique : seul un essai contrôlé permet de distinguer l'effet propre d'un produit de l'effet placebo, particulièrement puissant sur une plainte subjective comme l'anxiété. Aucun effet spécifique n'a été démontré."}, {"q": "Le phéochromocytome est :", "o": ["Une tumeur du cortex surrénalien sécrétant du cortisol", "Une tumeur souvent bénigne, de la médullosurrénale", "Une tumeur de l'hypophyse, sécrétant de l'ACTH en grande quantité", "Une maladie auto-immune des surrénales"], "r": 1, "e": "L'hypersécrétion d'adrénaline provoque des accès de tachycardie, des poussées d'hypertension, des sueurs et des céphalées. L'immunomarquage du gène PNMT confirme l'origine médullaire de la tumeur. Elle sécrète de l'adrénaline."}, {"q": "La technique d'immunomarquage utilisée dans l'étude des surrénales repose sur :", "o": ["La mesure des hormones sanguines, au laboratoire", "Des anticorps reconnaissant une protéine du tissu", "L'imagerie par résonance magnétique, en coupes", "Le séquençage complet de l'ADN tumoral"], "r": 1, "e": "Elle permet de visualiser directement où une protéine est exprimée : PNMT dans la médulla, CYP11A1 dans le cortex. C'est ainsi qu'on rattache une tumeur à l'un ou l'autre tissu. Ces anticorps sont de synthèse."}, {"q": "Le système nerveux parasympathique, par rapport au sympathique :", "o": ["Amplifie la réponse de stress, en toute urgence", "Favorise le retour au calme et la reprise digestive", "Sécrète le cortisol des surrénales", "Est inactif en permanence, au repos"], "r": 1, "e": "Les deux branches du système autonome s'équilibrent : le sympathique prépare à l'action, le parasympathique restaure et économise. Le retour à l'homéostasie après un stress passe par sa remise en jeu. Il ralentit aussi le cœur."}, {"q": "La noradrénaline se distingue de l'adrénaline par :", "o": ["Son absence totale d'effet sur le cœur et les vaisseaux", "Son rôle surtout de neurotransmetteur du sympathique", "Sa nature stéroïdienne, lipidique", "Sa sécrétion par le cortex surrénalien"], "r": 1, "e": "Elle est à la fois neurotransmetteur aux terminaisons sympathiques et hormone médullosurrénalienne. Ses effets recoupent ceux de l'adrénaline, avec une composante vasoconstrictrice plus forte. Son effet vasoconstricteur est aussi plus marqué."}, {"q": "Le rétrocontrôle négatif de l'axe HHC s'exerce :", "o": ["Du cortisol sur l'hypothalamus et l'hypophyse", "De l'ACTH sur le cortex surrénalien", "De la CRH sur l'amygdale, pour éteindre la peur", "De l'adrénaline sur l'hypothalamus"], "r": 0, "e": "Le produit final freine les étages qui l'ont commandé : moins de CRH, moins d'ACTH, donc moins de cortisol. C'est ce dispositif qui empêche l'emballement — et qui est débordé dans le stress chronique."}, {"q": "Le cortex préfrontal intervient dans la réponse au stress en :", "o": ["Déclenchant directement la sécrétion de cortisol", "Évaluant la situation et en modulant la réponse", "Produisant le GABA de l'hypothalamus", "Contrôlant le rythme circadien, par le noyau suprachiasmatique"], "r": 1, "e": "C'est l'étage d'évaluation cognitive : une même situation sera vécue comme une menace ou comme un défi selon l'interprétation. Son altération par le stress chronique réduit cette capacité de régulation. Il peut moduler la réponse à la hausse comme à la baisse."}, {"q": "La variabilité interindividuelle de la réponse au stress s'explique par :", "o": ["Le seul patrimoine génétique, hérité", "Des facteurs génétiques, développementaux et sociaux", "L'âge uniquement, chez l'adulte", "Le type de stresseur exclusivement, physique ou psychique et sa durée"], "r": 1, "e": "À stresseur identique, les réponses diffèrent selon le terrain biologique, l'histoire de développement et les ressources de l'environnement — soutien social, sentiment de contrôle, stratégies apprises."}]};</script>
