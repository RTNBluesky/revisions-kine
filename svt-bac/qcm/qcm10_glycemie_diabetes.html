<script>window.QUIZ={"titre": "Glycémie et diabètes", "fiche": "../fiches/fiche10_glycemie_diabetes.html", "questions": [{"q": "La glycémie normale à jeun est d'environ :", "o": ["0,3 g/L", "0,9 g/L (0,7-1,1 g/L)", "2 g/L", "5 g/L"], "r": 1, "e": "Glycémie de consigne ≈ 0,9 g/L (intervalle physiologique 0,7 à 1,1 g/L)."}, {"q": "L'insuline :", "o": ["Est sécrétée par les cellules α", "Est sécrétée par les cellules β des îlots de Langerhans", "Est hypoglycémiante", "Est hyperglycémiante"], "r": [1, 2], "e": "Insuline : sécrétée par les cellules β. Hypoglycémiante (stockage glucose en glycogène/lipides)."}, {"q": "Le glucagon :", "o": ["Est hyperglycémiant", "Est sécrété par les cellules α", "Stimule glycogénolyse et néoglucogenèse au foie", "Est antagoniste de l'insuline", "Stimule la captation du glucose par les muscles"], "r": [0, 1, 2, 3], "e": "Glucagon : sécrété par les cellules α, antagoniste de l'insuline, hyperglycémiant via le foie. C'est l'action de l'insuline ; le glucagon libère du glucose au lieu de le faire entrer dans les cellules."}, {"q": "Le diabète de type 1 est :", "o": ["D'origine auto-immune", "Caractérisé par une destruction des cellules β", "Insulinodépendant (insulinothérapie indispensable)", "Le plus fréquent"], "r": [0, 1, 2], "e": "DT1 (≈ 10 % des diabètes) : auto-immune → destruction cellules β → insuline quasi nulle → insulinothérapie à vie."}, {"q": "Le diabète de type 2 est :", "o": ["Le plus fréquent (~ 90 %)", "Lié à une insulinorésistance des cellules cibles", "Favorisé par obésité et sédentarité", "Toujours insulinodépendant dès le diagnostic"], "r": [0, 1, 2], "e": "DT2 : ~90 % des diabètes. Insulinorésistance d'abord, puis épuisement des cellules β. Favorisé par mode de vie."}, {"q": "L'HbA1c (hémoglobine glyquée) :", "o": ["Reflète la glycémie à un instant t", "Reflète la glycémie moyenne des 2-3 derniers mois", "Cible thérapeutique généralement < 7 %", "Sert au suivi du diabète"], "r": [1, 2, 3], "e": "HbA1c : glycation de l'hémoglobine, intégrée sur la durée de vie des globules rouges (~120 j). Cible < 7 % en général."}, {"q": "La néoglucogenèse :", "o": ["Se fait dans tous les organes", "Se fait principalement au foie (et un peu au rein)", "Utilise lactate, acides aminés, glycérol", "Augmente la glycémie"], "r": [1, 2, 3], "e": "Néoglucogenèse : synthèse de novo de glucose à partir de précurseurs non glucidiques, principalement hépatique."}, {"q": "Les complications microvasculaires du diabète comprennent :", "o": ["Rétinopathie", "Néphropathie", "Neuropathie", "Infarctus du myocarde"], "r": [0, 1, 2], "e": "Microvasculaires (petits vaisseaux) : rétine, rein, nerfs. L'infarctus est macrovasculaire (gros vaisseaux)."}, {"q": "La régulation de la glycémie est un exemple de :", "o": ["Rétroaction positive", "Rétroaction négative (homéostasie)", "Système non régulé", "Réflexe nerveux uniquement"], "r": 1, "e": "La glycémie est maintenue autour de la consigne par un système à rétroaction négative (boucle hormonale)."}, {"q": "Le traitement de première intention du DT2 est :", "o": ["L'insuline d'emblée", "Hygiène de vie + metformine", "Greffe d'îlots de Langerhans", "Pompe à insuline"], "r": 1, "e": "DT2 : mesures hygiéno-diététiques (régime, activité physique) + metformine en première intention. Insuline si échec."}, {"q": "Le récepteur à l'insuline :", "o": ["Est intracellulaire", "Est membranaire, à activité tyrosine-kinase", "Active la translocation du transporteur GLUT4 à la membrane", "N'a aucun effet sur l'entrée du glucose"], "r": [1, 2], "e": "Récepteur insuline = transmembranaire avec activité tyrosine-kinase. Active une cascade → translocation de GLUT4 → entrée du glucose."}, {"q": "Le cerveau et la glycémie :", "o": ["Le cerveau est glucodépendant", "Il consomme ~ 120 g de glucose / jour", "Il sait synthétiser son propre glucose", "Il a peu de réserves en glucose"], "r": [0, 1, 3], "e": "Cerveau : ~ 20 % de l'énergie au repos, dépendant du glucose (pas d'oxydation de lipides efficace). D'où l'importance de la régulation."}, {"q": "Lors d'une HGPO (hyperglycémie provoquée), un sujet sain :", "o": ["A une glycémie qui monte puis redescend en < 3 h", "A une glycémie qui dépasse 2 g/L 2 h après", "Sécrète de l'insuline rapidement", "Ne sécrète pas d'insuline"], "r": [0, 2], "e": "Sain : glycémie revient sous 1,4 g/L à 2h. Diabète si > 2 g/L à 2h. Hyperinsulinémie marquée chez le diabétique T2 au début."}, {"q": "Le pancréas est :", "o": ["À la fois exocrine (enzymes digestives) et endocrine (hormones)", "Uniquement endocrine", "Contient ~ 1 million d'îlots de Langerhans (1-2 % du volume)", "Sans rôle dans la digestion"], "r": [0, 2], "e": "Pancréas mixte : exocrine (sucs digestifs) + endocrine (îlots avec α, β, δ). Les îlots représentent ~ 1-2 % du tissu pancréatique."}, {"q": "La prévention du diabète de type 2 passe par :", "o": ["L'activité physique régulière", "Une alimentation équilibrée, réduction des sucres rapides", "Le maintien d'un poids sain", "L'absence de dépistage"], "r": [0, 1, 2], "e": "Prévention DT2 : très efficace via mode de vie. -30 % à -60 % du risque avec activité + alimentation. Dépistage des sujets à risque utile."}, {"q": "La valeur de référence de la glycémie à jeun se situe entre :", "o": ["0,3 et 0,5 g/L", "0,7 et 1,1 g/L", "1,5 et 2 g/L", "2 et 3 g/L"], "r": 1, "e": "La valeur de consigne est d'environ 0,9 g/L. C'est un paramètre régulé, c'est-à-dire une constante du milieu intérieur maintenue malgré les apports discontinus et les dépenses variables."}, {"q": "Après un repas, le pic post-prandial de glycémie atteint typiquement :", "o": ["0,9 g/L", "1,4 g/L", "2,5 g/L", "4 g/L"], "r": 1, "e": "Chez un sujet sain, la glycémie monte jusqu'à environ 1,4 g/L puis revient à la valeur de consigne en deux à trois heures. C'est la cinétique de retour, plus que le pic lui-même, qui renseigne sur la qualité de la régulation."}, {"q": "On parle d'hypoglycémie en dessous de :", "o": ["0,6 g/L", "0,9 g/L", "1,1 g/L", "1,26 g/L"], "r": 0, "e": "Le cerveau étant strictement glucodépendant, l'hypoglycémie se manifeste rapidement par des sueurs, une confusion, puis un coma. C'est une urgence à court terme, alors que l'hyperglycémie nuit surtout à long terme."}, {"q": "Un adulte possède environ combien d'îlots de Langerhans ?", "o": ["Un millier", "Un million", "Un milliard", "Une dizaine"], "r": 1, "e": "Ces îlots constituent le pancréas endocrine, dispersé au sein du pancréas exocrine qui sécrète, lui, les enzymes digestives. Le même organe assume donc deux fonctions très différentes."}, {"q": "L'insuline permet l'entrée du glucose dans les muscles et le tissu adipeux en :", "o": ["Ouvrant des canaux ioniques", "Provoquant la translocation du transporteur GLUT4 vers la membrane", "Dégradant le glycogène", "Activant la néoglucogenèse"], "r": 1, "e": "Les transporteurs GLUT4 sont stockés dans des vésicules intracellulaires ; l'insuline déclenche leur adressage à la membrane. Sans insuline, le glucose reste largement à la porte de ces cellules."}, {"q": "Le récepteur à l'insuline est un récepteur :", "o": ["Intracellulaire, agissant sur l'expression des gènes", "Membranaire à activité tyrosine-kinase", "Canal ionique", "Couplé à une protéine G uniquement"], "r": 1, "e": "L'insuline étant une hormone peptidique, donc hydrosoluble, elle ne traverse pas la membrane et agit par un récepteur de surface. C'est l'inverse du cortisol, stéroïdien et à récepteur intracellulaire."}, {"q": "L'insuline est remarquable parce qu'elle est :", "o": ["La seule hormone hyperglycémiante", "La seule hormone hypoglycémiante de l'organisme", "Produite par les cellules α", "Sécrétée par le foie"], "r": 1, "e": "Plusieurs hormones font monter la glycémie — glucagon, adrénaline, cortisol, hormone de croissance — mais une seule la fait baisser. C'est ce qui rend son déficit immédiatement menaçant."}, {"q": "La glycogénogenèse désigne :", "o": ["La dégradation du glycogène en glucose", "La synthèse de glycogène à partir du glucose", "La production de glucose à partir d'acides aminés", "La conversion du glucose en lipides"], "r": 1, "e": "Trois termes à ne pas confondre : glycogénogenèse (mise en réserve), glycogénolyse (déstockage) et néoglucogenèse (fabrication de glucose à partir de précurseurs non glucidiques)."}, {"q": "Le glucagon agit principalement sur :", "o": ["Le muscle squelettique", "Le foie", "Le tissu adipeux", "Le cerveau"], "r": 1, "e": "Le foie est le seul organe capable de libérer du glucose dans le sang, par glycogénolyse puis néoglucogenèse. Le muscle stocke du glycogène mais le garde pour son usage propre."}, {"q": "Dans la boucle de régulation de la glycémie, les cellules α et β des îlots jouent le rôle de :", "o": ["Effecteurs uniquement", "Capteurs et intégrateur, car elles détectent directement la glycémie et ajustent leur sécrétion", "Messagers hormonaux", "Organes de stockage"], "r": 1, "e": "Elles perçoivent la glycémie plasmatique sans intermédiaire nerveux et répondent en modulant leur sécrétion. Les effecteurs sont le foie, les muscles et le tissu adipeux."}, {"q": "Le diagnostic de diabète est retenu pour une glycémie à jeun supérieure ou égale à :", "o": ["1,10 g/L", "1,26 g/L", "1,50 g/L", "2 g/L"], "r": 1, "e": "Le seuil doit être constaté à deux reprises. Il correspond au niveau au-delà duquel le risque de complications microvasculaires, notamment la rétinopathie, augmente nettement."}, {"q": "L'hémoglobine glyquée (HbA1c) reflète la glycémie moyenne :", "o": ["Des dernières heures", "Des 2 à 3 derniers mois", "De la dernière année", "Du dernier repas"], "r": 1, "e": "Le glucose se fixe irréversiblement sur l'hémoglobine, et la durée de vie d'un globule rouge est d'environ 120 jours. L'objectif thérapeutique habituel est de maintenir l'HbA1c sous 7 %."}, {"q": "L'HGPO (hyperglycémie provoquée par voie orale) consiste à :", "o": ["Mesurer la glycémie à jeun uniquement", "Suivre la cinétique de la glycémie pendant deux heures après ingestion de glucose", "Doser l'insuline plasmatique", "Mesurer le glycogène hépatique"], "r": 1, "e": "Chez un sujet sain, la glycémie remonte puis revient à sa valeur de départ en deux à trois heures. Chez un diabétique, le pic est plus haut et le retour bien plus lent : c'est la capacité de régulation qui est testée."}, {"q": "Le diabète de type 1 représente environ :", "o": ["10 % des diabètes", "50 % des diabètes", "90 % des diabètes", "99 % des diabètes"], "r": 0, "e": "Le type 2 représente environ 90 % des cas. Le type 1, auto-immun, touche surtout l'enfant et le jeune adulte, et impose une insulinothérapie à vie."}, {"q": "Dans le diabète de type 2 débutant, l'insulinémie est :", "o": ["Nulle", "Normale ou élevée, malgré l'hyperglycémie", "Toujours effondrée dès le diagnostic", "Sans rapport avec la maladie"], "r": 1, "e": "Le pancréas compense d'abord l'insulinorésistance en produisant davantage d'insuline. C'est l'épuisement progressif des cellules β, après des années de surcharge, qui fait basculer vers un déficit de sécrétion."}, {"q": "L'insulinorésistance se traduit au niveau cellulaire par :", "o": ["Une absence totale d'insuline circulante", "Une mauvaise réponse du récepteur et de sa voie de signalisation, avec moins de translocation de GLUT4", "Une destruction des cellules β par les lymphocytes T", "Une surproduction de glucagon exclusive"], "r": 1, "e": "Le message hormonal est présent mais mal reçu : le glucose entre moins dans les cellules cibles, et la glycémie reste élevée malgré une insulinémie parfois forte."}, {"q": "Le déclencheur suspecté du diabète de type 1, sur un terrain génétiquement prédisposé, est :", "o": ["L'obésité", "Un facteur viral", "La sédentarité", "Une alimentation trop sucrée"], "r": 1, "e": "Un épisode infectieux pourrait initier la réaction auto-immune contre les cellules β. Le type 2, lui, associe prédisposition génétique, surpoids, sédentarité et alimentation déséquilibrée."}, {"q": "Parmi les complications microvasculaires du diabète, on retrouve :", "o": ["L'infarctus du myocarde", "La rétinopathie, la néphropathie et la neuropathie", "L'AVC", "L'artérite des membres inférieurs"], "r": 1, "e": "Les petits vaisseaux souffrent les premiers : œil, rein, nerfs. Les complications macrovasculaires — infarctus, AVC, artérite — touchent les grosses artères et relèvent du risque cardiovasculaire global."}, {"q": "La neuropathie diabétique est particulièrement dangereuse au niveau des pieds parce que :", "o": ["Elle provoque une douleur insupportable", "La perte de sensibilité fait passer inaperçues des plaies qui s'infectent et cicatrisent mal", "Elle entraîne une paralysie immédiate", "Elle ne touche que les sportifs"], "r": 1, "e": "L'atteinte nerveuse supprime le signal d'alarme, l'atteinte vasculaire retarde la cicatrisation, et l'hyperglycémie favorise l'infection. C'est l'association des trois qui fait la gravité du pied diabétique."}, {"q": "Le traitement de première intention du diabète de type 2 est :", "o": ["L'insuline d'emblée", "Les mesures hygiéno-diététiques, puis la metformine", "La greffe d'îlots pancréatiques", "Les analogues du GLP-1 en première ligne"], "r": 1, "e": "Activité physique, alimentation équilibrée et perte de poids agissent directement sur l'insulinorésistance. La metformine vient ensuite ; l'insuline n'intervient qu'en cas d'échec des autres traitements."}, {"q": "Le pancréas artificiel utilisé dans le diabète de type 1 repose sur :", "o": ["Une greffe de pancréas entier", "Une boucle fermée associant un capteur de glycémie continu et une pompe à insuline", "Un traitement par comprimés", "Une transplantation de cellules souches"], "r": 1, "e": "Le capteur mesure en continu, l'algorithme calcule et la pompe administre : le dispositif reconstitue artificiellement la boucle de rétroaction que la maladie a supprimée."}, {"q": "Le nombre de personnes atteintes de diabète dans le monde est de l'ordre de :", "o": ["5 millions", "50 millions", "500 millions", "5 milliards"], "r": 2, "e": "Environ un demi-milliard de personnes, dont une large part l'ignore, le type 2 pouvant évoluer des années sans symptôme. L'urbanisation, l'obésité et la sédentarité expliquent cette progression."}, {"q": "Le coma acidocétosique survient typiquement :", "o": ["Dans le diabète de type 1, par carence profonde en insuline", "Dans le diabète de type 2 uniquement", "Lors d'une hypoglycémie", "Après un repas trop copieux"], "r": 0, "e": "Privé d'insuline, l'organisme puise dans les lipides et produit des corps cétoniques acides. Le type 2 donne plutôt un coma hyperosmolaire, lié à une hyperglycémie majeure et à la déshydratation."}, {"q": "Le cerveau, vis-à-vis du glucose :", "o": ["Peut s'en passer totalement", "En dépend étroitement, ce qui rend l'hypoglycémie rapidement dangereuse", "Le stocke en grande quantité sous forme de glycogène", "N'en consomme qu'en cas d'effort"], "r": 1, "e": "Il ne dispose pratiquement d'aucune réserve et consomme en permanence. C'est pour lui, avant tout, que la glycémie doit être maintenue en toutes circonstances."}, {"q": "Lors d'un jeûne prolongé, le maintien de la glycémie repose d'abord sur :", "o": ["La lipogenèse", "La glycogénolyse hépatique, relayée ensuite par la néoglucogenèse", "Le stockage musculaire", "La sécrétion d'insuline"], "r": 1, "e": "Les réserves de glycogène hépatique s'épuisent en une douzaine d'heures. Le foie fabrique alors du glucose à partir du lactate, des acides aminés et du glycérol libérés par les autres tissus."}, {"q": "La lipogenèse déclenchée par l'insuline dans le tissu adipeux consiste à :", "o": ["Libérer des acides gras dans le sang", "Convertir le glucose en triglycérides de réserve", "Dégrader les triglycérides", "Produire du glucose"], "r": 1, "e": "L'excédent de glucose est converti en graisse de réserve. C'est la raison pour laquelle une alimentation durablement excédentaire en sucres rapides favorise la prise de masse grasse."}, {"q": "Un sujet dont la glycémie à jeun se situe entre 1,10 et 1,25 g/L :", "o": ["Est diabétique", "Présente une hyperglycémie modérée à jeun, état de prédiabète justifiant une surveillance", "Est en hypoglycémie", "A une glycémie parfaitement normale"], "r": 1, "e": "Cette zone intermédiaire n'atteint pas le seuil diagnostique mais signale une régulation qui se dégrade. C'est précisément le stade où l'activité physique et les mesures diététiques sont les plus efficaces."}, {"q": "La metformine agit principalement en :", "o": ["Stimulant la sécrétion d'insuline par les cellules β", "Réduisant la production hépatique de glucose et en améliorant la sensibilité à l'insuline", "Bloquant l'absorption intestinale des lipides", "Détruisant les cellules α"], "r": 1, "e": "Elle n'ajoute pas d'insuline mais aide l'organisme à mieux utiliser la sienne, ce qui explique qu'elle n'expose pas au risque d'hypoglycémie comme le font les sulfamides ou l'insuline."}, {"q": "Les cellules β sont situées :", "o": ["À la périphérie des îlots de Langerhans", "Au centre des îlots de Langerhans", "Dans le canal pancréatique", "Dans le foie"], "r": 1, "e": "Cellules β au centre pour l'insuline, cellules α en périphérie pour le glucagon. Cette organisation permet un dialogue étroit entre les deux populations au sein de chaque îlot."}, {"q": "Outre le glucagon, quelles hormones sont hyperglycémiantes ?", "o": ["L'insuline et la leptine", "L'adrénaline, le cortisol et l'hormone de croissance", "La mélatonine et la sérotonine", "L'ADH et l'aldostérone"], "r": 1, "e": "L'organisme dispose de plusieurs voies pour remonter la glycémie, ce qui est cohérent avec l'enjeu vital que représente l'approvisionnement du cerveau. Une seule hormone, l'insuline, la fait baisser."}, {"q": "La mesure continue de la glycémie (CGM) apporte par rapport aux glycémies capillaires ponctuelles :", "o": ["Une valeur unique plus précise", "Le profil complet des variations, y compris nocturnes, permettant d'ajuster finement le traitement", "Un dosage de l'insuline", "Une mesure de l'HbA1c"], "r": 1, "e": "Ce qui compte n'est pas seulement le niveau moyen mais aussi la variabilité et le temps passé dans la cible. Le CGM révèle notamment les hypoglycémies nocturnes, invisibles autrement."}, {"q": "La rétinopathie diabétique peut conduire à :", "o": ["Une cécité", "Une surdité", "Une insuffisance respiratoire", "Une paralysie des membres"], "r": 0, "e": "L'atteinte des capillaires rétiniens fait du diabète l'une des premières causes de cécité évitable de l'adulte. D'où l'importance du dépistage ophtalmologique annuel, avant l'apparition de tout symptôme."}, {"q": "La prévention du diabète de type 2 repose principalement sur :", "o": ["Un dépistage génétique systématique", "La lutte contre le surpoids et la sédentarité, une alimentation équilibrée et le dépistage des sujets à risque", "L'injection préventive d'insuline", "La vaccination"], "r": 1, "e": "C'est l'un des rares troubles chroniques dont l'apparition peut être retardée, voire évitée, par le mode de vie. Les sujets à risque — antécédents familiaux, hypertension, obésité — justifient une surveillance régulière."}, {"q": "Une prédisposition génétique au diabète de type 2 :", "o": ["Rend la maladie inévitable", "Augmente le risque sans déterminer à elle seule l'apparition de la maladie", "Protège de la maladie", "N'existe pas"], "r": 1, "e": "Le diabète est multifactoriel : la génétique fixe une susceptibilité, l'environnement décide largement du reste. C'est ce qui rend la prévention utile même chez les sujets prédisposés."}, {"q": "Dans le diabète de type 1, l'insulinothérapie est indispensable parce que :", "o": ["Les cellules cibles ne répondent plus à l'insuline", "Les cellules β ont été détruites et ne produisent plus d'insuline", "Le foie produit trop de glucagon", "L'alimentation ne suffit pas à apporter du glucose"], "r": 1, "e": "Il s'agit d'un déficit de production, non d'un défaut de réception : la seule solution est d'apporter l'hormone manquante de l'extérieur. Dans le type 2, l'insuline est présente mais mal utilisée."}]};</script>
