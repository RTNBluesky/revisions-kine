<div class="quiz-head"><p>50 questions à choix multiple. Mode révision : correction immédiate. Mode examen : correction et score à la fin.</p><div class="bar"><i></i></div><p style="margin-top:8px" id="compteur"></p></div><div id="quiz"></div>

<script>window.QUIZ={"titre": "Les climats de la Terre", "fiche": "../fiches/fiche4_climats_terre.html", "questions": [{"q": "L'effet de serre est dû :", "o": ["À l'absorption des UV par l'ozone", "À l'absorption de l'infrarouge terrestre par certains gaz atmosphériques", "À la réflexion des nuages", "Au rayonnement cosmique"], "r": 1, "e": "Les GES (CO₂, CH₄, H₂O, N₂O) absorbent l'IR émis par la Terre et le réémettent vers le sol → réchauffement."}, {"q": "Cocher les principaux gaz à effet de serre :", "o": ["O₂ (dioxygène)", "CO₂ (dioxyde de carbone)", "CH₄ (méthane)", "Vapeur d'eau (H₂O)"], "r": [1, 2, 3], "e": "GES naturels et anthropiques : H₂O (le plus abondant), CO₂, CH₄, N₂O, O₃, gaz fluorés. O₂ n'est pas un GES."}, {"q": "Les paramètres de Milankovitch sont :", "o": ["Liés à l'activité solaire seule", "Excentricité, obliquité et précession de l'orbite terrestre", "Liés aux éruptions volcaniques", "Liés aux courants océaniques"], "r": 1, "e": "Milankovitch (1920) : variations astronomiques (excentricité 100 ka, obliquité 41 ka, précession 23 ka) → cycles glaciaires."}, {"q": "Pour reconstituer les paléoclimats, on utilise :", "o": ["Les isotopes de l'oxygène (δ¹⁸O) dans les glaces et les sédiments", "Les pollens fossiles", "Les cernes des arbres", "Les ophiolites"], "r": [0, 1, 2], "e": "Indicateurs paléoclimatiques : δ¹⁸O (T° passée), pollens (végétation → climat), dendrochronologie, foraminifères, etc."}, {"q": "Le bilan radiatif de la Terre :", "o": ["Est nul si le climat est stable", "Est positif depuis l'industrialisation", "Mesure l'écart entre énergie reçue et émise", "Est uniquement déterminé par le Soleil"], "r": [0, 1, 2], "e": "Bilan radiatif = énergie reçue - énergie émise. Stable historiquement, il est devenu positif (~ +0,87 W/m²) avec les émissions anthropiques."}, {"q": "La concentration en CO₂ atmosphérique :", "o": ["Est restée stable depuis 2 millions d'années", "A dépassé 420 ppm en 2025 (contre 280 ppm en 1750)", "Diminue depuis 1950", "Est négligeable dans l'atmosphère"], "r": 1, "e": "CO₂ pré-industriel ≈ 280 ppm → 420+ ppm en 2025 : niveau jamais atteint depuis plusieurs millions d'années."}, {"q": "Le cycle long du carbone :", "o": ["Se fait en quelques années", "Implique stockage dans les roches et libération par volcanisme", "Concerne seulement la biosphère", "N'affecte pas le climat"], "r": 1, "e": "Cycle long (> million d'années) : altération des roches silicatées (puits), sédimentation, volcanisme (source) → régulation du CO₂."}, {"q": "Le GIEC est :", "o": ["Une association militante", "Le groupement d'experts intergouvernemental qui synthétise les connaissances scientifiques", "Un organisme de l'ONU", "Une agence européenne"], "r": [1, 2], "e": "GIEC = Groupe d'experts intergouvernemental sur l'évolution du climat, créé en 1988 par ONU et OMM."}, {"q": "Conséquences attendues du réchauffement climatique :", "o": ["Élévation du niveau marin", "Augmentation des événements extrêmes", "Acidification des océans", "Refroidissement global"], "r": [0, 1, 2], "e": "Conséquences : hausse du niveau marin (~ 20 cm depuis 1900), fonte des glaciers, vagues de chaleur, acidification des océans (absorption du CO₂)."}, {"q": "Pour limiter le réchauffement à 1,5 °C (Accord de Paris) :", "o": ["Il suffit de ne rien faire", "Il faut atteindre la neutralité carbone vers 2050", "Il faut compter sur la nature seule", "C'est déjà perdu"], "r": 1, "e": "Trajectoire 1,5 °C : nécessite la neutralité carbone vers 2050 (zéro émission nette) selon le GIEC."}, {"q": "Une rétroaction positive du système climatique :", "o": ["Amplifie la perturbation initiale", "Atténue la perturbation initiale", "Exemple : fonte des glaces → ↓ albédo → ↑ T°", "Exemple : ↑ T° → ↑ couverture nuageuse réfléchissante"], "r": [0, 2], "e": "Rétroaction positive = amplification. Albédo-glace, libération du méthane du permafrost. Rétroaction négative = atténuation."}, {"q": "La signature isotopique du CO₂ atmosphérique récent (¹³C/¹²C en baisse) :", "o": ["Prouve une origine volcanique", "Prouve une origine fossile/anthropique", "N'apporte aucune info", "Pointe vers les océans"], "r": 1, "e": "Les combustibles fossiles sont appauvris en ¹³C (origine biologique). Leur combustion abaisse le δ¹³C atmosphérique → signature anthropique."}, {"q": "Le scénario SSP1-1.9 du GIEC correspond à :", "o": ["Un futur le plus optimiste (limite à 1,5 °C)", "Un futur le plus pessimiste (4-5 °C)", "L'absence de toute action", "Un retour aux conditions préindustrielles"], "r": 0, "e": "SSP1-1.9 : scénario d'action très ambitieuse → +1,5 °C en 2100. SSP5-8.5 : pire scénario (+ ~4,4 °C)."}, {"q": "Le permafrost en dégel :", "o": ["Libère du méthane et du CO₂ stockés depuis des millénaires", "Est un puits de carbone net", "Constitue une rétroaction positive sur le climat", "Concerne surtout l'Arctique"], "r": [0, 2, 3], "e": "Permafrost = sols gelés. Sa fonte libère du CH₄ (très GES) et du CO₂ → rétroaction positive sur le réchauffement."}, {"q": "L'acidification des océans est due à :", "o": ["Une augmentation des pluies", "L'absorption croissante du CO₂ par les océans formant H₂CO₃", "Une baisse du pH de ~8,2 à ~8,1 depuis 1850", "Une menace pour les organismes calcifiants (coraux, mollusques)"], "r": [1, 2, 3], "e": "Acidification = CO₂ + H₂O → H₂CO₃. pH global ↓ 0,1 unité depuis l'ère préindustrielle. Menace majeure pour la biodiversité marine."}, {"q": "Dans les glaces polaires, une baisse du δ¹⁸O traduit :", "o": ["Une période chaude", "Une période froide", "Une hausse du niveau marin", "Une éruption volcanique"], "r": 1, "e": "Plus il fait froid, moins l'¹⁸O, plus lourd, parvient jusqu'aux pôles : le δ¹⁸O de la glace chute. Attention, dans les carbonates de foraminifères c'est l'inverse — le froid fait monter le δ¹⁸O, car l'eau légère reste piégée dans les calottes."}, {"q": "Dans les tests carbonatés de foraminifères, une hausse du δ¹⁸O indique :", "o": ["Un réchauffement des océans", "Une période glaciaire, l'eau légère étant stockée dans les glaces", "Une acidification de l'eau", "Une augmentation de la salinité uniquement"], "r": 1, "e": "L'eau contenant l'¹⁶O s'évapore plus facilement et s'accumule dans les calottes : l'océan résiduel s'enrichit alors en ¹⁸O. C'est l'interprétation inverse de celle des carottes de glace — une confusion classique le jour de l'épreuve."}, {"q": "Les bulles d'air des carottes de glace permettent de connaître la composition de l'atmosphère jusqu'à environ :", "o": ["10 000 ans", "100 000 ans", "800 000 ans", "10 millions d'années"], "r": 2, "e": "Les forages antarctiques les plus profonds remontent à environ 800 000 ans. C'est la seule archive donnant directement, et non par déduction, les teneurs passées en CO₂ et en CH₄."}, {"q": "Le rapport Mg/Ca mesuré dans les foraminifères renseigne sur :", "o": ["Le pH de l'océan", "La température de l'eau de mer", "La salinité uniquement", "Le volume des glaces continentales"], "r": 1, "e": "L'incorporation du magnésium dans le test augmente avec la température. Ce proxy est complémentaire du δ¹⁸O, qui mêle signal thermique et signal du volume des glaces."}, {"q": "Une vallée en U témoigne :", "o": ["D'un creusement par un cours d'eau", "D'un ancien glacier", "D'une faille tectonique", "D'une érosion éolienne"], "r": 1, "e": "Le glacier rabote le fond et les flancs, laissant un profil à fond plat ; l'eau courante, elle, incise en V. Moraines, blocs erratiques, stries glaciaires et tillites complètent la panoplie des indices glaciaires."}, {"q": "Les stries glaciaires observées sur une roche renseignent surtout sur :", "o": ["L'âge du glacier", "La direction du mouvement glaciaire", "L'épaisseur de la glace", "La température de l'air"], "r": 1, "e": "Les débris rocheux emprisonnés sous le glacier rayent le substrat dans le sens du déplacement. Les moraines donnent plutôt l'extension maximale, et les blocs erratiques la trajectoire et l'origine des roches transportées."}, {"q": "Au maximum glaciaire, il y a 20 000 ans, le niveau marin était inférieur au niveau actuel d'environ :", "o": ["5 m", "20 m", "120 m", "500 m"], "r": 2, "e": "L'eau manquante était immobilisée dans les calottes qui recouvraient alors le nord de l'Europe et les Alpes. Cette baisse a découvert des plateaux continentaux entiers et ouvert des passages terrestres entre continents."}, {"q": "Le principe d'actualisme consiste à admettre que :", "o": ["Le climat a toujours été stable", "Les lois régissant les phénomènes géologiques actuels étaient déjà valables dans le passé", "Seules les observations actuelles ont une valeur scientifique", "Le passé est inaccessible à la science"], "r": 1, "e": "C'est ce qui autorise à interpréter une moraine fossile en s'appuyant sur ce qu'on observe au front des glaciers actuels. Sans ce postulat, aucune reconstitution paléoclimatique ne serait possible."}, {"q": "Au cours du Quaternaire, les périodes glaciaires durent environ :", "o": ["10 000 ans, contre 100 000 ans pour les interglaciaires", "100 000 ans, contre 10 000 à 20 000 ans pour les interglaciaires", "1 000 ans pour les deux", "1 million d'années"], "r": 1, "e": "Le rythme est très asymétrique : de longues glaciations entrecoupées de brefs interglaciaires. Nous vivons dans l'un de ces interglaciaires, l'Holocène, commencé il y a environ 11 700 ans."}, {"q": "L'optimum climatique de l'Éocène, il y a environ 55 Ma, se caractérisait par :", "o": ["Une température moyenne inférieure d'environ 14 °C à l'actuelle", "Une température moyenne supérieure d'environ 14 °C à l'actuelle, sans glaces polaires", "Une calotte glaciaire couvrant l'équateur", "Un climat identique à l'actuel"], "r": 1, "e": "La Terre a connu des états climatiques très éloignés de l'actuel, sans aucune glace permanente aux pôles. Cela rappelle que ce qui est en jeu aujourd'hui n'est pas la survie de la planète, mais la vitesse du changement rapporté aux capacités d'adaptation du vivant."}, {"q": "Le Petit Âge Glaciaire (XIVᵉ–XIXᵉ siècle) correspond à :", "o": ["Une véritable glaciation quaternaire", "Un refroidissement modeste, de l'ordre de −0,5 °C en Europe", "Un réchauffement régional", "Une extinction de masse"], "r": 1, "e": "Son ampleur est sans commune mesure avec les glaciations orbitales. Il illustre néanmoins qu'un écart de quelques dixièmes de degré suffit à modifier récoltes, glaciers alpins et sociétés."}, {"q": "L'obliquité de l'axe terrestre varie selon un cycle d'environ :", "o": ["23 000 ans", "41 000 ans", "100 000 ans", "400 000 ans"], "r": 1, "e": "Les trois paramètres de Milankovitch à retenir : excentricité ~100 000 ans, obliquité ~41 000 ans (entre 22,1° et 24,5°), précession ~23 000 ans."}, {"q": "L'obliquité influence surtout :", "o": ["La distance Terre-Soleil", "Le contraste entre les saisons", "La durée de l'année", "La vitesse de rotation terrestre"], "r": 1, "e": "Plus l'axe est incliné, plus les étés sont chauds et les hivers froids aux hautes latitudes. C'est le contraste saisonnier — en particulier la fraîcheur des étés — qui conditionne la survie estivale des neiges et donc la croissance des calottes."}, {"q": "Les variations orbitales de Milankovitch expliquent le déclenchement des glaciations mais pas leur ampleur, parce que :", "o": ["Elles sont trop récentes", "Leur effet direct sur l'insolation est faible et doit être amplifié par des rétroactions positives", "Elles agissent uniquement dans l'hémisphère sud", "Elles n'ont aucun effet mesurable"], "r": 1, "e": "Le signal orbital est le déclencheur ; les rétroactions albédo-glaces, vapeur d'eau et solubilité du CO₂ en font un basculement de grande ampleur. C'est un point central du chapitre."}, {"q": "La rétroaction albédo-glaces amplifie un refroidissement parce que :", "o": ["La glace absorbe davantage de rayonnement solaire", "L'extension des glaces augmente la réflexion du rayonnement solaire, ce qui refroidit davantage", "La glace libère du CO₂", "La glace réduit l'évaporation"], "r": 1, "e": "Une surface blanche renvoie l'énergie au lieu de l'absorber : plus il y a de glace, moins la Terre se réchauffe, donc plus la glace s'étend. Le mécanisme joue symétriquement dans le sens du réchauffement."}, {"q": "Un océan qui se refroidit :", "o": ["Dissout moins de CO₂", "Dissout davantage de CO₂, ce qui amplifie le refroidissement", "N'échange pas de CO₂ avec l'atmosphère", "Libère du méthane"], "r": 1, "e": "La solubilité des gaz augmente quand la température baisse. Le CO₂ retiré de l'atmosphère affaiblit l'effet de serre et accentue le refroidissement initial : encore une rétroaction positive."}, {"q": "Une rétroaction négative se définit comme un mécanisme qui :", "o": ["Amplifie la perturbation initiale", "Atténue la perturbation initiale", "N'a aucun effet sur le climat", "Inverse le sens du temps climatique"], "r": 1, "e": "Positif et négatif ne qualifient pas ici le caractère souhaitable, mais le sens de l'effet : amplification ou amortissement. Les rétroactions positives du système climatique sont les plus préoccupantes car elles emballent le signal."}, {"q": "L'éruption du Pinatubo en 1991 a provoqué :", "o": ["Un réchauffement de 0,5 °C pendant deux ans", "Un refroidissement d'environ 0,5 °C pendant deux ans", "Aucun effet climatique mesurable", "Une glaciation régionale durable"], "r": 1, "e": "Les aérosols sulfurés injectés dans la stratosphère réfléchissent le rayonnement solaire. L'effet est net mais bref : les particules retombent en quelques années, contrairement au CO₂ qui persiste des siècles."}, {"q": "El Niño correspond à :", "o": ["Un refroidissement des eaux de surface du Pacifique équatorial", "Un réchauffement des eaux de surface du Pacifique équatorial, associé à des années globalement plus chaudes", "Une oscillation de l'Atlantique Nord", "Une éruption volcanique majeure"], "r": 1, "e": "C'est une redistribution interne de chaleur entre océan et atmosphère, sans modification du forçage radiatif. La Niña est la phase inverse. Ces oscillations sont un bruit superposé à la tendance de fond."}, {"q": "Sans effet de serre naturel, la température moyenne de surface de la Terre serait d'environ :", "o": ["0 °C", "−18 °C", "−50 °C", "+5 °C"], "r": 1, "e": "L'effet de serre naturel apporte environ 33 °C, faisant passer la Terre de −18 °C à +15 °C. Le problème actuel n'est donc pas l'effet de serre en soi, mais son renforcement rapide par les émissions humaines."}, {"q": "Les gaz à effet de serre agissent en :", "o": ["Absorbant le rayonnement solaire visible entrant", "Absorbant le rayonnement infrarouge émis par la surface terrestre et en réémettant une partie vers le sol", "Réfléchissant le rayonnement solaire vers l'espace", "Réchauffant directement l'air par conduction"], "r": 1, "e": "L'atmosphère est largement transparente au rayonnement solaire de courte longueur d'onde, mais opaque à l'infrarouge réémis par le sol. C'est ce piégeage sélectif qui constitue l'effet de serre."}, {"q": "Le pouvoir de réchauffement global (PRG) du méthane sur 100 ans est d'environ :", "o": ["1", "28", "265", "22 800"], "r": 1, "e": "Repères à retenir : CO₂ = 1 (référence), CH₄ = 28, N₂O = 265, certains HFC jusqu'à 22 800. Le méthane est bien plus efficace que le CO₂ par molécule, mais sa durée de vie atmosphérique est plus courte."}, {"q": "Le protoxyde d'azote (N₂O) a pour principale origine anthropique :", "o": ["La combustion du charbon", "Les engrais azotés utilisés en agriculture", "Les réfrigérants industriels", "Les rizières"], "r": 1, "e": "Chaque gaz a sa source dominante : fossiles et déforestation pour le CO₂, élevage, rizières et gaz naturel pour le CH₄, engrais azotés pour le N₂O, réfrigération et aérosols pour les HFC et CFC."}, {"q": "L'albédo terrestre moyen renvoie vers l'espace environ :", "o": ["10 % du rayonnement solaire incident", "30 % du rayonnement solaire incident", "70 % du rayonnement solaire incident", "95 % du rayonnement solaire incident"], "r": 1, "e": "Sur les quelque 342 W/m² reçus en moyenne, environ 30 % sont réfléchis par les nuages, les glaces et les sols clairs, et 70 % sont absorbés puis réémis en infrarouge."}, {"q": "Un forçage radiatif positif signifie que :", "o": ["La Terre perd plus d'énergie qu'elle n'en reçoit", "Le bilan énergétique est excédentaire, ce qui tend à réchauffer le système", "L'albédo augmente", "L'effet de serre disparaît"], "r": 1, "e": "Le forçage radiatif, exprimé en W/m², chiffre la perturbation du bilan énergétique par rapport à une référence préindustrielle. Positif il réchauffe, négatif il refroidit — ce qui permet de comparer entre eux des facteurs très différents."}, {"q": "La concentration atmosphérique en CO₂ est passée depuis l'ère préindustrielle d'environ :", "o": ["180 à 280 ppm", "280 à 420 ppm", "420 à 560 ppm", "100 à 200 ppm"], "r": 1, "e": "Environ 280 ppm avant 1850, environ 420 ppm aujourd'hui : une hausse de 50 % en moins de deux siècles. Les carottes de glace montrent que ce niveau est sans équivalent depuis au moins 800 000 ans."}, {"q": "Le réchauffement observé depuis la période 1850-1900 est d'environ :", "o": ["+0,2 °C", "+1,1 °C", "+3 °C", "+5 °C"], "r": 1, "e": "Chiffre du sixième rapport du GIEC. Les dix années les plus chaudes jamais enregistrées sont toutes postérieures à 2010, ce qui écarte l'hypothèse d'une simple fluctuation naturelle."}, {"q": "Le rythme actuel d'élévation du niveau des mers est d'environ :", "o": ["0,3 mm/an", "3,6 mm/an", "3,6 cm/an", "1 m par décennie"], "r": 1, "e": "Soit une vingtaine de centimètres accumulés depuis 1900, et une accélération en cours. Deux causes s'additionnent : la dilatation thermique de l'eau et l'apport d'eau douce par la fonte des glaces continentales."}, {"q": "La banquise arctique estivale recule depuis 1979 d'environ :", "o": ["1 % par décennie", "13 % par décennie", "50 % par décennie", "Elle n'a pas reculé"], "r": 1, "e": "La fonte de la banquise, déjà flottante, n'élève pas le niveau marin — contrairement aux glaciers et calottes continentales — mais elle abaisse fortement l'albédo régional et amplifie le réchauffement de l'Arctique."}, {"q": "L'acidification des océans résulte de :", "o": ["Rejets d'acides industriels", "La dissolution du CO₂ atmosphérique, formant de l'acide carbonique", "Le réchauffement de l'eau uniquement", "La fonte des glaces"], "r": 1, "e": "CO₂ + H₂O → H₂CO₃, qui libère des protons et abaisse le pH : d'environ 8,1 aujourd'hui vers 7,8 d'ici 2100. Les organismes à squelette ou coquille calcaire — coraux, mollusques, ptéropodes — en sont les premières victimes."}, {"q": "Face au réchauffement, les aires de répartition des espèces se déplacent globalement :", "o": ["Vers l'équateur et vers les basses altitudes", "Vers les pôles et vers les hautes altitudes", "De façon aléatoire", "Elles ne se déplacent pas"], "r": 1, "e": "Les espèces suivent leur enveloppe climatique. Celles qui ne peuvent ni se déplacer assez vite ni s'adapter — espèces peu mobiles, endémiques d'altitude ou d'îles — sont les plus exposées à l'extinction."}, {"q": "Le scénario SSP5-8.5 du GIEC correspond à :", "o": ["Une neutralité carbone atteinte vers 2050", "Des émissions très élevées, avec un réchauffement estimé de +3,3 à +5,7 °C en 2100", "Des émissions intermédiaires", "Une baisse immédiate des concentrations de CO₂"], "r": 1, "e": "C'est le scénario dit « business as usual ». SSP1-1.9 vise +1,0 à +1,8 °C avec la neutralité carbone vers 2050, SSP2-4.5 aboutit à +2,1 à +3,5 °C."}, {"q": "L'Accord de Paris (2015) fixe comme objectif de limiter le réchauffement :", "o": ["À +0,5 °C", "Bien en deçà de +2 °C, en visant +1,5 °C", "À +3 °C", "Il ne fixe aucun objectif chiffré"], "r": 1, "e": "L'accord distingue l'atténuation — réduire les émissions — et l'adaptation — vivre avec le changement déjà engagé. La neutralité carbone, c'est-à-dire l'équilibre entre émissions et absorptions, en est le corollaire."}, {"q": "La séquestration du carbone désigne :", "o": ["La réduction des émissions à la source", "Le stockage durable du carbone dans les forêts, les sols ou le sous-sol", "L'adaptation des pratiques agricoles au climat", "La mesure du forçage radiatif"], "r": 1, "e": "Il faut distinguer trois leviers : l'atténuation réduit les émissions, la séquestration retire du carbone de l'atmosphère, l'adaptation limite les dégâts du réchauffement déjà engagé."}, {"q": "Parmi ces arguments, lequel établit le mieux l'origine humaine du réchauffement actuel ?", "o": ["La Terre a déjà connu des périodes chaudes", "Les modèles climatiques ne reproduisent le réchauffement observé qu'en incluant les gaz à effet de serre anthropiques", "Les glaciers reculent", "Le niveau des mers monte"], "r": 1, "e": "Recul des glaciers et montée des eaux sont des conséquences, pas des preuves de cause. L'attribution repose sur trois éléments : la corrélation CO₂-température, la signature isotopique du carbone fossile, et l'échec des modèles à reproduire les observations sans le forçage anthropique."}]};</script>
