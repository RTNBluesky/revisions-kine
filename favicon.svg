<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Révisions Kinésithérapie">
  <title>Révisions Kinésithérapie</title>
  <!-- Une seule teinte, comme le reste du site. C'est l'icône de repli :
       quand JavaScript tourne, theme.js la redessine à la couleur choisie. -->
  <rect width="64" height="64" rx="14.7" fill="#ff6b9d"/>
  <!-- K : hampe, diagonale haute, diagonale basse. Mêmes proportions que
       favicon.ico et les PNG, pour que l'icône soit la même partout. -->
  <path d="M19.5 10.9V53.1M19.5 32 45.4 10.9M19.5 32 45.4 53.1"
        fill="none" stroke="#fff" stroke-width="9.3"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
